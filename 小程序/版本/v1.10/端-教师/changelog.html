{d:'2026-10-23 14:44:45',t:'PRD 书写规范补充详细更新记录与升版本口径：区分 1.1 修订记录（大版本）与 7.2 详细更新记录（日常小改）',p:['docs'],i:['文档骨架表「附录」行补 7.1 平台默认值等参考资料、7.2 详细更新记录','1.1 修订记录加一句分工：只记文档版本号变动的大版本修订，日常小改记入 7.2','新增 1.4「详细更新记录与升版本的口径」：两种记录的分工表、7.2 固定五列、时间格式、页面/模块写法、更新内容按小节编号定位、按时间倒序最新在上、每天一条合并记录','自检清单末尾加一条：改动已记入 7.2；升版本时 1.1 与产品方案标题后缀同步']},
{d:'2026-10-23 14:05:12',t:'分配职务保存加并发校验：按打开时快照核对老师职务记录与所选职务状态，不一致整单拒绝并按最新数据重绘，toast 按职务级 / 记录级原因区分',p:['teacher.html','school.html'],i:['老师端分配职务页与学校端教师详情的分配职务抽屉：打开时记下在职状态、职务记录与各职务启用 / 范围类型的快照（模拟服务端版本号），保存时重读共用存储再校验','老师已被删除 → toast 并回教师管理页（学校端关闭抽屉）；已离职 → toast「该老师已离职，不能分配职务」并回教师详情','本次所选或原本持有的职务被停用 / 删除 / 改范围类型 → toast「「{职务名}」已停用 / 已被删除 / 数据权限已修改，已刷新为最新，请重新选择」并重绘；与本人无关的职务变化不拦','老师的职务记录被别人改过 → toast「该老师的职务刚被 {操作人} 修改，已刷新为最新，请核对后再保存」并重绘，操作人取打开后该老师最新一条日志；整单拒绝、不做合并，本次勾选不保留','两端演示说明同步；口径已写入飞书 PRD 2.1.2.6 保存校验表（并发修改、老师状态已变两行）、2.1.2.11 与 2.1.1.12 的版本号口径']},
{d:'2026-10-23 12:00:36',t:'学生详情新增毕业办理半屏，转班 / 离校 / 毕业确认后名单与统计真实增减，修改学生信息页班级改为只读',p:['teacher.html'],i:['学生详情「更多操作」新增「毕业」（顺序：转班 / 离校 / 毕业 / 删除 / 取消），拉起「毕业办理 · 姓名」半屏，内容对齐学校端 Web 毕业办理弹窗：当前年级班级只读、毕业届可改（2026届（当前学年）/ 2025届（上一学年），毕业届 = 学年结束年份，默认选中当前学年对应的 2026届），底部取消 / 确认毕业','毕业届为单列滚轮半屏（对应小程序 picker），与毕业半屏共用同一 sheet：确定回填并回到毕业半屏，取消或点遮罩也回到毕业半屏、已选不变；通用滚轮 pickerSheet 新增取消回调参数，遮罩点击对通用滚轮走 pkCancel，其它页面未传回调时行为不变','毕业届不标必填星号（打开即有默认值、无法留空，与离校半屏同口径）；「确认后，学生将移出在读名单并生成毕业档案」提示放在字段之后、按钮之前（与删除教师 / 设为离职半屏同结构，Web 放顶部）','转班 / 离校 / 毕业确认后不再只弹 toast：离校与毕业把学生移出在读名单，该班人数、年级行人数与统计栏总数 / 已认领 / 待认领同步减一；转班把学生从原班移到目标班、两班人数一增一减，目标班不在本页两个演示班时学生从本页消失；只改运行时、刷新即恢复','改动同步到共用演示名册（STU_GONE / STU_MOVED，attcGenStudents 按此过滤与迁入）：考勤明细、代学生补签、代学生请假的选择学生半屏重新取名册时即跟随；素质评价已缓存的名单不跟随','学生管理统计栏与「N 个班 · N 人」改为按各班班额计算（班额取校园签到统计 attSchool，总数仍为 89），不再写死；转班半屏打开时定位到学生当前年级、当前班置灰不可选（点击提示「该学生已在此班级」）','修改学生信息页「学生班级」改为只读：去掉必填星号、箭头与点击，只回显班级；换班统一走学生详情「更多操作 → 转班」，删除修改页专用的选班入口函数','学生详情、学生管理、修改学生信息页演示说明同步上述口径']},
{d:'2026-10-23 11:59:29',t:'职务并发校验与兼任上限：添加老师提交时按最新数据校验并剔除已持有 / 离职 / 兼任已满的老师，停用主职务遇兼任已满直接解除关联，老师端分配职务补 3 项上限并以删除线列出已停用记录',p:['school.html','teacher.html'],i:['学校端「添加老师」对话框：点确定时重读最新数据再校验（真实产品由服务端执行，对话框打开时的快照不作为写入依据）；职务被删除 / 停用时关闭对话框并 toast，数据权限类型被改时清空范围区红字提示重选','所选老师中已持有本职务、已离职、兼任已满 3 项（含已停用，文案写明「含 N 项已停用职务」）的人红字按原因分组列出、从已选区与候选列表移除、按钮改为「确定（剩余 N 人）」，本次不写入，再点确定按剩余的人提交；全部不可添加时提示「本次没有可添加的老师」','候选列表不再列出兼任已满 3 项的老师，提示文字改为「已持有本职务或兼任已满的不再列出」','停用职务：以它为主职务且兼任已满 3 项（含已停用）的老师不并入兼任、直接解除与本职务的关联，启用后不自动恢复；停用确认框追加「其中 X 位兼任职务已满…」一段，停用职务日志追加「；X 位兼任已满、已解除关联：{姓名}」并给每人各记一条「分配职务」日志','老师端分配职务页补「兼任最多 3 项」上限（含已停用记录）：已满时未勾选行置灰、底部提示「兼任职务最多 3 项（含 N 项已停用职务），收回后才能新增」，勾第 4 项与保存均拦截','老师端分配职务页与教师详情页：已停用职务的记录以删除线列在兼任末尾、标「已停用 · 暂不生效」，分配职务半屏中默认勾选、取消勾选即收回腾出名额，保存记「兼任：收回 {职务名}（已停用）」','演示说明同步；口径已写入飞书 PRD 2.1.1.7 添加校验表、2.1.1.9 停用 / 启用、2.1.1.11 日志模板、2.1.2.6 分配职务']},
{d:'2026-10-22 18:32:12',t:'新增学生页补归属学年、入学级、学生类型与必填校验、删除家长，表单选择改为小程序滚轮半屏，现住址拆为所在地区与详细地址',p:['teacher.html'],i:['新增学生页：性别下方新增「归属学年」（必填，默认不选，2025—2026 学年（当前学年）/ 2026—2027 学年（下一学年））；学生班级下方新增「入学级」（按归属学年与年级自动推算，选项往前 16 届）；出生日期下方新增「学生类型」（选填，走读生 / 住宿生）','入学级在归属学年与学生班级都选定后才可手动修改，手动修改后再改学年 / 班级不再自动覆盖，选回「选择学年和年级后自动推算」恢复自动推算；学生审核页同规则，每条申请重新推算；两页共用 stuEnrCalc','新增学生页「保存」按表单顺序校验必填项：学生姓名、归属学年、学生班级、现住址（两段要么都不填要么都填全）、每张家长卡片的称谓 / 家长姓名 / 家长手机号（11 位手机号格式）','新增学生页家长卡片新增「删除该家长」，至少保留一个家长（只剩一张时不显示），删除后分组标题重新编号；修复删除第一张卡片后无法再添加家长','表单选择类字段改为底部滚轮半屏（对应小程序原生 picker）：新增学生页归属学年 / 入学级 / 学生类型 / 家长称谓（爸爸 / 妈妈 / 爷爷 / 奶奶 / 外公 / 外婆 / 其他）、学生审核页归属学年 / 入学级；新增学生页与修改学生信息页的出生日期改为年 / 月 / 日三列滚轮，天数随年月变化','现住址拆为「所在地区」（省 / 市 / 区县三列联动滚轮，对应 picker mode="region"）+「详细地址」（最多 40 字），与家长端孩子资料同一字段；新增学生页、修改学生信息页选填且两段要么都不填要么都填全，学生详情页合并一行展示；演示名册所在地区按本校所在地浙江省 杭州市 西湖区补齐','演示说明同步更新：新增学生、修改学生信息、学生审核三页']},

{d:'2026-10-22 16:50:08',t:'学生注册审核交互优化：修复勾选收起、搜索失焦与隐藏勾选误批，按记录 id 定位，列表补申请信息与风险提示，批量通过加确认',p:['teacher.html','parent.html'],i:['修复：勾选学生后班级被自动收起——记住各年级 / 班级的展开收起状态，勾选、搜索后保持不变','修复：搜索框每输入一字即失焦、打断中文输入法——搜索栏只生成一次，列表单独重画','修复：搜索状态下批量通过 / 拒绝会带上被搜索隐藏的已勾选学生——换关键字时取消结果外的勾选，已选人数与批量操作只作用于可见勾选项','勾选、进详情、通过 / 拒绝、家长认领家长列表改为按记录 id 定位，同名学生不再串人','学生行点整行进审核详情（行尾「详情 ›」），勾选只认左侧勾选框并加大点击区；年级 / 班级表头整行（名称、人数、箭头）均可收起展开','列表默认全部展开，超过 20 人时班级默认收起，搜索时一律展开','学生行补充申请人关系 · 手机号 · 提交渠道（人工申请 / 班级注册码 / 学校注册码）与提交时间，姓名旁标「新学年入学」及风险提示（本班已有同名学生 / 同班有同名申请 / 同一申请人多条申请，只提示不拦截）；家长端同步的申请带出提交渠道','勾选框选中改为蓝底白色对勾，年级 / 班级 / 全选部分选中时显示半选态','批量通过先弹确认半屏，列出将通过的学生','学生审核页：申请人家长卡片标题改为「家长信息（申请人）」且不可删除，老师新增的家长卡片可「删除该家长」','演示数据：注册申请补齐申请人姓名、关系、手机号与提交渠道，新增陈子昂（3年级-2班）演示同名提示，待审核由 5 人变为 6 人；演示说明注明本页面向所有有审批学生注册权限的老师']},
{d:'2026-10-22 16:26:06',t:'添加孩子与绑定申请新增「就读安排」，学生审核页新增归属学年与入学级并与家长端双向联动',p:['parent.html','teacher.html'],i:['家长端添加孩子、班级 / 学校注册码绑定申请与老师端添加孩子表单在监护关系上方新增「就读安排」（现在就读 / 新学年入学），必选，默认「现在就读」，每次进入页面恢复默认','老师端学生审核页：学生班级上方新增「归属学年」（2025—2026 学年（当前学年）/ 2026—2027 学年（下一学年）），按家长填写的就读安排自动定位；学生班级下方新增「入学级」，按「归属学年起始年 −（年级 − 1）」自动推算，选项自起始年往前 16 届；两项均可手动修改，改学年或换年级后重新推算','学生审核页选班结果改为写回本页（此前与修改学生页共用目标、选完不回显），换年级后入学级跟着重算','学生审核页去掉出生日期与现住址字段','家长端 → 老师端：家长在同一浏览器提交的本校绑定申请即时进入老师端「注册申请 · 待审核」，带出就读安排、监护关系、手机号；家长姓名按「孩子姓名 + 关系」默认（如 林晓乐妈妈，关系为「其他」时为「XX家长」），老师可改；家长撤回同步移除，家长端刷新清空','老师端 → 家长端：老师单条或批量通过 / 拒绝后结果即时回传——通过转已绑定（孩子管理页条目转普通条目、孩子数 +1，未匹配承接页状态卡转「已通过」，办理页 chip 转正）；拒绝按撤回口径清除并提示未通过及理由','演示数据：赵小雪（3年级-2班）设为「新学年入学」；相关页面演示说明同步更新']},

{d:'2026-10-22 06:19:02',t:'学校端操作日志与 PRD 2.1.1.10 对齐：注册码两类第一阶段不列出、自动激活操作人记「系统」、页头说明补请假单导出',p:['school.html','docs'],i:['操作日志类型下拉不列「重新生成注册码」「作废注册码」（注册码有效期、作废、重新生成第一阶段隐藏）：QR_PHASE1 开关上移到 AUDIT_TYPES 之前定义，类型清单按它过滤；列表与导出只展示类型清单内的记录，种子中的一条「重新生成注册码」随之不显示，数据保留，QR_PHASE1 改为 false 即恢复','老师本人访问小程序并切换到本校自动激活时，「激活账号」日志的操作人由「{姓名}（本人）」改为「系统」，与 PRD 教师注册口径一致','页头说明改为「职务、职务分配、班级角色、教师注册、教师账号的变更与请假单导出记录，只读、不可修改」','演示说明（操作日志）补：导出请假单写入本页、激活操作人记「系统」、批量导入教师明细 5 位以内逐人列出、超过 5 位只写人数、注册码两类第一阶段隐藏的范围与恢复方式','PRD（飞书）职务管理新增 2.1.1.10「学校端：操作日志」并附截图，原 2.1.1.10–2.1.1.12 顺延；批量导入明细上限与注册码两类不列出两项待确认定版，第一阶段隐藏与后续阶段同步']},
{d:'2026-10-22 05:56:54',t:'请假时长按学生排班计算：代学生请假多名学生时长不同时分组显示，部分学生时长为 0 整批拦下',p:['teacher.html','docs'],i:['时长按学生排班计算：一天可有多个班次段（如白天 08:00–16:00 加晚自习 18:30–20:30），逐段取重叠、段间空档不计，各段都被完整覆盖才计整天；晚自习计入请假时长与考勤','演示排班：3年级-2班 王一彤、杨梓冉另有晚自习 18:30–20:30，其余学生只有白天段','代学生请假时长行：所选学生时长全部相同显示一个值；不同时按时长从短到长分组逐行显示「{时长} · {n} 人」并附小字「按学生排班分别计算」；改选学生后重算，每张单记录本人时长','空单拦截逐人判定：全部为 0 沿用两种原提示；部分为 0 整批拦下，toast「{姓名}等 n 人在所选时段无需到校，请调整时段或学生」','代销假与销假确认的时长同样按该生排班计算','演示说明新增两个入口：多名学生时长因排班不同、只选晚自习时段时部分学生时长为 0 整批拦截','飞书 PRD：「时长（上学日）」计算规则改按学生排班并补晚自习示例，代学生请假第 3、4 条与提交校验表（新增 6″）同步，补两张截图，修订记录同步']},
{d:'2026-10-22 05:44:57',t:'请假：老师代请假与代销假不通知家长、取消免审开关，代学生请假标签改为「证明材料」，证明材料说明去掉格式提示',p:['parent.html','teacher.html','school.html','docs'],i:['老师代请假不通知家长：家长端消息页「李老师为林晓阳代请假」与服务号「请假代提交通知」隐藏（节点保留，消息筛选按 data-off 跳过），代请生效节点改为「老师代提交即时生效」，代请 toast 去掉「并同步双家长」，学校端代请附注改为「代请即时生效」，演示说明同步（模板消息 35 条改为 34 条）','取消学校免审开关：是否免审只看代请人是否持有覆盖该班的「请假 · 审批与销假确认」，删去「保守学校可关闭免审」','老师代销假不通知家长：代销附注去掉「已同步全部家人」，toast 改为「已销假：…」，家长端销假结果推送注释与演示说明写明老师代销假不推送','老师端代学生请假「证明材料」标签去掉「（可由家长事后在请假单内补传）」，补传随退回补充为后续阶段','家长端发起请假、补充材料与老师端代学生请假的证明材料说明行去掉「支持 JPG / PNG / HEIC 图片」，只收图片的规则不变','飞书 PRD 同步：代学生请假提交结果重写、流转记录表、消息与入口、代销假说明、第一阶段证明材料标签；家长端、老师端「老师代请：生效节点」截图重拍；修订记录同步']},

{d:'2026-10-21 13:10:06',t:'智慧放学待确认项定版：主行保留规则、查看与操作权限分开、开始放学与延迟放学限在离校时段内、区分离校时段与放学时间',p:['teacher.html','parent.html','docs'],i:['主行段：放学中的段优先作主行，满 10 分钟且下一段入校开始才让给下一段；系统收口的段即时让出；家长端主行同一规则','查看与操作分开：页面列表取查看范围并集，超出任教班级时显示两个 Tab，第二个 Tab 全校范围叫「全校班级」、否则叫「可查看班级」；只有查看的班点击未放学 / 延迟放学格子提示「暂无 {班级} 的放学操作权限」；只有操作、没有查看的账号首页不显示智慧放学宫格，只经扫码进入，页面为空态','新增预览：4年级年级组长兼 3年级任教、只有查看没有操作、仅操作账号扫码','区分两套时间：离校时段（考勤控制时间段，非末段到下一段入校开始前一分钟、末段到 23:59）是开始放学与延迟放学的时间窗，离校开始前点开始放学会提示；接送设置的放学时间（可设多个）是自动放学计数窗口，窗口外出校不计数','延迟放学上限为该段离校结束；延迟期间出校达阈值仍自动放学','家长端消息列表标题统一为「孩子班级开始放学」，老师手动放学的服务号卡片带「操作老师」','设计文档第 9 章、13.4.4 同步；飞书 PRD 2.1.5 待确认项全部定稿并补修订记录']},
{d:'2026-10-21 05:59:48',t:'职务管理列表点在任老师人数改为打开职务详情抽屉并定位到在任老师 / 成员页签，0 人也可点',p:['school.html','docs'],i:['职务列表「在任老师」人数点击由跳转教师管理名单并按职务筛选，改为打开该职务的详情抽屉并定位到在任老师页签（自动关联的四行为成员页签）：不离开列表、筛选与位置不丢，可直接添加 / 移除老师；第一阶段站内教师管理菜单隐藏、侧边栏教师管理为外链原型，原跳转依赖对方页面按职务筛选','0 人改为可点链接，新建职务点人数即进在任老师页签接着添加老师','移除 gotoHolders；演示说明与隐藏菜单注释中「可由在任老师人数进入教师管理」改为由演示说明预览按钮进入；教师管理名单的职务筛选下拉保留','飞书 PRD 同步：在任老师列交互改写，删去「在任老师人数跳转教师管理要求教师管理·查看」，第一阶段范围表中教师管理页入口改为页面地址']},
{d:'2026-10-21 05:53:00',t:'职务管理列表职务列加宽到 240px，职务名与两个标签一行显示',p:['school.html','docs'],i:['职务表职务列由 160px 加宽到 240px：此前班主任等自动关联职务带「自动关联」「已调整」两个标签时第二个标签掉到下一行，行高不齐；现六字职务名加两个标签（如「课后服务老师 学校新增 已停用」）均在一行显示，更长的职务名仍换行兜底','飞书 PRD 职务列表「表格列」补充职务列宽度口径；「已调整」标签改写为功能权限与平台默认值不同时显示、改回后消失，默认模板与学校新增职务不显示']},
{d:'2026-10-21 05:31:38',t:'请假处理资格改按「审批与销假确认」权限点判定，校长可代请 / 代销假并直接审批；重叠比对纳入销假待确认与已销假；补事由 200 字上限、证明材料格式与销假 / 待办服务号推送；修正家长端详情深链报错与毕业孩子可发起请假',p:['parent.html','teacher.html','docs'],i:['处理资格（2026-10-21 定）：能否审批 / 确认销假、代请假与代销假是否免审，均看当前操作人是否持有覆盖该班的「请假 · 审批与销假确认」，按全部任职关系逐条计算后取并集、不按身份推断；待办仍只派给该班班主任。teacher.js 新增 LV_GRANTS / lvCan 按演示视角的任职关系判定，「待我审批」与角标只计本人任班主任的班级','老师端：校长视角显示「＋ 代学生请假」（候选为全校班级），可直接审批待审批单、确认销假，代请 / 代销假免审即时生效，三张演示主线单同样进专页；无处理资格的代请转该班班主任审批（流转「提交 → 待审批」进该班「待我审批」），代销假转「销假待确认」；通用详情页补「确认意见」与「不同意 / 确认销假」','重叠比对两端统一：待审批、已通过、销假待确认按原时段，已销假按缩短后的「开始 ~ 实际结束时间」，整单销假的不再占用；弹窗正文按生效时段显示；家长端演示说明新增「已整单销假的时段可重新请假」入口','事由两端最长 200 字、标签旁实时计数；证明材料说明行改为「支持 JPG / PNG / HEIC 图片，最多 5 个，最大 10 MB/个」','消息：家长端服务号推送页新增「销假结果通知」（5月28日 林晓乐整单销假）；老师端新增微信服务号推送示意页（消息页演示说明进入），含两张「请假审批提醒」与一张「销假待确认提醒」，点击直达单据','家长端修正：hash 直达请假单详情报 ReferenceError 致页面空白、后续脚本中断（改为脚本执行完毕后再渲染）；首页演示入口与页面地址直达发起请假可绕过「毕业孩子不能发起」（进入发起页与提交时统一拦截并提示）；林晓阳老师代请单时长 3.5 小时改为按统一算法的 3 小时','docs/design.md：13.4.1 处理类改按审批与销假确认判定、与待办派发分开；13.4.2 任课老师锁定项理由同步；13.4.3 待办派给班主任、取消「代批」权限点；13.4.4 权限表中年级组长、校长 / 校级管理员四项均可、免审，示例同步；附录代录免审口径同步','飞书 PRD 同日新增请假（家长端 / 老师端）一节并按上述口径修订（名词解释、关联原型、第一阶段隐藏、迭代方向、修订记录同步）']},
{d:'2026-10-21 05:09:33',t:'教师身份离职 / 被移除与扫码遇离职记录的告知由 toast 改为单按钮对话框，点「我知道了」后再跳转',p:['teacher.html','parent.html','assets/teacher.js','assets/teacher.css','assets/parent.js'],i:['这些告知字数多（30 字以上）、要用户记住「联系学校管理员恢复在职」，且后面紧跟页面跳转，toast 1.8 秒即消失、用户来不及看清就被带走','新增 tAlert 单按钮对话框（对应小程序 wx.showModal 不带取消），挂在手机框内居中弹出；teacher.css 补 .phone .modal-mask 定位样式','tRevoke：离职与被移除共六种情形都在当前页弹框，标题「教师身份已离职」/「教师身份已移除」，正文写明学校与将切换到的身份，无剩余身份时提示联系学校管理员（离职为恢复在职），点完再切换；家长端 #teacher-left / #teacher-revoked 与未匹配到孩子页的落地 toast 去掉，不重复告知','扫码注册遇本校离职记录：弹「无法重新注册」对话框，演示先隐藏表单区（真实产品在扫码判定时即弹框，看不到表单），点完再按剩下的身份分流','登录页、账号切换页、扫码注册页演示说明同步']},
{d:'2026-10-21 04:55:40',t:'已离职老师的登录与使用：离职记录不算教师身份，登录按剩下的身份分流并告知一次；使用中被设为离职即时切走；扫注册码与新增教师遇离职记录提示恢复在职',p:['teacher.html','parent.html','school.html','assets/teacher.js','assets/parent.js','docs'],i:['此前只写了「离职后无法登录本校」，没规定登录落点；改为与身份移除同一套兜底：其他学校在职 → 该校教师首页，有家长身份 → 家长首页，都没有 → 家长侧「未匹配到孩子」页，落地 toast「您在市实验一小的教师身份已离职」','assets/teacher.js：tRevoke 增加 why=left（文案点明学校与离职，家长端落地 hash 为 #teacher-left / &left）；新增 tLeftLogin 演示登录时识别到本校离职；登录页演示说明加三个「本校已离职」入口，账号切换页加三个「使用中被设为离职」入口，并修正其中仍写「未匹配教师身份」承接页的旧口径','扫码注册：手机号在本校已有离职记录时不进注册表单、不生成新申请，toast 提示联系学校管理员恢复在职（regDemo(left) 演示）；新增教师 / 修改教师信息的手机号查重遇离职记录提示「可在教师详情中恢复在职」，学校端 phoneErr 同步','assets/parent.js：识别 #teacher-left 与 #nochild=…&left，toast 告知本校教师身份已离职；未匹配到孩子页演示说明同步','docs/design.md：教师注册流程图的名单判定与日常登录节点注明不含离职记录，守门口径与教师名单规则补离职老师的登录、注册与查重']},
{d:'2026-10-21 04:05:37',t:'学校新增职务示例「教研组长」改为「课后服务老师」：指定班级范围，权限为校园签到·查看与智慧放学·查看 / 操作，由吴芳兼任',p:['assets/duty-store.js','assets/teacher.js','school.html','teacher.html'],i:['教研组长在真实学校按学科组织、管的是本学科老师的教研，不按具体班级分配，配「指定班级」范围和班级评价、校园签到权限与实际不符；课后服务看班老师按班分配，与该范围和签到 / 放学权限对口，作为「指定班级」类职务的演示示例','共用数据层（assets/duty-store.js）：职务 jyzz 教研组长（班级评价·查看、校园签到·查看）换为 khfw 课后服务老师（校园签到·查看、智慧放学·查看 / 操作，功能权限 3 项）；兼任人由教导处主任赵雪改为任课老师吴芳，范围仍为 3年级-4班、3年级-5班；操作日志「新增职务」「分配职务」两条同步；存储键升为 v18，打开页面按新种子重建','老师端演示说明（assets/teacher.js）：教师详情演示数据、分配职务页指定班级类示例与「勾选兼任」演示操作改为课后服务老师']},
{d:'2026-10-20 23:20:29',t:'学校端自动关联职务成员表：全体教职工不再输出范围列、只列老师；飞书 PRD 成员页签列定义同步',p:['school.html','docs'],i:['school.html：成员表第二列为该职务的范围名、值为每人各自的班级 / 年级，班主任 / 任课老师 / 值周老师因人而异保留；全体教职工范围固定为全校、人人相同，此前 23 行全是「全校」、与表格上方说明重复，改为按范围类型判断不输出该列，空态占位同步改为 1 列；职务管理演示说明补成员表列规则与本次原因','飞书 PRD「自动关联职务的详情与权限编辑」成员页签：表格列定义去掉「全体教职工为「全校」」，改为全体教职工范围固定、不设这一列、只列老师']},
{d:'2026-10-20 23:00:00',t:'学校端职务详情抽屉在任老师列「账号」改名「状态」，职务管理页头与教师详情提示语「和账号自动关联」改为「和在职状态自动关联」；飞书 PRD 学校端「账号状态」正常 / 已停用表述全部统一为在职 / 离职',p:['school.html','docs'],i:['school.html：职务详情抽屉「在任老师」表格表头由「账号」改为「状态」——列值是在职 / 待激活 / 离职这组在职状态而非账号状态，待激活的老师尚无账号，与教师管理名单的「状态」列同名同口径；职务管理页头说明与教师详情职务块提示语中的「值周分组和账号自动关联」改为「值周分组和在职状态自动关联」；职务管理演示说明补表头改名原因与页头文案变更记录','飞书 PRD《智小徽产品需求文档_V1.2.5_261020》：41 处替换，学校端的账号状态 / 账号正常 / 已停用账号 / 账号停用一律改为在职状态 / 在职 / 已离职 / 设为离职；老师端「名册、账号状态与权限口径」改为在职状态，原「两端两套叫法」改为统一一套并注明原叫法与日期；日志类型「停用账号 / 启用账号」改为「设为离职 / 恢复在职」、明细与原型写日志文案一致，保留旧类型名读取时自动归一的说明；职务的停用 / 启用与指登录账号本身的「激活账号」「删除本人账号」等用词不动；修订记录表新增一行「修改」记录本次口径统一']},
{d:'2026-10-20 18:56:16',t:'老师端登录分流：账号无任何教师 / 家长身份时统一落家长侧「未匹配到孩子」页，老师端「未匹配教师身份」页隐藏；家长侧「您是老师？」半屏手机号跟随页面当前号码',p:['teacher.html','parent.html','docs'],i:['2026-10-20 产品口径：家长与教师同一个小程序，登录后按账号全部身份分流——有教师身份进教师首页、只有家长身份进家长首页、什么都没有时无法判断来者是谁，统一落家长侧「未匹配到孩子」页，由其「您是老师？」半屏引导联系学校管理员加入教师名册；自助注册仍只有微信扫注册码冷启动一个入口','teacher.js：快捷登录授权 135****6677 与教师身份被移除且无剩余身份（tRevoke none）都跳 parent.html#nochild=<脱敏号>[&revoked]；sc-noauth 页 display:none 隐藏保留、hash 直达回登录页，登录页演示说明入口改为「无任何身份 → 家长侧未匹配到孩子页」与隐藏页预览（失效页入口同样改为预览，避免点进空白页）','parent.js：支持 #nochild= 跳入并随人设显示号码、&revoked 时 toast 身份已移除；「您是老师？」半屏文案与按钮保持原状，手机号改为引用页面当前号码（data-tel-of），老师端分流过来时两处号码一致','docs/design.md 登录流程 L3N 节点与家长注册口径同步；飞书 PRD 2.1.3 入口、守门判定、承接页小节、流程画板与截图已按此改']},
{d:'2026-10-20 18:07:07',t:'共用演示数据新增 5、6 年级各两个班，演示校扩为完整的六年制小学',p:['school.html','teacher.html'],i:['duty-store.js：年级字典加 5年级 / 6年级，班级字典加 5年级-1 / 2班、6年级-1 / 2班（全校 17 个班）；四个新班各配班主任与任课老师：冯磊 5年级-1班、苏畅 5年级-2班、唐宁 6年级-1班、新增老师秦岚 6年级-2班（前三位原无班主任班级，避免一人带两个班）','存储键升至 v17，两端打开时按新种子重建；老师端教师管理统计变为 28 / 24 / 3','添加老师对话框的班级区刚好 6 行填满上限；老师端分配职务 / 教师注册的选班半屏左栏列出 6 个年级；飞书 PRD 对应 5 张截图已换新']},
{d:'2026-10-20 17:10:16',t:'教师注册码第一阶段改为长期有效、不可作废或重新生成：学校端注册码弹窗隐藏有效期与作废 / 重新生成按钮，老师端「注册码已失效」页隐藏',p:['school.html','teacher.html','docs'],i:['2026-10-20 产品确认第一阶段以 Mockplus 教师管理页为准：注册码无有效期、不可重新生成；24 小时有效、作废 / 重新生成与老师端失效页列为后续阶段','school.html：注册码弹窗加 QR_PHASE1 开关，第一阶段状态恒为生效中、只保留「下载二维码」，有效期行与作废 / 重新生成按钮按约定隐藏（逻辑与日志类型保留，恢复方式见注释）；弹窗内去掉与标题重复的小标题；教师名单与操作日志演示说明同步','teacher.html：sc-expired 页 display:none 并注释恢复方式；teacher.js 该页演示说明改名「注册码已失效 ·（后续阶段）」、hash 直达回登录页，扫码注册演示说明去掉 24 小时有效','docs/design.md 13.1 注册码文字、流程图 A2 / B2 / B2N 与时序图节点同步为第一阶段口径；飞书 PRD 2.1.3 各处、流程画板与 3.1 补充说明表已同步']},
{d:'2026-10-20 16:55:46',t:'学校端按年级分行的班级多选行高收紧，添加老师对话框内限高 6 行、年级更多时区内滚动',p:['school.html'],i:['每行内边距由 9px 收到 6px，行高约 45px → 41px；新增教师 / 班级身份编辑 / 分配职务抽屉同一控件一并变紧凑，抽屉整体滚动、不限高','添加老师对话框内的班级区最高 248px（6 行 × 41px + 边框），小学 6 个年级刚好全显示，九年一贯制等年级更多的学校区内滚动，对话框不再被撑成长条；演示校 4 个年级时对话框在 1080p 下不需要整体滚动','飞书 PRD 2.1.1.7 指定班级区补充限高规则，添加老师截图已换新']},
{d:'2026-10-20 16:47:26',t:'学校端职务管理「添加老师」对话框候选区改为已选区 + 筛选条 + 勾选列表，支持按年级 / 班级身份筛选与全选当前结果',p:['school.html'],i:['原为平铺姓名 chip，百人规模下同名难分辨、已选的人一筛选就看不见；改为固定高度内滚的行列表，每行复选框 + 姓名 + 脱敏手机号 + 班级身份摘要（班主任 / 任课 / 无班级身份）+ 待激活标，首行「全选当前 N 人」吸顶','筛选条为姓名 / 手机号输入框、年级下拉、班级身份下拉；已选的人常驻列表上方作标签、点 × 移除，为空提示「尚未选择，从下方列表勾选」；无结果显示「没有符合条件的老师」','勾选 / 移除只刷新已选区、计数、影响提示与底栏，列表不重绘、滚动位置不变；指定班级区改动同步为只重绘范围区；职务管理页演示说明与飞书 PRD 2.1.1.7 已同步']},
{d:'2026-10-20 16:34:01',t:'学校端职务管理「添加老师」对话框与教师管理「分配职务」抽屉的指定班级改为按年级分行的班级多选，可整年级全选',p:['school.html'],i:['原为全校班级「x年级-y班」平铺 chip，真实学校几十个班会铺满对话框且前缀重复难扫读；改用班级身份编辑 / 新增教师 / 注册审核共用的按年级分行控件（左年级名、中班号标签、行尾全选 / 取消全选），整站班级多选只剩一种形态','「指定年级」只有几个 chip，保持平铺；共用控件的数据源分发新增 dh.s（添加老师）与 as.main / as.ex.N（分配职务）两类 key，勾选、排序、校验逻辑不变','飞书 PRD 2.1.1.7 指定班级区的规格与添加老师截图已同步']},

{d:'2026-10-20 14:26:26',t:'学校端教师状态口径与小程序统一：「账号状态」正常 / 已停用改为在职 / 待激活 / 离职，操作改为设为离职 / 恢复在职，两端操作日志类型同名',p:['school.html','assets/duty-store.js','assets/teacher.js','docs'],i:['学校端教师管理：统计卡「正常 / 已停用」改为「在职 / 离职」，名单列与详情「账号状态」改为「状态」（详情区块标题「账号」改为「状态」、行标签「当前状态」），离职老师在班级角色等下拉中标注「（离职）」，离职详情提示改为「该老师已离职，无法登录本校…恢复在职后按当前配置恢复」','学校端操作：「停用账号 / 启用账号」改为「设为离职 / 恢复在职」，确认弹窗、toast、本人置灰提示（「不能将本人设为离职，请由其他管理员操作」）同步改写；全体教职工说明改为「随在职状态自动变化」','操作日志：两端写入的类型由「停用账号 / 启用账号」统一为「设为离职 / 恢复在职」，变更内容文案同步；日志页类型筛选同步；共用存储读取时把旧记录类型归一，种子日志同步改名','暂不提供离职之外的临时停用（借调、长期休假等），后期按需再考虑；设计文档 13.4 相关表述、后台设计规范示例与两端演示说明同步改为在职口径']},

{d:'2026-10-20 13:36:15',t:'老师端教师注册与注册审核表单去掉职务字段、统一为姓名 → 手机号 → 性别 → 班主任班级 → 任教班级 → 称谓；白名单匹配前置到登录 / 扫码时，白名单内老师直接激活进首页，注册页只服务白名单外老师并一律转人工审核；隐藏教师身份认证确认页',p:['teacher.html','assets/teacher.js','docs'],i:['注册审核页（sc-tchaudit）：去掉「职务」字段与其选择半屏，新增班主任班级（选填多选）置于任教班级上方，任教班级改选填，手机号移到教师姓名下方、称谓移到最后；两个班级字段复用新增 / 修改教师的 tcpOpen 选择面板（上下文 ta），通过时把管理员修正后的姓名、性别、班级、称谓回写申请记录；称谓预填不再依赖自报职务','教师注册页（sc-reg）：同样去掉「职务」字段（职务一律由管理员分配，设计文档 13.4.5），字段顺序与注册审核页、新增教师页一致，两个班级字段复用 tcpOpen（上下文 reg，支持本页占位文案），班级命名统一为「3年级-1班」格式；旧的 regGrades / regSel 独立选择器与职务面板删除','守门口径（产品确认）：白名单匹配在登录 / 扫码时按账号手机号完成，在白名单内（含学校端预置班级身份的待激活记录）直接自动激活进首页、不进注册页、班级身份按学校端预置生效；注册页提交只剩转注册审核中页一种结果；演示入口改为「模拟提交 · 白名单外（转待审核）」与「模拟扫码 · 手机号在白名单内（直接激活进首页）」','注册审核中页申请人条目：原职务回填改为班级身份摘要（「{班级} 班主任」/「任教 {班级}」/「教师」）；待审核页分组按申请信息推导（填了班主任班级归班主任组），演示数据陈静怡、郑海涛补班主任班级','教师身份认证页（sc-auth）第一阶段隐藏：display:none 保留节点，微信快捷登录与验证码登录改为直达首页并 toast，hash 直达回退登录页，登录页演示说明新增「预览 · 教师身份认证页（已隐藏）」','design.md：13.1 守门判定改为登录 / 扫码时判定；13.4.5 注册页与注册审核表单差异项改为已同步并写明生效口径']},
{d:'2026-10-20 13:03:37',t:'老师端分配职务页与教师详情页：「主职务」标签改为「职务」',p:['assets/teacher.js'],i:['分配职务页（#sc-tchduty）分区标题「主职务」改为「职务」，点击字段拉起的选择半屏标题同步由「选择主职务」改为「选择职务」，演示操作「选主职务」改为「选职务」','教师详情页（#sc-tchdetail）「职务」卡内第一行标签「主职务」改为「职务」，兼任职务、自动关联两行不变，与分配职务页、个人资料页的「职务」行同名','数据层 main 字段与操作日志「主职务：A → B」格式保持不变（与学校端共用同一格式）；两页演示说明 chip 补充改名说明']},
{d:'2026-10-20 10:23:01',t:'老师端个人资料页：去除值周安排行（后续阶段隐藏），字段顺序改为班主任班级 → 任教班级 → 称谓 → 职务 → 兼任职务，两行班级统一为教师详情的灰字写法并去掉青色班级标签',p:['teacher.html','assets/teacher.js','assets/teacher.css','docs'],i:['值周安排行按产品要求从个人资料页去除：节点 display:none 保留（pf-hidden 类，注释写明恢复方式），演示说明两个预览按钮改名「预览 · 值周安排 · 值周中 / 不在分组（后续阶段）」，点击时临时显示该行、刷新恢复隐藏；补样式让隐藏行的前一行作为可见末行不画底线；design.md 13.4.2 提到该栏处补括注说明第一阶段原型已隐藏','字段顺序调整：头像、学校名称、教师姓名、性别、手机号之后依次为班主任班级 → 任教班级 → 称谓 → 职务 → 兼任职务（原为职务 → 兼任职务 → 称谓 → 任教班级 → 班主任班级）','班主任班级、任教班级两行统一为教师详情的写法：灰字、顿号分隔、班级名作不换行整体只在顿号处断行，超过 2 个班时整行改为标签在上、值在下（.pf-row.stack，与 .frm-row.stack 同款）；原任教班级青色标签 .pf-cls-tag 去除——两行都是本人的班级身份，一行标签一行灰字没有语义依据，青碧色也是留给状态 chip 的；两行由 meRoleSync 同一段逻辑按共用名册填充','个人资料演示说明按新顺序重写字段段落，并补值周安排后续阶段与两行班级统一口径']},
{d:'2026-10-20 10:07:05',t:'老师端首页角色标签与副标题改为按共用名册计算（角标职务、副标题数据范围，班级多时收敛为「等 N 个班」），家长端身份面板教师行接同一份名册；上下文子页刷新 / hash 直达回退父页',p:['teacher.html','parent.html','assets/teacher.js','assets/parent.js','assets/parent.css'],i:['首页角色标签按名册计算：头像角标不再写死「班主任」，按共用名册中本人记录（t26）取主职务名 > 班主任 > 教师，「我的」头部 chip、个人资料「职务」行、身份切换面板与账号切换页当前身份行（data-me-role）同源；个人资料的兼任职务、任教班级、班主任班级也按名册填充，不是班主任时班主任班级行隐藏；页面加载、保存分配职务、设为离职 / 恢复在职、恢复演示数据后刷新，「无功能权限首页」预览开启时按「教师」覆盖','首页副标题改为本人数据范围（此前与角标同为「班主任」互相重复，家长端同位置为身份类型 + 班级）：有主职务显示主职务范围（全校 / 所选年级班级 / 本人对应班级），没有主职务显示班主任班级 + 任教班级，都没有显示「—」，与教师管理名册行副标题同一段逻辑（tmClsText）','班级多时收敛（沿用学校端教师名单写法）：名册行副标题与首页副标题的班级类列表超过 3 个只列前 2 个并接「等 N 个班」，3 个及以内全列，指定年级类不收敛；教师详情、个人资料、分配职务页仍全列；此前 13 个班名册行折成 4 行、首页单行省略号截断看不出总数','家长端身份面板与账号切换页「王老师 · 市实验一小」行的职务 chip 接上两端共用名册：parent.html 引入 duty-store.js（只读），parent.js 末尾加同口径计算函数，parent.css 补 .chip.dname 省略样式；红旗小学校长行为跨校身份、保持写死；此前老师端改主职务后两端身份面板会对不上','上下文子页 hash 直达回退：教师详情 / 分配职务 / 修改教师信息 → 教师管理，学生详情 / 修改学生信息 → 学生管理，学生请假记录 / 详情 → 考勤明细，家长认领 → 学生待审核，请假单详情（通用）→ 请假，点评详情 / 点评明细 → 素质评价；这些页内容由进入时所选对象填充，刷新或直接按 hash 打开时无上下文、页面空白且保存按钮报错，现回到父页并替换 hash，站内跳转不受影响，11 个页面的演示说明各补口径','演示说明：首页、教师管理、教师详情、个人资料、家长端账号切换页补上述口径']},
{d:'2026-10-20 09:15:55',t:'演示账号王老师登记进两端共用名册（3年级-2班 班主任、兼任校级管理员），教师管理本人行标「我」，本人禁用设为离职 / 删除，学校端停用账号同口径；规则写入设计文档',p:['teacher.html','school.html','assets/duty-store.js','assets/teacher.js','assets/teacher.css','docs'],i:['共用存储升 v14：新增 t26 王老师（女、138****2233，与个人资料一致），3年级-2班 班主任（与王丽并列、居首）、任课 3年级-2班 / 3年级-3班、未设主职务、兼任校级管理员；原并列班主任冯磊改为该班任课老师，避免一班三名班主任；补一条何静「分配职务 · 王老师 · 兼任：新增 校级管理员」日志','老师端教师管理：名册行与详情头部姓名后加蓝色描边「我」标（.chip.me），总数变为 26；更多操作半屏中本人的「设为离职」「删除教师」置灰、点击提示由其他管理员操作，tdAcctSheet / tdAcctDo / tdDelSheet / tdDelDo 函数层同样拦截；给本人分配 / 收回职务照常，收回仍受「至少保留一名持有人」约束','老师端个人资料与教师身份认证页的兼任职务同步为「校级管理员 · 全校」；教师管理、教师详情演示说明补充本人口径并各加「查看本人（王老师 · 我）」按钮','学校端教师名单：何静（当前登录人）行加「我」标（.tag-me），本人行与详情中的「停用账号」置灰并带 title 提示，toggleAcct 函数层拦截；王老师在学校端教师名单与 3年级-2班 请假审批人中自动出现','设计文档 13.4.6 新增「教师名单包含操作者本人，但不能对自己停用 / 设为离职或删除」规则与理由，分工表「停用教师账号」行注明本人除外；后台设计规范「行内操作」补充对本人不开放的操作置灰不隐藏、title 写明原因']},
{d:'2026-10-20 06:12:21',t:'学校端 KPI 卡选中项统一回显为筛选胶囊（只写卡片名）、空态行 colspan 对齐可见列；职务名称 / 说明加字数计数并去空白再查重；老师端长职务名在角标 / 副标题 / chip 上省略截断；三条口径写入后台设计规范',p:['school.html','teacher.html','assets/teacher.css','assets/teacher.js','docs'],i:['职务管理空态行：职务表为 table-layout:fixed，空态 td 的 colspan 写死 6 而敏感数据列隐藏后可见列只有 5，筛到 0 条时表头右侧撑出一列无表头空白；改为随 SENS_ON 取 6 / 5','KPI 卡选中项进筛选胶囊：职务管理、教师管理、班级管理、白名单四页补上（请假管理此前已有），胶囊只写卡片名、排在最前、× 即取消卡片选中；下拉 / 搜索胶囊保持「维度：值」写法，两种写法用来区分来源','新增职务与「修改名称与说明」两处表单：职务名称 / 职务说明标签行右端加「已输 / 上限」计数（20 / 60），达到上限变红；此前 maxlength 静默截断无提示','职务名称保存前去掉首尾与中间全部空白（含全角空格）再做非空 / 同名校验并入库，「年级组长」「年级 组长」不再成为两个职务','老师端：首页头像角标限宽约 6 字、副标题单行省略、职务 chip（教师列表行、「我的」头部、身份切换 / 认证页）约 9 字后省略并带 title 全名；20 字主职务名不再撑破版面。姓名列 flex:1 只作用于文字列，头像不受影响','后台设计规范：KPI 卡回显胶囊与胶囊文案两种写法、空态行 colspan 对齐可见列、文本长度上限要显出来（计数）、名称类字段去空白、标签截断口径（列表 chip / 头像角标 / 头部副标题）']},
{d:'2026-10-19 19:04:12',t:'老师端教师管理名册由按主职务分组改为平铺 + 三组筛选（账号状态 / 职务 / 年级），行内加主职务 chip',p:['teacher.html','assets/teacher.js'],i:['名册不再按主职务分组：主职务稀疏（25 人里七八位有主职务却撑出七八个 1 人小组占满首屏）、兼任职务的人只出现在主职务组、分组集合随学校自定义职务变动；改为平铺，按账号状态（在职 → 待激活 → 离职）再按姓名拼音排，每行姓名 + 主职务 chip（有主职务时）+ 班级或范围副标题，待激活 / 离职沿用头像遮罩','筛选半屏由单一账号状态扩成三组：账号状态（全部 / 在职 / 待激活 / 离职）、职务（学校端启用的职务 + 班主任 / 任课老师 / 全体教职工自动关联项，一人兼多职在多个筛选下都出现，与学校端教师管理职务筛选同口径）、年级（班级身份或职务范围涉及该年级）；三组可叠加，底部重置 / 确定；按钮文字无筛选「全部」、一项为该项名称、多项「筛选 N 项」','统计栏点击只切账号状态、其余筛选保留，高亮与账号状态同步；演示说明同步并新增「筛选 · 年级组长」「筛选 · 班主任 + 3年级」「打开筛选半屏」「重置筛选」入口']},
{d:'2026-10-19 18:57:24',t:'老师端教师详情：每个职务都列出数据权限范围，全校类显示「全校」，任教班级 / 班主任班级类显示本人实际班级',p:['assets/teacher.js'],i:['此前只有指定年级 / 指定班级类职务显示范围，校长、校级管理员等全校类职务光秃秃，而紧挨着的「全体教职工」却标「全校」，读起来像没配范围','改为每个职务一律跟范围（与学校端职务列表同口径）：全校类显示「全校」；指定年级 / 班级类显示分配时所选；任教班级 / 班主任班级类显示按本人班级身份解析出的实际班级，本人没有对应班级时显示「任教班级 · 暂无」，提示该职务当前没有生效范围','分配职务页的兼任 chip 不变（选择态，范围在下方范围行）；教师详情演示说明同步']},
{d:'2026-10-19 18:51:14',t:'老师端教师详情职务卡改为标签在上、内容在下的上下结构，自动关联改用 chip + 范围写法；班级行超过 2 个班时同样上下排列，班级名不再从中间折断',p:['assets/teacher.js','assets/teacher.css'],i:['职务卡三段（主职务 / 兼任职务 / 自动关联）统一为标签在上、内容在下左对齐：每个职务一行，chip 放职务名，指定年级 / 指定班级的范围作灰字跟在后面自然换行，长短范围排法一致；此前右对齐多行文字难读、三条兼任各排各的','自动关联改为与兼任职务同款的灰 chip + 范围（班主任 · 班级、任课老师 · 班级、全体教职工 · 全校），三条各占一行；分配职务页的自动关联卡同步为同款','基本信息的班主任班级 / 任教班级：不超过 2 个班保持左标签右值，更多改为标签在上、值在下左对齐','班级 / 年级名作不换行整体（.nb），只在顿号处断行，不再出现「2年级-1 / 班」的折断；新增 .frm-row.stack / .duty-ls / .duty-ln 样式，去掉不再使用的 dsAutoLines；教师详情演示说明同步']},
{d:'2026-10-19 18:43:27',t:'老师端教师详情：职务行改为每个职务一行，范围作灰色小字跟在职务名后并可换行，修正长范围 chip 被卡片截断',p:['assets/teacher.js'],i:['主职务 / 兼任职务行此前把「职务名（班级列表）」整段放进一个不换行的 chip，指定班级类职务选了多个班时 chip 超出卡片被截断','改为每个职务占一行：chip 只放职务名，指定年级 / 指定班级的范围作灰色小字跟在后面、右对齐并允许换行；多个兼任职务纵向排列','去掉不再使用的 dsChip']},
{d:'2026-10-19 18:35:22',t:'老师端分配职务页：指定班级类职务的班级范围由内联网格改为选择字段 + 半屏，与教师表单的班级字段同款',p:['assets/teacher.js'],i:['指定班级类职务（教研组长）的范围行改为「职务名 · 班级 可多选」标签 + 整行选择字段，占位「请选择班级」，选完回填「3年级-1班、3年级-4班、3年级-5班」；点击拉起半屏「选择班级 · 教研组长」：左年级栏（带已选数）+ 右班级 chip + 顶部已选 chip 可点 ✕ 移除，与修改教师信息 / 新增教师 / 教师审核的班级半屏同一形态','改法缘由：真实学校几十个班按年级分行内联要滚好几屏，主职务与兼任都是指定班级类时更长；同卡主职务已是选择字段、教师表单的班级也是选择字段 + 半屏，内联网格是全站唯一的例外；指定年级类（年级组长）年级只有几个，仍内联勾选','勾选即写入分配数据并同步页面字段，范围未选不能保存的校验不变；分配职务页演示说明同步']},
{d:'2026-10-19 18:31:10',t:'老师端分配职务页：主职务卡与自动关联卡去掉卡内重复的标签行，主职务改为整行可点的选择字段',p:['assets/teacher.js'],i:['主职务卡：分区标题「主职务」下不再套一行「主职务」标签，卡内直接放整行可点的选择字段（与修改教师信息页的班级字段同款），显示当前主职务名、未设为「无」；指定年级 / 指定班级类职务的范围勾选行不变','自动关联卡：去掉「随班级身份」标签行（全体教职工随账号状态、值周老师随值周分组，并不都随班级身份；教师详情页同一行标签本就是「自动关联」），卡内直接按行列出自动关联的职务，没有时灰字「无」','两张单行卡不再是「分区标题 + 标签 + 值」三层，去掉多出的一层留白，与兼任职务卡的层级一致；分配职务页演示说明同步']},
{d:'2026-10-19 18:26:59',t:'老师端班级选择半屏：已选区空态占位去掉与副标题重复的引导句，三处统一为「尚未选择」',p:['assets/teacher.js'],i:['教师注册页「选择任教年级班级」、修改 / 新增教师的「选择班主任班级 / 选择任教班级」、教师审核页「选择任教班级」三处半屏，已选区为空时的占位由「尚未选择 · 先点左侧年级，再选班级」改为「尚未选择」：引导句与正上方副标题「先点左侧年级，再选班级；可跨年级多选」重复，已选区只表达「还没选」这一个状态']},
{d:'2026-10-19 18:24:52',t:'无功能权限的教职工登录后首页改为「暂无可用功能」空态，学校端清空全体教职工功能 / 职务功能为 0 项时补影响提示；两端去掉素质评价入口演示开关',p:['teacher.html','assets/teacher.js','assets/teacher.css','school.html','parent.html','assets/parent.js'],i:['老师端首页：功能权限为空（无职务或职务未勾功能，且「全体教职工」未开启功能）的在职教职工照常登录、照常进首页，不落「未匹配教师身份」页、不拦截登录；头部学校、姓名与身份切换保留，角色标签按无主职务、非班主任口径显示「教师」；活动横幅、扫一扫与全部功能宫格不显示，宫格位置显示「暂无可用功能 · 学校暂未为您开通功能，请联系学校管理员」空态；消息、「我的」Tab 照常','老师端首页演示说明新增「预览 · 无功能权限首页」开关（仅当次会话，刷新恢复）并补上述口径：功能权限决定能用哪些功能、看到哪些入口（设计文档 13.4.1），该状态是合法状态而非异常账号，学校端恢复权限后下次打开首页按权限重新渲染','学校端职务管理：编辑「全体教职工」等自动关联职务清空功能时，影响范围区即时提示保存后将没有任何功能权限的在职教职工人数（按手动职务 + 自动关联职务的并集算，新增 funcPermsOf）；新增 / 编辑职务功能权限为 0 项时，按「全体教职工」是否开着功能分别提示；两处都不拦截保存，与教师详情「看不到任何班级的数据」同口径；职务管理演示说明补「功能权限为空」段落','老师端、家长端去掉首页演示说明的「显示『素质评价』入口」开关：素质评价宫格固定显示；家长端消息筛选的「素质评价」类别、三条点评消息与服务号推送示意页的三张点评通知卡不再随开关显隐；两端不再读写 proto-eval 本地存储键，相关演示说明与注释改为「固定显示」']},
{d:'2026-10-19 18:04:02',t:'请假管理与办理明细对齐：去掉「全部」KPI 卡、导出按钮移到筛选条行尾并加确认框、KPI 选中项进筛选提示；请假管理 / 教师管理年级-班级改为级联下拉',p:['school.html'],i:['请假管理 KPI 不再设「全部」卡（与职务管理、运管端办理明细同一用法）：四张卡是关注切面而非状态划分，总数在上方「共 N 张」；未选中即显示全部，再点同一张取消','请假管理、操作日志的「导出当前结果」按钮从页头移到筛选条行尾（小号按钮），点击先弹学校端共用的导出确认框：导出内容、时间范围、筛选条件、导出条数、文件格式，确认后才导出；请假单多一行「敏感字段」（含病状、是否传染病与证明材料时橙色标出），确认后记操作日志并带筛选条件与条数；结果为空直接提示不弹框','请假管理点选 KPI 卡后，选中项作为胶囊进入筛选提示条（如「待审批 ✕」），点 ✕ 与再点卡片同样取消；导出确认框的筛选条件沿用提示条内容','请假管理、教师管理的年级 / 班级筛选改为级联（共用 clsSelect）：年级为全部时班级下拉只保留「全部班级」并置灰、悬停提示先选年级；选定年级后班级选项只显示「1班」「2班」，筛选提示与列表仍用全名；新增筛选条禁用态样式','两页与操作日志的演示说明同步']},
{d:'2026-10-19 17:42:24',t:'请假管理：KPI 拆出「待开始」卡，已销假按缩短后的区间计入请假中 / 待开始，详情实际时长不再重复原时长，新增已销假仍在请假中的演示单',p:['school.html'],i:['KPI 卡拆为「请假中」与「待开始」两张：请假中 = 生效中的单且当前时刻在请假区间内，待开始 = 生效中的单但开始时间未到，两者互斥；状态列下方小字相应显示「请假中」或「待开始」，都不进状态筛选','生效中的单包括已通过、销假待确认、已销假：已销假按缩短后的「开始 ~ 实际结束时间」判断（设计文档 8.1），实际结束时间未到的仍算请假中；整单销假区间为空、两类都不算；销假待确认在班主任确认前仍按原区间','详情抽屉：已销假单的「实际时长」行只显示实际值，原时长已在「请假时间」行括号内、不再重复','演示数据：新增王梓豪已通过、三天后开始的事假单作「待开始」示例；新增刘思远已销假、实际结束时间在明天 13:00 的病假单作「已销假但仍在请假中」示例；列表共 19 张，请假中 4 张、待开始 1 张','演示说明同步上述口径']},
{d:'2026-10-19 17:24:51',t:'学校端新增「请假管理」页：敏感数据与证明材料按权限显隐、状态按 8.1 列全、来源与处理责任人；三端请假详情增加销假后时长 / 实际时长',p:['school.html','teacher.html','assets/teacher.js','assets/teacher.css','assets/parent.js','docs'],i:['学校端新增侧栏「考勤管理 → 请假管理」（#leave）：全校请假单只读清单，KPI 卡（全部 / 待审批 / 请假中 / 销假待确认，点击筛选）+ 筛选栏（学生、年级、班级、类型、状态、来源、申请时间近 7 / 30 / 90 天或自定义区间，与操作日志页同一套日期交互）+ 列表 + 详情抽屉 + 导出；审批、销假确认由班主任在小程序处理，校级管理员无代批权限，本页不放审批按钮','权限：病状、是否传染病、病假证明材料按敏感数据权限点 s.ill 判定；第一阶段敏感数据权限点未实现（SENS_ON=false），持有请假查看权限的人都可见，导出含三项并记操作日志（新增类型「导出请假单」「查看证明材料」）；SENS_ON 恢复后按职务判定，不持有者不出两列、证明材料只显示张数与灰色占位；事假无病状字段显示「—」，事假证明材料不受限','状态：按设计文档 8.1 列全（待审批 / 退回补充 / 已通过 / 未通过 / 已撤销 / 实际到校 / 销假待确认 / 已销假），「超时」为待审批附加标记、「请假中」为计算态；审批超时、退回补充、实际到校（校门通行自动核销）三项第一阶段隐藏（LV_OVD_ON / LV_RET_ON / LV_ARR_ON 开关，数据与分支保留）','来源与处理：来源列区分家长申请 / 教师代录，班主任代录免审单显示「代录即生效 · 免审」而非审批人，任课老师代录转班主任审批；处理列按状态写明当前责任人（待 ×× 审批 / 确认、已等待时长、无班主任时红字提示）或处理结果（通过 / 不通过 / 撤销 / 教师代销，带意见）；实际结束时间单列','详情抽屉：状态标签放在标题里，正文 kv + 证明材料缩略图（点开大图、多张左右切换）+ 流转记录时间线；时长改为与小程序一致的上学日折算（每天只计 08:00–16:00，整个在校日计 1 天）','三端请假详情（家长端请假单详情、老师端通用详情 / 销假确认页 / 代销假后的已通过单、学校端抽屉）同口径：销假待确认另列「销假后时长 ×（待确认）」，确认前考勤仍按原时长；已销假显示实际时长并附销假前原时长；整单销假显示「整单销假，不计请假时长」','演示数据：19 张单覆盖全部状态，学生取自老师端演示名册，新增方宇航、韩雨泽、沈若溪、彭子墨、江雨萱登记 STU_EXTRA（名册自检通过），各班待审批张数与班级字典 pend 一致','设计文档 13.4.2：病假证明材料随「病状与是否传染病」一并受控、事假不受限；敏感数据权限点实现前持有请假查看权限的人都可见']},
{d:'2026-10-19 16:15:55',t:'查看值周老师改为仅全校范围：值周老师默认值与年级组长模板去掉该项，老师端个人资料页新增「值周安排」栏',p:['school.html','assets/duty-store.js','teacher.html','assets/teacher.js','docs'],i:['「查看值周老师」打开的是全校值周分组清单（各组成员、负责年级、执行时间），与编辑 / 删除同为校级配置，纳入仅全校范围的权限点清单（assets/duty-store.js 的 schoolOnlyPerm）：非全校职务与自动关联职务的编辑对话框中三项值周权限点一并置灰标「仅全校范围」，加载本地存储时清理旧数据里的该项','值周老师自动关联职务的平台默认值去掉查看值周老师，为班级评价的查看 / 点评 2 项；年级组长模板（指定年级）再去掉该项，由 29 项改为 28 项；五个全校范围模板职务不变','老师端个人资料页在班主任班级下方新增只读「值周安排」栏：显示本人所在分组 · 负责年级与执行时间，不在分组显示「无」（演示账号默认「无」）；值周老师看本人安排只走这一栏，不经查看值周老师权限点；演示说明新增「预览 · 值周中」「预览 · 不在值周分组」切换','学校端演示说明：职务管理条目中「查看值周老师为本班范围、可进班级角色」口径改为与编辑 / 删除同口径，并注明为 2026-10-19 补充裁决；权限点清单注释同步','设计文档 13.4.2：「教师管理只在全校范围生效」一条扩为三项值周权限点，写明原「查看为本班范围」与页面形态不符、不采用按负责年级过滤分组列表的理由，以及值周老师默认值与本人安排的展示位置；值周老师角色权限默认值同步']},
{d:'2026-10-19 13:38:25',t:'职务权限：教师管理与编辑 / 删除值周老师只在全校范围生效，非全校职务与自动关联职务置灰不可勾，年级组长模板随之去掉这些项',p:['school.html','assets/duty-store.js','docs'],i:['职务编辑对话框：数据权限不是「全校」时，教师管理整组与班级评价的「编辑值周老师」「删除值周老师」置灰、标「仅全校范围」、不可点，悬停提示先把数据权限改为全校；把范围从全校切到其他类型时自动取消已勾的这些项并 toast 按「组·项」列出；保存时兜底不写入','自动关联职务（班主任 / 任课老师 / 值周老师 / 全体教职工）编辑对话框同样锁定这些点、不受 LOCK_ON 开关影响：前三者范围不是全校标「仅全校范围」，全体教职工按设计文档 13.4.2 校级功能不一键放给全员标「仅手动分配」；打开、保存时去掉这些点','仅全校范围的权限点清单集中在 assets/duty-store.js 的 schoolOnlyPerm，加载本地存储时清理旧演示数据里非全校职务与自动关联职务上的这些点，学校端与老师端共用','年级组长模板（指定年级）去掉教师管理 7 项与编辑 / 删除值周老师，由 38 项改为 29 项；版本注释同步','演示说明：职务管理条目新增「仅全校范围的权限点」段落','设计文档 13.4.2 新增「教师管理只在全校范围生效」一条：说明判定规则套不到教师数据的原因、值周老师两项同此处理、不采用按任教班级交集界定可见老师的理由、自动关联职务同样不可勾、年级组长的教师事务由全校范围职务承担']},
{d:'2026-10-19 12:45:26',t:'职务管理改版：数据权限 KPI 卡 + 状态筛选、飞书式详情抽屉与对话框、职务说明字段、新增分配职务 / 离职复职 / 代补签权限、八个默认职务权限重定、隐藏教师管理与班级角色菜单；老师端信息确认统计栏可点击',p:['school.html','assets/duty-store.js','teacher.html','assets/teacher.js'],i:['职务管理页顶部改为五张数据权限 KPI 卡（全校 / 指定年级 / 指定班级 / 本人任教班级 / 本人班主任班级，值周老师不计入），点击即按范围筛选；原启用 / 停用状态筛选下放到筛选栏「全部状态」下拉，与搜索、来源并列','职务抽屉重做为飞书式只读详情：头部名称 + 标签 + 改名笔、职务说明，页签「在任老师」在前、「权限」在后；权限页签先功能权限后数据权限，功能权限标签旁的 ? 提示在只读视图同样显示；底部不再有保存 / 取消','添加老师、编辑权限、改名改说明各自弹出独立对话框（#dlg，叠在抽屉之上），点确定才生效并写操作日志，修复此前在任老师页签添加后点保存无反应、添加即生效导致保存 / 取消无意义的问题；添加老师对话框固定最小高度与候选区高度，勾选 / 搜索不再抖动','职务新增选填「职务说明」字段（名称与说明同一对话框修改，日志记「名称：A → B；说明：…」），输入框占位改为「请输入职务名称」「请输入职务说明」并调浅字色；自带模板补齐说明文案','功能权限点：教师管理新增「分配职务」「离职 / 复职」，校园签到新增「代补签」，请假「代录请假」改名「代请假」，学生管理「审核」改名「注册审核」；功能权限标签改为固定 20px 高的行内弹性盒，带 ? 图标的标签不再撑高','八个默认职务功能权限按产品口径重定：班主任 28 项、任课老师 14 项、校长 / 副校长 / 校级管理员 46 项（校级管理员另保留隐藏组职务与权限管理 / 查看操作日志）、教导处主任 42 项（不含修改 / 删除评价记录）、德育处主任 44 项（不含修改 / 删除班级评价记录）、年级组长 38 项；考勤管理员补代补签；存储键升为 zxh_school_duty_state_v13','职务 / 班级角色列表整行可点打开详情抽屉（按钮区除外），操作列按钮改为「详情」；左侧菜单隐藏「教师管理」「班级角色」（display:none + 注释保留，默认打开职务管理）','老师端：智能校徽信息确认页统计栏四个数字可点击筛选，与教师 / 学生管理同一交互；教师管理演示说明补「分配职务 / 设为离职按教师管理 · 分配职务 / 离职 / 复职 权限判定」与 v13 存储键说明','演示说明：职务管理条目重写（菜单、KPI 卡与筛选栏、详情抽屉与三个对话框、权限分组清单、八个默认职务权限）']},

{d:'2026-10-19 05:42:58',t:'演示名册自检结果显示到页面并提供命令行检查：「演示说明」chip 红点列明细，tools/check-demo-roster.sh 一条命令查漏登记与冲突',p:['teacher.html','docs'],i:['自检结果（漏登记 + 同一学生班级 / 性别冲突）汇总成一份问题清单：有问题时「演示说明」chip 右上出现红点，展开后各页面板顶部列出明细与处理方法；没有问题时不出现，不影响平时演示','页面根元素写出 data-stu-audit 属性（JSON 数组，没有问题时为 []），供命令行读取；控制台告警保留','新增 tools/check-demo-roster.sh：用本机 Chrome / Chromium 无头模式（临时独立配置目录）打开老师端页面读取自检结果，通过返回 0、有问题逐条列出并返回 1、页面脚本出错导致自检没跑或找不到浏览器返回 2——curl 不运行页面脚本，查不出这类问题','已用三份模拟副本验证：去掉宋佳怡登记报出 2 处漏登记、改动王一彤性别报出冲突、页面脚本出错时提示「自检没有运行」而不是误报通过','CLAUDE.md「老师端演示学生名单」约定改为改完学生数据后运行该脚本，并注明新增学生名单页面时要把它加进 stuAudit 的检查范围']},

{d:'2026-10-19 05:30:16',t:'自动生成的学生改为全校不重名、性别随名字：全校 1765 名学生姓名各不相同，宋佳怡登记为 3年级-2班',p:['teacher.html'],i:['原先每班凑人数的学生从 60 个名字的池子里取：全校 1764 个学生位只用了 88 个名字（同一名字最多出现 49 次），3年级-1班 与 3年级-3班 有 30 个同名学生；性别按序号分配，同名学生在两个班性别也会不同','改为姓氏 × 名字组合生成（100 个常见姓 × 男 / 女名各 60 个）：按年级、班号给每班分一段互不重叠的序号，经乘法置换映射到组合，全校不重名、相邻学生姓名不扎堆；性别随名字（男名 / 女名），同一班每次进入结果一致；跳过有名有姓的登记学生，生成名已与原型各页面的老师、家长等姓名核对、无重名','素质评价分组方案的组员宋佳怡（第2小组、周二值日）此前不在任何班的名册里，现登记为 3年级-2班 学生：3年级-2班 名单 18 → 19 人（考勤明细、代学生补签、学生管理、两处代学生请假半屏、素质评价一致）','自动生成的学生全部换名（考勤明细各班、3年级-1班 / 3年级-3班 名单、学生管理 3年级-1班、素质评价校长视角），有名有姓的演示学生、各班人数、考勤状态与点评次数不变；演示说明同步']},
{d:'2026-10-19 05:22:56',t:'教师端新增教师表单：去掉「职务」字段，新增选填的班主任班级，任教班级改为选填，称谓移到任教班级下方',p:['teacher.html','assets/teacher.js'],i:['表单顺序改为：学校（只读）/ 教师姓名 / 手机号 / 性别（必填）→ 班主任班级（选填，可多选）→ 任教班级（选填，可多选）→ 称谓；「职务」字段去掉，班主任、任课老师随两个班级字段自动关联，其他职务在教师详情「分配职务」中设置','班主任班级与任教班级共用同一个年级栏 + 班级 chips 面板（按打开的字段切换选中集合），都取学校端年级 / 班级字典','提交写入共用存储：待激活记录、白名单、任教班级加任课老师、班主任班级设为班主任（本班已有班主任时并列）并记「指定班主任」日志；两个班级字段都为空时允许提交，toast 提示激活后看不到班级数据；提交后表单复位','演示说明同步；脚本化场景验证带两类班级与不带班级两种提交的存储结果与日志']},
{d:'2026-10-19 05:16:46',t:'教师端待审核页：第一阶段隐藏「信息修改 / 非本人反馈」分类页签，只处理注册申请，待审角标只计注册申请',p:['teacher.html','assets/teacher.js'],i:['待审核页顶部分类页签（注册申请 / 信息修改 / 非本人反馈）整行 display:none 隐藏，页面默认即注册申请分类；节点与脚本保留，演示说明提供「预览 · 信息修改 / 非本人反馈分类（后续阶段）」与「回到注册申请分类」动作','脚本新增 TP_CATS_ON=false：教师管理「待审核」角标与「我的」待办计数只统计注册申请（由 5 变 2）；恢复方式：改为 true 并去掉页签的 display:none','待审核、教师审核、我的三处演示说明同步注明第一阶段口径']},
{d:'2026-10-19 05:16:21',t:'学生管理并入每班一份的演示名册：3年级-2班 18 人、3年级-1班 41 人，吴一诺、刘芷萱归 3年级-2班，孙浩然归 2年级-1班',p:['teacher.html'],i:['学生管理名单（smData）提前到「演示名册」段，作为登记学生的来源之一；页面显示的各班学生按演示名册重建、按姓名拼音排序，与考勤明细、代学生补签、两处「代学生请假」入口、素质评价同一批学生：3年级-2班 18 人、3年级-1班 41 人','跨班冲突按口径统一：吴一诺、刘芷萱由学生管理的 3年级-1班 改归 3年级-2班（沿用原详情），孙浩然归 2年级-1班（同智能校徽信息确认页，不在学生管理的两个班）；降级批量核对 / 班级注册码审核页的郑一鸣、马思远登记为 3年级-2班 学生','原名单之外的学生（如沈亦辰、马思远）按姓名确定性生成演示用的出生日期、住址与家长信息（每次进入一致），学生详情页可正常查看；原有学生详情不变','统计栏与年级行人数仍为真实班额（45 + 44 = 89 人，与首页、校园签到统计一致），名单只列演示学生；登记表冲突检查增加性别不一致告警；学生管理与代学生请假页演示说明同步']},
{d:'2026-10-19 05:07:38',t:'演示名册统一为每班一份：徐若曦归 3年级-2班、高子墨统一为男生，素质评价名单与考勤明细 / 代学生请假打通，填充名不再与有名有姓的演示学生重名',p:['teacher.html'],i:['新增「演示名册」：每班名单 = 基础名单（考勤明细 3年级-2班 手写 12 人，其余班按名字池生成）+ 该班登记的有名有姓演示学生（请假演示名单、请假单据、素质评价定格名单、智能校徽信息确认页其他班学生），每人只属于一个班；名字池生成的填充名一律避开登记学生（此前林晓乐、徐若曦等会被生成进其他班，考勤 279 处、素质评价校长视角 19 处，现为 0）','徐若曦统一为 3年级-2班（素质评价、排行榜、分组、智能校徽信息确认、降级批量核对等均为此班）；请假列表校长视角原「徐若曦 · 5年级-1班」待审批单改为叶书瑶，演示说明同步','高子墨统一为男生（考勤明细原为女生，请假、素质评价均为男生）','素质评价名单与演示名册同源：任教三个班保留定格点评次数与报告学号顺序，名册里其余学生按拼音补在末尾、点评次数为 0（3年级-2班 8 → 15 人、3年级-1班 2 → 39 人、3年级-3班 3 → 36 人），排行榜同步补 0 星；校长视角其余班级改取该班名册、点评次数按班级确定性派生，原独立名字池删除；按姓名反查性别（tevGirl）改从名单取','考勤明细补入的登记学生按请假单记当天考勤：1年级-1班 刘思远（7月6日 全天病假已通过）记为请假，其余记为正常到校；3年级-2班 考勤明细、代学生补签、两处代学生请假半屏、素质评价均为 15 人（考勤「签到」计数 11/14 → 12/15），3年级-1班 均为 39 人','演示名册段与考勤明细补人的部分代码已在 61cdfbc 中提前提交，本条完整记录此项改动']},
{d:'2026-10-19 05:04:06',t:'权限点拆分：素质评价 / 班级评价「删除/修改」拆为修改 + 删除，控辍保学「新增/编辑劝返 / 关爱记录」拆为新增 + 修改，存储升 v12',p:['school.html','assets/duty-store.js','assets/teacher.js'],i:['PERM_GROUPS：素质评价为查看 / 点评 / 修改 / 删除 / 评价报告（修改、删除、评价报告仍为校级），班级评价为查看 / 点评 / 修改 / 删除 / 查看值周老师 / 编辑值周老师 / 删除值周老师，控辍保学为查看 / 处理预警记录 / 新增劝返记录 / 修改劝返记录 / 删除劝返记录 / 新增关爱记录 / 修改关爱记录 / 删除关爱记录；新增权限点 eva.del、ceva.del、drop.retedit、drop.careedit','种子与默认值：原持有合并项的默认模板（德育处主任）与自动关联默认值（班主任的班级评价·修改与控辍保学两项、任课老师等）同时带上拆出的两项，实际权限不变；共用存储键升为 v12，两端刷新即得新权限点','「?」说明随拆分改为四条：修改 / 删除分别说明开启后可改 / 删任教或管理班级的记录，否则只能改 / 删自己的；演示说明中的权限点清单同步']},
{d:'2026-10-19 04:46:44',t:'代学生请假两处入口与考勤明细统一为每班一份演示名册：3年级-2班 14 人、3年级-1班 37 人，选择学生半屏与考勤明细、代学生补签名单一致',p:['teacher.html'],i:['考勤明细名单生成在同事版移植的生成逻辑（改名 attcGenBase，内容不变）之上，补入任教班级里请假演示用到、原先不在考勤名单内的学生（3年级-2班 王梓豪、吴一诺；3年级-1班 陈奕辰等 6 人），记为正常到校（演示当天均无覆盖当天的请假单），排在名单末尾','两处「代学生请假」入口的选择学生半屏改为读同一份名单：3年级-2班 考勤明细、两处半屏、代学生补签均为 14 人（考勤明细「签到」计数随之由 9/12 变为 11/14），3年级-1班 均为 37 人','性别仍以任教班级演示名册为准；代学生请假页与考勤明细演示说明同步']},
{d:'2026-10-19 04:29:28',t:'家长端证件照裁切：裁切图改由 parent.js 绑定 load 监听，修复页面加载时控制台报 upCropFit 未定义',p:['parent.html'],i:['原因：脚本抽离到 assets/parent.js（body 末尾加载）后，裁切图上的内联 onload="upCropFit()" 在页面加载时常先于脚本触发，控制台报 ReferenceError: upCropFit is not defined','去掉内联 onload，改在 parent.js 中 upCropFit 定义之后用 addEventListener 绑定：页面加载时裁切层尚未显示、适配本无事可做，漏掉这一次无影响；换图（upCrop 改 src）后新图加载完成仍按新尺寸重新适配裁剪框']},
{d:'2026-10-19 04:26:57',t:'老师端代学生请假 / 家长端发起请假：选了请假类型、未选起止时间时「事由」紧贴时间输入框，补齐间距',p:['teacher.html','parent.html'],i:['起止时间行补上与表单行相同的 13px 下边距，时长行上边距由 12px 改为 0：起止未选齐、时长行未出现时，「事由」与时间输入框之间为标准字段间距','起止选齐、时长行出现后，时间行与时长行之间由 12px 变为 13px，其余间距不变','两端表单同构，同步修正']},
{d:'2026-10-19 04:26:56',t:'设计文档 8.1 补充教师批量代录：可一次为同班多名学生代录请假，每人一张单据',p:['docs'],i:['8.1 状态机「发起」段补充：老师代录可一次为同班多名学生发起（考勤明细入口限当前班级、可多选，请假列表入口一次一名），每名学生各生成一张单据，各自通知家长、各自审批与销假，是否免审按 13.4.1 逐单判定','时段重叠逐人校验：任一学生与其已有的待审批 / 已通过单重叠即整批拦下、不部分提交']},
{d:'2026-10-19 04:16:01',t:'代学生请假两处入口统一为「选择学生半屏 → 代学生请假页」：请假列表任教班级单选、考勤明细本班多选；选择学生半屏改为跨班搜索 + 按班折叠的三列姓名网格，移除考勤明细移植整页',p:['teacher.html'],i:['请假列表底部「＋ 代学生请假」（待办工作台快捷入口同）与考勤明细底部「代学生请假」都先弹「选择学生」半屏，确定后进入同一个代学生请假页填写请假信息；请假列表入口为任教班级单选、一次一名学生，考勤明细入口限当前班级、可多选','代录请假页标题改为「代学生请假」，与两处入口按钮同名；考勤明细原先进入的同事版整页 #sc-attleave（页内勾选 + 全选 + 另一套简化表单）及其脚本移除','选择学生半屏与评价报告「选择学生」同一形态：居中标题 + 右上关闭、胶囊搜索（✕ 清空）跨任教班级检索并按班级分组、无命中空态；名单按班级折叠分节、组头标人数，默认只展开已选学生所在班；三列姓名网格按拼音排序；已选学生蓝底并在打开时滚到该生；列表区固定高度，搜索时半屏不跳动','选定与确认分两步：点姓名只是选中，底栏回显「已选：姓名 · 班级」/「已选 N 人」，点「确定」才进入表单；多选不设全选','表单「学生」字段：多名学生逐个列出姓名并注明「班级 · 共 N 人」，点击用同一半屏改选、已填内容保留；每次从入口进入均为空表单，直接打开本页时为「请选择学生」占位、提交时首先校验','多名学生提交时每人生成一张请假单；重叠校验按姓名 + 班级比对，任一人重叠即整批拦下并逐人列出已有时段；提交后回到入口页（请假列表切到全部请假，考勤明细原样返回）','演示说明同步：代学生请假 / 请假列表 / 考勤明细三页说明与演示入口更新，新增单选 / 多选入口与多名学生重叠拦截演示；移除 #sc-attleave 说明条目']},
{d:'2026-10-19 04:11:37',t:'职务管理：素质评价、班级评价的「删除/修改」权限点加「?」悬停说明',p:['school.html'],i:['职务抽屉与自动关联职务抽屉的权限 chips 中，素质评价、班级评价的「删除/修改」后带「?」图标，悬停显示深色气泡：开启后可修改、删除任教或管理班级的点评 / 班级评价记录，否则只能修改、删除自己的点评记录；点「?」不触发勾选','说明文案集中在 PERM_TIP 字典，后续其他权限点可按需补充；演示说明同步']},
{d:'2026-10-19 04:03:25',t:'职务管理：自动关联职务抽屉第一阶段不做平台锁定与「仅手动分配」，权限 chips 只区分选中 / 未选中（LOCK_ON 开关）',p:['school.html'],i:['脚本新增 LOCK_ON=false：班主任 / 任课老师 / 值周老师 / 全体教职工编辑抽屉内不再出现带锁不可关的平台锁定项与虚线置灰的「仅手动分配」项，所有权限点均为普通 chips、可自由勾选（含校级功能）；平台默认值与已选计数不变','CROLES 的 on / off 锁定数据与权限点的校级标记保留未删，改为 true 即恢复原规则；演示说明在「仅手动分配」段落补注后续阶段口径']},
{d:'2026-10-19 03:59:58',t:'职务管理：数据权限筛选去掉「值周分组负责的年级」选项',p:['school.html'],i:['数据权限下拉只列职务可选的五类范围（任教班级 / 班主任班级 / 全校 / 指定年级 / 指定班级）；值周老师固定的「值周分组负责的年级」只对应一行、学校新增职务时选不到，不再作为筛选项，该行仍在「全部 / 启用中」与「自动关联」类型下可见','演示说明同步']},
{d:'2026-10-19 03:57:10',t:'职务管理：在任老师页签添加老师面板去掉「正常与待激活账号」提示',p:['school.html'],i:['添加老师面板提示改为「可多选；已持有本职务的不再列出」，不再随教师激活开关显示「正常与待激活账号」（此前只在开关关闭时隐藏，开关恢复后又出现）']},
{d:'2026-10-19 03:43:12',t:'教师 / 职务数据层抽为两端共用的 assets/duty-store.js：老师端教师管理改读写学校端同一份本地存储，老师名单、职务、账号状态与操作日志两端互通',p:['assets/duty-store.js','school.html','teacher.html','assets/teacher.js'],i:['新增 assets/duty-store.js：把 school.html 内联脚本中的存储键与版本说明、年级 / 班级字典、正副班主任与教师激活开关、自动关联职务默认值、种子数据与读取归一化整体搬出，提供 dutyLoad() / dutySave()；school.html 引入该脚本并改为 let S=dutyLoad()、save() 调 dutySave(S)，页面行为与数据不变','老师端 teacher.html 同样引入该脚本，教师管理模块放弃同事版的 12 人内存名册，改为直接读写同一份存储（键 zxh_school_duty_state_v11）：名册即学校端的 25 位老师（张建国、刘敏、赵雪、何静 …），按主职务与班级身份分组（有主职务的按职务，其余按班主任 / 任课老师 / 其他教职工），统计栏改为教师数 / 待激活 / 已停用，筛选加正常 / 已停用，搜索支持手机号','教师详情、分配职务、停用 / 启用账号全部基于共用数据：职务列表取学校端启用中的职务（含任教班级 / 班主任班级范围类型，随班级身份、不用选），年级与班级取学校端字典（指定班级按年级分行勾选），影响提示的功能项数不含第一阶段隐藏的「职务与权限」组，防锁死按 duty.admin 权限点判定；保存写回存储并记操作日志（操作人「王老师（小程序）」，格式与学校端一致），学校端刷新即见','新增教师改为写入共用存储（口径同学校端 13.1 管理员直接新增）：表单补手机号（查重），职务选项为班主任 / 任课老师 + 学校端启用的职务模板，任教班级取学校端字典；提交生成待激活记录、手机号进白名单、任教班级加任课老师、选班主任的同时设为班主任，记「新增教师」「指定班主任」日志','演示说明：教师管理、教师详情、分配职务、新增教师四条改写为两端共用口径并更新演示人物（何静 校级管理员 + 考勤管理员、王丽 班主任、钱毅 已停用），教师管理加「恢复演示初始数据（两端共用）」动作；学校端职务管理说明补共用存储说明。待审核（注册申请 / 信息修改 / 非本人反馈）仍为同事版独立演示数据，未接入','校验：学校端与老师端 WebKit 无头回归无新增报错；同一 WebKit 实例内先在小程序改职务（收回兼任、防锁死拦截、年级组长范围校验）、停用唐宁、新增测试老师，再载入学校端页面，读到的职务、账号状态、班主任指定与操作日志与小程序侧完全一致']},
{d:'2026-10-19 03:27:41',t:'教师端补职务管理：教师详情新增职务块与「分配职务」页（主职务 / 兼任 / 指定年级班级 / 影响提示 / 防锁死）及账号停用 / 启用',p:['teacher.html','assets/teacher.js','school.html','docs'],i:['按设计文档 13.4.6 的分工，小程序只做单个老师的职务查看、分配 / 收回与账号停用 / 启用，职务定义、权限配置与批量分配仍在学校端 Web；入口放在教师管理 → 教师详情（仅持有「职务与权限管理」权限点的账号可见，演示按校级管理员视角）','教师详情：基本信息「职务」行改为显示主职务（未设主职务的班主任显示「班主任」、其他显示「教师」，与老师端职务标签同口径）；新增「职务」块列出主职务、兼任职务与自动关联（班主任 / 任课老师随任教班级、全体教职工随账号），右侧「分配职务」；新增「账号」块显示正常 / 未激活 / 已停用并提供停用 / 启用（停用即收回全部职务并提示班主任待办转接，唯一「职务与权限管理」持有人不能停用，未激活不提供停用）；已停用老师在名册列表显示「已停用」遮罩','新增「分配职务」页 #sc-tchduty：主职务底部列表单选（可选无，标注范围类型）、兼任 chips 多选；年级组长在职务下方勾选负责年级，教研组长点开年级栏 + 班级 chips 面板选班级；只读列出自动关联；底部提示保存后影响（全校范围功能项数、校级管理员可管理全校职务与权限、未激活老师激活后生效）；保存校验范围必选、收回唯一在职持有人的「职务与权限管理」拦截、无改动提示，成功后返回详情即时生效','职务模板与学校端一致（校长 / 副校长 / 教导处主任 / 德育处主任 / 年级组长 / 校级管理员 / 考勤管理员 / 教研组长）；演示数据：张明远 校长 + 兼任校级管理员，李秀芳 / 周敏 年级组长，郑海涛 兼任考勤管理员，陈志强 兼任教研组长；改动仅存于会话','演示说明：教师详情条目改写并加分配 / 停用动作，新增分配职务条目，教师管理条目补一句；学校端职务管理说明的分工口径与设计文档 13.4.6 分工表同步注明小程序入口','校验：WebKit 无头全站回归无新增报错；脚本化场景验证范围必选拦截、防锁死拦截、保存与无改动提示、停用 / 启用与列表遮罩均符合预期']},
{d:'2026-10-19 03:16:22',t:'设计文档 13.1 教师激活口径更正：预置后本人访问小程序切到本校自动激活，废止激活邀请、身份确认页与「不是我」反馈',p:['docs'],i:['13.1 标题由「预置 + 邀请激活」改为「预置 + 访问自动激活」；流程第 2、3 条改为学校群内告知、老师登录并切换到该校时自动激活并绑定 openid，注明原「激活邀请 + 身份确认页」已废止','管理员直接新增小节：「本人登录即激活」改写为「本人访问即自动激活」，不弹身份确认页；删除「不是我」条目，号码录错改由管理员在激活前改号或删记录兜底、激活后错配走停用；审计条目去掉「本人否认」','注册与登录流程图：日常登录旁支的「身份确认页」节点改为「切换到该校 · 待激活记录自动激活 · 不弹确认」，删除「不是我」分支与「提醒管理员核对手机号」节点；13.4.6 新增教师条目的激活描述同步']},
{d:'2026-10-19 03:13:47',t:'学校端恢复展示教师待激活状态（ACTIVATE_ON=true），按同事版口径改为访问小程序切到本校自动激活，去掉身份确认与「不是我」反馈',p:['school.html'],i:['脚本开关 ACTIVATE_ON 改为 true：管理员新增的老师保存后为「待激活」，名单与白名单恢复「待激活」卡片，教师详情恢复待激活资料编辑与删除记录，班级角色 / 新增教师 / 班级身份抽屉恢复「激活前本班请假暂时无人处理」提示，操作日志类型恢复「激活账号」','激活口径按同事版教师端更正：老师用该手机号访问小程序并切换到本校后自动激活，无需确认身份——教师详情、新增教师手机号提示、注册方式、保存与改号 toast、模拟激活的日志与提示文案由「登录小程序、确认身份后即激活」改为「访问小程序并切换到本校后自动激活」','去掉「不是我」反馈：删除本人否认标记（mis）、名单与详情的「本人否认」标签与核对提示、模拟否认动作 simDeny、操作日志类型「本人否认身份」及邓佳的否认日志；演示数据宁远、邓佳均为待激活，演示动作改为「查看待激活的宁远 / 邓佳」「模拟宁远本人访问小程序并切换到本校（自动激活）」','演示说明：教师名单的教师激活段落、新增教师路径、注册码与白名单、班级角色、操作日志同步改写为新口径；设计文档 13.1「预置 + 邀请激活」与身份确认页描述尚未同步']},
{d:'2026-10-19 03:13:47',t:'家长端与学校端班级命名统一为「3年级-2班」格式，与老师端一致；学校端存储升 v11',p:['parent.html','assets/parent.js','school.html'],i:['家长端 parent.html 与 parent.js、学校端 school.html 的班级 / 年级字面量由入学年份制按本学年 2025–2026 换算为「年级序号-班号」（2023级-2班 → 3年级-2班，2025级 → 1年级 … 2020级 → 6年级），三文件共约 350 处；首页演示说明中「全端采用入学年份制」的口径改为新格式说明','学校端字典 GRADES / CLASS_LIST 改为新命名并按年级升序排列，演示班级种子同样按 1年级 → 4年级 排序；班级筛选、职务范围排序等逻辑按字典顺序工作，无需改动；localStorage 键由 v10 升为 v11，刷新即得新命名的演示数据','校验：无头 WebKit 加载三端，初始化无报错；家长端 56 页 / 353 条演示动作 / 626 个点击项的运行结果与改动前完全一致，学校端 28 条演示动作无报错；遍历后的渲染文本中无「2023级」「三年级(2)班」等旧写法','未转换：运管端 admin.html / admin-trade.html 的中文年级写法（非本次范围）与历史更新日志']},
{d:'2026-10-19 03:06:01',t:'学校端教师激活口径更正：后台新增为待激活、老师访问小程序切到本校后自动激活且无需确认，说明与注释同步（状态展示仍由 ACTIVATE_ON 隐藏）',p:['school.html'],i:['更正此前「第一阶段暂不做教师激活、新增后默认激活」的口径：同事版教师端已设计「未激活」状态——后台新增的老师为待激活，老师用该手机号访问小程序并切换到本校后自动激活，无需确认身份，也没有「不是我」反馈','脚本 ACTIVATE_ON 开关注释与教师名单、注册码与白名单、班级角色、操作日志四处演示说明改为更正后口径；页面行为未变（开关仍为 false，新增即正常账号），并注明恢复展示时需把「确认身份后即激活」类文案改为自动激活、去掉本人否认相关分支']},
{d:'2026-10-19 03:05:20',t:'老师端班级命名统一为「3年级-2班」格式：主线入学年份制与 tn 移植页年级制一并转换，拼接 / 解析逻辑同步',p:['teacher.html','assets/teacher.js'],i:['全站班级全名统一为「年级序号-班号」（如 3年级-2班），年级单独出现时为「3年级」，年级目录下的班级为「2班」：主线入学年份制按本学年 2025–2026 换算（2025级 = 1年级 … 2020级 = 6年级，2023级-2班 → 3年级-2班），tn 移植页的「三年级(2)班」「三(2)」「(2)班」分别转为「3年级-2班」「3年级-2班」「2班」，teacher.html 与 teacher.js 共转换约 500 处字面量','主线逻辑：GRADE_YR 由 2026 − 年级序号 改为直接拼「年级」；评价报告班级名 repClsGrade、智慧放学全校班级表与请假班级解析（正则由 (\\d{4})级-(\\d+)班 改为 (\\d)年级-(\\d+)班）同步；任教班级排序由入学年份降序改为年级序号升序（视觉顺序不变）；演示学号仍以入学届年份开头，与家长端导出文件名一致','tn 移植逻辑：新增 clsFull(年级, 班) 拼全名；班级选择 chips 的键由「三(2)」短写改为全名、标签改为「2班」（新增教师 / 教师审核 / 考勤明细 / 代学生请假 / 代学生补签 / 转班 / 新增学生 / 信息确认详情共 8 处）；学生详情与学生审核的班级展示改用 clsFull；校园签到年级目录去前缀的正则由「(」改为「-」','演示说明与注释：首页、个人资料、账号切换、评价报告等处关于入学年份制的说明改为新格式口径，并注明家长端与学校端仍为入学年份制、待同步','校验：WebKit 无头全站回归无新增报错；遍历全部页面、演示动作与点击后的渲染文本中无「三年级(2)班」「2023级」「(2)班」「年级2班」等旧写法或拼接残留']},
{d:'2026-10-19 02:54:29',t:'老师端智能校徽 / 校园签到 / 学生管理 / 教师管理四模块与同事版 tn 原型对齐：移植 25 页及脚本样式，首页入口改回站内',p:['teacher.html','assets/teacher.js','assets/teacher.css'],i:['首页活动横幅与宫格「智能校徽 / 校园签到 / 学生管理 / 教师管理」由本标签外跳 app.ygzypm.com 改回站内页（go），页面、脚本与样式按 prototype/tn/index.html 同事版移植；控辍保学、班级评价宫格与隐藏的教师考勤宫格仍为外部站点','智能校徽：原单页双 Tab 承接页 #sc-apply 替换为 tn 的 5 页——信息确认（在读 / 未提交 / 待确认 / 已确认统计，状态下拉与姓名搜索联动，按班折叠名单，底部分享校徽办理 / 一键提醒未提交）、办理记录 #br、校徽办理详情（分享到微信）、信息确认详情可编辑 #sc-cf-edit / 只读 #sc-cf-view；页面上 4 处「列表仅展示部分学生（演示）」提示去掉、收入演示说明','校园签到：原考勤统计 / 2023级-2班考勤明细 / 学生签到详情 3 页替换为 tn 的 8 页——统计（日 / 周 / 月 + 日期导航，年级分组班级卡）、考勤明细（上午 / 下午 / 晚上 × 上学 / 放学分组，日期 / 班级 / 状态筛选）、补签 #sc-attcsign、学生签到详情、代学生请假 #sc-attleave、代学生补签 #sc-attsign、学生请假记录 #sc-stuleave 与详情 #sc-stuleavedt；考勤状态字典随 tn 改为待签到 / 迟到 / 待签退 / 早退 / 缺勤 / 请假；首页待办工作台的出勤概览改走 tn 的 goAtt 直达考勤明细','学生管理：原聚合入口 #sc-stumgr 与此前移植的待审核 / 学生审核 2 页替换为 tn 当前版本的 7 页——学生管理（邀请家长 / 新增学生 / 待审核，班级 / 学生 / 已激活 / 未激活统计，姓名搜索 + 筛选，年级 > 班级 > 学生层级名册）、学生详情（修改 / 转班 / 离校 / 删除）、新增学生、修改学生信息、待审核（注册申请 / 家长认领）、学生审核 / 详情、家长认领家长列表 #sc-claimparents；降级批量核对与班级注册码批量审核两页同步取 tn 版本','教师管理：原「教师注册审核」页 #sc-regaudit 替换为 tn 的 5 页——教师管理（邀请 / 新增 / 待审核，部门 / 教师 / 未激活统计，按职务分组名册）、教师详情、新增教师、教师待审核 #sc-tchpend（注册申请 / 信息修改 / 非本人反馈三分类 × 待审核 / 已拒绝）、教师审核 / 详情；「我的」管理员专区、待办工作台「管理员待办」与消息「教师注册自动生效通知」的入口改指教师待审核','脚本：按依赖闭包从 tn 提取四模块 277 条声明，按 tn 原顺序整体置于 teacher.js 末尾并统一初始渲染（renderAtt / renderAttc / smRender / spRender / tmRender / tpRender / taBadge），保证常量在使用前初始化；与主线同名但实现不同且仍被其他模块使用的 regGrades（扫码注册班级表）、attSchool（智慧放学 / 请假全校班级表）保留主线版本，tn 版本改名 tnRegGrades / tnAttSchool；go() 补代学生请假 / 代学生补签页进入时的学生列表初始化，并按 tn 包装为 go(id,name,cls,status) 以支持办理记录 / 信息确认详情带学生参数进入；移除主线旧版四模块脚本约 90 条声明与 3 条初始化语句；teacher.css 末尾补 143 条 tn 选择器及 .stu 相对定位、.att-nav b 加宽两条差异覆盖','演示说明：新增 / 替换 29 个页面条目（tn 条目直接沿用，办理记录 / 修改学生信息 / 家长认领三页补写），首页「入口映射」改写为站内口径并去掉「（站内）」预览动作，消息、我的说明同步；消息「学生注册审核提醒」改为 tn 数据中的张小明，点击进入待审核页并直达其学生审核页','口径提示：移植页面沿用 tn 的年级制班级命名（如「三年级(2)班」）与教师 / 学生「未激活」状态，与主线其他页面的入学年份制命名、学校端「教师激活为后续阶段」口径不一致，待统一；设计文档 13.4.6 的小程序职务分配入口两版原型均未落地，未改','校验：WebKit 无头加载全站（内联脚本），初始化无报错；新模块 29 页的全部演示动作与页面点击项无异常；全站演示动作与点击回归结果与改动前一致（仅两处与本次无关的既有问题）']},
{d:'2026-10-19 02:54:29',t:'职务管理：自动关联职务的成员页签去掉操作列',p:['school.html'],i:['班主任 / 任课老师 / 值周老师 / 全体教职工编辑抽屉的成员页签表格只保留「老师」与范围两列，去掉「操作」列与每行「详情」按钮，空态跨列数同步改为两列','演示说明「成员只读并注明维护入口」改为「成员只读、不设操作列，表格上方说明注明维护入口」']},
{d:'2026-10-19 02:11:00',t:'职务抽屉去掉说明性文案并移位，在任老师操作列去掉「详情」；教师激活收为后续阶段（ACTIVATE_ON 开关），新增教师直接为正常账号',p:['school.html','index.html'],i:['自动关联职务（班主任 / 任课老师 / 值周老师 / 全体教职工）编辑抽屉：权限页签底部「带锁的权限由平台锁定……只能通过在「教师管理」中分配的职务授予」整段去掉（规则只在演示说明，锁定项与「仅手动分配」项仍有悬停提示），CROLES 中仅为此服务的 lk 字段删除；原顶部 info-box 移到成员页签表格上方，并与原表头的维护入口合并为一句「自动关联全校 N 位班主任，范围为其担任班主任的班级；新指定的班主任自动关联，由教师详情的「班主任班级」维护。」（任课老师同口径为「任教班级」），成员页签原表头行与底部「自动关联的职务不能在这里添加或移除成员」提示去掉','手动分配职务抽屉的在任老师页签：操作列去掉「详情」只留「移除」；添加老师面板提示改为「可多选；已持有本职务的不再列出」','教师激活（后续阶段，第一阶段隐藏）：脚本新增 ACTIVATE_ON=false 开关，学校端新增教师保存后直接为「正常」账号、权限与班级身份即时生效，日志与提示不再出现「待激活」；教师名单与白名单去掉「待激活」卡片，教师详情管理员新增的显示「新增时间」，班级角色 / 新增教师 / 班级身份抽屉不再出现「（待激活）」与「激活前本班请假暂时无人处理」提示，影响范围提示统一为「保存后」，操作日志类型不列「激活账号 / 本人否认身份」，全体教职工自动关联说法改「新增的教职工」','演示数据：宁远、邓佳按正常账号生成，邓佳「本人否认」记录与日志不再生成；读取旧本地数据时待激活老师自动按正常账号处理，不升存储版本；待激活资料编辑、删除记录、模拟激活 / 否认等函数保留未删','演示说明：教师名单、白名单、班级角色、操作日志补「教师激活为后续阶段、第一阶段隐藏」口径，模拟激活 / 否认的演示动作收起、换为「查看管理员新增的宁远」；在任老师页签说明改为只有「移除」；index.html 配套页面描述去掉「与待激活」']},
{d:'2026-10-17 11:27:11',t:'职务抽屉新增「在任老师」页签：就地查看、添加、移除持有该职务的老师，自动关联职务加只读成员页签',p:['school.html','docs'],i:['已存在的职务抽屉分「权限 / 在任老师」两个页签：权限页签即原表单、随底部「保存」提交；在任老师页签列出持有者（姓名 + 脱敏手机号、主职务 / 兼任、指定年级或班级、账号状态），每行可「详情」「移除」','「添加老师」面板：按姓名 / 手机号筛选、多选正常或待激活账号（已持有的不列出），指定年级 / 班级类职务统一选一次范围批量应用，面板内提示全校范围等影响；一律作为兼任加入、不动主职务','添加、移除即时生效并写「分配职务」操作日志（兼任：新增 / 收回、主职务：… → 无），与教师管理的分配职务抽屉改同一份数据；移除走防锁死检查，移除主职务则主职务清空；停用的职务只能看成员，只读查看不显示操作','新建职务保存后直接落到其在任老师页签接着添加老师；删除有在任老师的职务、改为指定年级 / 班级的提示改为引导到该页签','自动关联的四行（班主任 / 任课老师 / 值周老师 / 全体教职工）抽屉同样分「权限 / 成员」页签，成员只读并注明维护入口','演示说明新增两条动作（打开年级组长的在任老师页签、班主任的成员页签）；设计文档 13.4.6 补「职务抽屉的在任老师页签：按职务的入口」并更新批量分配一行']},
{d:'2026-10-17 11:16:10',t:'全体教职工平台默认值定为班级评价·查看 / 点评 + 智慧放学·操作，存储升 v10，老师端扫码放学默认放行',p:['school.html','teacher.html','docs'],i:['职务管理「全体教职工」行平台默认值由空改为 3 项：班级评价·查看、班级评价·点评、智慧放学·操作（不带查看，页面仍只列自己的班）；列表摘要显示「班级评价 · 智慧放学」，教师名单、详情与分配职务抽屉默认即显示「全体教职工 · 全校」','localStorage 键由 v9 升为 v10，刷新即得新默认值；演示说明去掉「默认未开启功能」并补写默认值口径：素质评价仍默认不给，要全校点评的学校自行勾上，不想让全校老师扫码放学的学校去掉智慧放学·操作即可','老师端：全体教职工的「智慧放学·操作」改为默认开启，普通教师扫本校非任教班的教室码默认直达并拉起放学半屏；演示开关反向为「学校去掉全体教职工的智慧放学·操作」，切换后同一条扫码回首页 toast「暂无操作权限」，重置演示数据恢复默认开启','设计文档 13.4.2 全体教职工条目与 13.4.4 智慧放学配置同步改为平台默认值口径']},
{d:'2026-10-17 11:09:48',t:'智慧放学查看与操作权限独立判定：全体教职工只开「操作」即可扫码协助任一班放学，老师端补演示路径',p:['teacher.html','docs'],i:['设计文档 13.4.1 判定规则新增「操作类」：按「智慧放学·操作」权限点判定、不要求同时持有「查看」，只有操作没有查看的班级不进页面列表、只能扫该班教室放学码进入，进入后可见该班当次状态（执行操作必需的最小信息）','设计文档 13.4.4 新增「智慧放学的查看与操作」：班主任 / 任课老师两行保持默认（查看 + 操作、范围随班级身份），「全体教职工」行只开「操作」不开「查看」即可让全校老师扫码协助任一班放学而页面不列全校班级，校长 / 校级管理员不变；不用「扫到码就能操作」替代权限判定；第 9 章补引用','老师端扫一扫：本校非任教班的放学码改按「操作」权限判定，拦截 toast 由「您未任教 X，无法操作该班放学」改为「暂无 X 的放学操作权限」','扫一扫演示说明新增两条按钮：「普通教师视角 · 扫到本校非任教班 2022级-1班 的教室放学码」（默认回首页 toast）与「模拟开关 · 学校已为全体教职工开启智慧放学·操作」（开启后同一条扫码直达并拉起放学半屏，页面仍只列任教班级）；重置演示数据时一并关闭该开关','扫一扫与智慧放学页演示说明同步写入上述口径']},
{d:'2026-10-17 11:00:15',t:'职务管理新增自动关联职务「全体教职工」：全校范围、默认不附加功能，用于全校老师统一开通素质评价等功能',p:['school.html','index.html','docs'],i:['职务管理置顶的自动关联职务增至四行：班主任、任课老师、值周老师、全体教职工；全体教职工成员为账号状态正常的所有人（含教务、后勤等非教学人员，故不叫「全体教师」），新激活即带上、停用即收回，数据范围固定为全校，适用人数为正常账号数','平台默认值为空（已选 0 项），对只允许评价本班学生的学校无影响；要求任意老师都能评价全校学生的学校在该行勾上素质评价的查看、点评即可一次生效，不必新增全校范围职务再逐人分配','编辑抽屉与班主任行一致，校级功能仍标「仅手动分配」且文案改为「不向全体教职工开放」；保存写操作日志「修改职务 · 全体教职工」并提示 N 位教职工即时生效；演示说明动作新增「编辑「全体教职工」」','教师名单「自动关联职务」列、教师详情与分配职务抽屉只在全体教职工开启了功能时显示「全体教职工 · 全校」，说明文字随之补「全体教职工随账号自动关联」；名单职务筛选的「自动关联」组加入全体教职工，职务列表数据权限筛选「全校」包含该行','旧 localStorage 数据读取时按平台默认值补齐新增的自动关联职务，不升存储版本','职务管理页头、入口页配套页面说明、设计文档 13.4.2 角色权限（四套配置、全体教职工一条、与去掉的「教师」职务的区别）及相关列表同步']},
{d:'2026-10-17 10:40:28',t:'考勤管理员默认模板功能权限定为校园签到·查看与请假全部 4 项，存储升 v9',p:['school.html'],i:['职务管理：考勤管理员默认模板的功能权限由校园签到的查看 / 接收考勤通知改为校园签到·查看与请假的查看 / 审批与销假确认 / 代录请假 / 代销假，共 5 项','localStorage 键由 zxh_school_duty_state_v8 升为 v9，刷新即可看到新的默认权限','演示说明 chip 同步说明考勤管理员模板口径']},
{d:'2026-10-16 18:03:30',t:'学校端抽屉表单标题层级优化：字段标题改深色中粗与提示拉开，新增教师表单分组标题放大并补「基本资料」',p:['school.html'],i:['抽屉表单字段标题（.fr>.fl）由次文本灰 12.5px 常规字重改为主文本色 13px 中粗，提示文字固定常规字重、与标题间距 6→8px：标题与旁边的灰色提示、框内分组名（智能校徽、2023级等）拉开层级，「功能权限」「数据权限」等区块标题不再像备注','同一样式为学校端抽屉表单共用，新增 / 编辑职务、编辑自动关联职务、新增教师、分配职务、编辑班级身份、维护班级角色、注册审核、编辑资料、拒绝原因等一并生效','新增教师表单的分组标题新增 .fsec：字号 15px、与下方字段间距 14px，组间加分隔线（首组不加），与字段标题区分；顶部补「基本资料」分组，与教师详情抽屉的「基本资料 / 职务 / 班级身份」一致','「班级身份」分组旁的「自动关联班主任、任课老师」由行内样式改用通用 .sub 样式，字号、间距与其他提示一致']},
{d:'2026-10-16 17:31:49',t:'老师端身份确认页「角色权限」改为「职务」，个人资料补列兼任职务',p:['teacher.html','docs'],i:['教师身份认证页：「角色权限：班主任（本班考勤/请假审批/放学播报）」改为「职务」，分行列出自动关联的职务及对应班级（「班主任 · 2023级-2班」「任课老师 · 2023级-2班、2023级-3班」），去掉括号内的权限说明','个人资料：「职务」下方新增只读「兼任职务」行，未分配显示「无」（演示账号为「无」）；班主任、任课老师体现在任教班级、班主任班级两栏，不列入兼任职务','教师身份认证、个人资料两页演示说明同步','docs：design.md 第 10 章流程图身份确认页节点「学校 · 班级 · 角色权限」改为「学校 · 班级 · 职务」；13.4.5 删去已完成的「个人资料需补列兼任职务」待同步项']},
{d:'2026-10-16 17:23:40',t:'教师管理新增教师表单说明班主任、任课老师自动关联，职务标签未设主职务时按班级身份显示「班主任」或「教师」',p:['school.html','teacher.html','docs'],i:['新增教师表单：职务下拉仍不含班主任、任课老师，兼任职务下方加说明「班主任、任课老师按下方班级身份自动关联，无需在此选择」，「班级身份」标题旁加灰色小字「自动关联班主任、任课老师」','职务标签规则：设了主职务的显示主职务；未设主职务的，担任班主任（正、副、代理）显示「班主任」，其他显示「教师」，推导只用于展示、不影响权限；主职务提示改为「用于职务标签与按职务统计，权限与兼任职务相同；不设时班主任显示「班主任」，其他显示「教师」」','停用职务弹窗改为「主职务将清空（职务标签改为「班主任」或「教师」）」；职务管理、教师管理演示说明同步','老师端个人资料「职务」行补注释说明显示规则，演示账号王老师（未设主职务、2023级-2班班主任）显示「班主任」，与新规则一致','docs：design.md 13.4.2 职务标签改为按上述规则推导并写明原因，主职务、停用职务条目同步；13.4.5「与现有原型的差异」改为说明老师端现状已符合新规则']},
{d:'2026-10-16 16:10:05',t:'职务口径统一：教师管理与操作日志同步自动关联职务，去掉兜底职务「教师」、主职务改选填，「科任」全站改称「任课老师」',p:['school.html','teacher.html','index.html','docs'],i:['教师管理：名单「班级身份」列改为「自动关联职务」（如「班主任 · 2023级-2班」「任课老师 · 2023级-1班、2023级-2班」「值周老师 · 全部年级」），职务筛选分「自动关联」「手动分配」两组；教师详情职务块与分配职务抽屉只读列出自动关联的职务，注明不在分配职务中选择；停用账号文案改为「失去全部职务（含自动关联的职务）」','职务管理：班主任、任课老师、值周老师三行的在任老师人数与其他职务一样跳到教师管理并按该职务筛选；操作日志取消「修改角色权限」类型，改这三个职务的权限记为「修改职务」，明细以「自动关联的职务」开头','去掉兜底职务「教师」：职务列表与默认模板不再有它，主职务改为选填（下拉首项「无」，不设时名单显示「—」、老师端职务标签显示「教师」）；停用职务时以它为主职务的老师主职务清空；名单职务筛选去掉「教师」；localStorage 存储键升级为 v7','「科任」全站改称「任课老师」（与「班主任」配对，与「任教班级」一致）：学校端职务管理 / 教师管理 / 班级角色列名 / 操作日志类型「维护任课老师」与演示说明，教师端 teacher.html / teacher.js / teacher.css，入口页 index.html；历史更新日志、同事版备份 tn/ 与 docs/superpowers 旧规格保持原样','docs/design.md 13.4：新增「界面称呼（2026-10-16）」说明自动关联的职务只是呈现方式、授权模型与 10-13 裁决不变；「班级角色不进职务清单」改为置顶只读、仅调功能权限、不能手动分配；教师名单列、教师详情、分工表与第一阶段过渡同步；去掉「教师」兜底职务与主职务必填；全文「科任」改为「任课老师」；db-design-user-domain.md 角色注释同步']},
{d:'2026-10-16 15:37:21',t:'学校端 Web 职务管理定稿合并版：班主任、科任、值周老师作为自动关联的职务置顶在职务列表，删除单页版与页签版',p:['school.html'],i:['三版对比定稿合并版：删除单页版（角色权限、职务上下两个分区）与页签版（「职务 | 角色权限」）的样式、节点与脚本分支（DUTY_LAYOUT / dutyTab / setDutyLayout、#duty-tabs、#duty-role 与 renderCRoles），地址参数 ?layout 不再生效，对比期的 #duty/role 回落 #duty','页面固定为一张职务列表：页头说明「班主任、科任、值周老师按班级角色和值周分组自动关联到老师，其他职务在「教师管理」中分配」，「新增职务」在页头；筛选为「全部类型」（自动关联 / 默认模板 / 学校新增）与含「值周分组负责的年级」的数据权限下拉','自动关联职务的编辑抽屉固定为「编辑职务 · 班主任」，校级功能标签统一为「仅手动分配」；「教师」查看说明与同名校验（不能与这三个同名）不再区分布局','演示说明：去掉两个「对比 · 切换为…」动作，【角色权限】段改为【自动关联的职务】，【页面布局】【布局对比】合并为定稿说明，并列出暂未同步的设计文档 13.4、教师管理与操作日志类型；班级角色页演示说明的「职务管理 → 角色权限」入口改为置顶的自动关联职务']},
{d:'2026-10-16 15:30:18',t:'学校端 Web 职务管理页面布局优化：状态 KPI 卡改为筛选条分段、新增来源筛选、两表列宽对齐，单页版 / 页签版 / 合并版三版并存待定稿',p:['school.html'],i:['职务区去掉四张 KPI 卡与「共 N 个职务」统计，状态筛选改为筛选条内的分段控件「全部 / 启用中 / 已停用」（计数随关键词、数据权限、来源联动，即点选后的列表行数）；新增「全部来源」下拉（默认模板 / 学校新增，「默认模板」不含兜底职务「教师」），筛选胶囊同步；「＋ 新增职务」由页头移到职务筛选条右端','角色权限与职务两表统一为名称 / 数据权限 / 功能权限 / 老师 / 操作五列，固定列宽、上下对齐；职务表去掉状态列，停用的职务整行置灰、名称旁标「已停用」；来源标签只有「学校新增」带颜色，「默认模板」改为灰色；角色行去掉「平台预置」标签与身份副标题','页头说明与两个分区提示去重；表头「在任教师」改为「在任老师」；角色权限的适用老师人数可点：班主任、科任跳到「班级角色」，值周老师提示跳转「值周老师管理」（另一模块，演示占位）；职务抽屉的数据权限五个范围排成两列，减少滚动；删除未使用的常量 SV','布局对比 · 页签版（地址加 ?layout=tabs）：拆成「职务 | 角色权限」两个页签（#duty / #duty/role），「新增职务」回到页头、只在职务页签显示，分区标题由页签代替；单页版、合并版访问 #duty/role 回落 #duty','布局对比 · 合并版（地址加 ?layout=merge）：不设角色权限分区，班主任、科任、值周老师作为自动关联的职务置顶在职务列表、名称旁标蓝色「自动关联」，数据权限列为各自范围，操作只有「编辑」；页头说明改为「班主任、科任、值周老师按班级角色和值周分组自动关联到老师，其他职务在「教师管理」中分配」，「新增职务」在页头','合并版筛选：「全部来源」改为「全部类型」并多「自动关联」，数据权限多「值周分组负责的年级」，切回另两版时这两项筛选复位；编辑抽屉标题为「编辑职务 · 班主任」，校级功能标签由「仅职务」改为「仅手动分配」，「教师」查看抽屉说明同步；新增或改名的职务不能与这三个同名','三版共用一份数据：演示说明新增两个「对比 · 切换为…」动作（地址同步更新，刷新不丢），编辑科任、值周老师的动作名随布局变化；新增【页面布局】【布局对比】两段，写明合并版暂未同步设计文档 13.4、教师管理、班级角色页演示说明与操作日志类型；定稿后删除其余两版的脚本分支、#duty-tabs 节点与「布局对比」样式']},
{d:'2026-10-16 14:56:25',t:'老师端小程序代录请假页与家长端发起请假页样式及交互对齐：分段式类型 / 病假附加项 / 渐进披露 / 同序校验与重叠拦截，去除家长口头确认勾选与学生弹层辅助信息',p:['teacher.html','docs'],i:['表单改为与家长端相同的「标签 + 控件」行式布局，学生选择器改用通用 .pick 样式；请假类型由三枚 chip 改为二选一分段按钮，收敛为病假 / 事假（去掉「其他」）；新增病假附加项「是否传染病」（必选）与「病状」（多选），选事假时收起，两项随单据写入详情页','渐进披露：进入页默认不选类型、起止留空占位「请选择」，起止选齐后才显示时长；事由改为必填占位「请简述请假原因」；提交按钮文案统一为「提交请假单」；teacher.css 补 .seg2 分段按钮与 .cmask / .cdlg 居中弹窗样式（与家长端同值）','提交校验顺序与家长端一致：类型 → 是否传染病 → 起止 → 结束晚于开始 → 事由 → 上学日时长 0 空单（两种成因分开措辞）→ 时间重叠；新增「当前时间段已存在请假记录」居中弹窗（返回修改 / 查看请假记录），比对该学生待审批 / 已通过单，首尾相接续假放行','去除表单底部「已获家长口头确认」勾选项及其校验；代录 / 代销单据标记口径由「教师代录·家长口头确认」「教师代销·家长口头确认」改为「教师代录」「教师代销」（演示说明、代销假流转记录文案、docs/design.md 第 341 / 865 行同步），监督异议通道口径保持「审批结果同步双家长」不变','「选择学生」弹层去除标题下说明行、班级 chip 的「· 班主任 / · 科任（数学）」后缀与学生行右侧今日考勤状态 chip；请假列表底栏按钮文案由「＋ 代录请假」改为「＋ 代学生请假」（仅此一处，首页入口与页面标题不变）','代录请假演示说明重写：补充与家长端对齐的说明、修正过时的「满 8 小时折算 1 天」时长口径，新增预填提交 / 完整覆盖 / 部分重叠 / 周末空单四个演示入口']},
{d:'2026-10-16 11:33:41',t:'家长端小程序校徽办理减量确认弹窗：「取消」改回晴空蓝，「确认」降为次级墨色',p:['parent.html'],i:['「取消」去掉微信绿 #07C160 内联色，恢复全局规则的晴空蓝加粗，与「请假时间重叠」弹窗及页面主按钮配色一致','弹窗左侧按钮全局颜色由 --ink 改为 --ink-2（parent.css），本弹窗「确认」与请假弹窗「返回修改」同步弱化，突出右侧推荐操作']},
{d:'2026-10-16 09:37:20',t:'学校端 Web 值周老师改为角色权限：与班主任、科任并列统一调整，随「值周老师管理」分组自动生效，撤销值周老师职务模板',p:['school.html','index.html','docs'],i:['「班级角色权限」区块改名「角色权限」，新增第三行「值周老师」：身份、负责年级与执行时间由另一模块「值周老师管理」按分组维护，本页只管权限、不另设范围；数据权限列显示「值周分组负责的年级」，适用人数取执行时间内（值周中）分组的老师数','值周老师平台默认值为班级评价的查看 / 点评 / 查看值周老师，无平台锁定项；抽屉提示「范围为值周分组负责的年级，仅值周期间生效；在「值周老师管理」中新指定的老师自动带上」，页脚说明身份与范围在值周老师管理中维护','撤销 10-15 新增的「值周老师」默认职务模板与郑凯的兼任分配，避免同一人经职务与分组两条路获得范围、有效期不一致的权限；演示数据新增值周分组镜像（管理组 郑凯 / 吴芳 / 冯磊 值周中，值周一组 陈晨 / 林悦 已结束）','页头描述、「教师」职务提示、停用账号文案与操作日志类型（「修改班级角色权限」改为「修改角色权限」）同步；演示说明新增「编辑值周老师的角色权限」动作；localStorage 存储键升级为 v6','index.html 学校端入口描述同步；docs/design.md 13.4.2 默认模板清单去掉值周老师，「班级角色权限」段改为「角色权限」并补值周老师一条，第 10 章与 13.4.6 分工表同步']},
{d:'2026-10-15 17:51:12',t:'学校端 Web「值周老师」模板职务权限改为班级评价的查看 / 点评 / 查看值周老师',p:['school.html','docs'],i:['值周老师模板取消班级评价·删除/修改，改为班级评价·点评；查看与查看值周老师不变，范围仍为指定班级','职务管理演示说明与 docs/design.md 13.4.2 同步']},
{d:'2026-10-15 17:48:53',t:'学校端 Web 职务管理新增平台预置「值周老师」职务：班级评价的查看 / 删除/修改 / 查看值周老师，范围为指定班级',p:['school.html','docs'],i:['默认模板新增「值周老师」（排在年级组长之后）：范围类型指定班级，分配时选定本周负责的班级；功能权限为班级评价·查看、删除/修改、查看值周老师','演示数据：郑凯兼任值周老师，范围 2023级-1班 / 2班 / 3班；localStorage 存储键升级为 v5，打开页面按新种子重建','职务管理演示说明模板清单同步；docs/design.md 13.4.2 默认模板清单与范围类型说明同步']},
{d:'2026-10-15 17:28:11',t:'学校端 Web 班级角色权限抽屉：校级功能改为显示但不可选并标「仅职务」，权限点清单与职务抽屉一致',p:['school.html'],i:['班主任 / 科任权限抽屉不再隐藏校级功能：素质评价的查看所有班级 / 点评所有学生 / 删除/修改 / 评价报告、班级评价的编辑 / 删除值周老师、智慧放学的操作所有班级、教师管理整行均列出，显示为虚线置灰 chip 并带「仅职务」小标签，悬停提示「校级功能，只能通过职务授予」，不可勾选、不计入已选数；「职务与权限」行按第一阶段继续隐藏','抽屉页脚在平台锁定说明后补「标「仅职务」的为校级功能，范围不限于本班，只能通过职务授予」，与带锁项（已开启不可关）区分','职务管理演示说明中班级角色权限段落同步更新口径']},
{d:'2026-10-15 17:05:27',t:'老师端小程序首页控辍保学宫格改为跳转第三版老师端关爱管理 V1.2 页面',p:['teacher.html'],i:['控辍保学宫格点击后由原 app.ygzypm.com 老师端站点 #sc-list 改为跳转 guozi0718.github.io 下「第三版-老师端关爱管理-V1.2-20261015.html#sc-list」','仅替换跳转地址，宫格图标、样式与其他入口不变']},
{d:'2026-10-15 16:51:37',t:'学校端 Web 职务功能权限细化：班级评价增加值周老师三项、智慧放学增加操作所有班级、学生管理增加离校、控辍保学拆分为预警 / 劝返 / 关爱记录',p:['school.html'],i:['班级评价权限点由「查看 / 点评 / 删除/修改 / 设置」改为「查看 / 点评 / 删除/修改 / 查看值周老师 / 编辑值周老师 / 删除值周老师」，编辑 / 删除值周老师为校级、只通过职务授予，不进班级角色权限','智慧放学新增「操作所有班级」（校级、只通过职务授予），默认模板校长、校级管理员持有','学生管理在「转班」与「毕业」之间新增「离校」，默认模板教导处主任、校级管理员持有','控辍保学由「查看 / 处理」改为「查看 / 处理预警记录 / 新增/编辑劝返记录 / 删除劝返记录 / 新增/编辑关爱记录 / 删除关爱记录」','班级角色默认值：班主任新增查看值周老师、新增/编辑劝返记录、新增/编辑关爱记录（23 项），科任新增查看值周老师（14 项）；德育处主任模板补齐班级评价（查看 / 删除/修改 / 值周老师三项）与控辍保学全部权限点，校长模板补班级评价查看与查看值周老师','localStorage 存储键升级为 v4，打开页面按新种子重建演示数据；职务管理演示说明的权限点清单与班级角色权限口径同步更新']},
{d:'2026-10-15 15:45:15',t:'家长端校徽办理支付半屏：制作数量默认 3 枚、上限放宽至 10 枚，减至 1 枚时弹确认弹窗',p:['parent.html'],i:['支付半屏唤起时制作数量默认由 1 枚改为 3 枚（提交办理、林晓乐增办预览、跨家长拦截预览、认领后续接提交四处入口统一），步进器上限由 4 枚放宽至 10 枚，10 枚时「+」禁用','数量为 2 枚时点减号不直接减少，先弹微信原生式居中确认弹窗「确认申领数量减至1张?」：正文「因校徽补办制作时间较长（约20个工作日），建议留有备用校徽，防止丢失、损坏影响正常使用」（工作日标红），左「确认」减为 1 枚并重算金额，右「取消」维持 2 枚；其余数量之间增减不弹窗','演示说明「数量规则」同步更新默认值、上限与确认弹窗口径，「第 4 枚由客服联系确认」改为「第 4 枚起」，新增「预览 · 减至 1 枚确认弹窗」按钮']},
{d:'2026-10-15 15:31:19',t:'家长端添加孩子新增「已有家人绑定」备用方案：命中其他账号下孩子时提示联系班主任添加',p:['parent.html'],i:['添加孩子表单五要素（学校 / 年级 / 班级 / 姓名 / 性别）命中其他账号下已绑定学生时，新增备用方案弹「该孩子已有家人绑定」承接半屏：孩子信息卡 + 「暂不支持自助添加，请联系班主任核实身份后为您添加，或由班主任发送绑定邀请」，仅「我知道了」一个出口，不展示任何家庭 / 家人信息，单 / 多命中同一文案','演示说明新增开关「命中已有家人绑定的孩子时改为提示联系班主任（备用方案）」（localStorage proto-famalt，默认关闭走原加入家庭候选卡）与「预览 · 备用方案」按钮；开关打开后提交演示数据陈小雨 · 2024级-1班 · 女即走该分支','演示说明正文补充备用方案口径与取舍：所有「已被绑定」场景收口到班主任，同名孩子同样由班主任核对名册后在教师端添加或邀请，不再设「继续提交申请」逃生通道']},
{d:'2026-10-15 09:55:26',t:'学校端 Web 职务功能权限按功能模块重新分组并移到数据权限上方，暂时隐藏「职务与权限」行',p:['school.html'],i:['职务抽屉「功能权限」区块移到「数据权限」上方，数据权限提示改为「使用上方功能」','功能权限按功能模块分九组：智能校徽（查看 / 一键提醒未提交 / 信息确认）、素质评价（查看 / 点评 / 查看所有班级 / 点评所有学生 / 删除/修改 / 评价报告）、班级评价（查看 / 点评 / 删除/修改 / 设置）、校园签到（查看 / 接收考勤通知）、智慧放学（查看 / 操作）、学生管理（查看 / 新增 / 审核 / 修改 / 转班 / 毕业 / 删除）、教师管理（查看 / 新增 / 修改 / 删除 / 注册审核）、请假（查看 / 审批与销假确认 / 代录请假 / 代销假）、控辍保学（查看 / 处理）','原「家长绑定·审核绑定申请」并入学生管理·审核，原「教师考勤管理」移除；素质评价的查看所有班级 / 点评所有学生 / 删除/修改 / 评价报告为校级，只通过职务授予，不进班级角色权限','「职务与权限」行（职务与权限管理 / 查看操作日志）按第一阶段 display:none 隐藏，已选计数、列表摘要与影响范围提示不计入；数据保留，防锁死规则照常生效','班级角色默认值按新分组重设：班主任 20 项、科任 13 项，锁定项改为请假查看、审批与销假确认与学生管理·审核（家长绑定申请）；八个默认模板职务的权限点按新分组重新映射，考勤管理员改为校园签到的查看与接收考勤通知','旧权限点 id 全部更名，localStorage 存储键升级为 v3，打开页面按新种子重建演示数据；职务管理、教师管理、注册审核的演示说明同步更新']},
{d:'2026-10-15 01:37:46',t:'学校端 Web 第一阶段暂不区分正副班主任：班级身份、班级角色列表与抽屉、确认弹窗与操作日志统一只称「班主任」',p:['school.html','index.html'],i:['新增教师 / 编辑班级身份抽屉：每班「正班主任 / 副班主任」切换行按第一阶段隐藏，「班主任班级」提示改为「担任班主任的班，可多选」；勾选时数据层仍自动落位（本班尚无正班主任记为正、已有则记为副），不会顶替现任者','教师名单与教师详情的班级身份标签由「正班主任 / 副班主任」统一为「班主任」','班级角色列表「正班主任 / 副班主任」两列合并为「班主任」一列，KPI 改为「未指定班主任 / 多名班主任」，页头描述与下载模板提示同步；维护抽屉改为「班主任」多选（已停用的现任班主任仍列出便于改派，班主任均为待激活时提示激活前无人处理），原正班主任下拉 + 副班主任多选隐藏','撤换班主任、新增教师、编辑班级身份、删除待激活记录的确认弹窗与操作日志统一为「班主任新增 / 移除 / 不再担任班主任」；三条演示初始日志同步去掉正副字样','职务管理：班级角色权限行「正、副班主任」改为「班主任」，数据范围「班主任班级」说明改为「本人担任班主任的班级」','以脚本内 HR_SPLIT 开关统一控制，数据层保留 head / dep 字段（正空出时由其余班主任递补），后续阶段改为 true 即恢复区分；演示说明 chip 三条目与演示动作名称同步更新，原「替换确认」动作改为「预览 ·（后续阶段）」','index.html 学校端入口描述改为「班级角色（班主任与科任）」']},
{d:'2026-10-14 19:04:25',t:'学校端 Web 新增班级角色权限统一调整，数据权限范围改为任教班级 / 班主任班级，同一职务不可重复分配',p:['school.html','index.html','docs'],i:['职务管理页上方新增「班级角色权限」：班主任（正、副共用一套）、科任两行，平台给默认值（班主任 11 项、科任 7 项），学校可对全校统一增减，按班级身份自动生效，不用逐个分配职务；列表显示适用老师人数（随班级身份实时变化），与平台默认不同时标「已调整」','编辑抽屉只列请假、校园签到、智慧放学、素质评价、家长绑定五组与班级数据有关的功能；平台锁定项带锁不可改：班主任的请假查看、审批与销假确认、审核绑定申请固定开启，科任不能开启审批与销假确认；可一键恢复平台默认，保存即时生效，操作日志新增「修改班级角色权限」类型','数据权限范围「本人班级」（任教 + 班主任合集）改为「任教班级」（本人任课的班级），「本人班主任班级」改为「班主任班级」，与教师班级身份的两个字段同名同义、不设合集；新增职务默认「任教班级」；职务列表、筛选、新增 / 编辑抽屉、分配职务下拉与操作日志同步，旧演示数据自动转换','分配职务与新增教师：同一职务对同一位老师只分配一次，其他行已选的职务在下拉中置灰并标「已选」，可选职务都已添加时「添加兼任职务」置灰，保存时仍校验重复','职务管理页描述、「教师」职务提示，以及职务管理、班级角色、操作日志的演示说明同步；index.html 配套页面描述同步','docs/design.md：13.4.2 新增「班级角色权限」段落（统一调整、自动生效、锁定项、与职务分工、审计与恢复默认），范围类型改为任教班级 / 班主任班级并说明不设合集的原因，主 / 兼任职务补「同一职务只分配一次」；13.4.1、13.4.4、13.4.5、13.4.6（分工表与第一阶段过渡）及第 10 章同步']},
{d:'2026-10-14 18:16:07',t:'更新日志新增「学校端」分类筛选',p:['changelog.html'],i:['筛选条在「教师端」与「运管端」之间新增「学校端」，收录涉及 school.html 的记录（目前 3 条）；此前学校端 Web 的记录只能在「全部」下查看']},
{d:'2026-10-14 18:14:09',t:'学校端 Web 新增教师管理：教师名单与详情、直接新增教师（待激活）、注册审核、注册码与白名单；任教班级改为选填',p:['school.html','teacher.html','index.html','docs'],i:['侧栏「教职工与权限」改为教师管理 / 职务管理 / 班级角色，默认落地页为教师管理；原「教师职务」页并入教师管理，旧链接 #assign 自动跳到 #teacher；演示数据存储键升级为 v2，旧演示数据不再读取','教师管理分教师名单、注册审核（带待审核角标）、注册码与白名单三个页签','教师名单：KPI 为全部 / 正常 / 待激活 / 已停用 / 未关联班级，可按姓名或手机号后四位、年级、班级、职务筛选；列出主职务、兼任职务、按班合并的班级身份与账号状态（正常 / 待激活 / 已停用，本人否认另标）；页头新增「＋ 新增教师」主按钮','新增教师：管理员直接预置老师，姓名、手机号必填，性别选填，可同时分配职务与班级身份；已是本校老师、已有待激活记录或有待审核注册申请时拦截；替换现任正班主任需确认并写明待审批请假接手人；保存后状态为「待激活」，手机号不在白名单的自动加入，并打开该老师详情','待激活：老师本人用该手机号登录确认后激活，选「不是我」则标记本人否认、提醒管理员核对手机号；待激活期间资料可改可删（改号查重、白名单联动）；待激活老师是本班唯一班主任时提示「激活前本班请假暂时无人处理」；演示说明可模拟本人激活与「不是我」','教师详情抽屉分基本资料、职务、班级身份、账号、最近变更五块；已激活老师的基本资料只读，由本人在小程序维护，手机号只能本人更换；最近变更可跳转操作日志查看全部','班级身份可按人维护：任教班级、班主任班级均选填，班主任班级每班选正 / 副，本班已有正班主任时默认副；替换或离任需确认并写明待审批请假接手人；两项都为空且无带范围职务时软提示、不拦截；与班级角色页共用同一份数据','注册审核：只列未命中白名单的申请，白名单自动通过的记录进已办结；认领 5 个班及以上或跨 3 个年级提示建议核实；审核时可调整任教班级；按钮为拒绝（描边，左）/ 通过（主色，右），拒绝可填原因，通过即时生成科任关系','注册码与白名单：注册码 24 小时有效，可作废、重新生成、下载二维码；白名单按手机号匹配出已注册 / 待激活 / 未注册，未注册行可直接「新增为教师」（手机号锁定），已注册、待激活行可查看教师','班级角色页：列表与下拉标注已停用 / 待激活老师，可指定待激活老师；正班主任待激活且无已激活副班主任时提示','操作日志新增新增教师、修改教师资料、删除教师、激活账号、本人否认身份、通过注册、拒绝注册、维护白名单、重新生成注册码、作废注册码等类型；各页演示说明同步','teacher.html 小程序注册页任教年级班级改为选填（不任课可不选），提交不再校验班级，未选班级时成功提示不显示任教班级，演示说明同步','docs/design.md：13.1 补管理员直接新增（预置、待激活、本人登录确认激活、「不是我」、待激活期间可改可删、待激活的班主任）及流程图，注册任教班级改为选填；13.4.1 / 13.4.2 注明班主任、科任可按班或按人维护同一份数据；13.4.5 补任教班级选填；13.4.6 新增校方 Web 端「教师管理」按人入口；第 10 章学校端功能要点同步','index.html 配套页面中学校端 Web 的描述同步']},
{d:'2026-10-14 13:52:10',t:'学校端 Web 职务管理隐藏敏感数据权限（后续阶段）',p:['school.html'],i:['新增 SENS_ON 开关（第一阶段为 false），节点与数据保留，改为 true 即恢复','职务管理列表隐藏「敏感数据」列，编辑抽屉隐藏敏感数据权限勾选区','职务抽屉与教师职务分配抽屉的影响范围提示不再列出敏感数据项，仅保留全校范围与职务权限管理提示','演示说明同步注明敏感数据权限为后续阶段']},
{d:'2026-10-14 09:52:12',t:'新增学校端 Web 职务与权限原型：职务管理、教师职务、班级角色、操作日志',p:['school.html','index.html'],i:['新增 school.html（学校端 Web），依据设计文档 13.4，样式遵循后台原型设计规范，侧栏为「教职工与权限」「系统设置」两组','职务管理：列表展示数据权限、功能权限、敏感数据、在任教师与状态，状态卡片可筛选；抽屉内新增 / 编辑职务，数据权限范围类型五选一、功能权限按功能 × 操作勾选、敏感数据单独勾选并提示影响范围；「教师」不可编辑停用删除，有在任老师的职务不能直接删除，停用后主职务回落「教师」','教师职务：主职务单选必填（默认「教师」）+ 多条兼任职务，指定年级 / 班级类职务须选具体范围；班级身份只读展示；保存前提示新增的全校范围与敏感数据权限；可停用 / 启用账号','班级角色：指定正班主任（每班至多一名）、副班主任与科任；撤换班主任时确认弹窗写明被替换者与本班待审批请假的接手人；代理班主任为后续阶段暂隐藏','防锁死：停用职务、修改权限、取消分配、停用账号导致无人持有「职务与权限管理」时拦截','操作日志：上述变更实时写入，时间筛选默认近 30 天并支持自定义区间；数据存 localStorage，演示说明可一键恢复初始数据','index.html 配套页面区新增学校端入口']},
{d:'2026-10-14 09:25:02',t:'设计文档新增 13.4.6：职务管理与班级角色指定的校方 Web 端 / 小程序分工',p:['docs'],i:['docs/design.md 新增 13.4.6：职务管理与班级角色指定在校方 Web 端和老师端小程序都提供入口，按操作分工，不做两套完整功能；Web 端负责职务定义、批量分配与批量指定，小程序只做单个教师的职务分配、收回与查看，以及单个班级的班主任指定与撤换','分工表覆盖职务增改停删、批量与单个分配、停用教师账号、查看分配与审计、教师查看本人职务、批量与单个指定班主任、代理班主任（后续阶段）','两端共用后端规则：同一操作要求相同权限点，防锁死、主职务回落、审计统一校验；小程序分配全校或敏感数据权限时确认页写明影响范围；撤换班主任即时移出或签名单，未处理请假由其余班主任或新任正班主任接手','第一阶段过渡：职务定义用平台默认模板、确需调整由运管端代为配置；职务分配与班级角色指定放在「管理员专区」','联动更新第 10 章学校端功能要点，13.4.5 原型差异补充管理员专区入口、个人资料兼任职务、运管端代配页面']},
{d:'2026-10-13 13:44:20',t:'设计文档新增 13.4 教师权限模型：功能权限、数据范围、审批责任三层分工',p:['docs'],i:['docs/design.md 新增 13.4 节：不采用「职务关联权限点、取并集」的单层方案，改为功能权限看角色权限点、数据范围看任职关系与职务的数据权限类型、审批责任由流程规则指派；判定规则分查看、发起、处理三类，按每条任职关系逐条计算','班级角色扩为正班主任、副班主任、代理班主任（后续阶段）、科任；学生请假按班主任或签指派：正、副、代理班主任都收到待办，任一人处理即完成，其余人的待办自动消失','职务由平台提供默认模板（校长、副校长、教导处主任、德育处主任、年级组长、校级管理员、考勤管理员、教师），学校可保留、修改、停用、删除或新增；职务设功能权限点与数据权限，范围类型五选一（本人班级 / 本人班主任班级 / 全校 / 指定年级 / 指定班级，新建默认本人班级），指定年级、班级在分配职务时选定；病状、是否传染病、通行抓拍等敏感数据单独勾选；补充停用、删除、防锁死、审计与学年复核等约束','主职务只用于展示与统计、不影响权限；职务标签只显示主职务，班级身份在对应班级旁标注','新增「代批」权限点，取代「校长可代批」开关；以请假为例列出各角色权限表，年级组长、校长的直接审批、代录、代销假默认关闭，学校可在职务权限中开启','注册时自填的任教班级只生成科任关系，班主任关系与职务只能由学校管理员分配；记录与现有原型的差异（注册页自选「校长」即可获得全校数据范围等）及数据设计待补项','13.1、8.2 补充指向 13.4 的引用；附录「教师代录请假单是否免审」按或签口径调整']},
{d:'2026-10-13 11:27:27',t:'教师端请假页新增校长视角（全校可看不批）、班级选择半屏统一为原生多列 picker 并支持按年级筛选、审批 toast 精简',p:['teacher.html'],i:['请假页新增校长视角（不带班一种形态，经演示说明「预览 · 校长视角」进入，lvRole(2)）：列表范围为全校、不显示「待我审批 / 全部请假」tab、底部「＋ 代录请假」隐藏；补四张其他班级演示单（周浩宇 2024级-3班 / 徐若曦 2021级-1班 待审批、刘思远 2025级-1班 已通过、黄子涵 2022级-2班 未通过），班主任 / 科任视角按任教班级范围过滤、角标只计范围内的单','校长看全校为监督视角、第一阶段审批权仍只在班主任：校长视角下全部单据（含三张演示主线单）进通用详情页且只读，待审批 / 销假待确认单不显示审批意见卡与按钮，底栏改为说明式「待 ×× 班主任审批 / 确认」（各班班主任演示名册 LV_HEAD）；审批 / 代销假权限统一收紧为「班主任视角且本人任班主任的班级」，科任班级的待审批单同样显示责任人；班主任在专页审批后同单数据同步，校长视角可回看；升级链 / 班主任缺位代理 / 「校长可代批」开关作为后续阶段写入演示说明','班级选择半屏整套统一为微信原生多列 picker 形态（与线上小程序一致，clsWheelSheet）：顶部「取消 / 确定」，两列滚轮「年级 | 班级」级联；接入请假页班级筛选、素质评价「全部班级」筛选、表现点评与表现排行班级切换、学生信息审核「学生班级」五处，删除原平铺单选行与「左年级栏 + 右班级」实现及样式；班主任 / 科任身份标注不在滚轮内展示','带「全部」项的 picker 左列首项为「全部年级」，选定某年级后右列首项「全部班级」= 筛整个年级：请假页筛选条显示年级名、记录按所属年级匹配，素质评价按班级 key 年级前缀匹配、按钮显示年级名；换年级时停在同一班号或仍停「全部班级」，重开定位到当前值','请假审批「通过 / 不通过」后的 toast 精简为「已通过请假申请」「已不通过请假申请」（专页与通用详情页两处同步），删除仅为拼 toast 时段用的辅助函数','请假类型 / 审批状态半屏头部保持「居中标题 + 右上关闭」；请假页、通用详情页、素质评价、表现点评、表现排行演示说明与代码注释同步']},
{d:'2026-10-13 10:05:12',t:'教师端销假确认后留在待我审批 tab，确认 / 不同意的 toast 精简为「已确认销假」「已不同意销假」',p:['teacher.html'],i:['销假确认（cxConfirm）处理后不再切到「全部请假」tab 并重置搜索与筛选，改为与请假审批、销假不同意同口径：留在「待我审批」tab、只刷新列表与角标；代录提交、消息深链落到请假页仍切到全部请假（从列表外进入，需让新卡可见）','销假确认 toast 由「已确认销假：郑皓宸 7月6日 13:00 起请假结束，之后按实际到校判定，结果已同步全部家人」精简为「已确认销假」','销假不同意 toast 由「已不同意销假：请假单维持 7月6日 全天，意见已同步家长」精简为「已不同意销假」（与按钮「不同意」、意见卡占位、流转节点「不同意销假」同一用词）','请假页演示说明与代码注释同步：从待我审批点进的单处理后一律留在原 tab']},
{d:'2026-10-13 09:37:34',t:'教师端请假列表每张记录卡均可进详情：新增由单据数据渲染的通用请假单详情页',p:['teacher.html'],i:['新增通用请假单详情页 #sc-leavegen：lvOpen(id) 按 LV_GEN 单据数据渲染单据卡 + 流转记录卡，结构与请假单详情页 / 家长端请假单详情页同构；原仅弹「演示：…版式一致」提示的九张记录卡（吴一诺、林晓乐 7月14日、郑皓宸 7月6日 已通过、周雨桐、王梓豪、林晓乐 6月16日 老师代请、6月12日 已撤销、陈奕辰、许晴川）全部接入，代录请假提交生成的新卡同样可进（事由、证明材料取自表单）','待审批单在通用页可审批：审批意见卡 + 「不通过 / 通过」底栏，口径同请假单详情页（不通过须填意见，处理后「待审批」节点替换为结果节点、该单移出待我审批、以结果排到已办结区头部、角标递减）','本人任班主任班级的已通过单底部「代销假」：代销假半屏改为按单据上下文装配（tcxStart(id) 设学生 / 班级 / 假别 / 起止），不再写死林晓乐 6月26日 单；销假后通用页按数据整页重渲染，已通过请假单详情页（静态专页）仍逐项改写；科任班级（2023级-1班）的单只读，销假由该班班主任处理','郑皓宸 7月6日 已通过卡与销假待确认卡同单：销假待处理时点击进销假确认页，确认后进通用页回看「已销假」节点，不同意后回看「不同意销假」节点（意见警示色）；列表卡统一由 lvCardHTML 生成','与家长端同单的记录（林晓乐 6月16日 / 6月12日 / 7月14日）事由与流转文案与家长端 LV_RECS 一致；2023级-1班 班主任演示命名为刘老师','详情页标题「老师代请 / 教师代销」附注复用列表卡 .tag 样式；证明材料大图标题取假别时忽略附注','演示说明：新增「请假单详情（通用）」条目，请假页条目补充每张卡均可进详情的说明并加三个直达按钮（吴一诺待审批单 / 林晓乐 6月16日 老师代请单 / 6月12日 已撤销单），已通过请假单详情页「发起代销假」按钮改走新入口']},
{d:'2026-10-13 09:26:08',t:'教师端审批类按钮统一为描边次按钮 + 晴空蓝主按钮，否定操作在左、主操作在右',p:['teacher.html'],i:['请假审批「不通过 / 通过」、销假确认「不同意 / 确认销假」、补卡审批「不通过 / 通过」由珊瑚红实底 + 青碧实底改为描边 + 晴空蓝实底（补卡审批「退回补充」原即描边）','教师注册审核「通过」、批量审核「一键通过」、绑定人工审核 / 名册核正 / 认领核实半屏的主按钮由青碧改为晴空蓝；教师注册审核「拒绝」去掉红字红框改为普通描边，并与「通过」对调为「拒绝」在左、「通过」在右','口径：按钮表示动作，统一用晴空蓝；青碧 / 珊瑚红只用于状态 chip；红色实底只留给二次确认中的破坏性操作（确认拒绝、确认退出、删除点评等）。与家长端、学生注册审核、代销假半屏一致，白字对比度由青碧底 2.58:1 提升到晴空蓝底 3.99:1','考勤异常处置「补录到校 / 确认缺勤并通知 / 上报校方」与降级批量核对「一键补录到校」是两种处置结果并列，暂不调整']},
{d:'2026-10-13 09:03:31',t:'教师端代销假半屏去掉「已获家长口头确认」勾选，销假理由占位改为「请填写销假理由」',p:['teacher.html'],i:['代销假半屏移除「已获家长口头确认」勾选行及提交前的勾选校验，提交仅校验实际结束时间；销假后流转记录「教师代销·家长口头确认」口径文案不变','「销假理由」输入框占位文案由示例句「如：家长来电，孩子已提前返校」改为「请填写销假理由」','「已通过请假单详情（代销假）」演示说明同步去掉勾选描述']},
{d:'2026-10-13 06:30:38',t:'补记上一提交（教师端请假单详情页对齐家长端）的更新日志',p:['changelog.html'],i:['上一提交 dc51ae5 提交时更新日志写入步骤失败、未随提交入库，本条补记其日志条目（d 取该提交的提交时间）']},
{d:'2026-10-13 06:29:41',t:'教师端请假单详情页结构与信息展示对齐家长端请假单详情页',p:['teacher.html'],i:['请假单详情 / 已通过单详情（代销假）/ 销假确认三页改为与家长端 openLeaveDetail 同构：单据卡（假别 + 状态 chip → 学生 / 开始 / 结束 /（实际结束时间）/ 时长（上学日）/ 是否传染病 / 病状 / 事由 / 证明材料缩略图）+ 流转记录卡 + 意见卡，操作按钮改为悬浮底栏 apply-foot','证明材料由文件名 chip 改为缩略图，点击全屏看大图、多图左右箭头循环切换带页码（lvShot，复用通行抓拍遮罩并补左右箭头）','待审批单字段取值改为与家长端同一张单（林晓乐 7月7日 病假 LV_RECS.ok）一致；审批后「待审批」节点替换为「已通过 / 未通过 · 时间 · 审批人」，意见附节点下、不通过为警示色','代销假后时长按新区间重算并附「销假前」原时长，流转追加「已销假 · 王老师（代销假）」节点；销假确认页流转含「申请销假」节点，确认前时长保持原时长','不再单列单号、发起方、「审批 / 审批意见 / 考勤处理」行及底部通过后提示：发起方并入流转「提交」节点，考勤语义收进演示说明；三页演示说明同步']},
{d:'2026-10-13 00:34:44',t:'教师端请假页补「已撤销」状态：筛选项与已办结区只读卡，与家长端状态集一致',p:['teacher.html'],i:['审批状态筛选在「已销假」后加「已撤销」，状态集与家长端请假页 LV_STATES 一致（此前教师端独缺此项）','已办结区新增灰 chip「已撤销」只读卡（林晓乐 6月12日 事假 08:00–12:00，与家长端同单）：家长审批前自行撤销的单不再审批，但老师可能已收到待审批提醒，留卡解释去向；不进待我审批、不计角标','「请假」演示说明同步注明状态集与撤销单保留口径']},
{d:'2026-10-13 00:32:34',t:'教师端请假页姓名搜索框与三组筛选条固定在滚动区外，列表滚动时不动',p:['teacher.html'],i:['搜索框与「班级 / 请假类型 / 审批状态」筛选条从滚动区移到 tab 下方、滚动区外（新增 .lv-fbar 容器），与 tab 一同固定，列表滚动时不动（此前 tab 固定、搜索与筛选随列表滚走，一半固定一半滚动）','口径与家长端请假页 / 智能校徽办理记录的状态筛选条一致：筛选是列表的操作杆，翻到中间换条件不必滚回顶部','纯科任老师形态（tab 隐藏）下搜索条补回与标题栏的间距','「请假」演示说明同步注明']},

{d:'2026-10-12 09:21:04',t:'家长端销假待确认单可「撤回销假申请」',p:['parent.html'],i:['请假单详情「销假待确认」状态底栏新增「撤回销假申请」（原为只读、撤回标为后续阶段），点击二次确认「撤回销假申请？」','撤回后单据回到「已通过 · 原时段」：实际结束时间行消失、时长恢复原值、列表卡角标同步，底栏重新出现「申请销假」可再次发起','流转记录保留「申请销假」节点并追加「撤回销假申请」节点（班主任确认前自行撤回，请假单维持原时段）；班主任确认 / 不同意后不可撤回，只能重新申请','命名用「撤回」与请假单的「撤销」区分；真实产品中教师端待审批页签的「销假待确认」条目同步消失，原型两端不联动；sc-leave-tab 演示说明与脚本注释同步']},
{d:'2026-10-12 09:10:17',t:'两端销假滚轮时分列按请假起止裁剪，不可选到开始之前或结束之后',p:['parent.html','teacher.html'],i:['家长端申请销假、教师端代销假的「实际结束时间」滚轮：时、分列随所选日期动态裁剪到有效范围「开始时间 ≤ 实际结束时间 ≤ 原结束时间 − 30 分钟」（等于原结束即等于没销，上界前移一档）；例如 7月7日 08:00–12:00 的单只列 08–11 时，跨天单在开始日 / 结束日分别裁头 / 裁尾、中间日全量','切日期只重建时、分列，切小时只重建分列，列内容不变时不动，尽量保留原选中值、越界钳到最近一端；确定时再钳一次兜底，提交前的范围校验保留','发起请假 / 代录请假页的起止时间滚轮不受影响（仍为全量 24 小时）','顺带修复滚轮被半屏替换后脱离文档的列补发 scroll 事件导致的空引用报错（确定 / 取消瞬间）；两端演示说明同步']},
{d:'2026-10-12 09:03:49',t:'两端日期滚轮去掉顶部「清除」与「✕」，关闭统一走底部「取消」',p:['parent.html','teacher.html'],i:['家长端发起请假 / 申请销假、教师端代录请假 / 代销假共用的「日期 + 时 + 分」滚轮，顶部由「清除 · 回显 · ✕」改为只留居中回显；起止时间与实际结束时间均必填、改值直接滚到新值，清空没有独立场景，关闭与底部「取消」重复','删除 nlClear / plClear 清空函数；sc-newleave / sc-proxyleave 演示说明同步']},
{d:'2026-10-12 08:57:32',t:'修复两端销假半屏「实际结束时间」行点击无反应',p:['parent.html','teacher.html'],i:['原因：半屏改为分组行式后已去掉文本输入框，但日期滚轮弹层仍按旧逻辑读取 #nl-cancel / #pl-cancel 的值，取不到节点即报错中断，滚轮没有拉起','修复：销假场景的当前值改从半屏状态（lvCancelTime / tcxTime）读取，发起请假 / 代录请假页仍从各自输入框读；选定后回填与实际请假时长联动正常']},
{d:'2026-10-12 08:55:19',t:'教师端代销假半屏改为与家长端同款分组行式版式',p:['teacher.html'],i:['顶部新增学生行（头像 + 姓名 + 班级 · 假别），替代原「林晓乐 · 病假 · 起止」一行文字','两组圆角行式分组：第一组「请假开始 / 结束时间」只读回显带星期；第二组「实际结束时间」整行可点拉起原三列滚轮、右侧 › 箭头，「实际请假时长」按开始 ~ 所选时刻的上学日时长自动算（等于开始时间即 0 小时并标「整单销假」，未选显示 —），「销假理由」200 字上限带（n/200）计数','家长口头确认勾选与「取消 / 确认销假」按钮保留在分组之下；提交改从半屏状态读取实际结束时间（去掉原文本输入框），校验、详情与已办结卡联动不变','teacher.css 新增与 parent.css 同源的 .cx-stu / .cx-grp / .cx-row 样式，半屏加 max-height + 纵向滚动兜底；sc-leaveok 演示说明同步']},
{d:'2026-10-12 08:51:26',t:'家长端销假申请半屏改为学生行 + 分组行式表单版式',p:['parent.html'],i:['半屏标题改「申请销假」，顶部新增学生行（头像 + 姓名 + 班级，随单据所属孩子），替代原「假别 · 起止」一行文字','表单改为两组圆角行式分组（参考小程序销假页）：第一组「请假开始时间 / 请假结束时间」只读回显并带星期；第二组「实际结束时间」整行可点拉起原滚轮、右侧 › 箭头，「实际请假时长」按开始 ~ 所选时刻的上学日时长自动算（等于开始时间即 0 小时并标「整单销假」，未选显示 —），「销假理由」200 字上限带（n/200）计数，占位「请填写销假理由」','提交改从半屏状态读取实际结束时间（去掉原文本输入框），校验与流转记录写入不变；parent.css 新增 .cx-stu / .cx-grp / .cx-row 样式','sc-leave-tab 演示说明同步；教师端代销假半屏本次未动']},
{d:'2026-10-12 08:47:14',t:'家长端请假单详情底栏按钮「销假」改为「申请销假」',p:['parent.html'],i:['已通过单详情底栏按钮文案由「销假」改为「申请销假」，与半屏内「提交销假申请」按钮、状态「销假待确认」同口径：家长侧是申请、须班主任确认，不是直接生效','教师端已通过单详情的「代销假」按钮不变（老师代销免审即时生效）']},
{d:'2026-10-12 08:45:25',t:'教师端代销假半屏去掉输入框下方口径提示行',p:['teacher.html'],i:['移除「提交后请假按实际结束时间结束，选开始时间即取消整单请假；免审即时生效」一行，与家长端销假半屏同步，半屏只留时段、实际结束时间、说明、家长口头确认勾选与按钮','整单销假、免审即时生效等口径已在 sc-leaveok 演示说明中覆盖']},
{d:'2026-10-12 08:43:55',t:'家长端销假半屏去掉底部口径提示行',p:['parent.html'],i:['移除说明框下方「提交后请假按实际结束时间结束，选开始时间即取消整单请假；需班主任确认后生效」一行，半屏只留时段、实际结束时间、说明与按钮','整单销假、班主任确认后生效等口径已在 sc-leave-tab / sc-leavedetail 演示说明中覆盖，页面不再重复；教师端代销假半屏的同款提示本次未动']},
{d:'2026-10-12 08:39:04',t:'两端销假字段「销假时间」改为「实际结束时间」',p:['parent.html','teacher.html','docs'],i:['家长端销假半屏、教师端代销假半屏的时间输入标签改为「实际结束时间」，与上方「开始 ~ 结束」时段直接对照；「销假」仍作动作名（按钮）与状态名（销假待确认 / 已销假）','整单销假口径配文案：家长端底部提示改为「提交后请假按实际结束时间结束，选开始时间即取消整单请假；需班主任确认后生效」，教师端代销假半屏新增同款说明（免审即时生效）；校验 toast 同步改名','详情信息行、流转记录「申请销假」节点、请假列表卡、教师端销假确认页同步改名（家长端待确认 / 已销假两态统一印「实际结束时间」，不再区分「申请销假时间」）','请假记录卡标签列由 78px 加宽到 86px（两端同改，与详情页 .kv 一致）；教师端请假详情 / 销假确认 / 已通过单详情三页标签列同加宽到 86px，容纳六字标签','两端演示说明、脚本注释、docs/design.md 与 docs/考勤状态定义.md 的口径描述同步替换']},
{d:'2026-10-12 08:32:15',t:'教师端请假页记录卡改为与家长端请假页同构',p:['teacher.html'],i:['「待审批 / 已办结」两页签内的请假记录由单行 .stu 列表改为 .card.lv-card 卡片：卡头「学生 · 假别 + 状态 chip」、「开始时间 / 结束时间」两行、底栏学生头像 + 发起方 + 提交时间，样式与 parent.html #sc-leave-tab 同源（teacher.css 新增 .lv-card 规则与 .tag 卡头附注）','教师侧按状态多出信息行：销假待确认单加「销假时间」、待审批单加「证明材料」、已办结单加「审批」「审批意见」；周雨桐卡头保留「到期未返校追踪中」红色附注；提交时间统一为家长端 MM-DD HH:mm 写法，不再用「今天 / 昨天」相对表述','销假确认、代销假提交、代录请假提交三处动态改写列表项的脚本同步改为卡片结构，代录 / 代销卡头分别带「老师代录 / 教师代销」附注，新卡插到已办结容器头部','sc-leave 演示说明补充卡片同构说明']},
{d:'2026-10-12 06:12:06',t:'小程序请假新增销假：家长申请班主任确认、老师代销假，新增「销假待确认 / 已销假」状态',p:['parent.html','teacher.html','docs'],i:['家长端请假单详情：已通过单（含老师代请、原结束时间已过的历史单——补销假不设时限；毕业孩子历史单除外）底栏新增「销假」，半屏填销假时间 + 说明，销假时间复用发起请假的三列滚轮、日期轴限定在请假起止日内、范围为开始 ~ 原结束（等于开始即整单销假），默认值按未开始 / 进行中 / 已结束分别取开始时间 / 当前半点 / 留空','提交后单据转「销假待确认」（琥珀），流转记录追加「申请销假」节点、列表卡角标同步，家长侧只读等待班主任确认；状态筛选 chips 加「销假待确认 / 已销假」；列表预置一张已销假单（5月29日 事假 整单销假）与消息「林晓乐销假已确认」','教师端请假待审批页签与待办工作台新增「销假待确认」单（郑皓宸 7月6日 全天病假 · 申请 13:00 销假），新增「销假确认」页：确认后转已销假、已办结列表与出勤页条目同步更新；不同意须填意见、维持原时段；待办计数 2→3','教师端已办结页签已通过单（林晓乐 6月26日）点击进只读详情，底部新增「代销假」：免审即时生效、勾选家长口头确认、永久标记「教师代销·家长口头确认」，提交后详情与列表就地更新','「已销假」为独立状态，不复用「已撤销」；销假生效后请假区间缩为开始 ~ 销假时间，考勤按新结束时间回溯重算：design.md 8.1 状态机 / 8.3 联动、考勤状态定义第 6 节同步补充；两端相关演示说明同步']},
{d:'2026-10-12 04:37:44',t:'教师端智慧放学页不带班高权限账号去掉「全校班级」区块标题',p:['teacher.html'],i:['高权限不带班账号（仅全校班级、无 Tab）的列表上方不再印「全校班级」区块标题：它是原「任教班级 / 全校班级」上下两区块布局的分隔标题，单列表下成了孤行，还把「点击班级，可进行放学操作」提示与列表隔开','范围由筛选 chip「全部 23」与六张年级卡自明；页面结构改为与普通教师视角相同（日期时钟、操作提示、筛选 chip、年级卡）','sc-dismiss 演示说明与脚本注释同步']},
{d:'2026-10-12 04:24:56',t:'教师端智慧放学页年级卡头去掉「没有课 N」计数',p:['teacher.html'],i:['年级卡头只印「未放学 · 放学中 · 已放学」三项，不再在有班没有课时追加「没有课 N」：卡头回答「还有几个班没放」，没有课的班格子本身已灰底印出，与筛选 chip 不设「没有课」口径一致','年级内全部班当天都没有课时，卡头改印「今天没有课」，避免出现「未放学 0 · 放学中 0 · 已放学 0」','sc-dismiss 演示说明与脚本注释同步']},
{d:'2026-10-12 04:13:13',t:'教师端智慧放学页任教班级排序改为与全校班级一致（年级倒序、班号升序）',p:['teacher.html'],i:['任教班级年级内由「班主任班排首位」改为按班号升序，年级间仍按入学年份倒序，与全校班级同一规则；2023级 卡改为 1班 → 5班，班主任班靠角标区分','同一张年级卡在「任教班级 / 全校班级」两个 Tab 下格子顺序一致，切 Tab 不用重新定位','紧凑行与原班级卡两种对比样式复用同一排序；表现点评 / 表现排行等页「班主任班在前」的班级选择规则不变','sc-dismiss 演示说明与脚本注释同步']},
{d:'2026-10-12 04:09:47',t:'教师端智慧放学页全校班级：班主任班角标改印「班主任」',p:['teacher.html'],i:['全校班级 Tab 内任教班角标由清一色「任教」改为：班主任班印「班主任」、其余任教班印「任教」，非任教班仍不印；与任教班级 Tab 对同一个班的称呼一致','角标仍同为深蓝色，都读作「我的班」，不影响与非任教班的区分','sc-dismiss 演示说明与脚本注释同步']},
{d:'2026-10-12 04:07:12',t:'教师端智慧放学页默认样式改为格子 + 高权限兼带班双 Tab（与线上小程序一致）',p:['teacher.html'],i:['任教班级默认样式由紧凑行改为与全校班级同一布局的年级卡三列格子（tdStyle 默认 grid）：带计数与状态色点的筛选 chip、年级卡头各态计数、格子印班名 + 状态底色 + 时间，班主任班角标「班主任」','页面默认即高权限兼带班形态（tdRoleMode 默认 1）：头部出「任教班级 / 全校班级」药丸 Tab，默认停在任教班级；Tab 节点去掉初始 display:none','紧凑行与原班级卡降为对比预览；演示说明按钮改为「预览 · 任教班级紧凑行样式（对比）」「预览 · 原班级卡样式（对比）」「恢复 · 格子样式（默认）」，角色按钮改为「预览 · 普通教师视角（仅任教班级）」「预览 · 高权限账号（不带班）」「恢复 · 高权限账号（兼带班，默认）」，「重置演示数据」回到格子 + 兼带班形态','样式 / 角色切换 toast 的「恢复 / 切换」措辞随默认值对调；首页演示说明的直达入口改为「预览 · 普通教师智慧放学（仅任教班级）」','sc-dismiss / sc-home 演示说明与页面注释同步']},
{d:'2026-10-10 18:53:31',t:'教师端智慧放学页：任教班级改紧凑行（附格子 / 原班级卡对比样式）、高权限视图改 Tab、修正延迟下限与提示文案',p:['teacher.html'],i:['任教班级由「每班一张卡」改为每班一行的紧凑列表：首行班名 + 时段别名 | 状态 chip + 时间 + 「›」，次行角色 chip + 其余时段摘要（超长省略），5 个班一屏放下','演示说明新增任教班级样式对比（留哪种待定）：「预览 · 任教班级格子样式（对比）」与全校班级共用同一套渲染（带计数筛选 chip + 年级卡三列格子，角标改印「班主任」，筛选与全校班级各自独立）；「预览 · 原班级卡样式（对比）」为原「班级卡 × 班次段」；「恢复 · 紧凑行样式（默认）」','高权限兼带班账号由上下两区块改为头部「任教班级 / 全校班级」药丸 Tab，默认任教班级、切换后回到顶部；不带班账号无 Tab、仅全校班级','全校三态汇总行并入筛选 chip（「全部 23 / 未放学 n / 放学中 n / 已放学 n」，带计数与状态色点兼作图例）；没有课的班只计入全部，年级卡头另计「没有课」','全校班级补入本页新增的任教班 2023级-5班（共 23 个班），修正兼带班视图任教班级有、全校班级缺的问题；校园签到页全校表不变','延迟放学时间下限改为「当前时间与计划放学时间中较晚者」的下一分钟：小时列自下限所在小时起、该小时内分钟列自下限分钟起，默认值为较晚者 +10 分钟（修正上午时点可设出 11:10 这类早于计划 11:40 的「延迟」）','toast 文案：放学中的班点击 / 扫码改为「班级 HH:MM 开始放学」；开始放学改为「班级 已开始放学，已通知家长」（音屏下发等系统细节不上屏）；延迟放学改为「…放学，已通知家长」','摘要中未到点的时段改印计划放学时间（如「下午 16:40 放学」），不再写「下午 未放学」','「点击班级，可进行放学操作」仅在有未放学 / 延迟放学的班时显示；列表全部班级无班次（含休息日）时改为整页「今天没有课」空态','扫教室放学码落页前清掉筛选，兼带班账号落到该班所在 Tab；智慧放学页与扫一扫演示说明同步更新']},
{d:'2026-10-10 17:54:35',t:'教师端首页演示说明增加「预览 · 高权限账号智慧放学」入口',p:['teacher.html'],i:['首页演示说明在「打开智慧放学」后追加「预览 · 高权限账号智慧放学（任教 + 全校班级）」，直达智慧放学页高权限兼带班形态','首页演示说明入口映射中注明该直达路径']},
{d:'2026-10-10 17:38:09',t:'教师端智慧放学页新增高权限账号视图：「任教班级」+「全校班级」两区块',p:['teacher.html'],i:['高权限账号（校长 / 校级管理员）页面分两区块：「任教班级」沿用班级卡（不带班的高权限账号隐藏）；「全校班级」复用校园签到页全校 22 个班，按年级一卡、三列紧凑格子（班名 + 状态色 + 时间 / 预计时间 / 计划时间 / 没有课），年级卡头印三态计数','全校区块顶部为「未放学 / 放学中 / 已放学」汇总与「全部 / 未放学 / 放学中 / 已放学」筛选 chip，延迟放学计入未放学；任教班同时出现在全校区块并角标「任教」，不去重以保证年级计数完整','格子点击与班级卡主行同一分流：未放学 / 延迟拉起放学确认半屏、放学中 / 已放学 / 没有课 toast；全校班级的放学 / 延迟操作与「放学中」10 分钟流转同口径','权限：普通教师仅任教班级可操作，扫到本校非任教班的教室码回首页 toast「您未任教该班」；高权限账号全校任一班可操作','演示说明新增「预览 · 高权限账号（兼带班）」「预览 · 高权限账号（不带班）」「恢复 · 普通教师视角」入口；重置演示数据同时恢复普通教师视角；年段长看本年级为后续阶段']},
{d:'2026-10-10 17:29:44',t:'两端班级名全局统一为「2023级-2班」写法',p:['teacher.html','parent.html'],i:['教师端 / 家长端页面、数据与演示说明中的「YYYY级(N)班」（含不带「班」的短写「2023级(1)」）全部改为「YYYY级-N班」，共 368 处','年级与班级分开录入的选择器 / 只读字段 / 数据里的独立班级值由「(2)班」改为「2班」（35 处），年级 + 班级拼接显示处统一补「-」（含学生注册审核按班分组标题，15 处）','解析与生成班名的代码同步：全校班级表由班名解析班号改按「-N班」匹配，评价报告班名、注册时任教班级 key、审核页班级选择器改为「-」拼接','历史更新日志与 tn 参考原型不改；演示说明中「一年级(1)班」「三(2)班」等旧制对照文案保留']},

{d:'2026-10-10 17:12:12',t:'教师端扫一扫演示说明补齐教室放学码各分支入口',p:['teacher.html'],i:['在「扫到 2023级(2)班教室放学码」后追加五条入口：2023级(3)班（延迟放学 · 拉起半屏）、2023级(1)班（放学中 · toast）、2023级(4)班（已放学 · toast）、2023级(5)班（今天没有课 · toast）、其他学校班级码（未任职 · 回首页 toast）','sc-scan 演示说明正文注明各入口与分支对应关系']},
{d:'2026-10-10 17:08:26',t:'教师端扫教室放学码直达智慧放学页并自动拉起该班放学确认半屏，按班级状态兜底',p:['teacher.html'],i:['扫一扫识别教室放学码（码绑定班级）后，落到智慧放学页、该班卡滚动到可见位置，未放学 / 延迟放学自动拉起该班放学确认半屏','兜底：放学中 / 已放学不拉半屏，落页 toast「该班已于 HH:MM 放学」；今天没有课落页 toast；非本账号任职学校的班级码不落页、回首页直接 toast「该放学码不属于您任职的学校」','班级卡增加 id 锚点（td-card-班级 key）供滚动定位；tScanDismiss 不带班级参数时仍只落页','sc-scan 演示说明：原「扫到放学二维码（直达智慧放学）」入口改为「扫到 2023级(2)班教室放学码（直达并拉起放学半屏）」，分流与兜底口径写入说明；sc-dismiss 演示说明同步']},
{d:'2026-10-10 16:55:41',t:'教师端智慧放学页主行状态 chip 与时间列网格对齐',p:['teacher.html'],i:['状态 chip 按「延迟放学」四字定最小宽度、文字居中，未放学 / 放学中 / 已放学 chip 左右边缘与之对齐','时间列按「预计 17:20」定最小宽度、右对齐、等宽数字，「16:38」「16:40 放学」靠同一右边缘','不可点行（放学中 / 已放学 / 已结束）保留「›」箭头占位但不显示，收口段也输出空时间列，各行落在同一网格','sc-dismiss 演示说明同步']},
{d:'2026-10-10 16:51:47',t:'教师端智慧放学页增加「今天没有课」示例卡',p:['teacher.html'],i:['新增 2023级(5)班（科任）卡：当天未配置班次，卡内显示「今天没有课」、无可点主行；仅本页为展示该态而加，其余页面任教班级不变','五张卡自上而下为 未放学 / 放学中 / 延迟放学 / 已放学 / 今天没有课','sc-dismiss 演示说明同步']},

{d:'2026-10-10 16:41:52',t:'教师端智慧放学页「正在放学」chip 改为「放学中」，配色对齐家长端',p:['teacher.html'],i:['状态 chip 文案由「正在放学」改为「放学中」，与家长端智慧放学页同文案','配色由晴空蓝改为家长端 ing 态同款琥珀（--amber-bg 底、#C97A12 字）','sc-dismiss 演示说明同步']},

{d:'2026-10-10 16:33:56',t:'教师端智慧放学延迟放学时间弹层改为微信 picker 形态',p:['teacher.html'],i:['标题「选择延迟放学时间」居中、右上圆形「×」关闭整个流程，标题下通栏分隔线','时 / 分两列滚轮项内带单位（如「16时」「35分」），去掉原列头「时 / 分」标签；滚轮通栏抵边、选中行以通栏分隔线框定、字号加大','底部按钮改为绿色描边「取消」（回放学确认半屏）与绿色实底「确定」两个胶囊按钮，绿色与「开始放学」按钮同色','sc-dismiss 演示说明同步']},

{d:'2026-10-10 15:37:29',t:'教师端智慧放学页去除卡头应到人数、科任学科与出校计数区块，状态「已播报」改为「已放学」',p:['teacher.html'],i:['班级卡头去掉右侧「应到 N 人」；科任角色 chip 只印「科任」，不再带「· 数学」','去掉主行下的出校计数区块（进度条、「已出校 n / N · 百分比」、「满 n 人自动播报 / 达标自动播报」等触发方式文案）；出校计数与 80% 阈值仅在后台驱动自动播报，模拟达阈值仍可把未播报段转为已放学','段状态「已播报」改为「已放学」（主行 chip 与摘要行「上午 11:48 已放学」同步）；未播报 / 延迟放学 / 未播报 · 已结束不变','sc-dismiss 演示说明同步：卡头与计数口径改写，状态短语改为「已放学 16:44」']},

{d:'2026-09-29 09:59:01',t:'家长端校徽办理页去除待认领 / 核实中孩子姓名下方的认领提示与锁定提示',p:['parent.html'],i:['选择待认领孩子（王*明）时姓名下方原「学校名册已预留您的手机号，提交办理时需先完成认领验证（补全孩子姓名并选择关系）」提示行去除；选择核实中孩子（李*桐）时原「认领已锁定：验证未通过次数过多，转交班主任核实后将以消息通知结果」提示行去除，认领输错 3 次锁定时也不再向办理页写入该提示','认领规则与锁定后果在点「提交办理」时由认领半屏与拦截提示当场说明，不必预先在表单里解释；chip 琥珀底色已标识流程态。审核中孩子（林晓冬）姓名下方的审核状态提示行保留不变','sc-apply-form 演示说明同步：核实中孩子改为「选中显示打码信息」、状态改由提交拦截与认领半屏承载、注册办理码链路落点不再附认领提示']},
{d:'2026-09-29 09:53:17',t:'两端评价报告页自定义周期改为按月选择：年 / 月两列滚轮、最多 6 个月、结束月不晚于本月',p:['parent.html','teacher.html'],i:['评价报告页「时间筛选」半屏的自定义区间由按日（年 / 月 / 日三列、最长 180 天）改为「某月到某月」：起止胶囊显示「2026年3月」形态，年 / 月两列滚轮，起月首日～止月末日落成日区间；报告页预设周期全部按整月对齐、趋势区块只能按月画、导出文件按月 / 学期命名，精确到日是全页唯一例外（一天的「报告」没有意义却能通过校验），故收敛为按月','校验改为三条：开始不晚于结束 / 最多 6 个自然月（恰等于一个学期与趋势回看窗口，替代对家长陌生的「180 天」）/ 结束月不晚于本月——年份滚到本年时月份列只到当前月（2026 年到 7 月）、往年放开到 12 月，确定时再兜底校验；提示文案「自定义时间范围最多 6 个月」','自定义周期的导出文件名按月区间命名：同年「2026年3月–5月」、跨年「2025年11月–2026年1月」、单月「2026年3月」，替代原「自定义周期」占位；预设周期命名不变','新增 mr* 选择器（mrBox / mrFill / mrScroll / mrCommit / mrSwitch / mrCheck / mrStart / mrEnd / repPeriodName），仅报告页 evr* 使用；素质评价 / 点评明细 / 表现排行的按日自定义（dr*）保持不变','两端 sc-evalrep 演示说明同步改为按月口径并说明与列表按日自定义不同的理由，新增「时间筛选：自定义 2026年3月–5月」快捷入口；家长端评价报告段落的过期注释一并更新']},
{d:'2026-09-28 17:59:24',t:'教师端底部三个 Tab 图标对齐家长端',p:['teacher.html'],i:['teacher.js 的 Tab 图标定义整段替换为家长端同一套：图标尺寸 22px → 24px；「首页」未选中态改为带门房子线性图标','新增 tabsOn 选中态定义：首页 / 消息 / 我的三个 Tab 选中时用实心图形，未选中仍为描边线性图标，渲染逻辑同步为「有 on 类取实心、否则取描边」','两端 Tab 栏 CSS 与点击逻辑本已一致，未改动']},

{d:'2026-09-28 11:28:18',t:'两端扫一扫未识别承接定版为「重新扫描」半屏，收掉回来源页轻提示形态，半屏文案去掉「刚才」',p:['parent.html','teacher.html'],i:['家长端：移除 scanInvalidToast 及其演示入口，未识别分支仅保留 scanInvalidSheet（回来源页弹半屏「未识别到校徽二维码」，「重新扫描」再次调起相机、「关闭」留在来源页）；半屏说明文案「刚才扫到的不是校徽二维码。…」去掉开头「刚才」','教师端：移除 tScanInvalidToast 及其演示入口，仅保留 tScanInvalidSheet；半屏说明文案同样去掉「刚才」','两端 sc-scan 演示说明、家长端我的校徽 Tab 演示说明与扫码页 HTML 注释同步改为定版口径']},
{d:'2026-09-28 11:20:25',t:'两端扫一扫未识别分支改为收起相机回来源页承接：轻提示 / 「重新扫描」半屏两种形态并行演示',p:['parent.html','teacher.html'],i:['口径修正：真实产品调起微信原生扫码相机（wx.scanCode），相机能解出任意二维码即收起并把内容交回小程序，小程序无法在相机层上弹 toast、也无法拒收后驻留相机页，原「未识别留在相机页轻提示、继续对准重扫」口径不可实现，改为与其他结果分支同链路——先关相机回来源页再承接','家长端：scanResult 废止，新增 scanInvalidToast（回来源页轻提示「未识别到校徽二维码」）与 scanInvalidSheet（回来源页弹轻量半屏「未识别到校徽二维码」，「重新扫描」按钮以原来源页与待核验徽再次调起相机，「关闭」留在来源页）；sc-scan 演示说明未识别入口拆为「回来源页轻提示 / 回来源页半屏可重扫」两条并行演示、待定版，说明正文与我的校徽 Tab 演示说明同步改写，码读不出降级手工输入短编号入口注明应落来源页','教师端：新增 tScanInvalidToast（回首页轻提示「未识别到有效二维码」）与 tScanInvalidSheet（回首页弹半屏、「重新扫描」重新进入扫码页），sc-scan 演示说明未识别入口同样拆为两条并行演示，正文同步改写','两端扫码页 HTML 注释同步更新模拟入口函数名']},
{d:'2026-09-23 17:22:42',t:'教师端智慧放学页参照家长端同构重做：班级卡 × 班次段 + 出校计数与播报操作',p:['teacher.html'],i:['页面结构改为与家长端智慧放学同构：白色头部（居中标题 + 日期实时时钟，基准 16:44:05）+ 每个任教班级一张卡（卡头班级名 / 角色 chip / 应到人数；主行为当前最相关班次段，状态 chip 与时间成短语：未播报 16:40 放学 / 已播报 16:38 / 延迟放学 预计 17:20；其余段压成一行灰字摘要；无班次显示「今天没有课」）','主行下追加出校计数：进度条 + 「已出校 n / 应到 N · 百分比」，右侧写触发方式（满 n 人自动播报 / 王老师手动播报 / 达标自动播报 / HH:MM 自动播报 / 离校时段已结束）；未播报 / 延迟段显示「播报放学」「延迟放学（调整延迟）」按钮','脚本重写（TD_ 段）：手动播报、出校计数达阈值自动播报（已手动播报的班只更新计数不重播）、延迟放学半屏（17:00 / 17:20 / 17:40 / 18:00 快选）为实际操作；预览开关与家长端对齐：上午 11:00 时点、未播报段系统收口（「未播报 · 已结束」）、2023级(2)班配置第三段（晚托）、休息日 / 无班次三态，另加重置演示数据','演示编排与家长端互为两侧视图：2023级(2)班下午段由王老师手动播报（时间取时钟 16:44，对应家长端「王老师发起放学 16:44」消息）、上午 11:48 自动播报；2023级(1)班 16:38 达标自动播报；2023级(3)班未播报供延迟 / 自动达标演示','原页面的规则说明文案（播报仅到班级、同一学生只计一次、手动后不重播、离线作废不补播）全部移出页面、收入演示说明；原「今日放学时段」概览卡与「广场东屏离线」卡移除','「接送音屏」设备区块按用户要求去除（节点 display:none 保留、加注释），演示说明改为音屏在线状态由学校端承载','teacher.css 新增 #sc-dismiss 命名空间下的头部、班级卡、计数、操作、延迟半屏样式；演示说明条目整体重写并更新入口按钮']},
{d:'2026-09-21 16:01:11',t:'教师端注册审核中页去掉任教班级，注册页 / 审核中页「返回首页」统一落家长小程序首页',p:['teacher.html'],i:['注册审核中页（sc-pending）申请人条目副行去掉「任教 …」班级列表（多选时过长换行），保留「学校 · 职务 · 提交时间」；移除 pd-cls 节点及 regSubmit 中对应回填语句，任教班级仍可在管理端待确认列表查看','sc-pending 页头左侧「返回首页」小房子（pendHome）跳转目标由教师端「未匹配教师身份」承接页（sc-noauth）改为家长小程序首页 parent.html#sc-home','教师注册表单页（sc-reg）页头左侧同款「返回首页」小房子（regHome）跳转目标由家长端「未匹配到孩子」承接页（parent.html#sc-nochild）统一改为 parent.html#sc-home','sc-reg / sc-pending 演示说明 chip 及相关代码注释同步更新为新口径']},
