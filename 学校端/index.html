<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>智小徽学校后台</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#f2f5fa;font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#1f2329}
#app-frame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f2f5fa}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#f2f5fa;color:#4e5969;z-index:10}
#loading[hidden]{display:none}
#retry{height:32px;padding:0 16px;border:1px solid #01a239;border-radius:4px;background:#01a239;color:#fff;font:inherit;cursor:pointer}
#retry[hidden]{display:none}
</style>
</head>
<body>
<div id="loading" role="status"><span id="status">正在加载学校端最新正式版本…</span><button id="retry" type="button" hidden>重新加载</button></div>
<iframe id="app-frame" title="智小徽学校后台" referrerpolicy="no-referrer" hidden></iframe>
<script>
(()=>{
  'use strict';
  const frame=document.getElementById('app-frame');
  const loading=document.getElementById('loading');
  const status=document.getElementById('status');
  const retry=document.getElementById('retry');

  async function boot(){
    retry.hidden=true;
    loading.hidden=false;
    status.textContent='正在加载学校端最新正式版本…';
    try{
      const res=await fetch('当前版本.json?t='+Date.now(),{cache:'no-store'});
      if(!res.ok)throw new Error('当前版本配置不可用');
      const cfg=await res.json();
      const relPath=String(cfg.path||'').trim();
      if(!/^版本\/v\d+(?:\.\d+)+$/.test(relPath))throw new Error('正式版本路径无效');
      const target=new URL(relPath+'/index.html',location.href);
      const q=new URLSearchParams(location.search);
      if(!q.has('page'))q.set('page','school-feedback');
      target.search=q.toString();
      target.hash=location.hash;
      frame.onload=()=>{
        loading.hidden=true;
        frame.hidden=false;
        try{
          const t=frame.contentDocument?.title;
          if(t)document.title=t;
        }catch{}
      };
      frame.src=target.href;
    }catch(e){
      status.textContent='最新正式版本加载失败，请点击重试或刷新页面。';
      retry.hidden=false;
    }
  }
  retry.addEventListener('click',boot);
  boot();
})();
</script>
</body>
</html>
