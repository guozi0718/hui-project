{d:'2026-09-18 18:14:26',t:'下载评价报告演示文件更新：五份下载副本统一替换为新版学生报告',p:['parent.html','teacher.html'],i:['家长端与教师端下载评价报告页（sc-evaldl）共用的 assets/reports/ 五份演示副本（2026春季学期 / 2025秋季学期 / 2026年6月 / 2026年7月 / 自定义周期）内容统一替换为用户提供的新版学生报告 Word 文件（单份约 2.5 MB，原约 0.8 MB），五份仍为同一份内容、逐字节一致','文件名、下载链接与下载交互均不变，两端任一条目下载到的均为新版报告']},
{d:'2026-09-18 15:14:25',t:'订单域库表设计与 PRD 同步废止「扫码核验启用推定」确认收货',p:['docs'],i:['补齐 2026-08-26 原型废止「首枚启用推定确认收货」后文档侧的同步缺口（当时仅两端原型改动）。docs/db-design-order-domain.md：receipt_confirm_type 枚举收敛为 manual / auto（manual 限已寄出 / 已到校的单、部分启用的单不提供入口；auto 定时器从到校起算、不因部分枚已核验而终止；先于 7 日全部核验完结的单无需确认、字段保持 NULL），原 activated 值废止；receipt_confirmed 流转事件的确认方式与示例去掉「扫码核验启用推定」；「扫码核验启用」事务去掉前置推定 ②（不再写确认类型、不落确认收货流转行、不终止 7 日定时器），仅保留物流到校推定；§3 冻结口径去掉「启用推定无从触发」','物流侧「轨迹缺失时由首枚扫码核验启用推定到校」为保留口径，未改动','PRD 同步（飞书）：18.2 确认收货字段改为两种确认方式并补「无需确认（全部核验完结）」形态；关键记录信息的确认方式枚举、6.6 确认收货入口判定与各状态入口矩阵（部分启用 x/y 行不再提供确认收货）、6.7 详情页入口说明、6.7 两张办理进度节点表与 16.8 流转记录表的确认方式 / 操作者 / 挂起表述同步；6.7「取消与退款」条目同时按可读性样板重排为分表 + 设计说明结构，其中「交付与确认收货口径」按现行两种确认方式重写']},
{d:'2026-09-18 14:31:23',t:'家长端多枚核验进度改为按核验事实计数（停用不回退）',p:['parent.html'],i:['多枚逐枚核验（3 枚单 NO.0008–0010）的已核验枚数由「当前状态为已启用的枚数」（multiOn 读 bdState）改为按核验事实记录：新增 multiVerified 集合，bdSetMulti 核验成功时写入，multiOn / bdVerifyNext / 重复核验守卫均改读该集合——核验是一次性事件，与枚级使用状态（已启用 / 已停用 / 挂失）分开记，某枚核验启用后又被停用仍计入，「部分启用 x/3」、核验半屏「本次办理」行剩余枚数与成功 Toast 均不因停用回退','「我的校徽」Tab 演示说明补入该口径（本次迭代定版；该枚重新启用走行尾「启用」流转、无需再次核验；停用半屏为演示态不改状态，故不单独演示），源码注释同步','PRD 6.2 已同步：扫码核验半屏改为「标题带编号 + 正文三行」，新增「「本次办理」行文案规则」段与三形态表（剩余待核验枚数 = 有效枚数 − 已核验启用枚数 − 1；= 0「本枚启用后本次办理即完成」/ ≥ 1「本枚启用后还剩 N 枚待核验」/ 记录已完成则整行不显示），并写入「已核验启用枚数按核验事实计、停用不回退」']},
{d:'2026-09-18 11:40:26',t:'家长端扫码核验半屏去掉引导句与「校徽编号」行',p:['parent.html'],i:['「扫码核验（NO.xxxx）」半屏（bdVerifyRender，单枚 NO.0002 与多枚 NO.0008–0010 共用）去掉正文首行「已识别校徽二维码，信息核对如下：」引导句与「校徽编号」行——编号已在标题、正文重复；引导句与「已识别校徽」系列半屏标题下直接进字段行的版式不一致。保留学生 / 本次办理 / 核对结果三行与按钮','「我的校徽」Tab 演示说明与源码注释同步为「三行固定」口径']},

{d:'2026-09-05 15:05:42',t:'换绑手机号第二步去掉「请使用已绑定微信的手机号」说明行：新号无需事先绑定微信，快捷登录时可现场添加，演示说明、PRD 4.7 与 design.md 同步',p:['parent.html','docs'],i:['纠正上一条的错误前提：微信手机号快捷登录的授权半屏本身列出微信绑定号与已验证的其他号码并带「添加手机号」入口，新号现场添加、短信验证即可登录，不存在「新号未绑微信就登不进」的阻断','删除第二步「绑定新手机号」半屏输入行下的说明「请使用已绑定微信的手机号，以便下次登录」，该文案会让家长误以为新号必须先绑到某个微信','剩余风险改述为误选原号（原号仍留在微信号码列表中，习惯性选第一行会以原号登录并注册出无孩子的空账号），属体验问题而非阻断，靠成功 toast 与第 3 条短信提示；后续阶段可在服务端缓解——原号在换绑记录中保留 30 天，快捷登录命中近期被换绑的原号时不自动注册、改为提示改用新号','「个人资料 · 我的资料」演示说明第 ④ 条同步改写；成功 toast「换绑成功，下次请用新手机号登录」与不退出登录的结论不变','文档：飞书 PRD 4.7 首段同口径改写；仓库 docs/design.md 13.3.4 第 5 条同步']},
{d:'2026-09-05 14:56:35',t:'换绑手机号成功后不退出登录：成功 toast 改为「下次请用新手机号登录」、第二步半屏明示使用已绑定微信的手机号，演示说明、PRD 4.7 与 design.md 同步',p:['parent.html','docs'],i:['口径改定：换绑成功后保持当前登录态、不退出、不跳转登录页——登录态绑定账号而非手机号，用户刚完成原号与新号两步验证，且换绑不改变身份列表、与身份失效兜底无关；原手机号立即失效，之后登录与接收验证码均以新号为准','换绑成功 toast 由「换绑成功，原手机号已失效，请用新手机号登录」改为「换绑成功，下次请用新手机号登录」，不再暗示需要重新登录','第二步「绑定新手机号」半屏输入行下新增说明「请使用已绑定微信的手机号，以便下次登录」：第一阶段登录依赖微信手机号授权、验证码登录默认隐藏，新号未登记微信则下次快捷登录只能授权到原号、会以原号注册出无孩子的空账号，属第一阶段已知缺口','「个人资料 · 我的资料」演示说明第 ④ 条改写为不退出登录的理由、微信快捷登录风险与其他设备会话失效（后续阶段）口径','文档：飞书 PRD 4.7 首段与提示文案表「换绑成功」行同口径改写，并补第一层判定口径至 4.6；仓库 docs/design.md 13.3.4 第 5 条同步']},
{d:'2026-09-04 18:18:34',t:'教师端「我的」待认领支持多孩：chip 计数、可处理条目多于 1 个时先弹选择半屏、认领后计数减一不自动连弹下一个，演示说明同步',p:['teacher.html'],i:['认领数据改为多条目模型 TC_CLAIM：每个待认领孩子各自持有状态（待认领 / 已认领 / 已反馈 / 锁定核实中）、验证失败计数、打码姓名、班级与头像；默认演示数据仍只有王一明、与家长端一致','头部 chip 文案按待认领数生成（「N 个孩子待认领」），待认领归零但有核实中条目时转「认领核实中」仅提示，全部绑定 / 反馈后 chip 隐藏、箭头回归个人资料入口，底部「我的」tab 红点同源','可处理条目（待认领 + 核实中）多于 1 个时点 chip 先弹选择半屏：按添加时间列出各孩子打码姓名、学校班级与状态 chip，点待认领行进入原认领半屏、核实中行仅提示；恰 1 个待认领时仍直拉认领半屏','认领 / 锁定 / 反馈后关闭半屏回到「我的」、计数减一，不自动连弹下一个孩子（每个孩子的认领是独立决定、失败计数与锁定态各自独立；教师端无孩子管理页，直接弹最早的孩子会让第二个孩子没有独立入口）；成功 toast 在仍有待认领时补「还有 N 个孩子待认领」','认领成功的孩子按先后插入账号切换列表与首页身份面板，排在在读孩子之后、毕业 / 离校孩子之前','「我的」演示说明补写多孩口径与不连弹理由，新增动作「演示 · 多孩待认领（再命中王一诺）」；页面 chip 注释同步']},
{d:'2026-09-04 16:23:42',t:'请假待审批期间不再暂按请假处理：只有审批通过的请假才不计缺勤，两端原型、PRD 第 9 章与设计文档同步',p:['parent.html','teacher.html','docs'],i:['口径改定：待审批期间按正常考勤判定，学生当天未到校仍进入缺勤待核项、经老师核对后照常推送缺勤消息（老师核对时可见该生当日待审批请假单、可直接审批）；审批通过后请假时段不计缺勤，已产生的待核项自动核销、考勤流水回溯改判为请假；未通过 / 撤销不影响考勤','家长端：提交 toast 改为「已提交：待班主任审批，审批通过后请假时段不计缺勤」；「请假」「发起请假」「请假单详情」演示说明的缺勤提醒口径改写，补「需当天即时生效可电话告知班主任代请」','教师端：待处理与请假审批列表中吴一诺事假单副行「暂按请假处理中，不推送缺勤」改为发起人与时间，审批详情「考勤处理」行改为「审批通过后请假时段不计缺勤，已产生的缺勤待核项自动核销」，「请假审批」「教师考勤」演示说明同步','文档：飞书 PRD 9.1 状态表 / 9.2 提交成功 / 9.3 撤销 / 9.4 考勤语义 / 9.6 退回补充改写，9.4 状态流转图底注标注为旧口径待重绘；仓库 docs/design.md 8.2 / 8.3 与考勤状态定义 11.5 / 11.7 学生侧口径同步']},
{d:'2026-09-04 15:33:26',t:'发起请假空单拦截提示去掉「（周末）」：非上学日由校历与班级班次共同决定，PRD 9.2 校验表与时长段落同步',p:['parent.html','docs'],i:['提交校验 toast「所选时段均为非上学日（周末），无需请假」改为「所选时段均为非上学日，无需请假」——非上学日除周末外还包括法定节假日、寒暑假与该班当日无班次的日期（如某班周一不排课），点名「周末」会在这些场景下说错话，且把校级配置细节暴露给家长','submitLeave 注释与「发起请假」演示说明补上「上学日 = 校历 × 班级班次」的判定来源，演示仍按真实历法只扣周末','飞书 PRD 9.2 校验表第 7 行提示列与校验列、「时长（上学日）」段落的非上学日定义同步改写']},
{d:'2026-09-04 11:56:29',t:'请假「时长（上学日）」改为与校园签到统计同口径：整天数只计完整覆盖当日应出勤时段的上学日，其余按小时累加，弃用累计满 8 小时折算 1 天；两端原型与 PRD 9.2 同步',p:['parent.html','teacher.html','docs'],i:['家长端发起请假 nlSchoolMins / nlCalcDur、教师端代录请假 plCalcDur 改算法：逐日取区间与当日应出勤时段（演示 08:00–16:00）的重叠，完整覆盖当日应出勤时段的上学日计整天数（= 统计页月历蓝点、「请假 N 天」），其余部分覆盖日的重叠小时累加为小时数（= 统计页「时段请假」），显示「N 天 M 小时」、为 0 的部分省略','弃用「累计满 8 小时折算 1 天」：跨天半日单（12:00 请到次日 12:00）此前显示「1 天」，统计页却记请假 0 天 / 时段请假 8 小时，两页矛盾；现显示「8 小时」。既有示例 6月2日 08:00–6月4日 14:00 仍为「2 天 6 小时」，空单拦截改按整天数与小时数同时为 0 判定','「请假」「发起请假」演示说明与跨天单注释改写口径；飞书 PRD 9.2「时长（上学日）」段落按同口径重写并补反例']},
{d:'2026-09-04 10:52:17',t:'家长端发起请假补上事由必填校验：空白事由 toast 拦截，PRD 9.2 校验表同步',p:['parent.html','docs'],i:['发起请假表单事由文本框补 id，提交时事由为空或纯空格以 toast「请填写请假事由」拦截，校验位于结束时间有效性之后、上学日时长 0 空单与重叠拦截之前（与页面必填星号一致，原型此前未校验）','演示说明「发起请假」补该项拦截口径；演示入口（重叠 / 空单拦截预览）预填事由，保证直达后两项校验','飞书 PRD 9.2 提交校验表由七项改为八项、事由必填列为第 5 项，空单拦截动因段落序号同步']},
{d:'2026-09-04 10:37:22',t:'教师端新增「教师考勤」：校门工牌无感 + 小程序围栏打卡双通道、补卡 / 外勤 / 请假申请与校管审批；考勤状态定义第 11 节、PRD 第 14 章、用户域数据库设计同步',p:['teacher.html','docs'],i:['考勤方式决策：A + B 混合——教师佩戴与学生同款无源 UHF 工牌复用校门读写器 + 人脸相机无感采集，小程序围栏打卡（默认半径 300 米 / 校园 WiFi，服务器时间，围栏外不生成记录）为平行通道，两路等权合并（签到取最早、签退取最晚）；异常兜底为补卡 / 外勤 / 请假申请，教师本人发起、校级管理员审批、不可自审','「我的」新增可见「考勤」区：我的考勤 sc-tatt（今日到离校时间轴 + 打卡按钮 + 本月统计 + 月记录，‹ 切 6月定格）、考勤申请 sc-tattfix（补卡 / 外勤 / 请假三类型合一表单）；首页宫格新增第 8 格「教师考勤」（同其他宫格外链线上站点 #sc-tatt）；管理员专区（隐藏）内新增「教师考勤」校管总览入口','校管视图 sc-tattadmin（日实时 / 月定格、全部 / 异常 / 待审批 / 请假·外勤筛选、按科室 toast 占位）与教师明细审批 sc-tattdetail（李强 7月3日 签到补卡：通过按认定 07:35 重判为迟到 5 分钟 · 补卡，退回 / 不通过需填意见），王老师非本校校管、经演示说明预览','演示链路：7月2日 签到缺卡 → 行内「补卡」→ 申请页提交 → 「缺卡 · 补卡审批中」→ 演示说明「校管通过我的补卡」→ 「正常 · 补卡」（认定 07:26 早于应签到 07:30）；打卡半屏围栏内 / 围栏外两形态，围栏内确认后时间轴追加 09:41 补充记录、状态不变；7月3日 签到 07:19 为小程序打卡示例','演示说明新增 sc-tatt / sc-tattfix / sc-tattadmin / sc-tattdetail 四条，sc-home / sc-att / sc-me 三条同步补入口与去向说明；teacher.css 新增 .punch 圆形打卡按钮与 .geo-box 定位占位','docs/考勤状态定义.md 新增第 11 节教师考勤（主体与班次、来源四枚举与双通道合并、新增侧状态「外勤」、申请单影响、刷新复用第 10 节、与学生口径差异对照、后续阶段）并记修订 15；design.md 新增第 14 章教师考勤（定位、硬件复用、围栏打卡、班次状态、申请审批、隐私、端功能），1.2 / 10 / 11 章同步（pass_event 主体泛化 subject_type + subject_id，新增 punch_event），附录开放决策追加教师考勤待定项','docs/db-design-user-domain.md 升 V1.1：teacher_profile 增 staff_no / dept_id / shift_id / att_exempt，新增 school_dept（平行维度）、8.6 教师工牌归属（badge 可空双外键恰一非空，不建 teacher_badge）、8.7 教师考勤五表（teacher_shift / attendance_fence / teacher_attendance_event / teacher_attendance_day / teacher_attendance_request），school_config 六项默认值、audit_log 动作、ER 图、衔接点、开放问题同步；2026-07-10 考勤统计 spec 加备注指向新章节，正文不改']},
{d:'2026-09-03 17:11:06',t:'家长端记录保留提醒改为归档记录到期前 30 天推送：PRD 13.1 / 13.2 与原型演示说明同步',p:['parent.html','docs'],i:['PRD 13.1「记录保留提醒」与 13.2「归档清理提醒」发送时机由「到期清理前推送」定为「到期前 30 天推送一次」，毕业结转当时不发、保留期由毕业态首页卡片常驻告知；示例时间 2026-07-01 15:00 改为 2027-06-01 15:00（站内消息示例 6月1日 15:00）','原型消息列表与服务号推送卡的注释、「消息」页演示说明补充该口径，演示条目仍提前置于当前时间轴']},
{d:'2026-09-03 12:49:58',t:'家长端智慧放学收口预览改为仅晓乐班上午段：末段离校截止固定 23:59、当天无收口形态',p:['parent.html'],i:['学校端「学生班次」把每个班次末段的离校截止固定为 23:59（一天打卡 2 次的单段班次即末段），末段收口在当天结束才触发、家长端无感，故去掉晓阳班全天段的收口演示，晓阳卡片保持「全天 · 放学中 16:58」','收口实际只对非末段起作用且一定沉入摘要行：「已放学且无时间」不会成为主行；toast 与演示说明改写，补充末段漏播当晚保持「未放学 + 计划放学时间」、第一阶段接受不按下课时间猜测收口的口径','PRD 8.3 / 状态表 / 8.4 / 8.6 已同步同一口径']},
{d:'2026-09-03 12:40:01',t:'家长端智慧放学新增「预览 · 未播报段系统收口」切换',p:['parent.html'],i:['演示说明新增按钮 dnCloseToggle()：模拟晓乐班上午段、晓阳班全天段出校时间段结束仍未播报、由系统置为已放学的形态——上午段沉入摘要行写作「上午 已放学」，全天段主行为「全天 · 已放学」且时间位置留空（无播报时间不拿计划时间冒充）','口径同步 PRD 8.3：收口按段独立、不推送班级放学通知、延迟段不收口（到点自动播报接管）、教师端控制台显示「未播报 · 已结束」；演示说明补充该段说明','互斥关系：与上午 11:00 时点预览互斥（任一开启即关闭另一个，窗口未结束无从收口）；与延迟预览叠加时晓阳按延迟展示']},
{d:'2026-09-02 15:48:55',t:'家长端绑定申请页审核中状态态去掉「审核通过前不可见孩子任何数据」尾句',p:['parent.html'],i:['状态卡底部提示精简为「班主任将与班级学生名册比对后批量处理 / 结果以消息通知」，规则口径已由演示说明 chip 覆盖，不再印在页面正文']},
{d:'2026-09-02 09:53:56',t:'家长端「我的」头部待认领 chip 点击改为直接拉起认领半屏',p:['parent.html'],i:['chip 点击由仅跳孩子管理页改为复用消息 / 推送卡的认领入口函数：落孩子管理页并直接拉起认领半屏，三个入口行为统一','演示说明补充口径：仅 1 个待认领时直拉半屏，多于 1 个时只落列表由家长自选']},
{d:'2026-09-02 09:50:58',t:'教师端「我的」隐藏「系统设置」宫格，「账号与帮助」卡片改两列等分',p:['teacher.html'],i:['「系统设置」宫格第一阶段隐藏（display:none 保留节点，原为演示 toast、无独立页面），演示说明注明为后续阶段','「账号与帮助」卡片仅剩账号切换 / 帮助与反馈两项，容器改两列等分避免右侧空位，恢复方式见注释']},
{d:'2026-09-02 08:47:35',t:'教师端「我的」隐藏「孩子」卡片，头部新增与家长端同位置的「1 个孩子待认领」chip，点击拉起认领半屏；底部「我的」tab 加待认领红点',p:['teacher.html'],i:['「孩子」卡片（添加孩子）第一阶段隐藏（display:none 保留节点），入口收进「我的」演示说明「预览 · 添加孩子（后续阶段）」','头部右侧新增「1 个孩子待认领」chip：名册以手机号命中属账号级事实、与当前身份无关，教师且名下无已绑定孩子时账号切换列表无家长身份行，本处为除消息外唯一承接点；头像 / 姓名区保留个人资料入口','点击 chip 拉起认领半屏（教师端无孩子管理页）：补全姓名验证 + 关系选择、三次失败锁定转「认领核实中」、「这不是我的孩子」反馈，与家长端同一套口径（演示答案：一，刷新恢复）','认领成功后 chip 消失，王一明作为在读生行动态加入账号切换列表与首页身份面板，可切换为家长身份','底部「我的」tab 右上角红点与家长端同口径：待认领常亮、三条出路同步消失、不因进入本页清除；「消息」tab 暂不加','演示说明补充边界：教师恰为该孩子所在班班主任时，核实应转交年级组长 / 学校管理员']},
{d:'2026-09-02 08:29:16',t:'家长端底部「我的」tab 新增待认领红点：存在待认领孩子时常亮，随认领 / 锁定 / 反馈隐藏同步消失',p:['parent.html'],i:['四处 tabBar 的「我的」按钮加右上角红点节点（图标右上、珊瑚红描白边），仅 claimState 为待认领时显示','红点与头部「N 个孩子待认领」chip 同源：认领成功、连续验证失败转核实中、反馈「不是我的孩子」三条出路均同步消失，进入「我的」页不清除（待办信号而非未读信号）','「消息」tab 未读红点暂不加，演示说明已注明口径']},
{d:'2026-09-02 05:24:11',t:'家长端扫码注册 / 邀请注册链路新增学校级注册码与学校级邀请卡片演示路径：码只带学校，绑定申请页年级 / 班级由家长自选',p:['parent.html'],i:['新增注册码 / 邀请卡片级别状态（班级级 / 学校级，会话级、刷新恢复班级级）：学校级时班级注册码海报标题改「学校注册码」、副题「家长注册」、有效期行「仅限本校家长使用」，邀请卡片改为教务处李主任分享、文案不带班级；服务号主页 / 欢迎语 / 落地页与班级级共用','绑定申请页学校级形态：年级 / 班级由只读改为选择控件（选项与添加孩子表单同源），未选则提交拦截；登录落点不做「已绑定该班孩子」拦截（学校级码覆盖全校，多孩家长为另一个孩子申请属正常场景），状态态只按经本码提交的申请重建（码不带班级，演示种子在途申请不计入），首次登录一律落表单由家长填孩子资料；提交前三道拦截与在途申请写入均改按家长所选校班比对，提交 toast 按所选班级班主任口径','演示说明：登录页新增「从学校注册码海报开始」「从学校级邀请卡片开始」「模拟扫学校注册码 · 直达绑定申请」三个入口，班级级邀请卡片入口改为显式置级别；绑定申请页新增「学校级注册码 / 邀请卡片」开关（切换后按当前人设重新走登录落点）；海报页 / 邀请卡片页新增学校级与班级级切换按钮，相关说明补学校级口径（学校管理员管理端生成，后续阶段）']},
{d:'2026-09-02 04:49:36',t:'教师端登录页与家长端登录页对齐：背景图 / 品牌区 / 面板尺寸同款，协议改为「点登录先弹协议确认半屏」并接入协议阅读页，快捷登录拉起微信手机号授权半屏，补「暂不登录」游客态首页',p:['teacher.html'],i:['登录页视觉对齐家长端：背景改为 login-bg.jpg + 蓝色渐变叠层，品牌区标题 27px / 字距 6px、副标改为「智能校徽 · 智联校园」，白色面板圆角 18px、内边距 35/20/56，微信按钮 15px 内边距 / 13px 圆角','协议同意口径对齐：底部文案改为「登录前请阅读并同意」（13px / 行高 2），三个协议名点开新增的协议阅读页 sc-legal（引入 assets/legal.js，全文与家长端同源；teacher.css 补 .legal-doc 样式）；快捷登录 / 验证码登录的「登录」先弹「服务协议与隐私保护」确认半屏（同意并登录 / 不同意），半屏内协议行进阅读页、返回自动重新拉起半屏续接登录','「手机号快捷登录」由 toast 直跳改为拉起微信手机号授权半屏：138****2233（上次提供）命中教师名册进教师身份认证，135****6677（微信绑定号码）落「未匹配教师身份」承接页并同步页面手机号；「不允许」关闭半屏、「管理号码」toast 示意','「手机号验证码登录」按钮改为默认隐藏，登录页演示说明内新增显示开关（localStorage proto-smslogin 与家长端共用）；验证码登录页底部协议文案同步改为「登录前请阅读并同意」并可点开阅读页','登录页底部补「暂不登录」文字按钮（家长 / 教师已合并为一个小程序）：点击落新增的未登录首页 sc-visitor，页面与家长端游客态首页同一结构（品牌头部「未登录」引导 + 活动横幅 + 六宫格 + 底部 Tab），任意功能入口与「消息 / 我的」Tab 均跳登录页、「首页」Tab 驻留','演示说明新增 sc-visitor / sc-legal 条目，sc-login（补「暂不登录」入口）/ sc-sms 条目更新']},
{d:'2026-08-31 20:48:49',t:'家长端未匹配承接页「审核中」状态卡去掉多余底部分割线',p:['parent.html'],i:['状态卡此前插在「提交人工申请」入口之前、入口随即隐藏，隐藏节点仍是卡片末节点，最后一张状态卡失去 .cell:last-child 去底线规则、卡片底部多出一条分割线','parent.js：nochildPendCell 与办理链路 payokDoneNew 两处改为把状态卡追加到入口之后（入口有状态卡时始终隐藏，位置不可见），最后一张状态卡成为真正的末节点；撤回全部后入口恢复显示仍为末节点，无底线']},
{d:'2026-08-31 20:46:18',t:'家长端绑定申请页审核中状态态的孩子卡改为默认静态不可点，仅「允许撤回」开关打开时可点开申请详情',p:['parent.html'],i:['状态态卡片已印全姓名 / 校班 / 提交时间，再点开申请详情半屏只是复述、无增量信息，故去掉点击与右箭头；孩子管理页 / 承接页的审核中条目不变（条目未印提交时间且半屏承载撤回出口）','「允许撤回审核中的申请（后续阶段）」开关扩展到绑定申请页演示说明（与孩子管理页 / 承接页同源 localStorage）：开关打开时卡片恢复可点与箭头，点开同一申请详情半屏（含撤回出口）；切换开关时驻留状态态就地重绘','绑定申请页演示说明同步']},
{d:'2026-08-31 20:41:23',t:'家长端班级注册码 / 邀请注册卡片登录落点精简：已绑定分支半屏改 toast，绑定申请页状态态去掉「为另一个孩子申请」按钮',p:['parent.html'],i:['已绑定分支：落家长端首页后由半屏「您已绑定该班的孩子」（查看孩子 / 为另一个孩子申请）改为 toast「您已绑定该班的孩子 林晓乐，无需再次申请」——首页头部已显示该孩子，「查看孩子」无增量信息；同班双胞胎等窄场景走正式入口 我的 → 添加孩子 → 人工申请（同一位班主任审核），不在卡片链路另开出口；删除 cregBoundSheet','绑定申请页审核中状态态去掉「为另一个孩子申请」次按钮，与未匹配承接页「自身入口单次提交」口径对齐：零绑定双胞胎的第二个孩子待第一个过审、账号有孩子后经 我的 → 添加孩子 补提（接受进不了同一批集中审核的取舍）；表单态仅经登录落点 / 演示说明进入','绑定申请页演示说明、代码块注释与页头注释同步']},
{d:'2026-08-31 20:29:18',t:'家长端班级注册码 / 邀请注册卡片登录落点按卡片班级下的记录三行分流：已绑定落首页弹半屏、审核中落绑定申请页状态态、无记录落表单；页头补微信「返回首页」按钮按身份路由',p:['parent.html'],i:['登录落点分流（cregEnter，wxAuthPick / smsLogin 的 bind 分支共用）：①该班已有已绑定孩子 → 家长端首页（首页所选孩子切到该孩子）+ 半屏「您已绑定该班的孩子 林晓乐」（查看孩子 / 为另一个孩子申请）；②该班有审核中申请（不分账号）→ 绑定申请页审核中状态态；③无记录 → 表单。此前无条件直达表单，已绑定家长要填完姓名才被拦、再点卡片看不到申请状态','绑定申请页审核中态由一次性 innerHTML 升级为可重入状态态（cregStatus）：按卡片班级过滤统一在途申请表重建，逐条列出孩子卡（头像、姓名、校班、提交时间，点开申请详情半屏、撤回后同步刷新），保留审核说明两行，新增「为另一个孩子申请」次按钮回表单（双胞胎 / 二孩出口）；不落未匹配承接页——其「不在名册中 + 三通道引导」框架与冷启动情境打架','零绑定账号提交也写入在途申请表并向未匹配承接页插「审核中」状态卡（新增 nochildPendCell，nochildApplyPending 改为复用），本页就地转状态态；有孩子账号提交落点维持上一迭代（孩子管理页条目 + 承接半屏）；重复提交拦截对全部人设生效，出口回状态态（cregPendDupSheet）','页头补微信原生「返回首页」小房子按钮示意（扫码 / 分享进入非入口页且页面栈仅一页时导航栏自动显示）：cregHome 按账号身份兜底路由——有孩子 → 家长端首页，无孩子有教师身份 → 教师端首页，均无 → 未匹配承接页；此前该页对有教师身份、名下无孩子的账号是无出口死胡同。教师身份不改变落点与提交逻辑（师长双身份为支持场景，扫自己班的码放行自审）','演示人设由 cregHasKids 布尔改为 cregPersona 三态（new 零绑定 / kids 乐乐妈妈 / teacher 有教师身份无孩子）：绑定申请页演示说明两个互斥开关（切换即重新走登录落点分流）、新增「按当前人设重新走登录落点分流」「查看邀请注册卡片链路」按钮；登录页演示说明班级注册码入口改为三种人设的登录落点直达','演示说明同步：绑定申请页改写落点分流、状态态、返回首页与教师身份口径；孩子管理页补「流程态条目为账号级、不受首页所选孩子同校筛选」口径；未匹配承接页补零绑定扫码提交写状态卡口径；邀请注册卡片页补登录落点分流引用；parent.html 页头注释同步']},
{d:'2026-08-31 11:36:50',t:'家长端添加孩子候选卡演示说明新增「一个家庭被拉黑、一个家庭可发起」预览入口',p:['parent.html'],i:['famJoinLockAllPreview 增加 partial 模式：妈妈家庭（尾号 3216）置为被拉黑「暂不可发起」、爸爸家庭（尾号 8027）保持可「加入家庭」，直接打开候选卡','演示说明补充局部不可发起态口径：顶部说明维持「请辨认您的家人…」引导，仅由行尾 chip 区分']},
{d:'2026-08-31 11:30:44',t:'家长端添加孩子候选卡：被拉黑与多次被拒锁定统一为模糊的「暂不可发起」态，全部家庭不可发起时说明改为班主任出路',p:['parent.html'],i:['口径定版：拉黑作用于「申请人 × 该家庭」（候选卡每行即一个家庭，行级锁定即家庭级锁定），申请人侧不区分被拉黑与 2 次被拒锁定、同一呈现——行尾「加入家庭」换成灰 chip「暂不可发起」（原「已锁定」为系统词），不暴露原因；拉黑不单独通知申请人，对方只收普通「已被拒绝」消息，冷却期后该家庭行仍为「暂不可发起」；不采用完全静默丢弃，保留班主任核实出路','候选卡全部家庭均不可发起时，卡内说明由「请辨认您的家人…」改为「当前暂不可向该学生的家庭发起加入请求，如需绑定请联系班主任核实」，「不是同一个孩子？继续提交申请」逃生通道与「取消」保留','parent.js：确认页「拒绝并拉黑」同步给申请人侧家庭行打 blocked 标记（呈现同 locked）；修正确认页「已由其他家人处理」态文案——原引用「爸爸 · 尾号 8027」在两同名家庭模型下属另一家庭，改为「陈小雨的其他家人已同意该请求」','演示说明：添加孩子页补充不可发起态呈现与拉黑口径，新增「预览 · 候选卡全部家庭不可发起态 / 恢复候选家庭为可发起」两个入口；确认页说明补充拉黑在申请人侧的呈现']},
{d:'2026-08-31 10:26:38',t:'家长端「加入请求」页演示说明删去「拒绝并拉黑」的「报告班主任核实」描述',p:['parent.html'],i:['sc-famconfirm 演示说明：「拒绝并拉黑」规则描述改为「不再接收该申请人后续请求」，与上一版页面文案精简同步，该规则不再保留','同段「需先在添加孩子表单发起请求」改为「如需演示申请人侧联动，可先在添加孩子表单发起请求」——上一版已去掉须先发起请求的演示门槛，原描述已过时']},
{d:'2026-08-31 10:25:10',t:'家长端「加入请求」页精简结果文案：已同意态去掉能力罗列、拒绝并拉黑相关文案去掉「报告班主任核实」',p:['parent.html'],i:['已同意态结果说明由「…已成为陈小雨的家人，可接收到离校通知、发起请假并管理校徽。」精简为「…已成为陈小雨的家人。」（开通能力已在上方信息卡「同意后」一行说明，不重复）','已拒绝并拉黑态结果说明与「拒绝并拉黑」二次确认半屏正文均去掉「报告班主任核实」尾句，确认后 toast 同步改为「已拒绝并拉黑该申请人的后续请求」']},
{d:'2026-08-31 10:20:51',t:'家长端「加入家庭请求待确认」消息处理后再点落确认页已处理态：按请求当前状态呈现结果，不回放待确认态',p:['parent.html'],i:['口径：加入请求本身是业务对象、「加入请求」确认页即其详情页——站内消息与服务号推送卡无论处理前后都落本页，只按请求当前状态变形（待确认 / 已同意 / 已拒绝 / 已拒绝并拉黑 / 已由其他家人处理 / 已失效），与校徽订单消息「结果类消息落当前状态」同口径；消息条目标题与摘要不改（历史消息不可变）','确认页新增已处理态区块：动作区整块隐藏，换成状态 chip + 处理时间 + 结果说明，已同意态另给「查看陈小雨的家人」出口（演示账号名下无陈小雨，进家人页以 toast 说明版式）；头部 chip 由固定「加入请求」改为随状态显示「待确认 / 已同意 / …」','三动作确认后由跳转孩子管理页改为停留本页就地转态（真实产品行为），去掉此前须先在添加孩子表单发起请求的演示门槛与提示 toast；申请人侧存在在途请求时孩子管理页条目仍同步流转（famConfirmDo → famJoinApprove/famJoinReject(silent)），孩子管理页演示按钮模拟对方同意 / 拒绝时同步置确认端状态','返回键按来源回溯：由消息 / 推送卡进入回消息页 / 推送页，由添加孩子页或孩子管理页预览进入回原页（famReqOpen 记录来源）','演示说明：确认页补充已处理态口径并新增「预览 · 已由其他家人处理态 / 预览 · 请求已失效态 / 重置为待确认态」三个入口；消息页说明同步补充待办类消息处理后的落点口径']},

{"d": "2026-08-14 20:31:40", "t": "PRD 补入点评趋势纵轴刻度的完整计算步骤", "p": ["docs"], "i": ["PRD 飞书文档 10.10「点评趋势」原只描述刻度口径（步长档位、下界、条数上限），未给出算法；本次补齐六步公式：①粗算步长 = max(1, ceil((max − base) ÷ 4))，base = min(0, min)；②吸附到 1 / 2 / 2.5 / 5 × 10ⁿ 中不小于初始步长的最小者；③下界 = floor(base ÷ 步长) × 步长；④条数 = max(2, ceil((max − 下界) ÷ 步长) + 1)；⑤条数超 5 则步长升一档回到③重算；⑥上界 = 下界 + 步长 × (条数 − 1)", "一并写明两处容易被改错的取值依据：除以 4 而非 5（5 条网格线之间只有 4 个间隔，除以 5 会算出偏小步长、反而需要 6 条线）；base 取 min(0, min) 而非 min（数据全为正时纵轴从 0 起，避免「纵轴从 37 开始」这类视觉放大）", "仅补文档，原型实现与刻度结果不变"]},

{"d": "2026-08-14 10:09:56", "t": "分组方案明确排序与选中规则：正序 + 默认首位 + 按方案 id 跨会话记忆", "p": ["teacher.html", "docs"], "i": ["方案列表明确为创建正序（新建 push 到末尾），不倒序、不按创建人 / 小组数 / 最近使用重排：半屏通常只有 1–3 行、一屏全见，排序对「找得到」几乎没有帮助，而每新建一个就让既有项集体下移会让位置持续漂移——与班级列表「位置稳定的肌肉记忆优于智能排序」同一原则。默认落点为排序首位，正序下通常是学期初建的主用方案（若改倒序取首位，别的老师刚建的临时方案会成为他人首次进班的默认）", "当前方案的记忆由内存对象 EP_PLANCUR_CLS 改为 localStorage（proto-tev-plan）跨会话保留，与当前班级的记忆同口径——老师对同一个班长期用同一套方案；此前刷新即回到首位，而演示说明写的「各班方案选择互相记忆」读起来像与班级记忆同级，实为会话内", "记忆值由「列表下标」改为「方案 id」：方案是多人共享、他人可增删的对象，按下标记忆会在别人删掉靠前方案后指到另一个方案上（上次选的是学习组，回来变成值日组）；EP_PLANS_CLS 各演示方案补稳定 id，新建方案发 new<n> 序号 id", "epPlanDelDo 的下标算术改为按 id 找回原选择：删的不是当前方案时选择不变（下标前移自动处理），删的正是当前方案则回落首位，记忆同步改写；记忆的方案已被删除或演示数据刷新重置时一律回落首位", "顺带修复初始化：epPlans / epPlanCur 此前硬编码取 c32，当班级记忆不是三(2)班时小组 Tab 会先显示别班的方案，直到手动切一次班才纠正；改为随 epSt.cls 解析", "sc-evalpick 演示说明补排序与选中规则全文，动作项加「重置分组方案记忆（回排序首位）」；PRD 飞书文档 10.7 新增「方案的排序与选中」一段"]},
{"d": "2026-08-14 09:55:53", "t": "评价报告「下载」浮钮与「导出报告」统一为同一动作", "p": ["parent.html", "teacher.html", "docs"], "i": ["两端评价报告页右下「下载」浮钮由 go('sc-evaldl') 纯跳转改为 repExport()：与「导出报告」完全一致——按当前学生 × 当前周期生成一份新的 Word 入队「生成中」、跳转下载评价报告页，约 2.5 秒后转「已生成」。此前两个按钮同屏、落点相同却一个有副作用一个没有，用户无法预判点哪个会生成文件", "空态下两个入口一并拦截，均提示「本周期暂无点评数据，暂无法导出报告」；此前浮钮在空态下仍可点，与被拦截的「导出报告」规则不一致", "浮钮保留的理由改为「同一动作的第二入口」：报告页较长，头部按钮滚动后即不可见，浮钮让导出在任意滚动位置都够得着；仅需浏览已导出记录时走演示说明的「进入下载列表」", "sc-evalrep 两端演示说明改写两个入口的关系与空态处置；PRD 飞书文档 10.10 导出段与空态段同步"]},
{"d": "2026-08-14 09:45:59", "t": "评价报告补无点评数据的整页空态（两端同构）", "p": ["parent.html", "teacher.html", "docs"], "i": ["两端评价报告页新增空态形态：四个分区（点评分布 / 趋势 / 统计 / 明细）包进 rep-body 整体收起，换成 rep-empty——插画 + 「本周期暂无点评数据」+ 一句去路说明 + 「切换评价周期」按钮；家长端去路是换周期，教师端多一条换学生（该端头部本就有学生卡切换入口，家长端没有）", "头部学生信息卡、周期按钮与「导出报告」在空态下保留：空态最常见的成因就是周期选错，切周期的入口必须留在当前页，退回上一页重选是多余的一步", "空态下「导出报告」点击拦截提示「本周期暂无点评数据，暂无法导出报告」——导出一份全空的 Word 对家长没有价值；右下「下载」浮钮仍可用，它进的是下载列表，其中可能有其他周期已导出的报告，与当前周期有无数据无关", "真实产品由报告数据决定形态，原型加 repEmpty(on) 开关经演示说明切换（与角色切换同一手法，演示数据刷新恢复）；sc-evalrep 两端演示说明各加「预览无点评数据（空态）」「恢复演示数据」动作", "订正演示说明中「发展亮点维度分析」分支①的表述：周期内无任何点评记录时整页已是空态，该分支的简评文案根本不会露出，原描述与实际形态自相矛盾", "PRD 飞书文档 10.10 新增「周期内无点评记录时的空态」一段，10.11 文案规则表分支①「无数据」的文案模板改为「不出简评——该情形整页已是空态（见 10.10）」"]},
{"d": "2026-08-13 20:15:00", "t": "小组图标补自定义上传：选本地图 + 圆形取景裁剪，按班级复用", "p": ["teacher.html", "docs"], "i": ["「选择图标」半屏底部「自定义上传」由 toast「后续阶段」接上真实交互：触发本地选图（仅 JPG / PNG、单张不超过 5MB，超出即提示拦截），FileReader 读为 data URI 后进「调整图标」半屏；真机走微信选图，原型以系统文件选择器模拟", "新增「调整图标」裁剪半屏：圆形取景框固定居中，pointer 事件拖动定位 + 滑块 1–3 倍缩放，位移按「图片盖满取景圆」实时钳制、裁不出白边；确认时按当前位移与缩放换算 drawImage 源矩形，canvas 统一导出 240×240 PNG——图标位最大只有 96px，存原图既浪费又让各小组清晰度参差。不引第三方裁剪库", "渲染层只改 epIcSvg / epIcBg 两个函数即全站生效：g.ic 以 data: 开头时渲染 <img>（object-fit:cover + 圆形裁切）、底色转 transparent，小组卡 / 小组管理页 / 点评面板对象头像 / 图文点评选组 / 点评记录卡头像无需逐处判断", "上传过的图标进入该班图标库，排在 12 个预置图标之前可直接复用（同一套小组常配同一批图），带 ✕ 可移除——移除只影响图标库，已选用该图的小组不受影响；图标库与分组方案、小组同口径按班级隔离，不跨班共享（演示数据，刷新恢复）", "sc-grpinfo 演示说明同步上传约束、裁剪与复用口径，动作项加「自定义上传图标（选一张本地图片）」；PRD 飞书文档 10.7 新增「小组图标的自定义上传」一段、小组信息段去掉「自定义上传属后续阶段」，后续阶段能力清单移除该条"]},
{"d": "2026-08-13 19:42:00", "t": "PRD 同步分组方案的重命名与删除口径", "p": ["docs"], "i": ["PRD 飞书文档 10.7「教师端：小组与分组方案」删去「方案的重命名与删除属后续阶段」，新增一段完整规则：重命名沿用添加方案的输入形态（6 字上限）并做同班重名校验；删除需二次确认，方案下的小组一并删除、组员回未分组、历史点评记录与星星保留，以及删前 / 删当前 / 删光三种情形的落点", "同段补权限口径：教师只能改自己创建的方案，非本人创建的方案行不渲染重命名 / 删除图标（不置灰——看得见却点不动只造成困惑），校长作为学校管理者可管理本校任意班级的任意方案", "10.12 权限段在「点评的编辑与删除仅限点评人本人」之后补分组方案同理的一句，并指回 10.7", "后续阶段能力清单移除「分组方案的重命名与删除」（该能力已在本次实现），保留「教师端小组图标的自定义上传」"]},
{"d": "2026-08-13 19:20:00", "t": "分组方案补编辑 / 删除交互：仅创建人可改，校长可管理全校", "p": ["teacher.html"], "i": ["「选择分组方案」半屏的 ✎ / 🗑 由 toast「后续阶段」接上真实交互：✎ 弹「重命名分组方案」（复用添加方案的输入形态，6 字上限 + 实时字数，预填原名），保存后小组 Tab 方案名与小组管理页当前方案行同步刷新并退回选择半屏；新增同班重名校验（方案名是老师切换方案时唯一的识别依据，同名两个方案在半屏里分辨不出），添加方案同样生效", "🗑 弹删除确认半屏，文案写明连带口径——方案下的 N 个小组一并删除、组员回到未分组，历史点评记录与星星保留不受影响（与「解散小组」同口径）；删排在当前方案之前的方案时当前选择不变（下标前移修正），删的正是当前方案则落回列表首个，删光则关半屏回到「当前班级暂无分组方案」空态，若当时停在小组管理页则自动退回表现点评页", "编辑 / 删除权限：分组方案决定全班的小组点评口径，误删他人方案代价高，故教师只能改自己创建的方案，非本人创建的方案行不渲染 ✎ / 🗑（不置灰，避免看得见却点了才被拒），与点评记录「仅本人可编辑 / 删除」同一思路；校长为学校管理者，可修改 / 删除本校任意班级的任意方案（epMe / epPlanEditable，随 evRole 切换），入口另有 epPlanGuard 兜底拦截", "三(2)班演示数据新增「值日小组」方案（创建人李老师、周一值日 / 周二值日 2 个小组），用于对照展示无权限形态；新建方案的创建人由硬编码「王老师」改为取当前账号，并补上按班级记忆当前方案（EP_PLANCUR_CLS）", "sc-evalpick / sc-grpmgr 演示说明同步上述权限与连带口径，演示动作补「重命名当前分组方案」「删除当前分组方案」"]},
{"d":"2026-08-13 18:00:33","t":"图文点评发送规则收紧为项目必填；常用评语定为教师个人语料并换预置清单","p":["teacher.html","docs"],"i":["图文点评发送校验由「评语 / 项目 / 图片至少其一」改为「点评项目必填 + 评语与图片至少其一」，提示分别为「请选择点评项目」「请填写评语或添加图片」——原规则允许不带项目发送，这类内容既不计星星也不生成点评记录，家长侧没有任何落点可看，等于发了一条没人收的通知；只挂项目而不写评语不加图则走点评面板的单项点评更快，不必进本页","常用评语明确为教师个人语料：各人独立、互不可见也互不影响（表达习惯因人而异，共用一份会互相干扰），新增条数上限 50 条（原仅限单条 50 字、条目数无界，超出提示先删除不用的）","系统预置评语由 5 条换为 10 条（表扬 6 + 待改进 4，覆盖德智体美劳常见场景）：原 5 条全为表扬向、待改进场景无可用预置，首条「表现不错」四字更像占位；新清单措辞用面向家长的陈述口吻，待改进类只描述行为与下一步、不评判孩子本人，单条 50 字以内","sc-evalpub / sc-tevedit 演示说明同步；PRD 飞书文档 10.6 改写图文点评发送规则、补常用评语归属与上限，并新增「系统预置评语」清单表与措辞原则"]},

{"d":"2026-08-13 17:14:15","t":"校长视角可对全校任意班级发起点评；班级多时改用左年级栏 + 右班级","p":["teacher.html","docs"],"i":["素质评价模块引入账号角色（与校园签到页同口径，原型经素质评价页演示说明切换）：教师视角为任教班级，校长视角为全校 6 个年级 22 个班——SCHOOL_CLS 由考勤页 attSchool 派生，key 取 c<年级><班号> 与既有 c31 / c32 / c33 天然对齐，三年级三个演示班在校长视角下直接复用原有名单与计数","校长可对全校任意班级发起点评（校园巡查表扬 / 提醒），点评记录的「点评老师」即校长本人；身份 chip 不出（班主任 / 科任是相对当前账号的关系），默认取排序首位一年级(1)班，班级记忆按角色分开存储、两种视角互不覆盖","班级选择形态按候选集规模分流：1–6 个班平铺点选即生效（教师视角不变），超过 6 个（校长全校 / 走班制科任）改用「左年级栏 + 右班级」——点年级切右侧班级、点班级即生效，打开时左栏定位到当前班级所在年级，「全部班级」仍置顶于年级栏之上；此前删除的 pcvSheet 预览形态由本实现替代","修复班级选择半屏被撑穿：.sheet 无高度上限，教师视角 3–4 个班从未暴露，校长 22 个班一次铺开把标题与「全部班级」顶出屏幕；平铺态列表加 .cls-scroll 限高滚动，评价报告「选择学生」半屏（校长视角 22 个班上百名学生）同样限高","全校学生与排行数据：非演示班的名单按班级 key 确定性生成（8–10 人、同班不重名、每次进入一致）并缓存，排行由名单派生按星星净值降序；EP_STUS / RK_STUS 的直接下标访问统一改走 epStus() / rkStus()；报告内入学届别与学号由硬编码三个班改为按「本学年入学届 = 2026 − 年级」计算","教师端删除点评弹窗文案改为「删除后该条点评从两端列表移除…家长侧已推送的消息会保留并标为「该点评已被老师撤回」」（原文案说「从家长端移除」会让老师误以为家长侧什么都不留）","sc-eval / sc-evalpick / sc-rank / sc-evalstu 演示说明同步；PRD 飞书文档 10.6 新增「校长身份的班级范围」四条，10.5 / 10.8 / 10.10 的班级与选人范围改为随账号角色，10.12 权限段补校长覆盖全校，10.13 移除已实现的「校长视角选班形态」"]},

{"d":"2026-08-13 14:29:18","t":"点评记录卡时间格式定版：新提交记录按今天 HH:mm 显示，不用「刚刚」","p":["teacher.html","parent.html","docs"],"i":["新提交点评的记录卡时间由「刚刚」改为规范格式：新增 evNowTxt() 演示时钟，自演示时点 2026-07-06 17:05 起逐条 +1 分钟输出「今天 HH:mm」（跨小时正确进位），epAddRec 与旧版快捷点评半屏两处生成记录卡的地方统一走它；点评明细页从记录卡就地读取时间、自动同步","取消「刚刚」相对时间档的动因：点评时间是有格式规范的字段，「刚发出」已由记录置顶与统计联动表达，且相对时间会让同一条记录的显示随列表是否重新拉取而变化（老师从表现点评页返回素质评价页算不算「重新进入」本就无法界定）；递增时刻还能自然体现新记录排在列表最前。校徽「刚刚启用」等状态描述句不属时间字段，保持不变","PRD 飞书文档 10.3 新增「时间显示格式」一节并定版：当天「今天 HH:mm」、当年内其他日期「M月D日 HH:mm」（月日不补零）、跨年「YYYY年M月D日 HH:mm」（与请假时间选择器当年省略年份、跨年标年同口径——本学期 / 上学期与 180 天自定义区间均可能跨自然年），提交后的新记录同走当天规则；两端记录卡、点评明细列表、点评详情「点评时间」与评价报告明细行同此口径","两端 sc-eval 与教师端 sc-evalpick 演示说明同步上述格式与演示时钟口径"]},
{"d":"2026-08-13 13:59:10","t":"素质评价自定义区间改为小程序滚轮选择器","p":["parent.html","teacher.html","docs"],"i":["六处时间筛选的自定义区间（家长端素质评价页 / 评价报告，教师端素质评价页 / 点评明细 / 表现排行 / 评价报告）由 antd 风日历浮层改为「起止两个日期胶囊 + 年 / 月 / 日三列滚轮」：点胶囊切换当前编辑端（选中端高亮）、滚轮停稳即回写该端并刷新胶囊文案、月年变化联动当月天数——日历是桌面端形态，小程序内的日期选择应与请假 / 代录请假的时间选择器、孩子出生日期选择一致走滚轮","新增两端同款 dr 区间组件（drInit / drBox / drFill / drScroll / drDays / drCommit / drSwitch / drCheck，实现逐行一致）；教师端此前无三列滚轮，补齐 dpFill / dpIdx / dpMark / dpVal 基础件与 .dp-wheel / .dp-col 样式，两端新增 .dr-row / .dr-pill / .dr-sep 胶囊样式","校验时机由「选定日期即时校验」改为「点确定时统一校验」（滚轮滑动过程中不报错）：未通过只弹提示、不写入筛选条件，半屏保持打开且滚轮当前值不变，可改期后再次确定；文案不变（开始日期不能晚于结束日期 / 最长不能超过180天）","「起止未填全」降为防御性兜底：滚轮从上次有效区间起步、滚动只会换成另一个合法日期，前端不存在清空动作，故该场景不可达（服务端接口仍需对起止必填做校验以防绕过），drCheck 内保留分支并加注释","drCommit / drDays 统一经 drReady() 判断三列已填充后才取值——此前仅判断元素存在，三列未填充时读 children 会抛错（DOM stub 用例覆盖）","两端移除 dtp.js 引用（已无 date 输入）；dtp.js 回退为原实现、仅修订文件头注释说明「清除」仅服务运管端可留空的区间筛选，运管端 admin-trade 日历不受影响","sc-eval / sc-evalrep 等演示说明与代码注释同步滚轮口径；PRD 飞书文档 10.3 同步形态、校验时机与场景表（删除不可达的空值行与取值恒同的处置列，收敛为场景 / 触发条件 / 提示文案三列）"]},

{"d":"2026-08-12 14:26:32","t":"原型更新提示升级：后台与切屏静默刷新、白底蓝字提示条，机制写入后台设计规范","p":["index.html","parent.html","teacher.html","badge-h5.html","admin.html","admin-trade.html","docs"],"i":["update-check.js 探测到新部署时按页面可见性分两种形态：页面在后台（切走浏览器标签页/最小化）直接静默刷新、不弹提示，切回即最新版；页面在前台才弹提示条，点击刷新、不打断进行中的演示","弹条后武装三类「无感时机」静默刷新兜底，旧版本最多只能「被盯着看」期间存活：① 切走浏览器标签页/最小化（visibilitychange）；② 原型内切屏——各端 go() 用 history.replaceState 改 hash、按规范不触发 hashchange，故对 replaceState/pushState 包一层，切屏动作本身即刷新信号，刷新落点由各页 hash 深链恢复到目标屏幕（含运管端订单详情 pushState 路径）；③ hashchange 兜底手改地址栏与前进后退","提示条视觉升级：深灰小字条改为白底蓝字胶囊（#1D4ED8、13px/600、圆角 22、淡蓝描边、currentColor 刷新图标），下滑回弹入场 .5s + 深藏青阴影呼吸脉冲 2.4s 循环——白底在移动端晴空蓝页头、深色边框、白色内容区上均保持对比，不再与背景融为一体","挂载定位按 .demo-fab 位置自动分三态：运管端 chip 在 .topbar 内 → 提示条挂进顶栏、top:50% + Y 轴 -50% 垂直居中（与演示说明 chip 同水平线、水平居中于内容区、随 sticky 顶栏常驻可视区，入场动画配 -50% 基准关键帧 ucDropC）；移动端 chip 挂手机容器 → top:10px 居中正好盖住 chip；无 chip 页面 → 视口顶部 fixed 居中","#update-bar 本地预览模式同步挂上全部静默刷新时机模拟：切标签页后刷新（hash 仍在、提示条复现以确认刷新），原型内切屏后刷新（hash 已变、提示条消失不复现）","机制写入 docs/admin-prototype-design-spec.md：「六、通用组件」新增「部署更新提示条」小节（ETag 组合指纹探测、两种形态、三类无感时机、样式参数、三态定位、预览方式），「八、新页面骨架模板」脚本清单补 update-check.js 引用防漏接"]},
{"d":"2026-08-12 11:21:16","t":"列表卡修改信息补无照片排除，办理记录按钮与操作条显示矩阵写入 PRD 6.6","p":["parent.html","docs"],"i":["列表卡「修改信息」按钮补 !noPhoto 排除：无需证件照形态的记录（校级配置免照片）无可改项，详情页此前已做排除而列表卡漏做——两处判定应同源；现有种子无「待审核 + 无需证件照」单、缺口未曾露出，属预防性补齐","办理记录按钮显示规则写入飞书 PRD 6.6：摘要行文案表之后新增「列表卡按钮 × 记录详情页底部操作条」双列矩阵（待支付 / 待审核 / 待修改信息 / 生产中 / 已寄出·已到校·部分启用 / 退款中 / 已完成 / 已取消 八行），并配判定规则段——记录详情恒有兜底；去支付只看应付金额（列表卡原地拉起收银台、取消办理不上卡）；修改信息限派生待审核 / 待修改信息且非无照片形态；取消办理止于待支付 / 待审核（家长自主取消限提交生产前）；确认收货限已寄出 / 已到校 / 部分启用开头且非整单退完在途（部分退款在途保留）；派生退款中的单取消 / 修改一并收起、仅剩记录详情；全部按展示层派生状态（非底层状态）判定","PRD 6.7 记录详情操作条句尾补矩阵交叉引用；6.6 首段「修改信息」入口句同步无照片排除；家长端办理记录 Tab 演示说明同步补列表卡侧排除说明"]},
{"d":"2026-08-12 11:10:06","t":"扫码作废附注合并定版：不区分全额/部分退款，徽面只按是否免费枚分叉两种形态","p":["parent.html","docs"],"i":["bdScanVoid 作废时间行附注由「全额退款，校徽作废停用」改为「退款作废停用」：全额/部分是退款单的订单侧类型标签、不是枚级事实，且在枚级不稳定——多次部分退款退完的单（partrfall）每枚都由「部分退款」单作废、整单终点却等同全额，附注标「部分退款」与整单已取消的观感矛盾、标「全额退款」与作废它的退款单事实不符，而「退款作废停用」任何时刻都成立（与 chip 派生「全额退款不再是独立形态、就是一次退完」同哲学：类型标签不下沉到枚级表面）","类型也不是「整单是否关闭」的可靠代理（全额退款到校后退完转已完成、多次部分退完即关单），「这单其他徽怎么样了」是订单问题、由「查看办理记录」承接，徽面附注不兼职回答；此前拟增的「部分退款，校徽作废停用」第三种附注随合并取消——缺口靠合并消掉而非增补","合并后的分叉规则收敛为按被扫的这一枚是否免费枚分两种：付费枚「退款作废停用」（退款进度引导办理记录，bdScanVoid）/ 免费枚「免费枚回收，校徽作废停用」（无退款金额、额度已在回收当时恢复，bdScanVoidFree，混合退中的免费枚同归零元形态——这枚没钱可等，等钱的是付费枚），呼应零元口径定版判词「回收作废是处置本质，退款只是它在有金额时的形态」——徽面表面只回答处置本质与家长要不要等钱","飞书 PRD 6.3 退款作废句补合并口径与按枚分叉规则；我的校徽 Tab 演示说明退款作废段同步（附注改词 + 合并理由 + 分叉规则）；统一扫一扫轻提示与零元变体文案本为类型无关，不动"]},
{"d":"2026-08-12 10:59:32","t":"扫码作废形态补零元变体：扫到被回收的免费校徽文案分叉、不带「退款」二字","p":["parent.html","docs"],"i":["新增「扫到被回收的免费校徽」演示（bdScanVoidFree，我的校徽 Tab 半屏 + 统一扫一扫页轻提示按钮）：与退款作废（bdScanVoid）同为「已作废不可用」口径——状态 chip「已作废」、不可核验启用、不可恢复、实体徽无需退回一致，但文案按零元定版口径分叉、不带「退款」二字：作废事实行为「免费枚回收，校徽作废停用」（与流转行节点名同词），说明段不引导查看退款进度——零元无资金动作，带「退款」会让家长等一笔不存在的钱——改为告知「免费办理无退款金额、无需等待退款到账」与「首张免费额度已在回收当时恢复」","额度句定为完成时「已在回收当时恢复」而非「已恢复」：额度恢复是回收时刻的事件事实（流转行与回收消息通知的告知锚点），此后可能已被再次办理占用——林晓乐的额度即被 4月10日 首免单重新占用，扫码是状态时刻、断言当前额度状态会与「首张免费额度已用」演示基准冲突，事件时刻表面与状态时刻表面的告知口径就此分开","演示数据关系：演示为假想的已发出后被回收免费枚 NO.0012——已发出才会被家长扫到；家长端零元归档单 SS2026031628470359 为未发出变体（回收行不附作废停用段、家长手中无实体徽扫不到），「查看办理记录」跳转以其示意，已发出变体的运管侧完整演示见运管端沈亦航单（两变体附注差异见记录详情页演示说明）","飞书 PRD 6.3 扫码结果族补零元变体句（口径与文案分叉理由完整入册）；两端演示说明同步：我的校徽 Tab 补零元变体段与直达入口，统一扫一扫页描述补两种作废形态分叉说明"]},
{"d":"2026-08-12 10:48:35","t":"确认收货完结通道整体挂起定版：整单退完在途单人工确认入口收起，新增扫到退款作废校徽演示","p":["parent.html","admin-trade.html","docs"],"i":["挂起约束由「仅满 7 天自动确认定时器」扩展为确认收货完结通道整体：整单退完且退款在途的单，人工确认入口同步收起（家长端 odCanRecv 补判定——列表卡与详情底部「确认收货」隐藏；此前已到校 / 部分启用整单退完在途的单 chip 不派生、按钮仍显示，家长一点即经人工路径转已完成，与定时器抢跑是同一语义问题：无货可确认、完结归因应是末笔退款到账）、定时器挂起（上轮已落）、启用推定因单内已无可核验枚而无从触发；已寄出整单退完在途因 chip 派生「退款中」天然无入口，收起补的是不派生 chip 的缺口；部分退款在途不收起——剩余枚真实要收货（partrfing 单），与「部分退款在途不冻结」同构","核验路径明确无需另设约束：被退枚发起退款即作废入黑名单、不再计入待核验（不等到账，退款在途同口径），整单退完的单内无可核验枚，「核验转部分启用 / 已完成」的守卫在枚级事实层天然不可达——三条完结路径至此口径齐备：核验封死于枚级作废、人工确认与自动确认收起 / 挂起于通道、完结统一由末笔退款到账驱动","新增「扫到退款作废校徽」交互演示：我的校徽 Tab 半屏形态（bdScanVoid，经演示说明入口进入）——NO.0007 为已寄出后运管全额退款的被退枚（SS2026052834705921），作废徽不出现在列表、但徽已发出家长手中可能仍有实体徽，扫码是家长侧唯一撞见它的入口；半屏展示「已作废」状态与作废时间（附全额退款作废停用事实）、无任何恢复操作——与「已停用可随时恢复」「毕业注销不可恢复」并列第三种停用口径，「查看办理记录」直达该退款单详情；统一扫一扫页新增同场景模拟按钮（轻提示口径），退款在途被退枚同口径（作废时点＝发起退款）、演示以已到账单为例","飞书 PRD 同步 5 处：6.7 冻结口径段挂起句扩展为通道整体（含入口收起 / 定时器挂起 / 推定无从触发与核验路径不可达说明）；6.7 记录详情操作条句确认收货入口补收起条件；6.7 运管端节点表家长确认收货行、16.8 确认收货行同步通道整体挂起；6.3 统一扫一扫扫码结果族补齐——原「四类结果」落后于原型，补入已停用 / 毕业注销 / 退款作废 / 无效二维码四形态，并勘正「不属于当前孩子」为账号维度比对口径（原型 2026-08 已改定、PRD 漏同步）","仓库 db-design-order-domain.md 同步 2 处：§3 冻结口径挂起句扩展为通道整体，receipt_confirm_type 字段行三种确认方式的挂起口径集中改写（manual 收起 / auto 挂起 / activated 无从触发）","两端演示说明同步：家长端我的校徽 Tab 补扫到退款作废校徽段（含第三种停用口径对照与枚级事实基础说明）、记录详情页挂起句扩展、统一扫一扫页补作废形态；运管端办理明细条目挂起段扩展（补家长端入口收起与核验路径封死说明）"]},
{"d":"2026-08-12 10:18:12","t":"自动确认定时器挂起论据勘正：「已完结记录不再追加流转行」仅限核验启用事件，退款在已完结单照落流转行","p":["admin-trade.html","parent.html","docs"],"i":["勘正上一轮冻结口径中定时器挂起的论据：原表述「否则定时器先触发转已完成，退款到账行会追加到已完结记录、与『已完结记录不再追加流转行』冲突」把该口径当成了全称规则——其既定范围仅限核验启用事件（无状态变更不落行，枚级启用事实由『我的校徽』/校徽明细侧承载），退款事件在已完结单上本来就要落「发起退款」「退款到账」行：运管端 canRefund 允许已完成单发起售后退款、rfmDo / applyRefundSuccess 不看主单状态一律插行，PRD 16.8 发起退款行的作废停用分类也明确含「已完成」的单；即使定时器先触发，退款到账行照落、完结判定因已是终态跳过，并不存在该冲突","挂起结论不变，理由修正为两条：①自动确认的语义前提不成立——整单退完在途的单内所有徽已/将作废、班主任不会发放，家长无货可收，定时器照跑会落下失实的「家长确认收货 · 到校满 7 天自动确认」审计行与「到校满 7 天自动确认收货，本次办理完成」附注；②完结归因错位——该类单按定版口径的完结触发事实是末笔退款到账（已完成行附注四种触发路径之一），定时器先触发会让同一业务事实因时序竞态产生两种流转记录形态，挂起消除分叉","修正落点 4 处：parent.js 记录详情演示说明、admin-trade.html rfAllPending 注释与办理明细演示说明、飞书 PRD 6.7 冻结口径段（db 设计文档与 PRD 16.8 上轮写法未引用错误论据，无需修订）；三处同时补「退款在已完结单照落流转行、与挂起口径无关」的范围澄清，上一轮 changelog 条目按提交对应原则保留原文不改"]},
{"d":"2026-08-12 10:09:48","t":"运管端新增免费单家长自主取消示例：袁思齐种子单与演示入口","p":["admin-trade.html"],"i":["办理明细补缺失场景种子：此前家长自主取消仅有陈梓睿已付款单（取消发起退款、到账才关单），免费单被家长自主取消无示例——纯免费单何雨珊停在待确认、另两条已取消单均为支付超时自动取消","新增袁思齐单 SS2026062470315826（滨江二小，¥0 首枚免费单免支付直落待确认，06-25 家长提交生产前自助取消）：无款可退、取消即刻生效关单，无退款链路、不产生退款单，取消类型记家长自主取消；「已取消」行附注按 PRD 16.8 已取消行家长自主取消场景落「家长自主取消（提交生产前）」（附注只落取消场景事实，无款可退口径由场景自明、不入附注——「无实付金额，无需退款」为运管代取消场景专属措辞），首枚免费额度同步释放（额度表事实、不落流转行）；提交办理行附注「首张免费，无需支付」与何雨珊单同口径","种子落终态历史区（2026-06 静态日期、默认窗外，与张芷晴 / 陈梓睿相邻按时间倒序插入），与陈梓睿已付款自主取消单构成免费 / 付费对照；不落运管操作日志（家长端自助动作、无运管操作人，与陈梓睿单同口径——该单仅退款回调落系统日志，免费单取消无回调故无日志）","演示说明同步：办理明细条目取消办理段补免费单家长自主取消口径（无退款链路 / 附注措辞 / 额度释放 / 免费付费对照），演示入口新增「免费单家长自主取消（已取消 · 袁思齐）」直达该单详情"]},
{"d":"2026-08-12 10:05:00","t":"整单退完退款在途主单流转冻结定版：已寄出签收不推进主单、自动确认定时器挂起，PRD 6.7/16.8 与 db 设计同步","p":["admin-trade.html","parent.html","docs"],"i":["口径定版动因：关单 / 完结判定在末笔退款到账时刻按主单当时状态评估，已寄出单全额退款在途期间若物流签收把主单推进到已到校，判定会被翻转——退款弹窗预告「到账后转已取消」实际却转已完成，家长端 chip 也会从「退款中」翻回「已到校」、最后以「已完成 · 本次办理完成」收尾（与「已取消办理」摘要语义矛盾）；真实竞态窗口只有已寄出 → 已到校：包裹已在途无法召回、签收回调必然到达，原路退回需 1–3 个工作日、退款转线下会拉长到数周，而发出前其余各态发起退款时履约同步停止、天然到不了已寄出","冻结口径：整单退完且退款在途（全部枚已被退款单覆盖、至少一笔未到账，含退款关闭转线下的长期在途）＝主单流转冻结——已寄出单物流签收只落物流单状态与轨迹、跳过对本主单的到校级联（同批次其他主单照常级联），到账仍按发出前门槛转已取消：发起时被退枚已作废入黑名单、徽即便签收到校也不会发放，本次办理终究未交付；已到校 / 部分启用单整单退完在途期间到校满 7 天自动确认定时器挂起（否则定时器先触发转已完成，到账行会追加到已完结记录、与「已完结记录不再追加流转行」冲突），完结统一由末笔退款到账驱动；部分退款在途不冻结——剩余枚仍要寄送 / 发放 / 核验，与「未退完不派生退款中 chip」同理","运管端落地：新增 rfAllPending 判定（全部枚被退款单覆盖且未全部到账）；详情确认收货字段新增挂起形态「未确认（整单退款完结中，自动确认挂起）」——沈亦航单发起退款勾选全部两枚后、模拟回调到账前即可见；RF_CANCEL_STS 与 applyRefundSuccess 注释补「按到账时刻评估之所以成立依赖冻结」的说明；办理明细与退款单页演示说明补完整口径","家长端同步：状态口径注释与 odRfAgg 门槛注释补冻结依据（「退款中」chip 与「已取消办理」摘要稳定不回翻）；办理记录 Tab 与记录详情页演示说明补口径（列表侧一句话点到、详情侧承载全文）","飞书 PRD 同步 7 处：6.7 取消与退款句插入冻结口径全文（定义 / 竞态窗口 / 两侧处置 / 部分退款例外）；6.7 家长端节点表已到校行、运管端节点表已到校行与家长确认收货行补冻结例外；16.8 已到校行补「跳过级联不落本行」、确认收货行补「定时器挂起不产生自动确认事件」；顺带勘正 6.7「状态筛选仍按底层状态」残留——筛选与 chip 同取派生口径此前已在原型定版、PRD 漏改","仓库 db-design-order-domain.md 同步 6 处：§3 核心立场补冻结口径，并勘正「已到校及之后退完只作废枚级、主单状态不动」与「筛选仍按底层状态」两处前轮口径残留；receipt_confirm_type 的 auto 枚举补定时器挂起；流转事件表 arrived 行、§9 到校级联要点与发货到校写路径补「整单退完在途的主单跳过级联」；退款回调要点完结分支改按定版口径表述（已到校 / 部分启用且无待启用未退枚→completed）并补冻结依赖说明；6.7 状态机画板无需改动——冻结是既有边上的守卫细化、不新增状态与边"]},
{"d":"2026-08-12 09:25:53","t":"级联停用作废并入退款到账行附注：高权限例外退款不再落独立流转行，PRD 16.8 同步","p":["admin-trade.html","docs"],"i":["applyRefundSuccess 中高权限例外退款（含已启用枚）原额外落一行「级联停用作废」（红色）——该节点不在 PRD 16.8 流转节点枚举与 db 设计 event_code 枚举中，与上一轮「免费额度释放」独立行同类；现并入「退款到账」行附注：行尾追加「· 高权限例外级联：已启用枚 {EPC 列表} 停用作废并入黑名单」，级联是本次到账的处置细节而非独立事件","红色色标随附注迁移到「退款到账」行（仅含级联段时），高危场景在时间线上的醒目强调保留；普通退款到账行色标不变","飞书 PRD 16.8 退款到账行同步两格：附注写入内容补「高权限例外含已启用枚时并注级联停用作废（不设独立节点）」；运管端示例补级联段格式与红色强调说明（家长端不透出级联段，被退枚失效经消息与校徽状态承接）","仓库 db-design-order-domain.md refund_succeeded 行同步：note 写入内容与示例补级联并注情形","演示说明同步：办理明细条目高权限段补「级联事实并入退款到账行附注、不落独立行」的口径说明"]},
{"d":"2026-08-11 19:00:15","t":"运管端流转行口径修正：移除免费额度释放独立节点，已取消/发起退款附注收敛，PRD 16.8 同步","p":["admin-trade.html","docs"],"i":["移除「免费额度释放」独立流转行（取消办理与零元退款成功级联两处写入）——PRD 16.8 流转节点枚举与 db 设计 event_code 均无此事件，db 设计明确「额度释放为额度表事实，不入 note」；额度释放本身仍随取消 / 退款即时生效（freeQuota 字段与弹窗、toast 提示不变），家长端权益告知由零元退款「免费枚回收」行附注「首张免费额度已恢复」承载","「已取消」行附注收敛为纯场景事实「运管代取消（无实付金额，无需退款）」：原行尾拼接的「操作人 xxx」与取消说明移除——PRD 16.8 附注两层规则「附注只存审计事实文案」，操作人由流转记录结构化字段（操作人类型 / 操作人编号）承载、取消说明由操作日志承载（17.2 取消办理模板本就含取消说明原文，原为同一内容重复落两处）","「发起退款」实时流转行按 PRD 16.8 写入规范重排：原「运管部分退款 ¥XX…· 操作人 xxx」与种子及 PRD 格式不一致（缺枚数与原因、多操作人），现统一为「部分退款 N 枚（原因），¥XX 将于 1–3 个工作日原路退回，退款单编号 RO-xxx」「全额退款（原因），…」、零元「零元退款单（免费枚回收作废，无退款金额），退款单编号 RO-xxx」；原因取弹窗必填的退款说明（PRD 明确原因入附注，与取消说明的归属不同），操作人同口径移除，高权限例外含已启用枚的提示保留","飞书 PRD 同步：16.8 已取消行「客服代取消」场景改写定版为「运管代取消」（第一阶段限无实付金额的 ¥0 单、取消即时关单；两端文案、操作人与取消说明不入附注、额度释放为额度表事实不落流转行）；6.7 家长端节点表与运管端节点表共三处「客服代取消」措辞统一为「运管代取消」（与 17.2 操作日志模板同词，家长端文案保留「经客服核实由平台代为取消办理」客服口吻）","仓库 db-design-order-domain.md cancelled 行同步：展示场景措辞统一「运管代取消」（与 cancel_scene 的 admin_cancel 一致）、补 note 只落场景事实与额度释放不落本表口径、示例补「运管代取消（无实付金额，无需退款）」","演示说明同步：办理明细条目取消办理段与退款弹窗段补本次附注口径修正说明（含修正前后形态对照）"]},
{"d":"2026-08-11 18:47:21","t":"零元回收消息通知定版：家长端消息列表与服务号卡新增，PRD 消息表同步","p":["parent.html","docs"],"i":["触达口径：零元回收生效时刻触达（零元退款单创建即生效、无退款到账事件——有金额退款的触达锚点是到账，零元的事实完备点即生效，与办理进度「免费枚回收」行同刻）；徽被作废与首张免费额度恢复属须触达的权益变动","服务号侧复用「校徽办理进度通知」模板而非退款结果通知——后者的退款金额 / 到账时间字段对零元不适用（填 ¥0.00 即摘要口径要避免的无信息量表述）；卡片字段：订单状态「免费校徽回收作废」（8 字）+ 进度说明「本次办理已关闭，首张免费额度已恢复」（17 字），受微信模板 20 字字段值约束、全文由落点详情页承载；进度说明按场景分两类，与流转行附注的作废停用 / 关单分类同构：已发出的单为「该枚已停用不可再用，免费额度已恢复」、未关单的单不说「本次办理已关闭」","消息列表新增演示条目「林晓乐免费校徽已回收」（3月19日，更早组、已读历史，类别归「校徽办理」）：摘要「免费校徽回收作废，本次办理已关闭，首张免费额度已恢复」（列表侧不受 20 字约束、承载全文），点击直达 2026-03 零元回收归档单 SS2026031628470359；服务号推送示意页同步新增对应模板卡（3月19日 14:30，按会话时序插入 3月2日 与 6月4日 之间），两侧一一对应计数 34→35 条","演示说明同步：消息页条目补免费校徽回收消息段（触达时机 / 模板选择 / 两类进度说明），服务号页条目更新计数与进度通知共用场景清单，记录详情页条目的「消息文案待定」标记销项","飞书 PRD 消息表「校徽办理进度通知」行同步：发送时机补零元回收生效场景（含复用本模板的理由），消息示例补场景④（含两类进度说明的分类规则与 20 字约束说明）"]},
{"d":"2026-08-11 18:37:38","t":"到校后退完口径修订：末笔退款到账即转已完成，运管端补退款完结级联，PRD/状态机同步","p":["parent.html","admin-trade.html","docs"],"i":["口径修订（随 6.7 状态机图更新定版）：已到校及之后退完全部枚原口径为「不关单、主单状态不变」——永久停在已到校的全退单会被在途统计与超窗提醒一直挂起；现改为末笔退款到账时若单内已无待启用的未退校徽即转「已完成」（已到校态即所有校徽均已退款，部分启用态即未退校徽全部启用、含高权限例外把已启用枚也退完的情形），与到校前退完转已取消构成对称边界：到校前退完＝未交付成、关单，到校后退完＝已交付、完结，退款属售后；「退款到账」与「已完成」同刻分开两行落，附注沿用退款到账触发完结口径「本次办理完成」","运管端 applyRefundSuccess 退款成功级联补完结分支（此前只实现门槛内关单，交互演示中沈亦航单两枚退完会停在已到校）：关单判定之后追加「已到校 / 部分启用且全部枚为已退款或已启用 → 转已完成、落已完成行」；可交互验证：沈亦航单发起退款勾选全部两枚、模拟渠道回调到账后整单转已完成（仅退免费枚的既有零元演示不受影响，退 1 剩 1 仍停已到校）；部分启用剩余全启用时退款到账完结（partrf 场景）的 runtime 同此分支覆盖","运管端详情确认收货字段的自动确认预告收敛显示条件：仅已到校 / 部分启用显示「未确认（到校满 7 天自动确认）」，终态单（如退款到账完结）定时器已无意义、只落「未确认」","两端说明文字同步去「主状态不变」：家长端 odRfAgg 门槛注释、演示说明退款口径①段与 partrfall 对照段，运管端演示说明退款段（补对称边界表述与沈亦航交互验证入口说明）","飞书 PRD 同步：6.7 取消与退款句改写（含对称边界与在途统计理由、自动确认定时器随终态失效）；16.8 已完成行与 6.7 家长端节点口径表已完成行的退款到账触发情形补完结守卫——并发现家长端节点表已完成行在确认收货定版轮被遗漏、本次一并补上确认收货触发两情形；16 章摘要口径段「主单状态不变」残留勘正；全文「状态不变」扫描无其他残留","上轮遗留的 6.7 状态机画板已由人工重绘更新，本轮核验通过：确认收货完结边、启用守卫改「未退校徽」、「到校满 7 天自动确认收货」措辞、完结边标签统一「家长确认收货」均已落图；「已到校→已完成」边的退款到账守卫按本口径标注「记录中所有校徽均已退款」；到校推定驱动补「同批次其他办理记录确认收货」并与文字同步（触发单自身直达部分启用 / 已完成、不经已到校，被级联的同批次其他记录转已到校，16.8 已到校行附注同步该口径）"]},
{"d":"2026-08-11 16:33:51","t":"家长端零元退款流转行口径定版：新增免费枚回收演示记录，PRD 16.8 同步","p":["parent.html","docs"],"i":["口径定版：家长端零元退款（纯免费枚回收）只落一行、节点名「免费枚回收」，不落「退款到账」行——有金额退款落两行是因为发起与到账之间有 1–3 个工作日资金在途区间、家长在等钱，零元单创建即生效、无钱可等，照套两行会出现「退款到账 · 无退款金额」的自相矛盾行；节点名不叫「退款」——回收作废是处置本质、退款只是它在有金额时的形态（运管端零元退款单既有定版口径），带「退款」会让家长等一笔不存在的钱","附注按校徽是否已发出分两类（与退款行作废停用分类同构）：已发出「免费枚回收 1 枚，该枚作废停用；免费办理无退款金额，首张免费额度已恢复」，未发出去掉作废停用段；「免费办理无退款金额」主动回答为什么没有钱，「首张免费额度已恢复」用家长端既有权益词汇「首张」（与支付半屏「首张校徽免费」同词）——额度恢复是权益变动，不告知则家长下次办理突然又能免费会显得莫名","边界口径：纯免费单在未发出状态被回收即满足「退完且校徽未发出」关单门槛，创建即生效、「免费枚回收」与「已取消」同刻分开两行落（无到账等待期，与免费单取消即时关单同构）；已发出后回收只作废枚级、主状态不变、不派生「退款中」（零元无在途资金）；混合退（含付费枚）金额大于 0 按正常退款口径落行、枚数含免费枚","新增演示记录 SS2026031628470359（林晓乐 2026-03 归档单，列表「已取消」态，经 sc-order 演示说明入口直达）：首张免费单生产中被平台回收关单——制作环节发现无法完成，与 SS2026051850613274 的付费单生产中全额退款关单构成免费 / 付费对照；未发出故附注不带作废停用（已发出变体经运管端沈亦航单交互演示）。摘要「已取消 · 免费枚已作废回收（1 枚）」与金额明细零元分组不出行两处派生逻辑（2026-08-09 定版）此前无种子覆盖，本单补上；既有 9 条退款记录派生结果逐条回归无变化","时间线设计（演示基准冲突的解法）：回收即释放首张免费额度、额度随后被 first 单（2026-04-10）重新占用——林晓乐「首张免费额度已用」演示基准不动，支付半屏免费抵扣与再办一枚演示不受影响；此前因该基准冲突搁置家长端零元演示记录，本次以归档时间线绕开","飞书 PRD 16.8 同步 7 处：发起退款行附注写入内容补零元标记；家长端显示节点名补「免费枚回收」分支；家长端示例补零元两变体与同刻关单规则；运管端示例补零元退款单文案；退款到账行家长端注明零元不落本行、运管端补零元附注示例；6.7 运管端节点表发起部分退款行家长端对应格同步","零元回收的消息通知文案仍为空白（徽被作废属须触达事实），随后续迭代定"]},
{"d":"2026-08-11 16:01:00","t":"运管端操作日志种子文案统一为实时写入模板，PRD 新增运管端承运商管理与操作日志章节","p":["admin-trade.html","docs"],"i":["操作日志种子明细统一为 addLog 实时写入模板口径：发起退款三条由「学生姓名（原因）」改为「学生姓名：原因」（与退款弹窗必填原因原文并入的实时拼装一致）；退款重试一条「前序流水受理失败」改「前序流水异常留痕」","渠道回调两条种子统一为标准模板「退款成功回调 · 退款单 {退款单编号} 置退款成功」：一条去掉模板外的「被退枚终态」附注；家长取消场景一条由叙述式文案改为标准形态（补退款单编号 RO2026062360915237），关单与免费额度释放叙事由办理记录流转行承载、不在日志复述","飞书 PRD 新增「17. 运管端承运商管理与操作日志」章节：17.1 承运商管理（carrier 字典定位与编码规则、启停即时生效只影响增量、新增承运商后续阶段口径、演示数据基准）；17.2 操作日志（审计定位与六列结构、写入来源与第一阶段四类展示、操作对象跳转、默认近 30 天有界时间筛选与搜索/操作人正交分工、导出留痕）","PRD 17.2 补「操作详情文案规则」：通用拼装约定（系统按类型模板一次成文、「 · 」分隔并列要素、「：」引出操作人必填说明原文、金额与枚编号格式、只记审计事实不含预期口径文案）与 11 类操作的详情模板对照表（含查看证件照 / 下载矢量文件第一阶段写入留痕暂不展示、系统写入类操作人记「系统」IP 记「—」）"]},
{"d":"2026-08-11 15:44:48","t":"确认收货完结通道定版：两端新增到校满 7 天自动确认演示记录，PRD 16.8/6.7 同步","p":["parent.html","admin-trade.html","docs"],"i":["口径定版（PRD 反转）：确认收货三种方式为 家长人工确认 / 到校起满 7 天未确认由系统自动确认 / 家长先扫码时由首枚启用推定确认（触发一次即止、7 天定时器随之终止）；人工确认与满 7 天自动确认即整单转已完成——「确认收货完结通道」，与全部枚扫码核验启用的核验完结互为补充，启用推定不触发完结（完结仍由核验事件承载）。飞书 PRD 6.7 原定「确认收货仅审计留痕、不参与状态机推进、家长端不透出」，与家长端原型既有「确认收货即整单转已完成」交互相反，按原型口径定版反转；措辞同步由「7 日」统一为「满 7 天」","「已完成」行附注四种触发路径齐备（16.8 映射表定版）：附注承载「触发事实 + 完结语义」，触发事实要么并入本行、要么由紧邻行承载，不空置也不重复——核验触发附启用编号（末枚启用事件并入本行）；家长手动确认，家长端并入本行附「家长确认收货，本次办理完成」、运管端同时刻先落「家长确认收货」行（附确认方式）而本行仅「本次办理完成」；到校满 7 天自动确认同构，家长端附「到校满 7 天自动确认收货，本次办理完成」——家长零操作被动完结，没有附注会让家长困惑完成从何而来；退款到账触发仅「本次办理完成」（触发事实由紧邻「退款到账」行承载）","家长端新增演示记录 SS2026061847291836（单枚付费单，列表「已完成」态，经 sc-order 演示说明入口直达）：已到校后既未扫码核验、也未确认收货，到校满 7 天系统自动确认、整单转已完成；该单校徽仍为待核验、后续正常经「我的校徽」扫码核验启用，核验不回写本记录（已完结记录不再追加流转行），不关联已启用徽、徽面缩略保持 NO.待分配（简号在核验启用时绑定）。arrived 演示记录到校时间 07-01→07-03（以演示锚点 07-08 计收进 7 天自动确认窗口）","运管端新增演示种子蒋一帆单 SS2026071952318064（自动确认完结，经办理明细演示说明入口直达）：与杜俊熙单同批次寄校、到校动态日期恰为 7 天前，自动确认落在今日；配套支付单 PM2026071938406125。枚状态新增「待核验」形态（琥珀 tag）——主单已完结但该枚从未核验启用，标「随主单推进」会被读作随主单已完成；退款判定按未启用枚口径（可退、不需高权限）。详情确认收货字段预告文案由「到校 7 日后自动确认」统一为「未确认（到校满 7 天自动确认）」","运管端既有含「家长确认收货」行的四条种子按新口径修正——原种子人工确认均落在核验完结之前，新口径下人工确认当刻即会完结、与其后的核验触发完结矛盾：杜俊熙单改为人工确认完结示例（确认当刻转已完成、附注仅「本次办理完成」，3 分钟后的扫码核验仅枚级启用，vAt 落校徽明细、不落主单流转行）；周雨萱 / 罗一鸣 / 林晓乐三单确认方式改「扫码核验启用推定」（确认时间取首枚启用时刻，罗一鸣单因推定不触发完结保持部分启用）。三种确认方式与两条完结路径至此均有种子覆盖","沈亦航零元退款种子改单独物流单补寄（LG2026080511230084，新增物流轨迹种子）、到校收进 7 天窗口：原与周雨萱共用物流单、到校已超 7 天，新口径下早该自动确认完结，确认收货字段「未确认」预告与到校时间就此自洽","飞书 PRD 同步定版共 12 处：16.8 确认收货行（附注写入内容 / 家长端显示 / 示例）与已完成行示例补确认收货触发情形；6.7 运管端节点表家长确认收货行三格；6.7 交付口径叙述句（完结通道 + 未核验枚保持待核验 + 两端落行方式）；6.7 状态机主流程句补确认收货完结；6.7 记录详情页操作条句补确认收货入口（已寄出 / 已到校 / 部分启用提供）；数据实体表物流单行「确认收货级联整批订单」勘正为「签收到校级联整批主单，确认收货为家长逐单动作」；16 章办理记录信息确认收货类型枚举补启用推定","已知遗留：6.7 状态机画板未改（「已寄出→已到校」边标注仍为更早期口径「确认收货/自动确认收货」、应为物流签收驱动，且缺「确认收货→已完成」完结边）——画板为整板覆盖写入、有损坏手绘布局风险，留待人工确认后再改；家长端静态历史种子 SS2026051436092817 到校超 7 天未确认未完结，沿用静态种子模糊时间锚（与其「退款在途超 1–3 个工作日预期」同类，不逐单校验）","两端演示说明同步：家长端 sc-order 补自动确认口径、四路径附注对照与推定机制说明并新增直达入口；运管端办理明细条目补三种确认方式、完结通道、种子修正说明并新增直达入口"]},

{"d":"2026-08-10 08:48:27","t":"教师端新增评价报告模块：选择学生、学生周期报告与下载列表，与家长端评价报告同构","p":["teacher.html"],"i":["素质评价功能条「评价报告」由演示占位 toast 实装为三页流程：选择学生（sc-evalstu）→ 学生评价报告（sc-evalrep）→ 下载评价报告（sc-evaldl），报告与下载两页和家长端同构（同一报告两侧视图：家长看自家孩子、教师可看任教班任一学生）","选择学生页：姓名搜索 + 按任教班级折叠分组（组头点击收起 / 展开）+ 学生名三列网格（名单与表现点评 EP_STUS 同源，演示仅列部分学生）；参考稿的全校单班大名单形态在教师权限内收敛为任教班级分组（教师只看得到任教班级，多班时分组比长列表更快定位）；点学生名进入该生评价报告","评价报告页：顶部学生信息卡（头像 / 学号 / 性别 / 评价周期，学号为演示编号、林晓乐与家长端一致，报告内班级按入学届别 2023级 命名口径与导出文件名一致）+ 周期按钮 + 导出报告；学生卡点击弹「选择学生」半屏（按班分组 fchip，点选即切换、免回列表页，头像 / 学号 / 性别 / 亮点文案姓名联动）；周期时间筛选与家长端 evr* 同构（本月 / 上个月 / 本学期 / 上学期 / 自定义 180 天上限，dtp.js 日历）；四分区（点评分布双环图 + 发展亮点、点评趋势折线、点评统计表、点评明细折叠）自家长端移植，统计为演示定格值（与家长端同一套数）——切换学生 / 周期仅更新头部与导出文件名、不重算数据，真实产品按学生 × 周期重新生成","下载评价报告页：与家长端同构（生成中 / 已生成两组、30 天自动删除提示、导出约 2.5 秒转已生成、演示含一条生成失败记录）；导出文件按当前学生 × 周期命名；真实下载演示副本仅林晓乐提供（assets/reports/ 与家长端共用），其他学生条目点下载为 toast 说明","演示说明新增 sc-evalstu / sc-evalrep / sc-evaldl 三条目、sc-eval 同步口径并新增「进入评价报告（选择学生）」入口；teacher.css 新增选择学生分组网格（es-*）与报告分区 / 双环图 / 图例 / 统计表 / 明细折叠 / 下载浮钮（rep-* / repd*）样式；esRender 初始渲染因依赖 EP_STUS（const 暂时性死区）置于表现点评段末尾执行"]},
{"d":"2026-08-10 08:38:17","t":"教师端新增表现排行榜页：班级榜单按星星数排名，时间与筛选同素质评价口径","p":["teacher.html"],"i":["素质评价功能条「表现排行」由演示占位 toast 实装为整页表现排行榜（sc-rank）：金色荣誉 hero（排行榜标题 + 奖牌插画，配色沿用该入口图标的琥珀金而非参考稿绿色，与教师端视觉体系一致）+ 白卡筛选条（班级 / 时间 / 筛选三入口）+ 班级榜单；参考稿的小红花计数在本系统对应星星——榜单按星星数（表扬 − 待改进星星合计）降序，前三名金 / 银 / 铜牌徽标、其余灰色序号，行内展示头像、表扬 / 待改进次数（与表现点评网格本周计数同源，RK_STUS 演示数据）与星星合计","班级筛选收敛为任教班级平铺单选（与表现点评同口径；排行在班级内才有可比性，不设「全部班级」）；时间筛选与素质评价 tevt* 同构（快捷周期 今日/昨日/本周/上周/本月/上个月/本学期/上学期 + 自定义区间最长 180 天、dtp.js 日历、非法输入 toast 拦截回退），默认本周","筛选面板为点评老师（全部/我的点评）× 点评类型（全部/表扬/待改进）× 指标维度（全部/五维）三组 chip（较点评记录筛选少「点评对象」——榜单只排学生），点选即生效、面板不关闭、底部重置/确定、非默认条件时入口高亮加点标；点评类型筛为表扬 / 待改进时榜单分别改按对应次数降序，待改进榜不发奖牌徽标、仅序号（避免给待改进最多的学生颁奖的语义错位）","计数为演示定格值：时间 / 点评老师 / 指标维度切换不重算（真实产品随条件联动重新统计）；行点击进入学生表现详情属后续阶段（toast 占位）；演示说明新增 sc-rank 条目、sc-eval 条目同步口径并新增「进入表现排行」快捷入口；teacher.css 新增 rank-hero / rank-bar / rk-row / rk-medal 等样式"]},
{"d":"2026-08-10 06:41:06","t":"教师端素质评价整页升级：五维筛选与点评详情、表现点评整页流程与图文点评、跨校校长身份","p":["teacher.html"],"i":["素质评价页（sc-eval）由「德育评价」升格为「素质评价」教师视图：点评记录新增智育 / 体育与小组点评示例共 3 条（记录卡带类型 / 维度 / 班级 / 老师 / 对象 / 日期 data 属性），积分商城 / 积分统计入口按第一阶段口径隐藏（display:none + 注释保留恢复方式）；记录卡点击进点评详情，右下浮钮与「表现点评」入口改进整页表现点评页（原快捷半屏 evalSheet 保留为演示说明「旧版」入口）","素质评价三处筛选实装（原占位 toast）：①「选择班级」半屏——不采用参考稿年级折叠树 + 确定的全校形态，教师权限内收敛为「全部班级 + 任教班级平铺」点选即生效、班主任 / 科任身份随行标注；校长视角按年级分组形态属后续阶段，演示说明提供「预览 · 校长视角选择班级」（复用教师注册页左年级栏 + 右班级组件、多选改单选并置顶全部班级）；②「时间筛选」半屏——快捷周期（今日/昨日/本周/上周/本月/上个月/本学期/上学期，学期按 2月1日 / 8月1日 衔接分割）+ 自定义区间（接入 dtp.js antd 风日历，最长 180 天、起止必填、非法输入 toast 回退），与家长端同口径，teacher.html 引入 dtp.js；③点评记录「筛选」半屏——点评对象（全部/学生/小组）× 点评老师（全部/我的点评）× 点评类型（全部/表扬/待改进）× 指标维度（全部/德智体美劳五维）四组 chip，点选即生效、面板不关闭、底部重置/确定，非默认条件时入口高亮加点标；班级 / 时间 / 面板与搜索四路条件交集过滤，命中为空显示空态；顶部统计为演示定格值不随筛选重算","表现点评页（sc-evalpick）：姓名搜索 + 班级 / 统计周期 / 点评范围三筛选；学生 Tab 三列网格卡（头像 + 👍 表扬 / 🙁 待改进本周计数，点评后实时累加，排序可切首字母 / 星星），点卡打开点评面板、点 👍 / 🙁 计数分别定位表扬 / 待改进 Tab；底部「点评多人 / 点评多组」弹多选半屏（勾选圈 + 搜索 + 全选 + 实时已选计数）；点评面板半屏：计次说明 ⓘ + 关键字搜索 + 表扬 / 待改进 Tab + 我常用筛选 + 左侧五维栏 + 项目列表，本次上线二级指标——项目按二级指标分组展示、顶部二级指标 chip 单选过滤、未分组条目沉底；单击项目即提交，「多项点评」转多选模式（分值框可改 1–9 星、底部实时合计、一次提交全部勾选项）；提交后逐目标 × 逐项目生成记录并置顶素质评价页、统计联动","小组点评与小组管理：小组 Tab 按分组方案展示小组卡（图标 + 组员名单 + 计数）与「新建小组」入口，「选择分组方案」半屏支持单选切换与添加新方案（重命名 / 删除为后续阶段占位）；小组点评组内成员各记同额星星、按人数计人次；小组信息页（sc-grpinfo）：预设图标半屏、组名最长 6 字、「选择本组学生」半屏仅列当前方案未分组学生（同一方案内一名学生只能属一个小组），保存校验非空后加入当前方案","图文点评页（sc-evalpub）：评语 500 字 + 常用评语半屏（点条目插入、逐条编辑 / 删除、添加 50 字上限）+ 点评项目可选（「添加点评项」半屏与点评面板同构、radio 单选、分值可改）+ 图片网格上传（演示模拟、最多 9 张，与家长端反馈 / 请假证明同构）；带项目发送计星星落记录卡，评语与图片随记录展示——记录卡与点评详情新增「老师评语」行与图片缩略图，点击全屏预览（img-view）；不带项目仅发送评语与图片不落记录；评语 / 项目 / 图片至少其一才可发送","点评详情页（sc-tevdt，记录卡点击进入）：上方学生 / 小组信息、类型与星星变化、维度 / 项目 / 老师 / 时间（小组另列点评组员行），下方表扬 / 待改进名单按成员平铺卡片（成员星星变化 + 家人读态，任一家人已读即记已读）；点成员卡弹半屏列该生各家人读态与公众号关注状态（未关注收不到服务号即时推送，帮助老师判断触达；与家长端点评详情「已读动态」互为两侧视图）","同号跨校多身份：首页身份切换面板与「我的-账号切换」页新增红旗小学校长身份行（同一手机号可在多所学校分别登记教职身份、数据按学校隔离），选择为演示 toast（校长视角首页属后续阶段，统计形态可在校园签到页以校长身份预览）","交互基建：遮罩点空白处关闭半屏（多层面板需要显式关闭出路，sheet 内点击不冒泡）；新增图片全屏预览层 img-view；teacher.css 新增表现点评网格卡 / 点评面板维度栏 / 分值框 / 底部操作条 / 图片缩略图与上传网格等样式；演示说明新增 sc-evalpick / sc-evalpub / sc-grpinfo / sc-tevdt 四条目并同步 sc-home / sc-eval / sc-switch 口径"]},
{"d":"2026-08-10 02:48:00","t":"家长端素质评价整页升级：五维点评与筛选、点评详情、时间筛选、评价报告与导出下载","p":["parent.html"],"i":["页面由「德育评价」升格为「素质评价」（页头 / 演示说明同步）：点评记录新增智育 / 体育 / 美育 / 劳育各一条表扬 + 一条待改进共 8 条（含维度 / 项目 / 老师 / 时间，教师端演示数据尚未同步四个新维度、以本页为准），头部统计调整为自洽口径——星星总数 12 = 加分 18 − 扣分 6、点评次数 16（含 5 条未上列表的历史点评，与评价报告统计表逐项可对账）；头部「可用积分」行按第一阶段口径隐藏（积分明细与兑换属后续阶段，display:none + 注释保留恢复方式）","点评记录「筛选」半屏面板（原筛选占位 toast 实装）：点评类型（全部/表扬/待改进）× 指标维度（全部/德智体美劳五维）两组 chip，与消息页筛选同构——点选即生效、面板不关闭、底部重置/确定，存在非默认条件时入口高亮加点标；与点评搜索（占位文案由「点评老师搜索」改「点评搜索」，关键词可命中点评老师 / 点评项目）为交集过滤，命中为空显示空态；各维度二级指标筛选属后续阶段","时间筛选：头部周期按钮（原统计周期 toast 实装，默认本月）弹「时间筛选」半屏——当前选择日期行 + 快捷周期 chip（今日/昨日/本周/上周/本月/上个月/本学期/上学期）+ 自定义日期区间（接入 dtp.js antd 风日历、与运管端同款，parent.html 引入该脚本），点选即生效、与搜索 / 筛选交集过滤，记录卡带 data-d 日期参与匹配；学期取衔接口径——以每年 2月1日 / 8月1日 为分割点，假期归入相邻学期、任何日期都落在某个学期内（本学期 2026-02-01～07-31、上学期 2025-08-01～2026-01-31，初版校历口径的 15 天寒假空档随之消除）；自定义区间最长 180 天、开始不得晚于结束、起止必填，非法输入 toast 拦截并回退上次有效区间——原「两端清空 = 不限时间」口径评审中废止（不限时间即超过 180 天上限、与上限自相矛盾），日历「清除」清空后按起止必填回退","点评详情页（sc-evaldt，记录卡点击进入）：孩子信息、类型 chip 与星星变化、维度 / 项目 / 老师 / 时间按所点卡片就地填充（不另存数据、增删记录自动适配）；「已读动态」展示该条点评被哪些家人查看过及时间——已读状态按家长账号独立、打开详情即记为已读（演示：当前账号乐乐妈妈均已读，今天的点评乐乐爸爸尚未查看不落行、历史点评两位家人均已读，时间为按点评时间推算的演示值）","评价报告页（sc-evalrep，功能条「评价报告」实装进入）：顶部学生信息卡（学号 / 性别 / 评价周期）+ 周期按钮 + 导出报告；四分区——①点评分布：CSS conic 双环图（外环五维加分占比 + 图例，内环表扬/待改进占比）+ 发展亮点维度分析（按加分取前二）；②点评趋势：SVG 折线（2–7月按月累计点评次数，五维同色系图例）；③点评统计：五维 次数/加分/扣分 表格与合计（16 / +18 / −6，与素质评价页头部同源）；④点评明细：按维度折叠分组（组头 维度（次数）+ 星星净值，展开列该维记录）、右上星星总数 +12；周期按钮弹时间筛选（本月/上个月/本学期/上学期/自定义，同 180 天口径），报告数据为演示定格值、切周期仅更新周期显示与导出文件名（真实产品按周期重新生成）；右下「下载」浮钮进下载页","下载评价报告页（sc-evaldl）：顶部 30 天自动删除提示条；生成中 / 已生成两组（组头数量 + 清空），条目 = W 图标 + 文件名 + 大小 + 时间戳，演示含一条生成失败记录；「导出报告」按当前周期命名的 Word 入队生成中、约 2.5 秒后转入已生成并 toast（演示节奏）；「下载」触发浏览器真实下载——assets/reports/ 按 5 个可能条目文件名各存一份演示报告副本（内容为同一份用户提供的学生报告 docx）、链接直指对应文件，不依赖 a.download 重命名（file:// 打开原型时本地文件互为跨源、download 属性被忽略回落资源名，实测踩坑后改此方案）","演示说明新增 sc-evaldt / sc-evalrep / sc-evaldl 三条目并扩充 sc-eval 条目（筛选 / 时间筛选 / 详情 / 报告口径与快捷入口共 7 个演示按钮）；parent.css 新增筛选入口高亮、评价报告分区 / 双环图 / 统计表 / 明细折叠 / 下载浮钮样式"]},
{"d":"2026-08-10 01:17:00","t":"素质评价入口默认开启、教师端首页样式对齐家长端并去消息角标、师长身份切换改跳本地教师端原型","p":["parent.html","teacher.html"],"i":["素质评价入口默认开启：两端 evalOn() 由「proto-eval==='on' 才显示」改为「非 'off' 即显示」——未设置过开关的访客默认可见，手动关闭过的仍按 localStorage 记忆保持关闭；proto-eval 为两端共享键，只改单端会导致同一键值在家长端与教师端显隐相反，故一并调整；两端首页与素质评价页演示说明、HTML 注释同步「默认显示、可由开关隐藏」；家长端毕业/离校归档态首页仍按 CSS !important 强制隐藏该入口，不受默认值影响","教师端首页样式对齐家长端：头部由纯蓝渐变改为蓝天白云背景图（sky-clouds.jpg），头像加大至 56px 带白描边、姓名 18.5px（「班主任」身份 chip 保留琥珀色以区分角色，仅对齐尺寸）；活动横幅改用盾牌头图（banner-badge.jpg）左对齐文案结构（补 bn-txt 包裹层），底部按钮由朱红改为家长端同款蓝渐变并加「›」后缀；宫格由 4 列 44px 图标改为 3 列 50px 大图标，智能校徽 / 校园签到 / 智慧放学 / 请假四个共享入口换用家长端同款 PNG 图标，学生管理 / 老师管理（教师端独有）保持渐变风格仅放大；提醒条图标换家长端同款铃铛、按钮加「›」；底部 Tab 文字与图标尺寸对齐（11.5px）","教师端状态栏图标统一：全站 28 处「●●● 〸 ▮▮▮」字符占位替换为家长端同款信号 / Wi-Fi / 电池 SVG 图标（时间保留教师端演示时点 9:41，属演示数据非样式）","教师端消息 Tab 去除未读数字角标：四处底部 Tab 栏的 tbadge 节点与对应 CSS 删除，与家长端同口径（即时提醒走微信服务号推送、消息页仅供回看历史，避免角标打扰）；未读联动保留在消息列表红点、「我的」入口与待办工作台（预览页）铃铛角标，updateMsgCnt 逻辑不变；教师端首页演示说明同步该口径","家长端师长身份切换改跳本地教师端原型：首页身份切换面板与「我的-账号切换」页共用的 idToTeacher()、及已废弃保留的「切换为教师身份」确认半屏模板，均由 Mockplus 外链改为当页跳转 teacher.html（与教师端切回家长身份 location.href='parent.html' 同口径，模拟同一小程序内身份切换）；首页与账号切换页演示说明、相关注释同步；admin-trade.html 菜单内 Mockplus 链接属运管端另一套原型外链，不在本次范围"]},
{"d":"2026-08-10 00:50:13","t":"家长端办理记录筛选改与卡片状态同口径：点「待审核」不再出现退款中的单","p":["parent.html"],"i":["问题：列表卡状态 chip 为 odChip 派生口径（已取消办理且退款未到账的单显示「退款中」），状态筛选却按底层订单状态（data-st 取记录原 chip 字段）——点「待审核」会筛出两条 chip 为「退款中」、摘要为「已取消办理」的单，家长不知底层状态，筛选分类与卡上标签对不上，还会误读为取消未生效","apOrderCard 的 data-st 改取 odChip 派生文案，与卡片 chip 同口径：退款中的单不再归入「待审核」，也不落「已取消」（退款到账关单后才归入），仅「全部」可见","「退款中」仍不单设筛选 chip：瞬态、单账号同时至多一两条，按时间倒序在「全部」顶部即可见，不值得常驻一个绝大多数时间为空态的筛选项","apNewStRender 移除第三参数 base（原用于新单取消后 data-st 写底层「待审核」），新订单卡 data-st 统一写展示文案，与列表卡同口径","确认 rfclosed（退款关闭转线下）单 chip 停留「退款中」为正确口径不随本次调整：退款关闭是退款单终态（原路退回这条路走死了），不是退款事项终态——钱未退到不关单、客服线下继续退，异常细节由卡片摘要与流转「退款关闭」行承载（PRD 16.8）","同步更新状态口径头注、odChip/odApplyFilter/OD_STATES 等六处代码注释，及办理记录 Tab 与记录详情页两处演示说明的筛选口径（均标注本次迭代改定缘由）"]},
{"d":"2026-08-09 22:56:00","t":"飞书 PRD 6.7 与 16 章免费额度小节已同步：三次迭代的累积口径一次补齐","p":["docs"],"i":["经 lark-cli 直接写入飞书《智小徽 · 家长小程序 PRD》（文档 BquNd3mrqoZZ38x5KWuchR64nhu，版本 516 → 519）。此前日志中三处「PRD 待同步（飞书，本次未改）」本次一并落地——读原文时才发现 6.7 至今仍是 2026-08-08 定版前的旧口径","6.7 第 3 条「取消与退款」整块改写（block_replace，892 字 → 1713 字）：① 已付款单取消由「即时转已取消、退款异步原路退回」改为「取消动作只发起退款、退款到账才关单」，原表述会导致「已取消但钱没到」的悬挂终态且无回退路径；② 去掉「运管可在校徽到校前操作退款」的到校前限定——到校后同样可退，只是不关单；③ 关单判定补两条件（退完＝全部有效行已退，按商品行事实、跨批次累计；且校徽尚未发出）；④ 新增同一主单可多次退款、零元退款单、免费额度锚定枚释放、已到校后退完不关单的处置与两端展示","16 章「免费额度占用记录信息」表格改两行（各自 block_replace）：「办理记录编号」说明补额度按枚占用；「释放时间」由「订单取消时释放」改为「占用额度的那一枚终态时释放」，与 db-design-order-domain.md 第 8 章一致","写入安全措施：写前 dry-run 校验请求体并确认 revision 未变；6.7 那条是单个 li 块、整块替换，其中与本次无关的「交付口径」段（358 字）从原文机械截取拼接、未手抄；写后逐字比对线上与本地内容一致，并校验旧口径已清除、9 项新口径全部命中、列表 1/2/3 结构完整。注意 block_replace 会使旧 id 失效：6.7 第 3 条 id 由 doxcnhxAidOhdSXhHSU6eCYNjTh 变为 doxcnf3CLjRRkN7VRxCn39fSe4f，若此前有人用旧 id 做过 block 直达链接会失效；需回滚可用 lark-cli docs +history-revert 回到 516"]},
{"d":"2026-08-09 22:55:28","t":"设计文档退款口径统一：消解三处矛盾表述，解除关单对退款单类型标签的耦合","p":["docs"],"i":["db-design-order-domain.md 内部三处口径不一致：核心立场第 1 条与第 3 章要点行写「全部有效行退款成功 → 主单转 cancelled」无状态门槛，第 9 章退款回调事务写「且主单处于校徽发出前四态」有门槛——同一份文档两套写法。现统一为有门槛，与两端原型实现一致","解除关单判定对退款单类型标签的耦合：退款回调事务原写「全额退款单全部有效行已退」，「全额退款单」是 initiator / type 标签（单次覆盖全部未退枚时才标全额），据此实现会漏掉「多次部分退款累计退完」——末笔若未被标为全额则不触发关单。现改为按商品行事实判定（全部有效行已退即命中，跨批次累计，由末笔到账触发），标签仅用于 cancel_scene 归因分流。该耦合在当前运管端实现里恰好不出问题（rfmType 会把覆盖剩余全部未退枚的那笔标成运管全额），但依赖巧合，写进文档就会被下一个实现者踩到","第 8 章免费额度重写释放口径：released_at 由「订单取消时」改为「占用它的那一行终态时」，补三个落地位置（无款可退的取消事务、退款成功回调、关单事务幂等兜底）与原口径的问题说明；第 9 章新增「零元退款单」事务分支（不创建 refund_transaction、不改支付单渠道交易状态、创建即 refunded 并执行级联，建议加 is_zero 标记供财务台账过滤），退款回调前置额度释放（与是否关单无关）","design.md 订单状态机段修正两处并补两句：① 原「运管可在校徽到校前操作部分或全部退款」不准确——到校后同样可退（已启用枚默认不可退、高权限例外），只是不关单；② 原「全部商品退款成功转已取消」补齐状态门槛与跨批次累计口径，并补已到校及之后退完只作废枚级、主单状态不变的处置；③ 补零元退款单与免费额度锚点两句"]},
{"d":"2026-08-09 22:54:49","t":"运管端放开零元退款单、补关单预告：免费枚可单独回收作废","p":["admin-trade.html"],"i":["核对结论修正：运管端关单判定 o.items.every(已退款) 本就是跨批次累计的，分两次把枚退完会在末笔到账时关单——此前认为「两端会打架」不成立，那是 rfmType() 的退款单类型标注（决定 type 字段显示运管全额 / 运管部分），不参与关单。真正的差异是状态门槛，且缺的是家长端（已同步补齐）","放开零元退款单（仅勾免费枚提交）：原 rfmCalc 在无可退金额时禁用提交并提示「请同时勾选付费枚」，导致「2 枚单里免费那枚有瑕疵」只能连付费枚一起退——把好的那枚也退掉。逆向处置一枚徽的本质是回收作废，退款只是它在有金额时的形态，金额为 0 不改变处置本身，故复用整条链路（枚作废入黑名单 → 免费额度释放 → 两端流转行），只是资金部分为空","零元退款单的执行差异：不创建退款流水（渠道不受理 0 元退款）、不改支付单渠道交易状态（不转「转入退款」），退款单创建即置退款成功并立即级联，无「退款中」中间态；退款单台账金额列加「零元回收」tag——¥0.00 在财务视角是噪音，标记说明其为无资金动作的逆向处置、不进资金流水","免费额度释放锚点由「整单关闭时」改为「占用它的那一枚终态时」：被退枚含免费枚即释放并落流转行。原口径与占用锚点粒度不一致——badge_free_quota.order_item_id 指向的是商品行，释放却按整单；已到校后免费枚被退的单不关单（在关单门槛外），额度会一直挂着：那枚免费徽已作废停用入黑名单、学生手上没有它，平台既收回了徽又扣着权益。付费枚被退不影响额度","抽出 applyRefundSuccess(r,t,zero) 承载退款成功后的级联（枚置已退款、级联停用作废、免费额度释放、关单判定），由渠道回调与零元退款两条路径共用，避免两处各写一遍关单与作废逻辑","补关单预告（rfmCalc 汇总区常驻）：本次勾选覆盖全部未退枚且校徽尚未发出时，就地提示「本次覆盖全部未退校徽：全部退款到账后，办理记录将转已取消」。此前该提示只写在「含已启用枚」的高危二次确认里，而已启用枚意味着单子已到校及之后、恰好不在关单门槛内——那句提示实际永不显示，真正会关单的普通退款（发出前）直接提交、操作人在提交前看不到关单后果。按既有立场（普通退款不加二次确认、避免确认疲劳）由汇总区承载而非新增弹窗。种子扫描：17 条主单中 7 条发出前的单会显示预告，已到校及之后的 10 条不显示","新增演示种子 SS2026072265913047（市实验一小 · 沈亦航 · 2 枚：首枚免费 + 增办 1 枚付费，实付 ¥15.00，已到校待发放，与周雨萱单同校同批次寄校 B2607-SY01-001 / LG2026072300056）与配套支付单 PM2026072281046532；演示说明新增入口「零元退款：仅退免费枚（勾第 1 枚提交）」——提交后该枚作废、额度释放、主单保持已到校（已到校在关单门槛外，且仍有 1 枚付费枚未退）"]},
{"d":"2026-08-09 22:53:54","t":"家长端退款展示改由退款单列表派生：多次部分退款按聚合口径收敛","p":["parent.html"],"i":["起因：全额退款在途派生「退款中」chip、部分退款不派生，看着割裂。结论是两者应当不同——chip 只回答「这单当前最主要在等什么」：全额退款后主流程已终止、退款是唯一在跑的事；部分退款时剩余枚仍要生产 / 寄送 / 核验，改成「退款中」会被读作整单停办。但确实缺一块：部分退款在途期间列表层没有任何「有笔钱在退」的信号，而全额退款有——同样是钱在路上，一条链路说了另一条没说","记录新增 refunds 字段（退款单列表 [{n:枚数, amt:金额, done:是否到账, closed:是否退款关闭转线下}]），摘要 / 状态 chip / 金额明细三处由 odRfAgg / odChip / odRfMeta / odRfRows 派生，7 条既有退款记录的写死文案（meta / refund / st 字段）全部移除。一笔办理可多次退款（运管端存在可退枚即可再次发起、退款关闭后客服也可对本单重发），写死文案既盖不住多笔，也容易把摘要拼成「¥15.00（1 枚）原路退回中 · 已退款 ¥15.00（1 枚）」这类并列串","摘要聚合「在途优先、只报一段」：有在途时只说在途那笔（家长此刻唯一在等的钱），全部到账后转累计已退，两态互斥、永不并列；因退款关单的单不报枚数、前半段为「已取消办理 / 已取消」，否则报枚数、前半段为「实付：¥XX」。金额明细按到账与否聚合成最多两行（已退款 / 退款中），不逐笔列退款单——逐笔溯源由流转行承载（每笔各落「部分退款」+「退款到账」两行），两处都列是冗余；行内「全额」按该行自身是否覆盖整单判定，不按整单是否退完（多次退款的中间态两行各只占一部分枚，都标全额是错的）","chip 派生判定＝退完（累计退款枚数覆盖全部枚，跨批次累计）且校徽尚未发出（RF_CANCEL_STS，与运管端同名同值）。全额退款因此不再是独立形态——它就是「一次退完」；已到校及之后退完不派生、主状态照常显示（徽已生产寄送发放甚至已核验启用，说「已取消」不成立，退款属售后）。refunding / rfclosed 的 chip 字段回落为底层状态「待审核」、去掉冗余 st 字段，odShow 的 isReview 与 apOrderCard 的按钮判断同步改用派生 chip——退款在途的单办理已终止，不应再出现「取消办理 / 修改信息」入口","零元退款（仅退免费枚）：金额为 0 的分组改述「免费枚已作废回收（N 枚）」而非「已退款 ¥0.00」（后者无信息量且易被读作退款失败），该分组不进金额明细（账本无资金变动）；混合退（含付费枚）按正常口径报金额与枚数","新增 4 条演示记录：SS2026050874261390（部分退款在途 · 已寄出）补齐此前缺失的中间形态；SS2026051436092817（3 枚 · 一笔已到账一笔在途）验证摘要聚合；SS2026050418735204（2 枚分两次退完 · 已取消）验证退完即关单；既有 SS2026050623194085 改为到账后终态与前者成对。家长自主取消链路（odCancelDo）同步改为写入 refunds 而非拼 meta 字符串","家长端未新增零元退款演示记录：可构造的自洽场景都要改动林晓乐「首枚免费额度已用」或林晓阳「未办过」这两个被多处引用的演示基准（支付半屏免费抵扣、再办一枚演示、我的校徽枚数均依赖），风险大于收益；口径由派生函数保证，可交互演示在运管端。既有 7 条退款记录派生结果逐字回归比对无变化，20 条记录键完整、日期倒序、编号唯一且合规"]},
{"d":"2026-08-09 07:24:59","t":"退款到账消息时间对齐关单时刻：消息中心与微信服务通知统一落 6月12日 15:20","p":["parent.html"],"i":["消息中心「林晓乐校徽退款已到账」由 6月11日 改为 6月12日（data-ago 25→24，演示时间基准为 7月6日）：该记录 6月11日 10:20 为发起退款、6月12日 15:20 才是退款到账并关单，原消息落在发起时刻却写「已到账」，与办理进度「退款到账 / 已取消」两行错开一天","微信服务通知页「退款结果通知」卡同步：时间由 6月11日 10:20 改为 6月12日 15:20，退款结果由「已原路退回，1–3 个工作日到账」（发起受理口径）改为「已原路退回至原支付账户，本次办理已关闭」，字段名「退款时间」改「到账时间」——退款结果通知在到账时刻触发，发起退款时不单独触达（家长在详情页办理进度可见「全额退款」行与到账预期）","消息中心演示说明同步该口径；通知页时间轴 6月4日 → 6月12日 → 6月19日 与消息列表 data-ago 递减顺序均校验有序"]},
{"d":"2026-08-08 08:16:48","t":"关单口径统一为「退款成功才关单」：家长自主取消链路对齐 PRD 6.7 状态机","p":["parent.html","admin-trade.html","docs"],"i":["按 PRD 6.7 状态机（取消边守卫「取消成功」即含退款成功）收敛已付款单关单时点：家长自主取消与运管全额退款统一为「取消动作只发起退款、退款到账回调时才转已取消」；未支付单与免费单无款可退，仍取消即关单。原家长取消链路即时关单、退款异步，与状态机守卫不符——退款失败或转线下时会出现「已取消但钱没到」的悬挂终态且无回退路径","家长端三条演示记录改写：SS2026061090241736（已到账）流转由「已取消 → 全额退款 → 退款到账」改为「全额退款 → 退款到账 →（同刻）已取消 · 本次办理已关闭」，与 SS2026052834705921 / SS2026051850613274 两条运管全额退款单结构完全一致；SS2026070166325149（退款处理中）与 SS2026060527816490（退款关闭转线下）去掉「已取消」行、订单尚未关单","退款在途期间的家长端展示：不新增订单状态枚举（新增「退款中」状态会波及部分退款场景——部分退款主单仍须正常生产流转），改由展示层派生——存在进行中的全额退款单时列表卡与详情 chip 显示琥珀「退款中」、副文案「已取消办理 · ¥15.00 原路退回中」，退款到账后转灰「已取消」；部分退款不派生，主单状态照常显示生产中/已寄出等","状态筛选改按底层订单状态：记录新增 st 字段（缺省回落 chip 文案）写入卡片 data-st，odApplyFilter 读 data-st——「退款中」的记录底层仍是待审核，点「待审核」筛得到，不再错归「已取消」；筛选条不新增「退款中」项（退款进度由退款单承载，非记录状态）","家长端「取消办理」交互同步：已付款待审核单确认取消后转「退款中」、流转只落「全额退款」行（当前状态行附注补「到账后本次办理关闭」），不再即时落「已取消」行；未支付单与免费单行为不变","运管端关单级联扩展：RF_CANCEL_STS 由生产中/已寄出扩为校徽发出前四态（待确认/待生产/生产中/已寄出），退款成功回调按退款单 type 分流关单归因（家长取消全额 → 家长自主取消，运管全额 → 运管全额退款关单）；陈梓睿单 SS2026062239106584 关单时刻由取消动作时刻 06-23 10:20 后移至退款到账 10:22、「已取消」行移至到账同刻；宋佳霖单 SS2026061428810369 退款两次原路退回失败转线下、至今未到账，状态由「已取消」回落「待生产」并去掉取消时间与取消类型——退款关闭不自动改办理记录状态，客服可对本单再次发起退款，到账时才关单（该单为可退枚判定中 rf 指向退款关闭单仍可退的既有形态）","db-design-order-domain.md 同步：核心立场第 1 条补「退款成功才关单」；主单表新增 cancel_requested_at（取消受理时间，非空即冻结推进——不可确认通过 / 提交生产，避免退款在途期间订单继续走向生产）、cancelled_at 口径明确为整单关闭时刻；「家长/运管取消（生产前）」事务按有无实付款拆两条路径；退款回调关单分支补商品行与免费额度处置、cancel_scene 按 initiator 分流；免费额度释放改随关单事务（取消受理但未到账期间仍占用，避免退款失败与额度已释放的不一致）；第 7 章 cancelled 事件 note 规范补「已付款单本事件落在全部退款成功回调时刻」","PRD 待同步（飞书，本次未改）：6.7 状态机图取消边守卫按「取消成功（含退款成功）」明确，并补免费单 / 未支付单无款可退的即时关单边；16.8 家长端映射表补「退款中」为展示层派生态、「已取消」行时点统一为退款到账时刻"]},
{"d":"2026-08-08 07:20:00","t":"家长端办理记录编号对齐 PRD 16.1：统一为 SS+日期+8 位随机数","p":["parent.html"],"i":["家长端 19 个办理记录编号由 OD-yyyyMMdd-NNN 改为 PRD 16.1 规定的对外单号规则 SS + 下单日期（yyyyMMdd）+ 随机不重复八位数字（parent.html 3 处静态展示 + parent.js 演示数据 / 演示说明 / 校徽备注引用共 22 处），与运管端办理明细既有编号（SS2026071652201473 等）格式一致","日期段沿用各记录原下单日期，随机段与运管端同日单号互不重复；编号在家长端仅作展示字符串（详情页复制、说明文案引用），无解析逻辑，交互不受影响","历史更新日志中的旧号指代同一批演示记录，对应关系：OD-20260626-415→SS2026062641572089、OD-20260615-772→SS2026061577203648、OD-20260528-347→SS2026052834705921、OD-20260518-506→SS2026051850613274、OD-20260506-231→SS2026050623194085、OD-20260605-278→SS2026060527816490"]},
{"d":"2026-08-07 17:30:48","t":"办理进度定版：新增多枚逐枚核验与生产中退款场景，两端流转行全量对齐 PRD 16.8","p":["parent.html","admin-trade.html"],"i":["家长端新增可交互演示记录 OD-20260626-415（3 枚增办、实付 ¥45.00，当前「已到校」）：与「我的校徽」Tab 新增的 NO.0008 / NO.0009 / NO.0010 三枚待核验徽双向打通，逐枚扫码核验即逐枚启用，同步驱动办理记录流转与列表卡状态实时更新（演示数据，刷新恢复）","流转记录落行口径：第 1、2 枚落「部分启用 1/3」「部分启用 2/3」，第 3 枚不落「部分启用 3/3」而直接落「已完成」——末枚启用与整单完结是同一动作的同一时刻，且 y/y 并非「部分」启用、与同时刻的已完成语义矛盾；已核验的徽立即参与考勤、不等其余枚（枚级终态口径）","PRD 同步定版「已完成」行附注（飞书 16.8 两端映射表 + 6.7 家长端节点口径表）：原两表对同一行给出两套文案（6.7 表「校徽已核验启用」、16.8 表「本次办理完成」）且均未覆盖「末枚核验触发完结」情形——按字面末枚编号在家长端会丢失，与运管端信息不对等。现统一为：由扫码核验启用触发完结时（单枚单启用即完成、多枚单末枚启用），该启用事件并入「已完成」行、不另落「部分启用 y/y」行，附注同时承载启用编号与完结语义「NO.0001 已核验启用，本次办理完成」；由退款到账触发完结时紧随「退款到账」行单独落行、无启用事实，附注仅「本次办理完成」；「扫码核验启用」行同步补注末枚不落本行","原型三条既有「已完成」行按新口径统一（原为三种写法）：first「校徽已核验启用」→「NO.0001 已核验启用，本次办理完成」，qing（林晓晴 2024 归档单）「校徽已核验启用」→「NO.0005 已核验启用，本次办理完成」，partrf（退款到账触发完结）「剩余 1 枚已启用，本次办理完成」→「本次办理完成」","流转行新增「当前状态行专属附注」机制（行数据第 4 位，odFlowRender 按是否当前行取用），对齐 PRD 16.8：部分启用行作为当前状态行时显示「NO.000X 已核验启用，剩余 N 枚待扫码核验」，转历史行后仅保留「NO.000X 已核验启用」——剩余枚数只在当前状态下成立，留在历史行即过期信息；既有 OD-20260615-772 / OD-20260506-231 两条静态记录原分别写死两态文案，现改由同一机制驱动（显示效果不变）","多枚核验半屏比单枚多一行「本次办理 共 3 枚 · 已启用 X 枚」：多枚场景下家长需要知道这枚是第几枚、还剩几枚要扫；演示入口自动定位下一枚待核验的徽","「我的校徽」汇总计数改为按 bdState + BD_OWNER 实时计算（原逐枚硬编码），核验 / 重新启用 / 解绑后自动同步；林晓乐组由 4 枚增至 7 枚，孩子筛选 chip 与组头枚数同步","运管端新增 3 枚逐枚核验单 SS2026071652201473（周雨萱 · 已完成）：校徽明细三枚各带独立扫码核验时间，办理进度按枚落「扫码核验启用第 N 枚 · 部分启用 N/3」、末枚落「全部启用即完成」，配套支付单 PM2026071640119253 与物流单 LG2026072300056 轨迹","运管端核验启用流转行统一带启用枚编号前缀：PRD 6.7 运管端节点表原示例「扫码核验启用第 1 枚 · 部分启用 1/2」与 16.8 映射表「NO.0003 已核验启用 · 第 1 枚 · 部分启用 1/2」差一个编号前缀，本次统一为后者格式；运管端原型六处核验行（周雨萱 3 枚 / 罗一鸣 / 杜俊熙 / 林晓乐）同步改写，编号按时间戳与校徽明细逐枚对应，用运管端全端一致的 BG-xxx 校徽编号（PRD 示例写作家长端简号 NO.0003，运管端各处均以 BG-xxx 检索对账）","运管端办理进度流转行改为「节点名 + 附注」两行结构（[时间, 节点名, 附注, 色标] 四元组，与家长端同构、与 PRD 16.8 两字段一一对应）：原「时间 + 一句话」单字段导致各行处理不统一——核验启用行有附注无节点名、已到校 / 已寄出 / 提交生产 / 家长确认收货有节点名无附注、退款类行节点名（运管发起部分退款 / 退款重试仍异常 / 人工判定无法原路退回 / 家长自主取消）非 PRD 定义事件名。74 行流转数据全量改写并校验：节点名全部落在 PRD 事件枚举内，附注按 PRD 补齐（已到校补物流签收事实、已寄出补物流单号、提交生产补批次号、家长确认收货补确认方式、退款各行补金额与到账预期及退款单编号），仅付费单「提交办理」按 PRD 无附注","已付款单取消按 PRD 拆为同时刻两行：「已取消」行只记取消场景、不附退款信息，另落「发起退款」行承载退款进度（陈梓睿、宋佳霖两单）；运行时追加的五处流转行（发起退款 / 退款重试 / 退款转线下 / 退款到账 / 级联停用作废 / 全额退款关单）同步改为四元组并补退款单编号","两端办理进度全量对照 PRD 16.8 校正（家长端 16 条 + 运管端 16 条记录逐行核）：① 修复真 bug——支付成功后未移除「待支付」行（PRD：支付成功的单不展示该行），wxPay 成功回调补 splice；② 各状态的预期口径文案（待支付 30 分钟、待审核审核中、生产中 20 个工作日、已寄出统一寄送、已到校待班主任发放）全部移入流转行第 4 位「当前状态行专属附注」，转历史行后自动不保留——原写死在基础附注位，multi3 单核验后「已到校」变历史行仍显示待发放文案；③ 同时刻落行按 PRD 校正：提交办理 / 支付成功 与 待支付 / 待审核 原差 1 分钟，现统一为同一时间戳（13 条记录）；④ 新提交记录的兜底流转补齐免费单提交附注与当前状态行预期口径","家长端新增「生产中被运管全额退款」演示记录 OD-20260518-506（列表「已取消」态）：制作环节发现无法完成、平台主动全额退款并关单，退款到账时整单才转已取消（与 OD-20260528-347 同构）；退款行不附「校徽作废停用」——校徽尚未发出、家长手中无实体徽，被退枚 NO.0011 由平台在发出前直接作废、从未寄出、不出现在我的校徽。与已寄出后退款的 OD-20260528-347 构成「附 / 不附作废停用」的对照演示，补齐此前家长端缺失的生产中退款场景（运管端冯诗涵单已有该场景）","PRD 补充定版三处（本轮检查发现的规格缺口，飞书 16.8 与 6.7 两表同步）：① 家长端退款行示例补「校徽作废停用」——被退枚即刻失效、家长手中实体徽不能再用，属须告知信息，原示例遗漏；附与不附的分界定为「校徽是否已发出」而非「是否已提交生产」：已寄出 / 已到校 / 部分启用 / 已完成的单附，待支付 / 待审核 / 生产中的单不附（家长手中无实体徽，生产中被退枚由平台在发出前直接作废、不再寄出，无须家长处置）——初版括注只写了「已发出」与「提交生产前」两类，遗漏中间的「生产中」状态（运管端冯诗涵单即该场景）；②「已寄出」行补「当前状态行附…转历史行后不保留」——与「提交生产」「已到校」两行同性质却唯独漏写，两表均补；③「已取消」运管端示例去「· 实付全额原路退回」——与同行规则「已付款单取消时本行不附退款信息，同时刻另落退款行」自相矛盾，按规则收敛","附注文案收敛至 PRD 定义：家长端「退款到账」去「退款单：」前缀（3 处）→「¥15.00 已原路退回」；运管发起的退款行按 PRD 定版为「全额退款，校徽作废停用，¥15.00 将于 1–3 个工作日原路退回」「部分退款 1 枚，该枚作废停用，¥15.00 将于…」（去退款原因、保留作废停用告知）；fullrf「已取消」→「本次办理已关闭」（与已完成行「本次办理完成」对称，原多「全额退款到账，」前缀而上一行即退款到账）；multi3「已到校」文案回归 PRD 统一文案（原多「逐枚」二字）；运管端「已取消」去「· 渠道关单成功后本地取消」、「发起退款」去「· 全部退款成功后本单将转已取消」（PRD 未定义，技术细节保留在操作日志）","「已到校」附注去除自动确认收货预告尾巴（原「物流妥投签收（…）· 未确认收货，X 将自动确认」→「物流妥投签收（签收即到校，级联整批主单）」，五单统一）：PRD 6.7 运管端表原要求「附自动确认收货预告」、16.8 表要求「物流签收事实」，两表矛盾；本次按 16.8 定版并同步修正 6.7 表——预告随时间变化、非事件发生时的事实（确认收货后即不成立，写死在附注里会长期显示错误信息），不入附注，由详情「确认收货」字段承载（与既有「预期口径不入库、由展示层承载」原则一致）","运管端时间显示统一为完整年月日（原多处只显示月日，与家长端不一致）：办理进度与物流轨迹的流转时间为 yyyy-MM-dd HH:mm（新增 flowTs，与家长端记录详情流转行同格式、不带秒）；支付单 / 退款单 / 退款流水的列表时间列与详情时间字段改用 fullTs 补齐为 yyyy-MM-dd HH:mm:ss（审计字段口径，与办理明细一致）；关联退款单摘要与关联流水行用 flowTs；「已到校」附注内嵌的自动确认日期补足年份（新增 agoYMD）。全站 205 个时间戳扫描校验，格式无异常","物流轨迹行与办理进度同构：事件类型（签收 / 派件 / 在途 / 揽收 / 异常）作节点名、时间弱化在后，原为「时间 · 类型」粗体一行","两端演示说明同步补充多枚逐枚核验口径与直达入口"]},

];
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* 端/类型筛选：按条目涉及页面（p）归类，一条涉及多端则各类别下均出现 */
const CATS=[
  {k:'all',n:'全部',f:null},
  {k:'parent',n:'家长端',f:p=>p==='parent.html'},
  {k:'teacher',n:'教师端',f:p=>p==='teacher.html'},
  {k:'school',n:'学校端',f:p=>p==='school.html'},
  {k:'admin',n:'运管端',f:p=>p==='admin-trade.html'||p==='admin.html'},
  {k:'docs',n:'文档',f:p=>p==='docs'},
  {k:'misc',n:'配套页面',f:p=>['index.html','changelog.html','badge-h5.html'].includes(p)}
];
let cat='all';
const catLogs=c=>c.f?LOGS.filter(e=>e.p.some(c.f)):LOGS;
const filtered=()=>catLogs(CATS.find(c=>c.k===cat));
function renderFilters(){
  document.getElementById('filters').innerHTML=CATS.map(c=>
    '<button class="fbtn'+(c.k===cat?' on':'')+'" data-k="'+c.k+'">'+c.n+'<span class="n">'+catLogs(c).length+'</span></button>'
  ).join('');
}
document.getElementById('filters').addEventListener('click',ev=>{
  const b=ev.target.closest('.fbtn');
  if(!b||b.dataset.k===cat)return;
  cat=b.dataset.k;
  shown=Math.min(filtered().length,10);
  renderFilters();render();
});
/* 时间轴分页渲染：首屏 10 条，滚动懒加载每次追加 15 条，加载完显示总数 */
let shown=0;
function row(e){
  const dt=e.d.split(' ');
  return '<div class="tl-row">'+
    '<div class="tl-date">'+dt[0]+(dt[1]?'<span class="t">'+dt[1]+'</span>':'')+'</div>'+
    '<div class="tl-node"><span class="dot"></span></div>'+
    '<div class="entry"><div class="title">'+esc(e.t)+'</div>'+
    '<div class="tags">'+e.p.map(p=>'<span class="tag'+(p==='docs'?' doc':'')+'">'+(p==='docs'?'文档':p)+'</span>').join('')+'</div>'+
    (e.i.length?'<ul>'+e.i.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')+
    '</div></div>';
}
function render(){
  const logs=filtered();
  document.getElementById('list').innerHTML=logs.slice(0,shown).map(row).join('');
  document.getElementById('more').textContent=shown>=logs.length?'已加载全部 '+logs.length+' 条更新':'加载中…';
  updateActive();
  requestAnimationFrame(maybeLoad); /* 追加后哨兵若仍在预载区内则继续加载（短页兜底） */
}
/* 滚动懒加载：哨兵进入视口下方 300px 预载区即自动追加 15 条 */
function maybeLoad(){
  const logs=filtered();
  if(shown>=logs.length)return;
  const r=document.getElementById('more').getBoundingClientRect();
  if(r.top<window.innerHeight+300){shown=Math.min(logs.length,shown+15);render()}
}
/* scroll-spy：视口上沿锚点（120px）之上最近的一条为当前条，其节点高亮 */
function updateActive(){
  const rows=document.querySelectorAll('.tl-row');
  if(!rows.length)return;
  let cur=rows[0];
  rows.forEach(r=>{if(r.getBoundingClientRect().top<=120)cur=r});
  rows.forEach(r=>r.classList.toggle('act',r===cur));
}
window.addEventListener('scroll',()=>{updateActive();maybeLoad()},{passive:true});
window.addEventListener('resize',()=>{updateActive();maybeLoad()});
shown=Math.min(LOGS.length,10);
renderFilters();
render();
</script>
