<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智小徽运营后台原型</title>
<style>
:root{--brand:#01a239;--brand-d:#008a2e;--brand-l:#e2fbdc;--bg:#f2f5fa;--card:#fff;--line:#e7e9ee;--th:#f2f5fa;--t1:#1f2329;--t2:#4e5969;--t3:#86909c;--danger:#e34d59;--warn:#ed7b2f;--blue:#0052d9;--purple:#7b5cd6;--cyan:#13b0c2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--t1);background:var(--bg);min-width:1100px}
a{color:var(--brand);cursor:pointer;text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--t1)}
/* layout */
.hd{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:fixed;inset:0 0 auto 0;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;letter-spacing:2px}
.logo i{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f6a523,#01a239);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.proto-tag{margin-left:14px;font-size:12px;color:var(--warn);background:#fff3e8;border:1px solid #f9d2b0;border-radius:4px;padding:1px 8px;font-weight:400;letter-spacing:0}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:18px;font-weight:600}
.avatar{display:flex;align-items:center;gap:6px;color:var(--t2);font-weight:400;cursor:pointer;position:relative}
.avatar b{width:28px;height:28px;border-radius:50%;background:#dfe3ea;display:grid;place-items:center;color:#fff}
.avatar .menu{display:none;position:absolute;right:0;top:34px;background:#fff;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:120px;padding:4px 0}
.avatar:hover .menu{display:block}
.avatar .menu div{padding:8px 16px}.avatar .menu div:hover{background:var(--bg)}
.sd{position:fixed;top:64px;bottom:0;left:0;width:232px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px 0 40px}
.mi{display:flex;align-items:center;gap:10px;height:40px;padding:0 20px;color:var(--t1);cursor:pointer;user-select:none}
.mi:hover{background:#f6f8fb}
.mi svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.mi .arr{margin-left:auto;width:14px;height:14px;transition:.2s}
.mi.open>.arr{transform:rotate(180deg)}
.mi.grp-act{color:var(--brand)}
.sub{display:none}.sub.open{display:block}
.mi.lv1{padding-left:52px}.mi.lv2{padding-left:68px}
.mi.act{color:var(--brand);background:#f2fbf3}
.mi.lv1.act::before,.mi.lv2.act::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);margin-left:-16px;margin-right:4px}
.main{margin-left:232px;padding-top:64px;min-height:100vh}
.tabs{height:48px;display:flex;align-items:center;gap:10px;padding:0 6px 0 6px;background:var(--bg);overflow-x:auto;white-space:nowrap}
.tab{height:32px;line-height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 14px;color:var(--t2);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab .x{font-size:14px;color:var(--t3)}.tab .x:hover{color:var(--t1)}
.tab.act{background:var(--brand-l);border-color:#b8eab5;color:var(--brand-d);font-weight:600}
.tab.act::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand)}
.content{padding:0 24px 24px}
.card{background:#fff;border-radius:8px;padding:24px;min-height:calc(100vh - 140px)}
/* page bits */
.backbar{display:flex;align-items:center;gap:14px;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.backbar .bk{color:var(--t2);cursor:pointer}.backbar .bk:hover{color:var(--brand)}
.backbar .sep{width:1px;height:14px;background:var(--line)}
.backbar h3{font-size:16px;font-weight:600}
.backbar .r{margin-left:auto;display:flex;gap:10px;align-items:center}
.ph{margin-bottom:16px}.ph h2{font-size:18px;font-weight:700}.ph p{color:var(--t2);font-size:13px;margin-top:2px}
.info{background:#f0f6ff;border:1px solid #cfe0ff;color:var(--t2);padding:9px 14px;border-radius:4px;margin-bottom:16px;font-size:13px;display:inline-block}
.warnbar{background:#fff8e6;border:1px solid #fbe3a5;color:#c27c00;padding:8px 14px;border-radius:4px;margin:0 0 14px;font-size:13px}
.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--t1);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-d);color:#fff}
.btn.dgr{color:var(--danger);border-color:#f5c2c6}
.btn.txt{border:0;background:none;color:var(--brand);padding:0 6px}
.btn.sm{height:28px;padding:0 12px;font-size:13px}
.lk{color:var(--brand);margin-right:12px;cursor:pointer;white-space:nowrap}.lk:last-child{margin-right:0}
.lk.red{color:var(--danger)}.lk.gray{color:var(--t3);cursor:default}
.ipt,.sel{height:32px;border:1px solid #dcdfe6;border-radius:4px;padding:0 10px;background:#fff;outline:none;min-width:0}
.ipt:focus,.sel:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-l)}
.sel{color:var(--t2);padding-right:6px}
textarea.ipt{height:auto;padding:8px 10px;resize:vertical;width:100%}
/* filters */
.filters{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.fgrid{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 24px}
.fi{display:flex;align-items:center;gap:10px;min-width:0}
.fi>label{width:96px;flex:none;text-align:right;color:var(--t2)}
.fi>.ctl{flex:1;display:flex;gap:6px;min-width:0;align-items:center}
.fi>.ctl>*{flex:1;min-width:0}
.fi.span2{grid-column:span 2}
.factions{display:flex;gap:10px;align-items:center;flex:none}
.compact{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.compact .search{width:280px;position:relative}
.compact .search input{width:100%;padding-left:10px}
.compact .sel{width:140px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .r{margin-left:auto;display:flex;gap:16px}
.exp{display:inline-flex;align-items:center;gap:4px;color:var(--t1);cursor:pointer}.exp:hover{color:var(--brand)}
/* stats */
.stats{display:grid;gap:12px;margin-bottom:16px}
.stat{border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat .n{display:flex;align-items:center;gap:6px;color:var(--t2);font-size:13px}
.stat .n::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--c,var(--t3))}
.stat .v{font-size:22px;font-weight:700;color:var(--c,var(--t1));margin-top:4px}.stat .v small{font-size:12px;color:var(--t3);font-weight:400;margin-left:4px}
.stat .d{font-size:12px;color:var(--t3)}
.summary{display:flex;gap:28px;align-items:center;background:#f7f9fc;border-radius:4px;padding:10px 16px;margin-bottom:14px;color:var(--t2)}
.summary b{color:var(--t1);font-weight:600}.summary .tt{font-weight:600;color:var(--t1)}
.rtabs{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.rtabs span{padding:6px 18px;cursor:pointer;border-right:1px solid var(--line);color:var(--t2)}.rtabs span:last-child{border-right:0}
.rtabs span.on{background:var(--brand);color:#fff}
.ltabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ltabs span{padding:8px 0;cursor:pointer;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ltabs span.on{color:var(--brand);border-color:var(--brand);font-weight:600}
/* table */
.tw{border:1px solid var(--line);border-radius:6px;overflow:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:100%}
th,td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-size:13px}
th{background:var(--th);color:var(--t2);font-weight:500;border-right:1px solid var(--line)}
td{border-right:1px solid #f0f1f4;max-width:240px;overflow:hidden;text-overflow:ellipsis}
tr:nth-child(even) td{background:#fafbfd}
tbody tr:hover td{background:#f2fbf3}
tbody tr:last-child td{border-bottom:0}
th.op,td.op{position:sticky;right:0;background:#fff;box-shadow:-4px 0 6px -4px rgba(0,0,0,.12)}
th.op{background:var(--th)}
td.l{text-align:left}
.empty{padding:40px 0;color:var(--t3);text-align:center}
.tag{display:inline-block;padding:0 8px;line-height:22px;border-radius:3px;font-size:12px;border:1px solid}
.tag-g{color:#00873c;background:#e8f8ec;border-color:#b6e6c3}.tag-r{color:#d54941;background:#fdecee;border-color:#f6c3c7}
.tag-o{color:#d46b08;background:#fff3e8;border-color:#fbd5ae}.tag-b{color:#0052d9;background:#ecf2fe;border-color:#bcd2fb}
.tag-c{color:#0d8e9c;background:#e6f8fa;border-color:#a9e3ea}.tag-gr{color:#5e6673;background:#f3f4f6;border-color:#dcdfe5}
.tag-p{color:#6b4cc2;background:#f2eefc;border-color:#d4c9f5}
.sub2{display:block;font-size:12px;color:var(--t3)}
.pager{display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--t2);font-size:13px}
.pager .sp{flex:1}
.pager .pg{min-width:30px;height:30px;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;cursor:pointer;background:#fff}
.pager .pg.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pager .jump{width:48px;text-align:center}
/* overlay */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;overflow:auto}
.dlg{background:#fff;border-radius:8px;width:560px;max-width:92vw;box-shadow:0 12px 40px rgba(0,0,0,.2);margin-bottom:6vh}
.dlg.w2{width:820px}.dlg.w3{width:1040px}
.dh{display:flex;align-items:center;padding:18px 24px 10px;font-size:16px;font-weight:600;gap:8px}
.dh .x{margin-left:auto;cursor:pointer;color:var(--t3);font-size:20px;line-height:1}
.db{padding:10px 24px 8px;max-height:68vh;overflow:auto}
.df{padding:12px 24px 20px;display:flex;justify-content:flex-end;gap:10px}
.drawer-mask{align-items:stretch;justify-content:flex-end;padding:0}
.drawer{width:560px;max-width:92vw;background:#fff;height:100vh;display:flex;flex-direction:column}
.drawer .db{flex:1;max-height:none}
.drawer .df{border-top:1px solid var(--line)}
.inf{font-size:12px;font-weight:400;color:var(--warn);background:#fff3e8;border-radius:3px;padding:0 6px}
.frm .fr{display:flex;gap:12px;margin-bottom:18px;align-items:flex-start}
.frm .fr>label{width:140px;flex:none;text-align:right;color:var(--t2);padding-top:5px}
.frm .fr>label.req::before{content:"*";color:var(--danger);margin-right:3px}
.frm .fr>.ctl{flex:1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-width:0}
.frm .fr>.ctl>.ipt,.frm .fr>.ctl>.sel{flex:1;min-width:120px;max-width:420px}
.frm .tip{width:100%;font-size:12px;color:var(--t3)}
.frm .txt{padding-top:5px}
.frm.narrow .fr>label{width:110px}
.grp-t{font-weight:600;font-size:15px;margin:6px 0 16px;padding-left:10px;border-left:3px solid var(--brand);line-height:1}
.chk{display:inline-flex;align-items:center;gap:6px;margin-right:16px;cursor:pointer;color:var(--t1)}
.chk input{accent-color:var(--brand);width:15px;height:15px}
.sw{width:40px;height:22px;border-radius:11px;background:#c9cdd4;position:relative;cursor:pointer;flex:none !important;transition:.2s}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s}
.sw.on{background:var(--brand)}.sw.on::after{left:20px}
.upl{width:96px;height:96px;border:1px dashed #c9cdd4;border-radius:6px;display:grid;place-items:center;color:var(--t3);font-size:12px;flex:none !important;cursor:pointer;text-align:center}
.upl:hover{border-color:var(--brand);color:var(--brand)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;font-size:13px}
.kv dt{color:var(--t3)}.kv dd{color:var(--t1);word-break:break-all}
.sec{border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:14px}
.sec h4{font-size:14px;margin-bottom:12px}
.code{background:#1f2329;color:#c9d1d9;font:12px/1.6 Consolas,monospace;padding:12px;border-radius:6px;white-space:pre;overflow:auto}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#fff;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:10px 18px;z-index:99;display:flex;gap:8px;align-items:center;border-left:4px solid var(--warn)}
/* custom pages */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 190px);gap:24px}
.welcome h1{font-size:24px;font-weight:500}
.two{display:grid;grid-template-columns:2fr 3fr;gap:14px}
.panel{border:1px solid var(--line);border-radius:6px;padding:16px;min-height:360px}
.pitem{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.pitem:hover,.pitem.on{border-color:var(--brand);background:#f2fbf3}
.faq{border:1px solid var(--line);border-radius:6px}
.faq .q{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.faq .q:last-child{border-bottom:0}
.faq .a{padding:10px 14px 14px 64px;color:var(--t2);background:#fafbfd;border-bottom:1px solid var(--line);font-size:13px}
.drag{color:var(--t3);cursor:move}
.tree .node{display:flex;align-items:center;gap:6px;height:34px}
.tree .ar{width:16px;cursor:pointer;color:var(--t2);text-align:center;transition:.15s;display:inline-block}
.tree .ar.open{transform:rotate(90deg)}
.tree .kids{padding-left:26px;display:none}.tree .kids.open{display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:560px}
.cal div{height:44px;border-radius:4px;display:grid;place-items:center;font-size:13px;background:#f7f8fa}
.cal .h{background:none;height:24px;color:var(--t3)}
.cal .ok{background:#e8f8ec}.cal .late{background:#fff3e8}.cal .abs{background:#fdecee}.cal .lv{background:#ecf2fe}.cal .off{color:var(--t3)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--t2);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.devcards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.devcards div{border:1px solid var(--line);border-radius:6px;padding:12px;text-align:center}
.devcards b{display:block;font-size:20px;margin-top:4px}
.thumb{width:40px;height:32px;border-radius:3px;background:linear-gradient(135deg,#dff5e3,#a8e0b4);display:inline-block;vertical-align:middle}
.rte{border:1px solid #dcdfe6;border-radius:4px;width:100%;max-width:640px}
.rte .bar{border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:14px;color:var(--t2);font-size:12px;flex-wrap:wrap}
.rte .ed{min-height:120px;padding:10px;color:var(--t3)}
.dir-grp{margin-bottom:14px}.dir-grp h5{font-size:13px;color:var(--t3);margin-bottom:6px}
.dir-grp a{display:inline-block;margin:0 14px 6px 0;font-size:13px}
.fab{position:fixed;right:20px;bottom:24px;z-index:30;background:var(--brand);color:#fff;border-radius:20px;padding:8px 16px;box-shadow:0 6px 16px rgba(1,162,57,.35);cursor:pointer;font-size:13px}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.timeline .it{position:relative;margin-bottom:14px;font-size:13px}
.timeline .it::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--brand);background:#fff}
.timeline .it b{margin-right:8px}
.timeline .it span{color:var(--t3);font-size:12px}
</style>
