<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学校 Web 原型</title><style>body{font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif;color:#344054;padding:48px}main{max-width:640px;margin:auto;padding:24px;border:1px solid #e4e7ec;border-radius:8px}a{color:#1677ff}</style></head><body><main><p id="status">正在打开学校端页面…</p><a id="entry" href="版本/v0.67/index.html">如果未自动跳转，请继续打开学校端。</a></main><script>(async()=>{const status=document.getElementById('status'),entry=document.getElementById('entry');try{const cfg=await fetch('当前版本.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('当前版本配置不可用');return r.json()});if(!/^版本\/v\d+(?:\.\d+)+$/.test(cfg.path||''))throw Error('版本路径无效');const target=new URL(cfg.path+'/index.html',location.href);target.search=location.search;entry.href=target.href;location.replace(target.href)}catch(e){status.textContent='学校端入口暂时无法载入，请使用版本入口。';const fallback=new URL('版本/v0.67/index.html',location.href);fallback.search=location.search;entry.href=fallback.href}})()</script></body></html>
