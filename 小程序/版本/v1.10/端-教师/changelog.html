*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#F4F8FD;min-height:100vh;color:var(--ink)}
/* hero：设计稿背景图（玻璃拟态文档 + 云端上传插画），渐变兜底防图片缺失；平底通栏 */
/* 背景图缩小固定为 880px 宽锚定右侧（插画约 240px 宽），左侧用横向渐变把图层左缘淡出到底层渐变，避免拼缝 */
.hero{background:linear-gradient(90deg,#4E96F7 0%,#3A80F0 calc(100% - 840px),rgba(58,128,240,0) calc(100% - 590px)),url(assets/changelog-hero.jpg) right -24px top -14px/880px auto no-repeat,linear-gradient(150deg,#4E96F7 0%,#2E7CF0 55%,#2568E0 100%);padding:44px 0 38px}
.hero-in{max-width:1120px;margin:0 auto;padding:0 32px}
.wrap{max-width:1120px;margin:0 auto;padding:30px 32px 70px}
.hd{color:#fff;display:flex;align-items:center;gap:16px;margin-bottom:8px}
.brand{width:56px;height:56px;border-radius:14px;background:#fff;box-shadow:0 6px 20px rgba(29,99,216,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand img{width:34px;height:auto;display:block}
.hd h1{font-size:25px;letter-spacing:1px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:rgba(255,255,255,.92);text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:16px;padding:5px 14px;background:rgba(255,255,255,.14);margin-top:14px}
.back:hover{background:rgba(255,255,255,.24)}
/* 时间轴：左列日期 + 节点圆点竖线 + 右侧卡片 */
.tl-row{display:grid;grid-template-columns:96px 34px 1fr;margin-bottom:28px}
.tl-date{font-size:13px;font-weight:600;color:var(--ink-2);text-align:right;padding-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-date .t{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3);margin-top:3px}
.tl-node{position:relative}
.tl-node::before{content:"";position:absolute;left:50%;top:10px;bottom:-28px;width:2px;background:var(--dot-line);transform:translateX(-50%)}
.tl-row:last-child .tl-node::before{display:none}
.tl-node .dot{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #C9D7EE;z-index:1;transition:background .2s,border-color .2s,box-shadow .2s}
/* act = 当前阅读位置（scroll-spy 随滚动移动），非固定最新条 */
.tl-row.act .tl-node .dot{background:var(--navy);border-color:#BBD5FB;box-shadow:0 0 0 3px rgba(46,124,240,.15)}
.entry{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(29,99,216,.07);padding:20px 24px}
.entry .title{font-size:15px;font-weight:700;line-height:1.6}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:11px;color:var(--navy-deep);background:#EDF4FF;border:1px solid #D5E4FB;border-radius:11px;padding:2px 11px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tag.doc{color:#8a6d1f;background:#FDF6E3;border-color:#F0E2B6;font-family:inherit}
.entry ul{list-style:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:13px}
.entry li{font-size:12.8px;color:var(--ink-2);line-height:1.75;padding:3.5px 0;display:flex;gap:10px}
.entry li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--navy);flex-shrink:0;margin-top:9px}
/* 筛选条：按端/类型过滤时间轴条目 */
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:26px}
.fbtn{font-size:12.5px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:16px;padding:5.5px 15px;cursor:pointer;font-family:inherit;transition:color .15s,background .15s,border-color .15s,box-shadow .15s}
.fbtn:hover{border-color:#BBD5FB;color:var(--navy-deep)}
.fbtn .n{font-size:11px;color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums}
.fbtn.on{color:#fff;background:var(--navy);border-color:var(--navy);box-shadow:0 3px 10px rgba(46,124,240,.28)}
.fbtn.on .n{color:rgba(255,255,255,.75)}
/* 底部懒加载哨兵：滚动接近时自动追加，加载完显示总数 */
.more{text-align:center;font-size:12.5px;color:var(--ink-3);padding:12px;user-select:none}
.foot{text-align:center;font-size:12px;color:var(--ink-3);margin-top:26px}
@media(max-width:700px){
  .tl-row{grid-template-columns:1fr;margin-bottom:18px}
  .tl-date{text-align:left;padding:0 0 6px 2px}
  .tl-node{display:none}
}
</style>

{d:'2026-11-10 15:53:58',t:'老师端新增「校徽办理待审核」消息与服务号卡片，直达信息确认详情并按来源返回；AGENTS.md 补 Codex 专属执行约定',p:['teacher.html','docs'],i:['老师端消息页「今天」分组新增「校徽办理待审核」（赵梓涵 · 3年级-2班 已提交校徽办理信息，请及时确认），绿色勾选图标；点击标为已读并直达该生的「信息确认详情」页，消息筛选类别新增「智能校徽」','微信服务号推送示意页新增校徽办理信息确认卡片（「工单处理提醒」：学校名称 / 学生姓名 / 工单状态「提交办理」/ 时间 / 位置），点击直达信息确认详情','信息确认详情按来源返回：办理记录或消息页进入的，返回与确认成功后回来源页；服务号卡片进入的没有上一页，返回与确认成功后回首页。已确认或本人无「信息确认」权限时进入只读详情；办理记录页的返回同样按进入来源','信息确认详情、消息页、服务号推送示意三页演示说明按现状改写为分节写法','AGENTS.md 新增「Codex 专属执行约定」：无头 Chrome 检查的沙箱申请、独立临时目录、保留错误输出与退出码、只清理本次启动的进程等；共享项目约定仍以 CLAUDE.md 为唯一来源']},
{d:'2026-11-10 11:35:46',t:'老师端新增通用无权限页面',p:['teacher.html'],i:['新增通用无权限页 sc-permission-denied，沿用请假详情的锁图标与空态卡片，使用不绑定具体业务的文案','支持返回来源页、指定安全返回页与无来源时回首页，提供 openNoPermission() 复用入口','各页演示说明新增通用无权限页预览入口；业务权限判定保持不变']},
{d:'2026-11-10 11:10:10',t:'请假单标签与来源叫法统一：「教师代销」改为「老师代销」、「教师代录 / 代录」改为「老师代请 / 代请」，V1.2.5 PRD 同步；基线 PRD 新增通用空态页规范',p:['teacher.html','parent.html','school.html','index.html','docs'],i:['老师端、家长端请假单卡头标签「教师代销」改为「老师代销」，与并排的「老师代请」叫法一致；已销假节点的流转附注「· 教师代销」同步改为「· 老师代销」（含演示数据里已有的单与新代销生成的附注）','学校端请假管理：销假处理人「{老师}（教师代销）」改为「（老师代销）」；来源下拉、筛选胶囊、列表「来源」列、详情「来源」行由「教师代录」改为「老师代请」，处理列「代录即生效」改为「代请即生效」','老师端代请提交成功 toast「已代录，免审即时生效」改为「已代请，免审即时生效」；待办工作台与「我的」页（后续阶段预览）的入口「代录请假」改为「代请假」，与权限点「请假 · 代请假」同名','三端演示说明与注释中的「教师代录 / 代录请假 / 代录单」统一为「老师代请 / 代请假 / 代请单」，更正代学生请假页「单据永久标记『教师代录』」的说法（实际标记为「老师代请」）；index.html 功能清单同步','飞书 V1.2.5 PRD（T9K9）：2.1.4 请假部分「教师代销」7 处改为「老师代销」、「教师代录 / 代录」7 处改为「老师代请 / 代请」（旧词删除线、新词绿字）；2.1.4.9 第 7 条新增 e 项引用通用空态页规范；7.2 详细更新记录新增 20261110 一行','飞书基线 PRD：1.4.3「设计规范 / 原则」新增第 2 条「通用空态页（暂无权限 / 不存在）」，2.8.2 第 6 条改为引用该条；原型无改动（请假单详情与学生审核已共用同一个空态卡）']},
{d:'2026-11-10 10:44:23',t:'老师端学生注册审核提醒点开按申请当前状态显示（暂无权限空态 / 只读学生详情带流转记录），审核时的更正同步家长端，称谓与家长关系改为滚轮选择并补必填校验，消息页去除「教师账号已激活」，PRD 同步',p:['teacher.html','parent.html','docs'],i:['老师端学生审核页打开时校验「学生管理 · 注册审核」：本人不持有覆盖该申请所报班级的权限时，整页显示「暂无权限审核该申请」空态与「返回」，不出学生、家长信息与「拒绝 / 通过」（空态卡与请假单详情共用）','消息页「学生注册审核提醒」点开显示该申请的当前状态，返回回消息页：待审核为可审核的「学生审核」，已通过 / 已拒绝为只读的「学生详情」；修复此前按姓名查申请 id 查不到、点开只停在待审核列表的问题。演示案例：张小明（无权限）、刘洋（已拒绝）、周雨彤（已通过，审核时姓名改正为周雨桐）','只读的学生详情：流转记录与生产现行实现对齐为「审核结果（状态标签）→ 提交时间 → 审核教师 → 通过 / 拒绝时间 →（拒绝理由）」；已通过的申请留存通过时生效的信息，显示老师改后的值并在改过的字段下标「申请时：原值」，审核时新增的家长只读列出；已拒绝显示申请时的原值','已通过的只读页新增「查看学生最新信息」，跳到学生管理里该生现在的学生详情页、返回回到本页；仅在该生仍在读且本人持有其现班级「学生管理 · 查看」时显示','提交「通过 / 拒绝」时申请已被他人处理：不写入，toast「该申请已处理」，页面刷新为只读的学生详情；演示说明新增「预览 · 提交时申请已被他人处理」「预览 · 刚通过的申请」','学生审核页申请人与新增家长的「称谓」、修改学生信息页各家长卡片的「关系」由演示提示改为底部滚轮单选（与新增学生页同款）；两页提交时逐张校验家长卡片的称谓 / 关系、姓名、手机号必填，新增家长手机号校验 11 位','学生审核页申请人「家长手机号」改为只读、审核时不可修改（它是提交申请的账号，号码不对应拒绝并请家长重新申请）','审核时的更正同步家长端：老师端通过时回传审核教师与改过的学生姓名、性别、班级、申请人称谓；家长端孩子管理条目、未匹配承接页状态卡、校徽办理页孩子选项按通过后的信息显示，审核通过的孩子可从孩子管理点开孩子资料页（出生日期、现住址显示「未填写」），页面不另加更正提示','家长端收到老师端回传的审核通过时，消息页「今天」新增「添加孩子申请已通过」、服务号示意页末尾追加「工单处理提醒」卡片；老师改过信息时两处同文「{孩子}已添加为您的孩子，信息有更正」，超过 20 字时沿用原文案','老师端消息页去除「教师账号已激活」消息，消息筛选的类别去掉「教师管理」','飞书基线 PRD：2.8.2 新增第 6–15 条（暂无权限空态、提醒点开显示当前状态与只读学生详情、提交时已被处理、家长撤回为后续阶段、只读页显示哪份信息、查看学生最新信息、称谓 / 关系选择与必填校验、申请人手机号不可改、更正同步家长端与通知文案），配图 5 张；7 附录「详细更新记录」新增 20261110 一行']},
{d:'2026-11-09 18:42:07',t:'老师端学生详情、学生管理操作按「学生管理」各权限点显示，删除学生按业务数据拦截，转班与审核选班按权限范围限制，请假单不存在空态去掉副文案，PRD 同步',p:['teacher.html','docs'],i:['学生详情「修改信息」与「更多操作」中的转班 / 离校 / 毕业 / 删除按「学生管理 · 修改 / 转班 / 离校 / 毕业 / 删除」显示，范围须覆盖该生所在班级；「更多操作」只列持有的项，都没有时底栏隐藏（此前对所有能进入该页的老师都显示，任课老师只有「查看」也能修改、转班、删除）','删除学生：此前只弹「演示：删除操作」。现只有没有任何业务数据的学生可删除，业务数据只算真实发生的记录（校门通行签到 / 签退、老师代补签或改判、请假单、素质评价点评、校徽办理与订单），系统自动记的缺卡 / 待签到 / 待签退不算、删除时一并清除；有数据时单按钮对话框「不能删除」：「该学生已有签到、请假等记录，不能删除。如已不在本校，请办理离校。」；无数据时「删除学生 · 姓名」二次确认后移出名单、统计减一','转班：转出班与转入班都须在本人「学生管理 · 转班」范围内，转班半屏只列范围内的班级，范围内没有其他班时不列「转班」（王老师默认只在 3年级-2班 持有，不能转出）；防止先在本班新增再转到任意班','学生审核页「学生班级」候选只列本人「学生管理 · 注册审核」范围内的班级，通过时复核、范围外 toast「暂无该班审核权限」','学生管理页「邀请家长」「新增学生」按本人任一班级是否持有「学生管理 · 新增」显示，「待审核」按「注册审核」显示；新增学生选班只列持有「新增」的班级','学生详情演示说明新增【删除】【按权限显示】两节与两个开关：「预览 · 无业务数据的学生（可删除，再点恢复）」「预览 · 本人在 3年级 各班持有「学生管理 · 转班」（再点恢复）」；学生审核页演示说明新增【选班范围】','请假单详情「请假单不存在」空态去掉副文案（产品内没有删除请假单的操作，只在链接失效、参数错误或后台清理数据时出现），演示说明「打开校验」同步去掉「首页待办」入口','飞书基线 PRD：2.8「学生管理（教师）」新增 2.8.1「教师端：删除学生」与 2.8.2「教师端：学生详情与新增学生的操作权限」，附五张截图，附录 20261109 记录同步','飞书 V1.2.5 PRD（T9K9）：2.1.4.9 第 1 条入口与返回按原型改、第 7 条 a 项去掉副文案与外部引用；2.1.1.13 学生管理「注册审核」「转班」「离校 / 毕业 / 删除」行补新规则，五行原型现状列补齐；7.2 记录同步']},
{d:'2026-11-09 16:38:29',t:'老师端请假单详情新增「暂无权限 / 请假单不存在」空态，打开时校验「请假 · 查看」，V1.2.5 PRD 同步',p:['teacher.html','docs'],i:['老师端请假单详情打开时先校验：单据不存在（已删除、外校、后续阶段单）显示「请假单不存在」空态（此前只弹 toast）；本人不持有覆盖该班的「请假 · 查看」显示「暂无权限查看该请假单」空态，副文案「可能已调整任教班级或权限 / 如有疑问请联系学校管理员」','两种空态不显示学生姓名、班级等单据内容，不出底栏，页内「返回」与左上角返回键同一落点；共用请假数据变动时打开中的详情一并重绘（单据被删即转空态）','修复：「纯任课老师」视角从消息页、服务号卡片仍能打开 3年级-2班 的单并看到全部内容，现显示无权限空态','请假单详情演示说明新增【打开校验】一节，演示操作新增「预览 · 无查看权限时打开请假单」（2年级-2班 韩雨泽的单）与「预览 · 请假单不存在」','飞书 V1.2.5 PRD（T9K9）：2.1.4.9 新增第 7 条「打开校验」；第 1 条「入口与返回」按原型补全入口、改为回到来源页，第 3 条 c 项与 2.1.4.10 第 1、4、5 条落点同步；7.2 详细更新记录新增 20261109 一行','CLAUDE.md 飞书 PRD 约定补例外：请假模块在 V1.2.5 开发完成前写 T9K9 的请假部分，不写基线 PRD']},
{d:'2026-11-09 10:57:20',t:'学校端、运管端演示说明去掉与页面入口重复的演示操作（学校端 35→22、运管端 26→21），「已隐藏 / 站内 / 后续阶段」入口同样自动沉底',p:['school.html','admin-trade.html','docs'],i:['学校端、运管端按 CLAUDE.md 演示操作取舍标准清理：学校端 35 个减到 22 个，运管端 26 个减到 21 个，共删 18 个','学校端：职务管理删去自动关联职务与年级组长的详情 / 页签、「班主任」成员页签、新增自建职务（列表行与页头可直接进入）；教师名单删去「新增教师」「查看教师注册码」（页头自带）与无特别案例的「查看待激活的邓佳」「查看王丽的教师详情」；注册审核删去「查看已办结记录」（页面筛选）；请假管理两个打开同一张单（王雨彤）的按钮合并为「打开销假待确认的单（两张证明材料）」','运管端：办理记录详情删去「复制本页深链」（浏览器地址栏即可复制）；操作日志删去按类型 / 操作人筛选的四个按钮，本页不再有演示操作','学校端、运管端演示面板接入 demoActsSink：职务管理的两个「（菜单已隐藏）」预览、教师名单的「预览 ·（后续阶段）替换确认」排到其他入口下方；CLAUDE.md 沉底规则由老师端、家长端扩为四端','运管端退款单、承运商管理演示说明中指演示按钮的「下方」按约定改为「上方」']},
{d:'2026-11-09 10:48:39',t:'演示面板中「已隐藏 / 站内 / 后续阶段」入口自动排到其他入口下方，老师端登录页新增「直达首页」，CLAUDE.md 补命名规则',p:['teacher.html','parent.html','docs'],i:['演示面板公共脚本新增 demoActsSink：老师端、家长端本页演示操作（按钮与页面开关）中，文字带「已隐藏」「站内」「后续阶段」的统一排到其他入口下方，其余保持原顺序；学校端、运管端不调用','老师端：首页、我的、个人资料、待办工作台、教师待审核、我的考勤、登录页的此类入口沉底；家长端：我的、个人资料、孩子管理、未匹配承接页、班级注册、我的校徽、办理记录详情、请假列表、请假单详情、旧版智慧放学的此类入口与「（后续阶段）」开关沉底','老师端两个入口补标注：「预览 · 待办工作台（原首页，已隐藏）」「预览 · 教师考勤（校管视图，后续阶段）」，正文引用同步','老师端登录页演示说明最上方新增「直达首页（跳过登录 · 王瑶账号）」，三个「已隐藏」预览入口移到模拟登录类入口下方','CLAUDE.md 原型内容约定补：此类入口由 demoActsSink 自动沉底，指向已隐藏页面或后续阶段功能的入口命名须带上三个关键词之一']},
{d:'2026-11-09 10:35:42',t:'演示说明去掉与页面入口重复的演示操作（老师端 448→183、家长端 359→199），CLAUDE.md 补演示操作取舍标准',p:['teacher.html','parent.html','docs'],i:['老师端、家长端演示说明的演示操作按钮按「只放页面做不到或难以找到的事」清理：老师端 448 个减到 183 个，家长端 359 个减到 199 个，共删 425 个','删去页面上已有入口的进入 / 返回 / 打开半屏与页面自带按钮，以及通用的打开下拉 / 月历 / 月份选择器、切 Tab、展开收起、泛用筛选与搜索、「第一条…」泛指操作','保留扫码与微信系统页等模拟能力、外部海报 / 卡片 / H5 链路起点、权限与数据状态预览（预览 · / 恢复 / 重置）、异常与并发情形、后续阶段或隐藏入口、对方视角，以及带案例说明的日期 / 记录 / 人员定位','家长端我的校徽演示说明「经「进入扫一扫」后」改指页面底部「扫一扫校徽二维码」','CLAUDE.md 原型内容约定新增演示操作取舍标准']},
{d:'2026-11-09 10:20:20',t:'素质评价去除校长特殊处理，查看 / 点评 / 评价报告分别按权限点的数据范围取班级，飞书 PRD 同步',p:['teacher.html','docs'],i:['去掉素质评价各页的教师 / 校长角色切换：班级范围按本人主职务、兼任职务与自动关联职务（班主任 / 任课老师 / 全体教职工）中对应权限点的数据范围逐条计算后取并集（mePermOn），不对校长等职务做特殊处理；点评老师统一为当前账号本人','素质评价记录与统计、表现排行、学生点评明细按「素质评价 · 查看」取班级；表现点评按「素质评价 · 点评」取班级；评价报告的选择学生页与报告内换人半屏按「素质评价 · 评价报告」取班级','表现点评与表现排行仍共享当前班级，切到的班级不在另一页范围内时另一页保持原班级；名册或职务权限变化后范围自动重算，已选班级不在范围内时回到默认','只有「点评」没有「查看」的班级，本人提交的点评不出现在记录列表与顶部统计中（没有查看权限就看不到，家长端照常收到）','编辑 / 删除他人点评改为按名册中真实持有的「素质评价 · 修改 / 删除」及其范围判定，原有演示模拟开关保留','演示说明的「以校长身份查看」改为「预览 · 学校为全体教职工开启「素质评价 · 查看 / 点评 / 评价报告」」三个开关与「恢复」；素质评价、表现点评、表现排行、评价报告等页演示说明按现状改写','飞书基线 PRD 2.4.6 / 2.4.7 / 2.4.8 / 2.4.9 / 2.4.11 / 2.4.13 同步去除校长特殊处理与三个权限点的取班口径（旧句删除线、新句绿字），附录详细更新记录 20261109 合并记录']},
{d:'2026-11-09 09:18:26',t:'素质评价顶部统计改为随班级、时间、角色联动计算，历史点评补进点评记录列表',p:['teacher.html'],i:['素质评价页顶部统计（星星总数 / 表扬 / 待改进 / 点评次数）不再写死，按「当前角色可见班级 × 所选班级 × 时间区间」汇总点评记录，切换班级、时间或角色即重算；记录筛选面板与搜索只筛列表、不改统计；点评次数按人次计，小组点评按在读组员人数计次','新增、删除点评与学生毕业 / 离校后统计按记录重新汇总，不再在原数字上加减；旧版快捷点评半屏提交后同步计入表现排行','学生统计行里多出的历史点评补进点评记录列表（挂该班任课老师名下、日期 7月1日）：页面加载时补任教班级，切到校长时补全校其余班级，列表与统计逐条对得上；补齐后李沐宸排行星星按记录更正为 +1','点评记录列表按角色范围显示：教师只看任教班级的记录','演示说明新增【顶部统计】一节，删去「顶部统计为演示定格值」的说法']},
{d:'2026-11-07 11:18:42',t:'学校端请假流转记录去掉代请转审批的「转本班班主任审批」附注，与小程序写法差异减为三处，飞书 PRD 同步',p:['school.html','docs'],i:['请假管理详情抽屉的流转记录不再给老师代请转审批的提交节点加附注「转本班班主任审批」：紧接着的待审批节点已写出本班全部班主任，附注重复；且附注写死「本班班主任」，由校长等有处理资格的人审批后会与「已通过 · 审批人」前后不符','学校端与小程序流转记录写法的差异由四处减为三处：时间带年份、待审批节点写出本班全部班主任、老师只写全名；演示说明【流转记录】与代码注释同步','飞书 V1.2.5 PRD 2.1.4.14 第 3 条 b 项加删除线，「三处」改为「两处」（旧句删除线、新句绿字），7.2 当日记录合并']},
{d:'2026-11-07 11:09:23',t:'请假审批、销假确认提醒改为只推送给持有「审批与销假确认」的班主任，与注册审核提醒同口径，飞书 PRD 同步',p:['teacher.html','docs'],i:['服务号「请假审批提醒」「销假待确认提醒」只推送给持有「审批与销假确认」的班主任，学校取消班主任该项后该班不推送，与已实现的注册审核提醒同口径；上一条「照常推送给该班全部班主任、不看权限」撤回','请假页、代学生请假、服务号推送示意三处演示说明同步；取消权限后本班单据只读、代请与代销假转审批、toast「已提交，待班主任审批」保持不变','飞书 V1.2.5 PRD 2.1.4.19 第 3 条 b 项恢复「与注册审核提醒不发给任何人同构」原句并补写提醒只推给持有该项的班主任，同条权限表、第 5 条消息表两行接收方、2.1.1.13 权限影响表「请假」行同步改写；7.2 当日记录合并为一条']},
{d:'2026-11-07 10:18:46',t:'老师端学校取消班主任审批权限后，本班请假单只读、代请与代销假转审批，服务号提醒照常推送，飞书 PRD 同步',p:['teacher.html','docs'],i:['首页 / 请假页演示说明「预览 · 学校取消班主任三项」打开后，3年级-2班 的请假单详情只读（底栏印「待 3年级-2班 班主任…审批」），代学生请假转「待审批」、代销假转「销假待确认」；此前只影响角标与「待我审批」，代请仍免审即时生效、详情仍可审批','代请转审批的 toast 沿用「已提交，待班主任审批」：一个班可有多位班主任，不为低频场景单独判断','服务号「请假审批提醒」「销假待确认提醒」不看班主任是否持有「审批与销假确认」，照常推送给该班全部班主任，代请人本人是班主任时同样收到；请假页、请假单详情、代学生请假、服务号推送示意四处演示说明同步，服务号推送示意中「校长代请转审批」更正为「没有处理资格的人代请」（校长默认免审）','飞书 V1.2.5 PRD 2.1.4.19 第 3 条 b 项与权限表、第 5 条消息表两行接收方、2.1.4.9 第 4 条、2.1.1.13 权限影响表「请假」行同步（旧句删除线、新句绿字），7.2 记录同步']},
{d:'2026-11-06 17:04:48',t:'学校端请假管理演示说明：流转记录差异更正为四处，班主任不再写正、副，飞书 PRD 同步',p:['school.html','docs'],i:['请假管理演示说明【流转记录】与小程序的差异由「两处」更正为四处，与 PRD 2.1.4.14 第 3 条一致：时间带年份；待审批节点写出本班全部班主任；老师代请转审批的单，提交节点附注「转本班班主任审批」；老师只写全名、不加「老师」','处理列与流转记录的待审批写法由「正、副班主任都列」改为「本班班主任都列出（一个班可有多位）」：第一阶段不区分正副班主任，一个班可有多位班主任；代码注释同步','飞书 V1.2.5 PRD 2.1.4.13 第 5 条「处理」列表、2.1.4.14 第 3 条 a 项同步（旧句删除线、新句绿字），7.2 记录同步']},
{d:'2026-11-06 16:54:25',t:'请假流转「已撤销」节点改为记录撤销的家长，「审批前自行撤销」移入附注，飞书 PRD 同步',p:['parent.html','teacher.html','school.html','docs'],i:['家长端撤销请假单时，流转记录追加的「已撤销」节点操作人为撤销的家长（如「乐乐妈妈」），附注「审批前自行撤销」，与「撤回销假申请」节点写法一致；原写法以固定文字代替操作人，看不出是谁撤销','三端共用请假数据中两张演示已撤销单（林晓乐、周浩宇）补上撤销人；请假数据缓存版本升为 v3，旧缓存作废','学校端请假管理处理列「{家长} 撤销」改取已撤销节点的操作人（原取提交人，非提交人撤销时会写错人）','三端演示说明同步','飞书 V1.2.5 PRD 2.1.4.3 第 7 条流转记录表「已撤销」行、2.1.4.7 第 1 条 b 项、2.1.4.9 第 6 条同步（旧句删除线、新句绿字）；同表「申请销假」行附注中的老师代销假操作人写法移到「操作人写法」列；7.2 记录同步']},
{d:'2026-11-06 16:31:13',t:'老师端补回称谓字段（第一阶段只存入资料、不用于称呼），去掉称谓字段改为后续阶段',p:['teacher.html','school.html','docs'],i:['个人资料、教师详情、新增教师、修改教师（含日志「称谓：旧 → 新」）、注册审核、教师注册补回称谓字段，默认「老师」；个人资料的称谓改为读写共用名册本人记录，与教师详情同一个值','推送、站内消息、放学通知与流转记录仍按「{姓名}老师」称呼，不用称谓（默认「老师」直接使用会出现大量「老师发起放学」）；「我的」与首页头部仍显示姓名','教师注册页与个人资料「修改称谓」半屏的占位由「请输入称谓（如：王老师）」改为「请输入称谓」，与其余三处一致','演示说明：恢复各条目的称谓描述，个人资料【称呼】写明称谓不用于称呼，新增【后续阶段 · 去掉称谓字段】','飞书 V1.2.5 PRD 2.1.2 / 2.1.3 称谓描述恢复，2.1.2.7、2.1.3.4、2.1.4.3 改为称谓只存入资料、不用于称呼，3.1 补后续阶段一行，重截 7 张，7.2 记录同步；家长端 PRD 当日记录的原因说明同步']},
{d:'2026-11-06 16:10:19',t:'老师端个人资料「职务」行改为显示实际主职务，未设显示「无」',p:['teacher.html','docs'],i:['个人资料「职务」行改为显示学校分配的主职务及范围（如「年级组长 · 3年级」），未设主职务显示「无」，与教师详情一致；不再套用首页角色标签「班主任 / 教师」的兜底推导，班主任身份由「班主任班级」一行体现','首页头像角标、名册行、「我的」头部仍按推导显示（演示账号为「班主任」）','演示说明同步；兼任职务演示初值更正为「人事专员 · 全校」（原写「校级管理员 · 全校」，与现状不符）','飞书 V1.2.5 PRD 2.1.2.3 第 4 条「职务标签」推导范围去掉个人资料并补个人资料写法，7.2 记录同步']},
{d:'2026-11-06 15:45:34',t:'老师端去掉称谓字段，三端老师称呼统一为「{姓名}老师」，飞书 PRD 同步',p:['teacher.html','parent.html','school.html','docs'],i:['老师端个人资料、新增 / 修改教师、教师注册、注册审核、教师详情去掉「称谓」字段及相关逻辑（修改教师资料日志不再记称谓），「我的」与首页头部显示姓名，改姓名后同步','称呼规则：句子里写「{姓名}老师」（如「王瑶老师已批准」「李航老师为林晓阳代请假」），标签已说明身份的字段（审核人、班主任、点评老师、拒绝人等）只写姓名；用全名不用「{姓}老师」，同班同姓（王瑶、王丽）可区分','家长端消息、点评、请假单、补签、邀请卡、账号切换等处的「王老师 / 李老师」改为王瑶 / 李航；名册外的点评老师换成 3年级-2班 任课老师（林→冯磊、张→王丽、陈 / 周→吴芳），学生点评明细补齐的记录按名册取该班任课老师','演示说明：个人资料新增【称呼】小节，教师详情、新增 / 修改教师、注册审核、教师注册等条目删去称谓描述（注册审核「按自报职务预填称谓」与现状不符一并删除），引用的产品文案同步','飞书 V1.2.5 PRD 2.1.2 / 2.1.3 称谓相关描述划掉、2.1.2.7 补称呼规则、2.1.4.3 第 7 条改口径，重截 8 张；家长端 PRD 2.6.10 消息示例 26 处改全名，重截 12 张；两份文档各记更新记录']},
{d:'2026-11-06 13:40:43',t:'老师端考勤明细与信息确认名单的状态标签去掉跳转箭头，待签到 / 待签退学生可进签到详情',p:['teacher.html'],i:['考勤明细学生行的状态标签只表状态、不再带跳转箭头：整行可点、按下灰底反馈，箭头放在标签里像下拉或可改状态的按钮、且每行重复冲淡状态色','考勤明细「待签到 / 待签退」的学生行也可点进签到详情（到校 / 离校节点为待记录），全部学生行点击行为一致；待签到的学生可能已到班但忘带校徽，老师同样需要查看','智能校徽信息确认名单「已确认 / 待确认」标签同步去掉箭头（14 行）；「未提交」行维持不可点，副标题「尚未提交办理信息」已说明无内容可看，催办走底部「一键提醒未提交」','演示说明：考勤明细改写点击学生行一段并新增「待签退学生进入签到详情」演示按钮；学生签到详情入口描述改为「点击任意学生行」；代学生补签删去与现状不符的「在考勤明细点缺卡学生直接跳转本页并默认选中该学生」']},
{d:'2026-11-06 11:17:26',t:'老师端服务号示意吴一诺请假结束时间改为 16:30，飞书 PRD 请假时长口径与截图同步',p:['teacher.html','docs'],i:['老师端「微信服务号推送示意」吴一诺 7月8日 事假的结束时间由 16:00 改为 16:30，与请假数据（全天单结束时间为放学时间）一致','飞书小程序 PRD 2.7.7.2 发起请假时长示例（3.5 小时、2 天 4 小时、跨天半日单 6.5 小时）与 2.7.10.1 请假审核结果模板示例（结束 16:30）同步；V1.2.5 PRD 2.1.4.17 时长计算规则改为按该班班次各时段的上学–放学计算、午休不计，算例表按新时段重算','按当前原型重截飞书截图：V1.2.5 PRD 请假与智慧放学 45 张（删除随规则取消的「部分学生时长为 0」图 1 张），小程序 PRD 签到统计、签到页、智慧放学、请假详情、服务号推送与消息列表 7 张；两份文档当天的详细更新记录各补一项']},
{d:'2026-11-06 10:43:25',t:'请假时长按班次各时段计算，晚上时段按班级配置，家长端补午间两条打卡消息',p:['teacher.html','parent.html','school.html'],i:['请假时长（上学日）的应出勤时段改为该班班次各时段的「上学–放学」，午休不计：四次打卡的班 08:00–11:30、13:30–16:30，3年级-1班 另加晚自习 18:30–20:30，1年级-1班（单段「全天」）08:00–16:50（此前一律 08:00–16:00，与放学时间 16:30 不一致）。leave-store.js 新增 lvsSegs / lvsSchoolMins / lvsDurTxt 三端共用，家长端发起请假与销假、老师端代请假与代销假改用同一函数','三端共用请假数据升级为 v2（旧缓存作废）：结束于 16:00 的单改到放学时间（从 08:00 起请的全天单取该班当天最后放学时间，其余取 16:30），每张单的时长、销假前时长、销假后时长改为按区间现算——半天单 08:00–12:00 由 4 小时变为 3.5 小时，下午 12:00 / 13:00–16:30 为 3 小时，林晓乐 6月2日–4日 病假 2 天 6 小时 → 2 天 4 小时，郑皓宸 / 王一彤 销假后 5 小时 → 3.5 小时，王一彤原时长 2 天 8 小时 → 3 天，林晓阳原时长 3 小时 → 3.5 小时','林晓乐 6月 时段请假标签按新口径：6月4日 4 小时、6月15日 0.3 小时、6月22日 0.5 + 2.5 小时、6月25日 3.5 + 3 小时，6月 时段请假 21 → 15.3 小时（两端统计、演示说明同步；老师端统计改为按小数小时累计）；消息、站内提醒与演示按钮中的「08:00–16:00」改为 08:00–16:30','晚上时段改为按班级配置：只有 3年级-1班 有晚上时段（与智慧放学、请假时长的班次一致），其余班级不再有部分学生带晚自习；没有晚上时段的班下午离校时段到 23:59（考勤明细缺卡截止、代学生补签可选范围按班级）','家长端消息列表与服务号推送示意补今天 11:47「林晓乐放学打卡」、13:26「林晓乐上学打卡」两条（一天四次打卡每次打卡各推送一条），消息页演示说明同步']},
{d:'2026-11-06 10:33:48',t:'3年级-2班 统一为一天四次打卡、去掉晚自习，林晓乐 6月 演示日按新时段调整，代学生请假时长按班级排班',p:['teacher.html','parent.html','docs'],i:['3年级-2班 统一为一天四次打卡（上午 / 下午两段），与两端智慧放学一致：考勤明细去掉赵梓涵、陈子昂、黄俊泽的晚上时段；该班下午是最后一个时段，下午离校时段到 23:59——考勤明细缺卡改为「截至 23:59」，代学生补签该班下午放学可选到 23:59（3年级-1班 等有晚上时段的班仍到 17:30）','家长端林晓乐签到页由一天两次改为一天四次打卡：今天午间 11:47 离校（放学 11:30）、13:26 到校（上学 13:30）由通行记录改为正式打卡节点，老师端学生签到详情同步（所有学生）；历史日仍为上午到校 / 下午离校两节点概要；演示说明中「一天两次单周期」「默认一天两次」的表述改为四次打卡','林晓乐 6月 演示日按新时段（下午入校 13:00–15:59、离校 16:00 起）调整，两端同步：6月9日 / 18日 病假由 08:00–14:00 改为 08:00–11:00（盖过上午入校时段终点 10:59，上午签到记请假），9日 返校 10:52；6月15日 请假由 16:00 起改为 16:10 起、16:07 出校仍早退 3 分钟；6月24日 离校由 15:10（落在下午入校时段、算不上离校）改为 16:10、早退 20 分钟；6月4日 数据不变，说明改为上午周期请假、下午顺延至 14:00 后 13:47 按时到校；6月 时段请假 27 → 21 小时','老师端自动生成学生的早退日改为 16:05–16:25 离校（此前最早 15:41，早于下午离校时段起点）','代学生请假时长改为按班级排班计算：排班按班级配置，同班学生相同，多名学生共用一个时长；删去「多名学生时长因排班不同」「部分学生时长为 0 整批拦截」两条演示与分组显示；演示排班改为 3年级-1班 全班有晚自习 18:30–20:30','飞书 V1.2.5 PRD 2.1.4.12 / 2.1.4.17 / 2.1.4.18 同步（时长按该班排班计算，删去分组显示与部分学生为 0 的拦截），7.2 当日记录合并；家长端签到页、代学生请假相关截图未重截']},
{d:'2026-11-06 10:16:08',t:'签到 / 签退时间与状态对齐：正常签到不晚于上学时间、正常签退不早于放学时间',p:['teacher.html','parent.html'],i:['老师端自动生成的学生：今天上午正常到校改为 07:20–07:59、下午正常到校改为 13:05–13:29（此前有 08:01–08:57、13:31–14:15 仍记「正常签到」），迟到分支下午到校 13:30–13:39 改为 13:20–13:29；按名册补满的学生下午到校同步改为 13:05–13:24','老师端历史上学日（6月1日–7月3日）正常离校改为 16:30–16:39（此前有 16:28 / 16:29 仍记「正常签退」）','3年级-2班 固定名单 8 名学生今天下午到校各提前 10 分钟（不晚于 13:30）；林晓乐 13:36 改为 13:26，家长端校园签到页今天的午间通行、六次打卡演示与两端演示说明同步','林晓乐 6月 历史离校时间两端同改：按日期生成的离校时间改为 16:30–16:39，6月5日 16:29 → 16:32、6月11日 16:28 → 16:31，家长端演示说明「6月4日 16:28 签退正常」改为 16:30','用无头 Chrome 逐班逐日核对（22 个班 × 26 个上学日）：老师端签到 / 签退时间与状态不一致的记录由 6150 条降为 0；飞书 PRD 正文未引用这些时间，无需同步']},
{d:'2026-11-06 10:05:29',t:'考勤时段边界与放学时间统一，智慧放学与考勤明细班额、出校人数对齐',p:['teacher.html','parent.html','docs'],i:['考勤时段边界统一为各段首尾相接、覆盖全天（docs/考勤状态定义.md 1.1）：入校上午 00:00–10:59、下午 13:00–15:59、晚上 17:31–19:59，离校上午 11:00–12:59、下午 16:00–17:30（无晚上段时到 23:59）、晚上 20:00–23:59。智慧放学离校开始由 11:30 / 16:20 / 20:20 提前到 11:00 / 16:00 / 20:00，放学时间前离校才识别得到早退；代学生补签各时段可选范围同步（此前为 07:00–08:30 等短时段，中间有空档）','考勤明细缺卡截止时点随之改为上午上学「截至 10:59」、上午放学「截至 12:59」、下午上学「截至 15:59」（此前为 08:30 / 12:30 / 14:00），历史日同步；下午放学仍为「截至 17:30」','智慧放学计划放学时间与考勤放学时间统一为 11:30 / 16:30（此前两端智慧放学为 11:40 / 16:40）：老师端任教班与全校 3年级班级、家长端晓乐班同步；延迟放学最早可选时间、「未放学 16:30 放学」等演示说明同步。老师端「上午 11:00 时点」预览改为 10:50（上午离校自 11:00 起，仍可演示离校开始前的「11:00 后可开始放学」拦截）','班额与出校人数两页对齐：智慧放学 3年级-1班 班额 46 → 44、3年级-3班 44 → 46，与校园签到统计、考勤明细名单一致；3年级-1班 下午 16:38 出校达 36 人（44 × 80%）自动放学、截至 16:44 出校 37 人，考勤明细该班离校记录按此排开（16:25 高弘毅疑似早退，16:30–16:37 共 34 人，16:38、16:41 各 1 人），到校学生均已出校、未到校的 2 人待签退；3年级-2班 / 3年级-3班 下午尚未放学，后台出校计数改为 0，上午计数取考勤明细的上午离校人数','飞书 V1.2.5 PRD 2.1.5.5 三处示例时间（延迟最早可选、默认值、离校开始前提示）与小程序 PRD 2.7.6.1、2.7.6.3「11:30 放学」示例同步，两份文档当天的详细更新记录各合并一项']},
{d:'2026-11-06 09:41:39',t:'签退新增「疑似早退」暂定显示，智慧放学 3年级-1班 补晚上段、晚上入校统一自 17:31 起',p:['teacher.html','parent.html','docs'],i:['考勤明细：离校时间段结束前，最后一次离校早于放学时间的学生显示「疑似早退」（橙色虚线标签，副文案「签退时间 16:25 · 17:30 后确认」），离校时间段结束才定案为早退或正常签退；最后一次不早于放学时间的直接显示正常签退。疑似早退与早退同级排序，状态筛选「早退」一并列出；分组标题「签退 n/总数」改为计已有离校记录的人数（含早退、疑似早退，此前只计正常签退）','3年级-1班 今天（演示时刻 16:44）的下午放学按校门通行记录显示：该班 16:38 已自动放学，已出校的为正常签退（16:30–16:43），高弘毅 16:25 出校显示疑似早退，其余待签退；该班当天有晚上第三周期，全班晚上两栏为待签到 / 待签退。演示说明新增「模拟 · 高弘毅 16:50 再次被识别」「预览 · 17:30 下午离校时间段结束」「回到 16:44」等按钮','学生签到详情：疑似早退的离校节点标虚线 chip、通道后注明「17:30 后确认」，头部为「今日疑似早退」，日历圆点按正常着色；校园签到统计页不计疑似早退；代学生补签「早退」筛选一并列出疑似早退','晚上入校开始时间统一为 17:31（下午离校时间段至 17:30）：老师端智慧放学段配置、3年级-2班「配置第三段（晚托）」预览、家长端晓乐班第三段预览由 19:00 改为 17:31，代学生补签晚上上学时间段由 18:00–19:00 改为 17:31–19:00；老师端智慧放学 3年级-1班 补上晚上段（计划 20:30 放学），与考勤明细一致；家长端旧版智慧放学设计存档未改','docs/考勤状态定义.md 第 3 节新增「签退检查点前的显示（疑似早退）」、10.3 节补签退侧即时落库与暂定显示，修订记录第 16 条；飞书小程序 PRD 2.7.5.1.3、2.7.5.1.9 与 V1.2.5 PRD 1.4.3 d 项同步，两份文档的详细更新记录各记一行']},
{d:'2026-11-05 19:42:02',t:'演示账号姓名由王建国改为王瑶',p:['teacher.html','school.html','parent.html'],i:['演示账号（t26，女老师，称谓「王老师」）的姓名由「王建国」改为「王瑶」：原名读起来像男老师。共用名册 duty-store.js 升 v23，老师端个人资料姓名同步；请假流转记录显示「王瑶老师」，学校端名单、处理列与操作日志显示「王瑶」，老师端操作日志操作人为「王瑶（小程序）」','老师端教师管理「查看本人」演示按钮、本人描述，请假单详情、学校端教师名单与请假管理等演示说明里的姓名同步改为王瑶；教师待审核里后续阶段的「王建国」信息修改申请为另一条演示数据，不改']},
{d:'2026-11-05 19:33:15',t:'请假流转记录的老师改为「{姓名}老师」，演示账号姓名改为王建国',p:['teacher.html','parent.html','school.html'],i:['请假流转记录里的老师操作人由「{姓}老师」改为「{姓名}老师」（全名加「老师」，如王建国老师、王丽老师）：同班两位王姓班主任此前都显示「王老师」，分不清是谁审批；流转记录是留痕，要能落到具体的人。学校端仍显示全名；消息推送、放学通知等文案继续用老师自己设置的称谓，不改','老师端「待 {班级} 班主任{姓名}审批 / 确认」说明式底栏与「该单已由 {姓名} 处理」提示改为写全名（如「待 3年级-1班 班主任郑凯、吴芳审批」）','共用名册 duty-store.js 升 v22：演示账号 t26 的姓名由「王老师」改为真名「王建国」（与老师端个人资料一致），称谓仍为「王老师」，首页头部等按称谓显示的地方不变；教师管理列表、学校端名单与操作日志随之显示王建国，老师端操作日志操作人改为「王建国（小程序）」','三端演示说明同步：老师端教师管理「查看本人」按钮与本人描述、请假单详情【流转记录】，学校端请假管理与职务说明，家长端请假页老师代请的提交人（李航老师）']},
{d:'2026-11-05 19:08:58',t:'请假三端联动（三）：老师端请假改读写共用数据，三张请假详情专页并入请假单详情页',p:['teacher.html','parent.html','docs'],i:['teacher.html 请假列表原 18 张写死的记录卡改为按共用请假数据渲染：待处理单（待审批、销假待确认）按提交时间正序在前（销假待确认按申请销假时间），已办结单按最近一次处理时间倒序；「待我审批」tab、角标与首页宫格角标按共用数据计算；后续阶段演示单、外校孩子的单、已毕业孩子的历史单不进老师端','三张写死的请假详情专页（待审批详情 #sc-leavedt、销假确认 #sc-leavecx、已通过详情 #sc-leaveok）删除，并入请假单详情页 #sc-leavegen：按单据状态显示审批（不通过 / 通过）、销假确认（页面标题改为「销假确认」，不同意 / 确认销假）、代销假；无处理资格的待处理单底栏按名册印「待 {班级} 班主任{姓名}审批 / 确认」；原写死的 LV_GEN 单据、LV_HEAD 班主任表与专页专用函数删除，teacher.css 去掉专页选择器','审批、确认 / 不同意销假、代销假、代学生请假都写入共用数据，家长端与学校端同步可见；操作人为当前视角的老师（班主任 / 纯任课视角王老师，校长视角张建国），流转节点按名册显示「{姓}老师」；有处理资格的老师代销假只追加一个「已销假」节点，无处理资格时追加「申请销假 · {老师}（代销假）」','处理前以共用数据的最新状态为准：单据已被其他老师处理时 toast「该单已由 {姓名} 处理」，家长已撤销、已撤回销假申请、已申请销假时分别提示，随后按最新状态重绘','家长端 / 学校端改动请假数据后，老师端列表、角标与打开中的详情自动刷新；「恢复演示初始数据」同时复位请假数据，请假页、请假单详情演示说明新增「恢复请假演示数据」','演示名册登记与考勤明细改读共用请假数据：本校在读学生的请假单登记进名册（外校、已毕业的不登记）；考勤明细补入学生当天被生效中的请假单（已通过、销假待确认，已销假按缩短后的区间）全天覆盖的记为请假','首页置顶卡、待办工作台、服务号推送示意、消息页的请假入口改为打开请假单详情页（原「cx」入口改为郑皓宸单据编号 chen）；消息「吴一诺请假待审批」申请人由「陈老师（代请假）」改为「一诺妈妈」，与单据一致','老师端请假页、请假单详情演示说明按现状改写（三张专页的说明合并为请假单详情一条，按小节分段），删除销假确认、已通过详情、原待审批详情三条演示说明；家长端请假页、请假单详情演示说明去掉「原型两端不联动」等说法，改为三端联动口径','docs：CLAUDE.md「老师端演示学生名单」的自动登记来源由 LV_GEN 改为三端共用的请假数据（assets/leave-store.js）']},
{d:'2026-11-05 18:56:20',t:'请假三端联动（二）：家长端请假改读写共用数据，1年级-1班 班主任改名李航',p:['parent.html','school.html'],i:['parent.html 请假列表原 15 张写死的记录卡改为按共用请假数据渲染：当前孩子的单按提交时间倒序，状态筛选、按孩子切换、空态预览沿用；后续阶段演示单（退回补充、实际到校、多次退回后通过）不列出，仍可经演示说明预览入口打开','请假单详情改为按共用数据渲染（原写死的 LV_RECS 删除），流转节点操作人按名册取「{姓}老师」；撤销、申请销假、撤回销假申请写入共用数据，学校端请假管理同步可见；写入前以最新数据为准，班主任已先处理时不写入并提示（「该单已被班主任处理」「班主任已处理该申请」「该请假单状态已变化」）','发起请假提交后真正生成一张待审批单（类型、起止、时长、是否传染病、病状、事由、证明材料取自表单），排在列表最前并清空发起表单；外校就读的孩子（林晓宁）发起的单记录校名，本校老师端、学校端不显示；时段重叠拦截改为比对共用数据','卡头附注按单据计算：老师代请的单带「老师代请」，老师代销假的单带「教师代销」（原写死为「老师代销」，与老师端、PRD 写法统一）','单据编号随共用数据更新：消息页、服务号推送示意页、演示说明入口里打开请假详情的编号（pend / ok / proxy 等）改为 le14 / le7 / yang 等；hash 直达 #sc-leavedetail 打开林晓乐 7月14日 待审批单','其他标签页改动请假数据后，列表与打开中的详情自动刷新；请假页、请假单详情演示说明新增「恢复请假演示数据」，请假页演示说明补「数据」一节','共用名册 duty-store.js 升 v21：1年级-1班 班主任 t18 由「高原」改名「李航」，与家长端、老师端写死的「李老师」（林晓阳班主任：代请假、校徽办理提醒、添加孩子审核、放学延迟）一致','学校端请假管理：外校孩子的单不显示、不计入班级待审批张数；leave-store.js 新增 lvsFull（小程序表单时间转存储格式）']},
{d:'2026-11-05 18:49:08',t:'请假三端联动（一）：新增三端共用的请假数据层，学校端请假管理改读共用数据',p:['school.html'],i:['新增 assets/leave-store.js：家长端、老师端、学校端共用的请假单数据层，存本地（键 zxh_leave_state_v1），提供读写、演示时钟、老师姓名与流转节点写法；其他标签页改动时触发回调供页面重绘','演示初值由三端原各自写死的演示单据合并去重，共 36 张（含退回补充、实际到校等后续阶段演示单 5 张）：同一学生同一张单只保留一份（如林晓乐 7月7日 病假取家长端已通过形态、郑皓宸 7月6日 病假取销假待确认形态），学校端原按真实日期推算的单据改为落在 7月6日 前后的上学日','演示「今天」三端统一为 2026年7月6日（周一）17:05；之后写入的流转节点时间在此基础上顺延，保证按时间正序','老师姓名只认共用名册（duty-store.js）：小程序显示「{姓}老师」，学校端显示全名；原写死的刘老师、李老师、周老师、赵老师、陈老师等按名册分别对应郑凯、高原、唐宁、冯磊、宋佳','各单时长按老师端排班算法逐张核对（王一彤有晚自习，7月6日–8日 病假原时长为 2 天 8 小时）','school.html 请假管理改读共用数据：列表、KPI、处理列、详情抽屉与流转记录由存储单据换算；请假中 / 待开始、申请时间窗口、已等待时长按演示时钟计算；时长取单据记录值，不再本页重算；其他标签页改动后列表与打开中的抽屉自动刷新','班级字典的「本班待审批请假」张数改为按请假数据现算；「恢复演示初始数据」同时复位请假数据','详情抽屉病假未填病状时不显示「病状」行（PRD 字段区「没有值的行不显示」），列表病状列显示「—」','请假管理演示说明「演示数据」一节按共用数据重写，演示操作按钮改用新单据编号，并补「打开申请销假后撤回的单」「打开不同意销假的单」「恢复演示初始数据」']},
{d:'2026-11-05 18:22:42',t:'三端请假单流转记录统一：节点名称与写法按 PRD 流转记录表，学校端改为逐条记录',p:['school.html','parent.html','docs'],i:['学校端请假管理详情抽屉的流转记录改为按单据逐条记录的节点显示（单据新增 tl 字段），不再按当前状态现拼节点：申请销假后经确认、不同意或撤回的中间节点保留；节点名称统一为提交 / 待审批 / 已通过 / 未通过 / 生效 / 已撤销 / 申请销假 / 撤回销假申请 / 已销假 / 不同意销假，未通过与不同意销假的意见红字','学校端老师代请免审的单补「生效 · 老师代提交即时生效」节点，提交节点不再附「代请即时生效」；转审批的仍附「转本班班主任审批」；已撤销节点操作人统一为「审批前自行撤销」；待审批节点仍写出该班正、副班主任','学校端新增两张单演示中间步骤：周雨桐「申请销假 → 撤回销假申请」、王梓豪「申请销假 → 不同意销假」；请假管理演示说明新增【流转记录】一节','家长端晓阳的老师代请假单：李老师有审批与销假确认权限，代销假由「代销假 + 已销假」两个节点合并为一个「已销假 · 李老师（代销假）」；无处理资格的老师代销假仍为「申请销假 → 已销假」两个节点','家长端已销假单、跨天单的「申请销假」「已销假」节点写法按 PRD 流转记录表统一（附注末尾「，等待班主任确认」；确认节点为「{班主任}确认」，附注「请假单已结束，{实际结束时间} 起按实际到校判定，已同步全部家人」）','docs：飞书 V1.2.5 PRD 2.1.4.14 第 3 条 b 项改为只在转审批时写提交节点附注，引用的流转记录表由「第 6 条」勘正为「第 7 条」，7.2 详细更新记录 20261105 行已合并记录']},
{d:'2026-11-05 13:52:32',t:'老师端考勤明细「代学生请假」按代请假权限判定：当前班无权限时提示，一个班都不持有时隐藏按钮',p:['teacher.html'],i:['考勤明细底部「代学生请假」按本人是否持有任一班级的「请假 · 代请假」显隐，不随当前所选班级变化，与「批量点名/补签」一致；一个班都不持有时按钮隐藏，底部只剩「批量点名/补签」','当前所选班级不持有「代请假」时点击 toast「暂无 {班级} 的代请假权限」，不打开选择学生半屏；不像补签那样改带别的班：多选半屏只列一个班、没有换班入口，换成别班名单老师看不出原因','权限读学校端共用职务数据（mePermOn 的 leave.proxy），新增 plProxyCls / plProxySync，进入考勤明细时同步按钮显隐','考勤明细演示说明新增「【底部按钮与权限】」一节与三个演示操作：模拟 · 学校取消任课老师代请假（切到 3年级-1班 点按钮看提示）、模拟 · 一个班都不持有代请假、恢复代请假权限；代学生请假页演示说明入口描述同步','飞书 V1.2.5 PRD 同步：2.1.1.13 权限对照表「请假」行补按钮显隐与无权限提示，2.1.4.12 第 1 条补同一规则，7.2 详细更新记录 20261105 一行']},
{d:'2026-11-04 18:22:12',t:'运管端侧栏外链更新为新版 Mockplus 地址，新增运营管理、学生类型字典、组织关系管理三个外链菜单',p:['admin-trade.html'],i:['admin-trade.html 侧栏原有 19 条 Mockplus 外链全部换为新版地址（路径加 yhEHhPtxVk 项目段，参数统一为 nav=0、rt=0、dt=none）：客户管理分组（客户管理 / 合同管理 / 监管账号 / 学校账号 / 模拟登录）、办理统计、发票管理、设备管理 / 客服管理 / 财务结算分组各项、系统设置分组个人中心至节假日配置','发票管理原与办理统计共用同一外链，改为发票管理独立页面','新增三个外链菜单，均在本标签打开：客户管理分组「模拟登录」下方「运营管理」；系统设置分组「节假日配置」下方「学生类型字典」、「操作日志」下方「组织关系管理」','办理明细演示说明：外链菜单范围同步为「系统设置分组的个人中心至学生类型字典、组织关系管理」']},
{d:'2026-11-04 17:36:39',t:'项目约定与原型设计规范：补演示说明写作规则，演示说明面板一节按共用侧栏重写',p:['docs'],i:['CLAUDE.md「原型内容约定」新增演示说明写作规则：只写当前口径，不写修订经过（此前 / 本次改为 / 原为 / 某日定）、对比版本与废弃方案（记在 changelog 与 PRD 更新记录）；按「【小标题】」分节、换行分段；设计理由压成一句；演示操作按钮称「上方」；改写已有条目先核对原型现状，不符的按现状改并向用户列出','docs/admin-prototype-design-spec.md「演示说明 chip」一节按现状重写：共用面板 demo-panel.js / demo-panel.css 的适用页面与 demoPanelRender 调用方式（原型总览页、校徽 H5 兜底页仍为旧版浮层），三种形态（手机框右侧侧栏 / 手机内浮层 / 后台右侧整高侧栏让位），排版（吸顶搜索、演示操作在前、小节折叠、分段规则）、交互（侧栏常驻、Esc 最上层优先）与写作规则；删去已过时的 340px 浮层与「点外部即收起」描述']},
{d:'2026-11-04 17:15:11',t:'学校端 / 运管端演示说明改为右侧整高侧栏，职务管理、教师名单、请假管理、办理明细四条按小节精简',p:['school.html','admin-trade.html','admin.html'],i:['面板：school.html / admin-trade.html / admin.html 的演示说明由顶栏下 340px 浮层改为屏幕右侧整高侧栏（宽 380–520px 随窗口、橙黄配色、字号 13px），打开时主内容区、详情抽屉、弹窗与遮罩整体左移让位，不遮挡表格操作列；切换模块后侧栏自动换成当前模块说明，点演示操作不收起，点 chip、✕ 或 Esc 收起','排版、折叠、搜索与「演示操作在前、通用入口在后」复用 assets/demo-panel.js / demo-panel.css（改为四端共用，新增 Web 侧栏模式 dp-web）；三个页面删去各自的浮层样式、toggleDemo / closeDemo 与点外部收起，renderDemo 改为调用 demoPanelRender','内容：学校端职务管理 10883 → 7286 字（权限点 / 仅全校范围的权限点 / 默认模板与学校职务 / 自动关联的职务 / 列表与筛选 / 职务详情抽屉 / 添加老师的校验与并发 / 停用主职务遇兼任已满 / 功能权限为空 / 侧边栏菜单 / 数据与同步），教师名单 3959 → 3007 字，请假管理 2521 → 2220 字；运管端办理明细 7998 → 6359 字（字段口径 / 办理进度流转行 / 确认收货 / 取消办理 / 发起退款 / 关单与完结 / 时间筛选 / KPI 卡与在途提醒条 / 导出当前结果 / 种子数据）；去掉修订经过，默认模板与自动关联职务的项数已与共用名册逐一核对','按现状更正：教师名单删去「取消最后一位职务与权限管理持有人的职务或将其设为离职会被拦截」（该防锁死规则 2026-10-26 已去除）']},

{d:'2026-11-04 14:47:26',t:'智能校徽信息确认与学生待审核：演示说明补充待审核学生的显示口径',p:['teacher.html'],i:['信息确认页演示说明新增【待审核学生】：名单只列名册内在读学生，注册申请未审核通过的学生不出现（审核通过入册后以「未提交」出现）；注册申请里的陈子昂与本页已确认的陈子昂为同名两人；家长认领待审核的学生照常按校徽办理状态列出、本页不显示认领状态','演示数据口径：林晓乐、王一彤（已确认）与赵梓涵（待确认）的校徽由另一位已认领的家人办理，学生待审核中的是新增监护人的认领（与小程序 PRD「认领关系未通过的家长不能提交生产」一致），数据不改','学生待审核页演示说明新增【与智能校徽信息确认的关系】，同一口径从待审核侧说明']},
{d:'2026-11-04 14:40:09',t:'智能校徽信息确认修复：办理记录与信息确认详情的女生头像显示为男生',p:['teacher.html'],i:['问题：信息确认页列表按性别显示头像，但办理记录、信息确认详情（可编辑 / 只读）三页进入时把头像写死为男生样式，女生（如 3年级-1班 陈雨桐）点进去变成男生头像','修复：新增 cfAvClass，三页头像性别以信息确认页该生行的头像为准，行不存在时查演示名册；头像文字同步改取名字末字，与列表一致']},
{d:'2026-11-04 14:11:17',t:'素质评价选择半屏修复：学生多时卡片被压成细线',p:['teacher.html'],i:['问题：多人点评、多组点评、小组成员、更换点评对象半屏的网格区为固定高度 + 滚动，卡片带 overflow:hidden，学生多到一屏放不下时（如 3年级-2班 45 人）网格行被压到 0，卡片显示为一条条细线；8 月网格改固定高度时即存在，名单补满后暴露','修复：teacher.css 的 .ep-grid 增加 grid-auto-rows:max-content，行高按卡片内容撑开、超出部分在网格区内滚动；表现点评页主网格不受影响']},
{d:'2026-11-04 13:52:50',t:'老师端名单排序：素质评价选择学生与小组组员按拼音，待审核与班级注册码审核按提交时间（PRD 同步）',p:['teacher.html','docs'],i:['素质评价：学生点评明细、评价报告选学生、多选点评、图文点评、选择本组学生等选择学生半屏，3年级各班名单改按姓名拼音排序（姓氏按姓氏读音，stuColl）；评价报告演示学号随名单位置生成，部分学生学号随之变化','小组组员：分组方案初始数据、小组卡、组员半屏、新建 / 编辑小组保存后、点评详情「点评组员」统一按拼音排序（epMemSort）','学生待审核：注册申请、家长认领（含已拒绝 / 核实未通过）按年级、班级分组，班内按提交时间先后排列（spGrouped）','教师待审核：按职务分组，组内按提交时间先后排列（tpTimeKey 解析 今天 / 昨天 / M月D日 HH:mm）','班级注册码批量审核：9 条申请按提交时间重排，每行新增「提交时间」；默认仍勾选名册命中的 6 条','演示说明：学生待审核、教师待审核、班级注册码审核、小组信息、选择学生（评价报告）五条补充排序说明','飞书 PRD：V1.2.5 PRD 1.4.3 第 1 条 d 项括号补「素质评价其他选择学生的半屏…与小组组员」，新增 v 学生待审核、vi 教师待审核、vii 班级注册码批量审核三条另行规定（绿字）；7.2 20261104 行已合并记录']},
{d:'2026-11-04 11:13:15',t:'校园签到统计：周期内离校 / 转班按生效日期计入，人数取统计截止日（PRD 同步）',p:['teacher.html','docs'],i:['口径：离校自离校日期当天起不再计入原班，转班、毕业自办理当天（演示「今天」7月6日）起生效；生效日之前的上学日学生仍计入原班的应出勤与各项统计。此前办理离校 / 转班后考勤名单不分日期整体变更，历史日期也少了该生或把他算进新班','统计页：年级行、班级卡人数取统计截止日当天在班的学生数（日视图为所选日期，本周 / 本月为今天，上周为 7月5日），年级人数为各班人数之和；新增 attEndDay，历史日统计按当天名单计（attRosterDay），离校 / 转班后历史统计缓存作废','名册：attcGenStudents 新增日期参数，按 stuInClsOn 判断学生当天是否在该班；STU_GONE 记起不在读日期，STU_MOVED 记生效日期与最初的原班；转入学生不再顶掉一名补满学生（转入后班额 +1）','考勤明细、代学生补签：选历史日期时列当天在班的学生（含之后离校 / 转出的学生，暂不加「已离校 / 已转出」标记），可点进签到详情','学生详情：离校日期默认值由电脑当天日期改为演示「今天」7月6日（此前晚于全部演示考勤数据，离校后考勤看不出变化）','演示说明：校园签到、考勤明细、学生详情三条同步','飞书 PRD：小程序 PRD 2.7.5.1.5 日级聚合判定顺序说明后新增「统计期间有学生离校 / 转班」一段（绿字），附录详细更新记录新增 261104 行']},
{d:'2026-11-04 10:37:58',t:'补充学生详情交互调整的原型更新日志',p:['changelog.html'],i:['补录提交 20cff9f「优化学生离校日期选择并移除毕业提示条」的更新记录，使用原提交时间与标题，说明毕业提示条移除、离校日期滚轮选择与确认交互调整']},
{d:'2026-11-04 10:34:22',t:'优化学生离校日期选择并移除毕业提示条',p:['teacher.html'],i:['学生详情毕业办理半屏移除字段与按钮之间的黄色提示条，同步更新演示说明与代码注释','离校日期由浏览器原生日期输入框改为与毕业届一致的底部滚轮，默认今天，点击日期行切换为年 / 月 / 日三列选择，与离校半屏共用 sheet；确定后回填，取消或点击遮罩返回离校半屏并保留原值','日期年份范围为当前年前后十年，年月变化时联动天数，兼容大小月与闰年；离校半屏主按钮改为「确认离校」，按所选日期办理并返回学生管理，演示说明同步更新']},
{d:'2026-11-03 18:45:52',t:'考勤日级口径：请假之外当天无任何通行记录记缺勤（非全天请假），两端原型与 PRD、考勤状态定义同步',p:['parent.html','teacher.html','docs'],i:['新口径：非全天请假、请假之外的应出勤时段内无任何到校 / 离校通行记录的，日级记缺勤（缺勤 1 天），请假时长仍按小时单列；此前落到「部分周期缺勤或任一周期异常」，记异常考勤并按出勤日计，孩子一整天未到校却计出勤一天','林晓乐 6月18日（病假 08:00–14:00、下午未返校）两端由异常改为缺勤：日详情顶部新增「缺勤 · 请假之外未采集到到离校通行记录」，月历圆点仍为朱红（缺勤与异常合并展示）；统计月历只命中缺勤与时段请假','6月统计两端同步：出勤 17→16 天、缺勤 1→2 天、缺卡 2→1 次、出勤率 77.3%→72.7%（家长端 parent.html 静态统计卡与环形图同步，老师端签到详情按 linSubs 自动计算）','老师端统计页：请假之外当天无任何到校 / 离校记录即计缺勤（去掉部分时段请假的例外）；签到详情演示入口改为「查看请假后未返校（林晓乐 6月18日 · 记缺勤）」，家长端同名入口改为「查看 6月18日（签到请假后未返校 · 记缺勤）」','docs/考勤状态定义.md：第 5 节日级聚合表新增一行并补判定顺序与修订说明，第 6 节签到侧请假补「请假之外再无通行记录的日级记缺勤」','飞书 PRD：小程序 PRD 2.7.5.1.5 日级聚合表新增一行 + 判定顺序说明（绿字）；2.7.5.1.6 请假影响表补齐请假结束 / 开始时间落在入校段与离校段之间的缺口（旧句删除线、新句绿字，与 docs 第 6 节对齐）；附录 261103 行新增 e 项，V1.2.5 PRD 7.2 20261103 行已合并记录','演示说明：两端签到详情与老师端统计页相关描述同步']},
{d:'2026-11-03 18:32:38',t:'校园签到统计改由考勤明细名单算出；今天无到校记录的学生按 16:44 记缺卡（下午放学仍待签退）',p:['teacher.html'],i:['统计页：三个任教班的请假 / 缺勤 / 迟到 / 早退 / 缺卡由考勤明细同一份名单逐人算出（今天取当天记录，历史日取 attcDayStu 定格记录；新增 attDays / attRosterDay），从班级卡点进考勤明细人数一致。此前为另外手写的一组数（如 3年级-2班 今天缺勤 8 人，明细只有 1 人缺卡）','计法按 PRD 日级聚合：全天请假记请假；当天没有任何到校记录记缺勤；其余为出勤（部分时段请假、其余正常仍为出勤），出勤中任一时段迟到 / 早退 / 缺卡单列计数；班额与年级人数取名单人数','考勤明细：今天没有任何到校记录的学生（如李沐宸，及演示名册中同类学生）上午上学、上午放学、下午上学由待签到 / 待签退改为缺卡（截至 08:30 / 12:30 / 14:00），下午放学仍为待签退——演示时刻 16:44 时前三个时间段早已结束','签到详情：今天全天未到校的学生头部为「今日缺勤」，离校节点改为「待记录」（下午放学时间段未结束），历史日仍为离校缺卡','演示说明：统计页新增【数据来源】段，考勤明细【今天的演示时刻】段补无到校记录学生的口径']},
{d:'2026-11-03 18:25:09',t:'校园签到统计：新增「缺卡」单列计数（计入出勤），汇总卡与班级卡同步',p:['teacher.html'],i:['班级合计卡在迟到、早退后新增「缺卡」行，班级卡由 5 列改为 6 列（出勤 / 请假 / 缺勤 / 迟到 / 早退 / 缺卡）；缺卡与迟到、早退一样计入出勤、单列计数，不进环形图','口径：按小程序 PRD 2.7.5.1.5 日级聚合，部分时段缺卡（如上午两侧缺卡、下午正常到校）的学生当天为异常考勤、计入出勤；日视图为当天任一时段缺卡的学生数，周 / 月为人次；全天两侧均缺卡的学生记缺勤，不重复计入。此前老师端只单列迟到 / 早退，这类学生在统计里看不出来；家长端统计同样单列缺卡次数','演示数据 tnAttSchool 各班今天 / 昨天 / 本月数组新增第 5 项缺卡','演示说明：校园签到统计页新增【缺卡】段']},
{d:'2026-11-03 17:32:16',t:'校园签到统计：周视图标签改为周一至周日（本周 7月6日–12日、上周 6月29日–7月5日）',p:['teacher.html'],i:['周视图日期导航：「本周 7月6日–10日」改为「本周 7月6日–12日」，「上周 6月29日–7月3日」改为「上周 6月29日–7月5日」；统计周为周一至周日','原因：周末也可能因调休补课上学（日期选择周末可选、页底「非上学日不计入」），标签截到周五等于默认周末不算','统计数字不变：本周截至今天仍为 7月6日 1 个上学日，上周仍为 5 个上学日（7月4–5日为周末，演示数据非上学日）','演示说明：校园签到统计页周视图范围描述同步']},
{d:'2026-11-03 17:28:34',t:'校园签到统计：周 / 月只累计截至今天的上学日（本周 7月6日 1 天、本月 7月1–6日 4 天）',p:['teacher.html'],i:['本周（7月6–10日）只累计截至今天的上学日 7月6日 1 天，取今天数据：应出勤 135 人次（此前按 5 天算 675 人次，提前统计了未来 4 天）；页底「周度统计按人次累计本周截至今天的上学日（7月6日）」','本月（7月）累计 7月1–3日 + 今天共 4 个上学日：应出勤 540 人次（此前只算 7月1–3日 405 人次，漏了今天，出现月比周少）；页底「月度统计按人次累计本月截至今天的上学日（7月1–6日），非上学日不计入」','上周 6月29日–7月3日 5 个上学日不变（675 人次）；日期导航仍显示「本周 7月6日–10日」「2026年7月」','演示说明：校园签到统计页的周 / 月范围描述同步']},
{d:'2026-11-03 17:25:41',t:'校园签到统计：年级行人数改为学生数，周 / 月页底注明按人次累计、非上学日不计入',p:['teacher.html'],i:['年级行「N 个班 · M人」的人数改为学生数（各班班额求和），各视图不变；此前取累计后的应出勤人次，周 / 月视图误显示为 675 / 405 人','页底说明：周视图「周度统计按人次累计本周上学日，非上学日不计入」、上周「上周数据按人次累计、已定格，补请假通过后自动更新」、月视图「月度统计按人次累计本月上学日（7月1–3日），非上学日不计入」；班级卡五项数字不带单位，紧挨班额易被读成人数，由页底注明按人次','「周末与节假日不计入」改为「非上学日不计入」：周末也可能因调休补课上学，与日期选择周末可选同一口径','演示说明：校园签到统计页【单位】段补年级行人数与页底说明']},
{d:'2026-11-03 17:19:52',t:'校园签到统计：周 / 月视图单位改为「人次」，首行「总人数」改为「应出勤」；日视图保持「人」',p:['teacher.html'],i:['班级合计卡：周 / 月视图按「学生 × 上学日」累计，单位由「人」改为「人次」，首行「总人数」改为「应出勤 N 人次」（学生数 × 上学日，如本周 675 人次）；出勤率 = 出勤人次 ÷ 应出勤人次，算法不变。此前周视图显示「总人数 675 人」，全年级实际只有 135 人','日视图保持「人」：每个学生按当天日级状态只计一次，出勤 + 请假 + 缺勤 = 总人数；迟到 / 早退为当天任一时段迟到 / 早退的学生数（上午、下午都迟到计 1 人）','班级卡的班额（如「44人」）各视图均为人数，不变','演示说明：校园签到统计页新增【单位】段']},
{d:'2026-11-03 17:13:21',t:'考勤明细今天的演示数据对齐 16:44 演示时钟：晚自习未开始、下午放学不判缺卡、缺卡截止改为 08:30 / 17:30，林晓乐今天改为待签退',p:['teacher.html'],i:['今天 7月6日 的考勤记录按老师端演示时刻 16:44 定格（与智慧放学、代学生补签同一时钟）：晚自习尚未开始，晚上上学 / 放学均为待签到 / 待签退（此前已有 18:xx 签到、20:xx 签退）；下午离校时间段（至 17:30）未结束，下午放学不判缺卡、改为待签退（此前沈亦辰等为「缺卡 · 截至 17:00 未签退」）','缺卡文案截止时间与代学生补签的演示时间段一致：「截至 08:00 未签到」改为「截至 08:30」、「截至 17:00 未签退」改为「截至 17:30」，历史日同步（共 11 处）；此前 08:00 与同页 08:1x 的迟到记录矛盾','林晓乐今天下午放学改为待签退：签到详情头部为「今日在校」、离校节点「待记录」，不再显示 16:47 / 16:52 通行与 16:58 离校；家长端时钟 17:05，仍显示 16:58 离校——两端是同一条时间线上的两个时刻','签到详情演示入口「查看放学缺卡学生（沈亦辰）」改为「查看放学缺卡（林晓乐 6月18日 · 上午请假）」','演示说明：考勤明细新增【今天的演示时刻】段，考勤明细与签到详情中林晓乐当天记录的描述同步改写']},
{d:'2026-11-03 17:01:57',t:'考勤明细 / 代学生补签日期选择去掉周末不可选：月历周末可选，‹ › 逐日切换',p:['teacher.html'],i:['两页共用的日期半屏月历：周末不再置灰，今天及以前（演示范围 2026年6月1日起）均可选，只有未来日期置灰；底注由「周末与未来日期不可选」改为「未来日期不可选」','日期胶囊 ‹ › 改为逐日切换，不再跳过周末（dpStep）','原因：学校可能因调休、补课在周末上课，上学日以校历与班次为准，不按星期几一刀切。演示数据周末无考勤，选中后显示非上学日空态','演示说明：考勤明细、代学生补签两页的日期控件描述同步']},
{d:'2026-11-03 16:55:34',t:'代学生补签：考勤时间半屏改为时 / 分滚轮，只列入校 / 离校时间段、默认上学 / 放学时间；补成缺卡不填时间，其余必填且状态随时间判定（PRD 同步）',p:['teacher.html'],i:['考勤时间半屏：两个原生下拉改为与延迟放学同一套时 / 分两列滚轮（居中标题 + 右上 ×，标题下注明该时段的入校 / 离校时间段与上学 / 放学时间，底部左右「取消 / 确定」）；分钟 1 分钟一档（此前 5 分钟），分钟列随小时裁到可选范围','可选范围按小程序 PRD 2.3.1.14：只列入校 / 离校时间段内的时间（含起止），补签今天时不晚于当前时间（演示时钟同智慧放学）；默认上学 / 放学时间。此前 0–23 时全量可选、默认 00:00。新增 AS_TM 演示时间段（真实产品取班次配置）','考勤状态移到考勤时间之前：补成缺卡时时间栏隐藏、不填时间；其余状态时间必填，状态由时间判定（上学不晚于上学时间为正常签到、晚于为迟到；放学早于放学时间为早退、到点及以后为正常签退）；手动点迟到 / 早退时时间改到上学时间后 / 放学时间前 1 分钟并拉起时间半屏，点正常改回上学 / 放学时间。此前时间非必填、选后无法清空，可与状态矛盾','切换日期或时段时时间与状态回到默认；该时段尚未开始（今天的晚上时段）时点时间或提交提示「该时段尚未开始」；去掉选时间后的「已根据…自动判定状态」提示','演示说明：代学生补签页新增【考勤时间】段并改写补签表单描述','飞书 PRD 同步：小程序 PRD 2.3.1.14 第 1、2 条 b 项改写（当日新写）、2.7.5.1.8 第 1 条补绿字，附录详细更新记录 261103 行新增 d 项；V1.2.5 PRD 7.2 详细更新记录 20261103 行已合并记录']},
{d:'2026-11-03 16:11:05',t:'考勤明细底部「代学生补签」按钮改名为「批量点名/补签」（PRD 同步）',p:['teacher.html'],i:['考勤明细：底部按钮文案由「代学生补签」改为「批量点名/补签」；点击后的时段选择弹框与进入的页面不变，页面标题仍为「代学生补签」','演示说明：考勤明细、代学生补签两页提到该按钮的 4 处同步改名（代码注释 1 处同步）','飞书 PRD（V1.2.5）同步：2.1.1.13 各模块对照表「校园签到 / 代补签」行按钮名旧名删除线、新名绿字；7.2 详细更新记录 20261103 行已合并记录']},
{d:'2026-11-03 16:02:38',t:'代学生补签：名单按所选时段的状态排（与考勤明细同序），每行显示状态标签（PRD 同步）',p:['teacher.html'],i:['名单顺序：按所选考勤时段的状态排，与考勤明细同一顺序（ATTC_ST_ORD）——缺卡 → 待签到 / 待签退 → 迟到 / 早退 → 请假 → 正常签到 / 正常签退，同状态内按姓名拼音（stuColl）；进页、切换日期 / 时段 / 班级时按新状态重排，勾选与搜索不改变相对顺序。此前按姓名拼音排，筛选默认「全部」后要补签的学生散在全班中间','状态标签：每行都显示所选时段的状态，与考勤明细同一套 attcStMap 配色（缺卡红、待签到 / 待签退灰、迟到 / 早退橙、请假蓝、正常签到 / 正常签退青绿），不带跳转箭头（本页点行是勾选）；此前只有缺卡、待签到 / 待签退带标签，迟到、请假的学生排在前面却看不出原因','口径修正：待签到 / 待签退不只是孩子还在路上，也可能已到班但忘带校徽或未被识别，老师同样需要补签；演示说明与代码注释中「避免给还在路上的孩子提前补签」的说法已改','演示说明：代学生补签页新增【名单顺序】段，【版式】段补状态标签说明','飞书 PRD（V1.2.5）同步：1.4.3 d 项正文名单去掉「代学生补签」，子项 i 改为「考勤明细、代学生补签另行规定」并注明待签到学生同样可能需要补签（绿字，当日新写直接改写）；7.2 详细更新记录 20261103 行已合并记录']},
{d:'2026-11-03 15:10:18',t:'权限刷新时机改为老师端不另存权限清单，各页以请求时服务端返回的结果为准（PRD 同步，原型措辞同步）',p:['teacher.html'],i:['代学生补签：代码注释与演示说明中的「本机权限清单」改为「页面上次请求时服务端返回的结果」，提交被拒后改述为「重新请求本页数据并按服务端返回的结果重画」；行为不变','首页演示说明的刷新时机改述为「首页每次显示时向服务端请求宫格与角标」','飞书 PRD（V1.2.5）同步：2.1.1.12 第 4 条去掉「老师端本机缓存一份本人权限清单」，改为不另存清单、各页以请求时服务端返回的结果为准——a 首页每次显示时请求宫格与角标，b 进入功能页（含从下级页面返回）按本次返回渲染，c 提交被拒后重新请求当前页数据并重画；2.1.1.13 第 6 条补句同步改述；7.2 详细更新记录 20261103 行改写并补原因（角标本就每次向服务端取，另存清单反而要定义刷新与过期）']},
{d:'2026-11-03 14:52:56',t:'权限刷新时机：提交被权限复核拒绝后立即刷新权限并重画当前页，代学生补签加演示；进补签页带入考勤明细当前班级（PRD 同步）',p:['teacher.html'],i:['代学生补签：提交时服务端按当前权限复核「代补签」，不通过不提交，toast「暂无 {班级} 的代补签权限」后立即刷新本机权限清单并重画本页——仍持有其他班时换到候选中排在最前的班、清空已选；一个班都不持有时返回考勤明细，底部「代学生补签」按钮隐藏。此前原型无此复核','新增 asSignHeld（本机权限清单）/ asSignSrv（服务端当前持有）与 asSignCls / asSignFirst / asSignSync；补签页班级候选只列持有「代补签」的班（attMineGrades 新增 only 参数）','进入代学生补签页时，考勤明细当前所选班级持有「代补签」则带入该班，否则带入候选中排在最前的班（PRD 2.1.1.13 代补签行）；此前沿用上次补签的班','演示说明：代学生补签页新增【提交时权限复核】段与「预览 · 停留期间学校收回本班 / 全部班级「代补签」，再点提交」「恢复代补签权限」三条入口；首页、请假角标两处说明的「下次打开首页」改为「回到首页时」并引用 PRD 刷新时机','飞书 PRD（V1.2.5）同步：2.1.1.12 新增第 4 条「权限刷新时机」（启动 / 回到前台拉取、首页每次显示渲染；进功能页按服务端本次返回渲染；提交被拒后立即刷新并重画当前页），2.1.1.13 第 6 条与其余 9 处「下次打开首页」类说法改为引用该条或「回到首页时」（旧句删除线、新句绿字），7.2 详细更新记录 20261103 行已合并记录']},
{d:'2026-11-03 14:35:43',t:'代学生补签：顶部考勤状态筛选默认「全部」，补签信息考勤状态默认「正常签到 / 正常签退」，「正常到校」改名「正常签到」（PRD 同步）',p:['teacher.html'],i:['进入代学生补签页时，顶部考勤状态筛选默认选中「全部」（此前默认「缺卡」），进页先看到全班学生，再按需筛选','补签信息的考勤状态默认选中「正常签到」（上学时段）/「正常签退」（放学时段），此前默认「缺卡」；补签多是给漏刷卡、实际已到校 / 已离校的学生补正常记录，迟到、早退、缺卡按需改选','切换考勤时段（asUpdateForm）时筛选与考勤状态同样回到这两个默认值；地址直达与页面初始 HTML 的默认值一并改','上学时段「正常到校」统一改名「正常签到」（状态筛选选项、考勤状态按钮、提交状态名），与考勤明细同名','演示说明：代学生补签页新增【默认值】段，并改写筛选与考勤状态的默认值描述','飞书 PRD 同步：小程序 PRD 2.3.1.14「教师补签时间限制」新增 1.b、2.b 与第 3 条（绿字），附录详细更新记录 261103 行与 V1.2.5 PRD 7.2 详细更新记录 20261103 行均已合并记录']},
{d:'2026-11-03 13:43:16',t:'老师端复选框统一自绘：修正 Chrome 下手机框小数缩放时「全选」与学生行复选框一大一小，全选改为 17px、间距 10px',p:['teacher.html'],i:['代学生补签：「全选」复选框由 16px 改为 17px、与文字间距由 6px 改为 10px，与学生行一致','teacher.css 新增原生复选框统一自绘样式（appearance:none）：手机框按窗口高度设了小数 zoom，Chrome 在小数缩放下按各自所在位置取整绘制原生复选框，同为 17px 的「全选」与学生行会画成一大一小（Safari 无此问题）；自绘后各处大小一致','自绘样式：默认 17px、浅灰描边 4px 圆角，勾选为藏青底白勾（与批量核对方框同色系），禁用为浅灰底；仍是原生 input，勾选、键盘操作、checked 与 change 事件不变','同时覆盖老师端其余原生复选框：智能校徽办理详情的「暂不上传」、教师管理分配职务半屏的两处复选框；家长端无原生复选框，不受影响']},
{d:'2026-11-03 11:51:15',t:'代学生补签版式统一：卡片标题同为 14px，补签信息改用代学生请假同一套表单，状态标签与姓名对齐考勤明细；考勤明细班级按钮改为 11.5px 胶囊形',p:['teacher.html'],i:['代学生补签：「代补签学生」「补签信息」两张卡片标题统一为 14px 加粗（此前 13 / 14px 不一）','「补签信息」改为与代学生请假同一套表单写法：考勤时段、考勤时间、考勤状态都是标签在上（.frow label，12px 灰字）、内容在下；考勤时段为只读 .pick、考勤时间为同款 .pick；考勤状态为三等宽 .seg2 分段按钮（单选 radio 视觉隐藏、保留键盘可达，选中蓝底蓝字加粗）。此前混用左右排与上下排（12 / 12.5 / 13px）、状态为带原生圆点的不等宽选项','新增 .seg2 label 样式（覆盖 .frow label 的块级小字），asSetStatus / asStatusChange 改为切换 on 类','学生行状态标签改用考勤明细同款 .chip（缺卡红 / 待签到、待签退灰），姓名字重 500 与考勤明细一致；此前为红底白字实心块、常规字重','考勤明细：班级按钮由 13px、8px 圆角改为 11.5px 胶囊形，与同一行日期、状态筛选同高同字号','演示说明：代学生补签页新增【版式】段']},
{d:'2026-11-03 11:33:32',t:'代学生补签：全选与「共 N 人」只算当前列表里看得到的学生，切换筛选或日期时取消已不在列表中的已选学生',p:['teacher.html'],i:['新增 asList(withSearch)：按所选日期、时段、状态筛选（与姓名搜索）取当前列表，渲染、全选、计数共用这一份；此前全选与「共 N 人」按全班算，「缺卡」筛选下只显示 1 人，点全选却选中全班 45 人','「全选」只勾选 / 取消当前列表里的学生；全选框在当前列表非空且全部选中时勾上；「共 N 人」为当前列表人数，有已选时显示「已选 N 人」','切换状态筛选或日期后，不在当前列表里的已选学生自动取消选择，避免把看不见的学生一起提交；只改搜索不取消，搜完清空可接着选；非上学日列表为空、已选清零','演示说明：代学生补签页新增【全选与计数】段']},
{d:'2026-11-03 11:31:25',t:'代学生补签：「缺勤」改为「缺卡」，标签 / 筛选 / 单选按所选时段取值，待签到不再标缺卡，放学文案与判定修正，地址直达不再报错',p:['teacher.html'],i:['页面上的「缺勤」统一改为「缺卡」：状态筛选按钮与选项、学生标签、考勤状态单选与提交映射。本页按单个考勤时段补签，单个时段没有记录是缺卡，缺勤指全天两侧都缺卡，与考勤明细同口径','学生标签与状态筛选改为按所选时段取状态（新增 AS_ST_KEY / asStKey）：此前一律读上午上学（amSt），选下午、晚上或放学时段时标签与筛选都不对；该时段没有考勤安排的学生（如无晚自习）不列出','标签口径与考勤明细一致：时段已结束仍无记录标红色「缺卡」，时段内尚未刷到标灰色「待签到 / 待签退」；此前待签到也标缺卡（如李沐宸在考勤明细为待签到、本页却为缺卡），老师可能给还在路上的孩子提前补签。默认「缺卡」筛选因此只列真正缺卡的学生','放学时段：状态筛选选项改为全部 / 待签退 / 正常签退 / 早退 / 缺卡 / 请假，考勤状态单选改为正常签退 / 早退 / 缺卡（上学仍为正常到校 / 迟到 / 缺卡，筛选「未签到」统一为「待签到」）；按时间自动判定改为早于放学时间为早退、到点及以后为正常签退，此前沿用上学「越晚越迟到」','地址直达 #sc-attsign 不再报错：页面加载早期跳转时代学生补签段尚未初始化（asStudents 为 undefined），改为等整份脚本执行完再初始化，未经时段弹框进入时默认上午-上学；此前直达即报错、学生列表空白','演示说明：代学生补签页的筛选、标签、单选与自动判定口径同步改写，并记录本次修正']},
{d:'2026-11-03 11:14:50',t:'勘误：教师管理名册先按在职状态（在职 → 待激活 → 离职）排，不是单纯按姓名拼音（PRD 同步）',p:['teacher.html','docs'],i:['学生管理页演示说明的排序口径中，教师管理名册由「用同一套姓名排序」改为「先按在职状态（在职 → 待激活 → 离职）排、同状态内用这套姓名排序」，与教师管理页实际排序及 PRD 2.1.2.4 第 5 条一致；页面行为不变','docs：飞书 V1.2.5 PRD 1.4.3 第 1 条 d 项正文名单去掉「与教师管理名册」，新增子项 iv「教师管理名册另行规定」（见 2.1.2.4 第 5 条），7.2 合并进 20261103 一行']},
{d:'2026-11-03 11:08:17',t:'学生管理每个班内待认领学生排在最前，同状态内按姓名拼音（PRD 同步）',p:['teacher.html','docs'],i:['smRender 班内排序改为先待认领、再已认领，同状态内按姓名拼音（stuColl）；班级与年级顺序不变。1班陈雨欣、2班李沐宸排到各自班级最前','理由：与考勤明细、信息确认同一原则（老师要跟进的状态在前）；每班待认领通常只有一两人，置顶后其余学生仍是完整拼音顺序，开学新生大量待认领时排在前面的正是要催家长认领的名单；只看待认领仍可点统计栏「待认领」筛出。此前定的「待认领不置顶」作废','演示说明：学生管理页排序口径中「待认领学生不置顶」改为新规则与理由','docs：飞书 V1.2.5 PRD 1.4.3 第 1 条 d 项删去「待认领学生不置顶」，新增子项 iii「学生管理另行规定」，正文名单去掉「学生管理」；写入时误删的子项 ii（信息确认页）已按写入前原文恢复；7.2 合并进 20261103 一行']},
{d:'2026-11-03 10:55:56',t:'智能校徽信息确认页各班学生先按办理状态排：待确认 → 未提交 → 已确认，同状态内按姓名拼音（PRD 同步）',p:['teacher.html','docs'],i:['新增 apSortRows / AP_CF_ORD：信息确认页每个班内部按 待确认 → 未提交 → 已确认 排序，同状态内按姓名拼音（stuColl）；班级与年级顺序不变。3年级-2班现为赵梓涵、周雨桐（待确认）→ 李沐宸、徐若曦（未提交）→ 已确认学生，此前为演示数据写入顺序','进入或返回本页时重排（go 包装与页面初始化各调用一次）：在办理记录页确认无误 / 取消确认后，返回即按新状态排位，停在办理记录页时不挪动','理由：待确认是老师自己的待办（首页宫格角标即计此项），排最前；未提交要等家长、行不可点，由「一键提醒未提交」统一处理，排第二；只看某一类仍用统计栏数字或状态筛选','演示说明：信息确认页新增【名单顺序】段','docs：飞书 V1.2.5 PRD 1.4.3 第 1 条 d 项「人员名单排序」补信息确认页状态顺序（当日新写未经评审，直接改写），7.2 合并进 20261103 一行']},
{d:'2026-11-03 10:45:27',t:'同名学生排序改按加入名册的先后（系统内部编号），学籍号改为选填、不作排序依据（PRD / 数据库设计同步）',p:['teacher.html','docs'],i:['学籍号在系统中为选填，极端情况下全部为空，无法区分同名学生，补填或修改后顺序还会变化；同名学生的先后改为按学生加入名册的先后（系统内部编号 student.id）升序——建档即生成、唯一、不随改名转班变化','原型：stuColl 注释与学生管理页演示说明的同名排序口径同步改写（原型名册全校不重名，页面行为不变）','docs：数据库设计 6.1 student.student_no 由 NOT NULL 改为可空（学校端选填），(school_id, student_no) 唯一仅在非空时校验、空字符串归一为 NULL，要点新增「学籍号选填」一条；文档版本号暂不升','docs：飞书 V1.2.5 PRD 1.4.3 第 1 条 d 项同名排序改为按加入名册的先后（系统内部编号）并注明学籍号选填（当日新写未经评审，直接改写），7.2 合并进 20261103 一行']},
{d:'2026-11-03 10:40:32',t:'考勤明细各分组先按考勤状态排：缺卡 → 待签到 / 待签退 → 迟到 / 早退 → 请假 → 正常，同状态内按姓名拼音（PRD 同步）',p:['teacher.html','docs'],i:['考勤明细各时段分组（上学 / 放学各自排）新增状态顺序 ATTC_ST_ORD：缺卡 → 待签到 / 待签退 → 迟到 / 早退 → 请假 → 正常签到 / 正常签退；稳定排序，同状态内保持名册的姓名拼音顺序（stuColl）。3年级-2班今天「上午 · 上学」前四行依次为周雨桐（缺卡）、李沐宸（待签到）、杨梓冉（迟到）、郑皓宸（请假），历史日期同一顺序','理由：一个班四十多人、异常通常只有几人，按拼音排时散落在正常记录中间要逐屏翻找；请假已审批、去向明确，排在异常之后、正常之前，不与异常混排；只看某一类仍用顶部状态筛选。真实产品当天记录只在进页面或下拉刷新时重排，不在查看时当场跳动','演示说明：考勤明细页【名单顺序】改写为新顺序与理由；学生管理页排序口径中考勤明细改为「先按考勤状态排、同状态内用姓名排序」','docs：飞书 V1.2.5 PRD 1.4.3 第 1 条 d 项「人员名单排序」把考勤明细移出拼音名单并补其状态顺序（当日新写未经评审，直接改写），7.2 合并进 20261103 一行']},
{d:'2026-11-03 10:27:02',t:'老师端名单姓名排序：姓氏按姓氏读音（曾读 zēng 排在 Z 段等），考勤明细与代学生补签改为拼音顺序（PRD 同步）',p:['teacher.html','docs'],i:['stuColl 改为姓名排序函数：比较前把多音字姓氏换成同音的非多音字再交给 Intl.Collator（复姓先匹配），修正曾（zēng）、单（shàn）、解（xiè）、仇（qiú）、区（ōu）、查（zhā）等姓被按常用读音排错段——学生管理 3年级-1班「曾宇轩」此前排在 C 段首位，现排在袁佳琪与张嘉豪之间；换字后相同再按原字比较，顺序确定','老师端名单共用这一个排序：学生管理、代学生请假选择学生、表现点评「按首字母排序」与按星星排序的同分组、表现排行同分组（原 localeCompare 改为 stuColl）、教师管理名册（tmColl 改为复用 stuColl）','考勤明细、代学生补签的名单由演示数据写入顺序改为姓名拼音顺序（attcGenStudents 返回前排序）','演示说明：学生管理页补姓氏读音、同名按学籍号、不按学号排、待认领不置顶的口径；考勤明细页补【名单顺序】一句','docs：飞书 V1.2.5 PRD 1.4.3「设计规范/原则」第 1 条新增 d 项「人员名单排序」，7.2 合并进 20261103 一行']},
{d:'2026-11-03 10:17:43',t:'学生管理与考勤明细的折叠区去掉 2000px 高度上限：四十多人的班级 / 分组展开后底部不再被截',p:['teacher.html'],i:['学生管理页年级 / 班级折叠区（.sm-grade-bd / .sm-cls-bd）原以 max-height:2000px 做展开动画，45 人的班展开约 2700px、整个年级约 6100px，底部学生被截掉；改为 height:auto + interpolate-size:allow-keywords 过渡，按内容实际高度展开，展开 / 收起动画保留，不支持该属性的浏览器只是没有动画、内容不被截','考勤明细（#sc-attclass）分组折叠区 .attc-grp-bd 同样受 2000px 上限影响（四十多人的分组约 2700px），一并改为同一写法','用无头 Chrome 展开老师端全部页面的折叠区逐一检查，已无内容被高度上限截断的区域']},
{d:'2026-11-03 10:09:30',t:'素质评价不再显示已毕业 / 离校学生的点评：列表、头部统计、表现排行、表现点评名单与分组方案即时移出该生（PRD 同步）',p:['teacher.html','docs'],i:['学生管理办理毕业 / 离校后（smGone）调用新增的 evGoneSync：头部统计按该生统计行（RK_STUS）扣回星星与点评次数，表现排行、表现点评名单（EP_STUS）与分组方案组员原地移出该生，随即重渲染','素质评价页列表（applyTevFilter）新增 evRecIn 判定：已毕业 / 离校学生的个人点评不显示（本人写的也一样）；小组点评只算仍在读的组员（evMems），记录卡「组内 N 人」随之减少，组员全部离开则整张卡不显示','点评详情的表扬 / 待改进名单、学生点评明细的「点评组员」只列仍在读的组员；删除小组点评时按仍在读的组员人数扣回统计；stuevOpen 对已毕业 / 离校学生同样 toast「暂无该学生查看权限」','演示说明：素质评价页新增【已毕业 / 离校学生的点评】段（演示：学生管理里把王梓豪办理毕业或离校后回到本页）；学生详情页「素质评价已缓存的名单不跟随」改为毕业 / 离校即时跟随、转班不跟随','docs：飞书 V1.2.5 PRD 2.1.1.13 素质评价「查看」行补毕业 / 离校学生口径、原型现状列补「毕业 / 离校已跟随」，7.2 加 20261103 一行；小程序 PRD 2.5.1.6 第 3 条 a 项补同一口径，2.5.1.8「小组不得为空」条补「毕业、」，附录更新记录加 261103 行']},
{d:'2026-11-02 12:33:51',t:'学生点评明细页进入前校验查看范围：不在范围内 toast「暂无该学生查看权限」并留在来源页，扫码进入回首页（PRD 同步）',p:['teacher.html','docs'],i:['stuevOpen 进入前按该生现所在班级校验本人素质评价「查看」：不在范围内（停留期间权限被收回、学生已转出 / 毕业 / 离校）不进学生点评明细页，toast「暂无该学生查看权限」并留在来源页，不区分原因，口径同学生管理学生详情；素质评价页头像、表现排行榜行、点评面板「点评明细」三个入口共用，扫一扫（tScanStu）被拦时回首页','停留期间权限被整体收回时列表页不另做处理（再次取数为空、下次进首页宫格消失），只在注释与演示说明中写明','演示说明：素质评价页新增「预览 · 已无该生查看权限」（sevNoView，用一次即复位），素质评价页与学生点评明细页说明补校验口径','进入明细页时补一次 evMoreSync，补齐的演示记录按当前权限显示「⋯」','docs：飞书小程序 PRD 2.5.1.9 第 1 条 c 项补进入前查看校验，附录更新记录补 i 项；V1.2.5 PRD 2.1.1.13 素质评价「查看」行补同一规则，「查看」行原型现状列重新写入（核对时发现该格为空），「修改」「删除」行原型现状的演示入口名称按原型更新，7.2 补「同日四补」']},
{d:'2026-11-02 11:29:59',t:'点评编辑 / 删除权限改为本人点评始终可操作、他人点评按权限点与范围，满足任一即可；无权限预览改在他人点评上演示（PRD 同步）',p:['teacher.html','docs'],i:['编辑 / 删除判定写明满足任一即可：①本人写的点评，不看所属班级是否仍在本人查看范围内（查看只决定列表里能否找到它）；②持有「修改」/「删除」且范围覆盖记录所属班级。本人写的点评复核时只会遇到「已被删除」','复核无权限时不再给记录卡打 data-noedit 标记，改为模拟对应权限点被收回：保存失败收回「修改」「删除」，删除失败只收回「删除」，随后按最新权限重算「⋯」','新增 tedPermDemo()：先模拟持有「修改」「删除」，在林老师（3年级-2班）的点评上打开编辑页 / 操作半屏并设定下一次复核时权限已收回；演示入口改为「预览 · 编辑他人点评时修改权限被收回」「预览 · 删除他人点评时删除权限被收回」，替换原先在本人点评上模拟的两个入口','编辑点评页、素质评价页演示说明与校验注释同步新口径','docs：飞书 V1.2.5 PRD 2.1.1.13 素质评价「修改」「删除」行恢复「本人写的点评可编辑 / 可删除」并补注不看查看范围、两条满足任一；小程序 PRD 2.5.1.6 第 5 条总述与 d 项、2.5.1.13 第 3 条 a 项同步；素质评价页小组点评改为随组员显示（任一组员在范围内即显示，含历史学年），两份 PRD 更新记录均已补记']},
{d:'2026-11-02 11:06:19',t:'素质评价记录卡「⋯」按修改 / 删除权限点显示，分组方案去掉校长例外仅创建人可改（PRD 2.1.1.13 / 2.5.1 同步）',p:['teacher.html','docs'],i:['素质评价页记录卡「⋯」改为按权限显示（V1.2.5「素质评价 · 修改 / 删除」权限点）：本人写的点评可编辑、删除；他人写的点评持有对应权限点且范围覆盖记录所属班级才显示，半屏只列有权限的操作，都没有时不渲染「⋯」（不置灰）；新增 evPerm / evCan / evMoreSync，切换校长 / 教师视图时同步重算','演示说明新增「预览 · 持有修改 + 删除」「预览 · 只持有修改」「恢复 · 只能处理本人点评」：王老师范围为班主任班 3年级-2班（林老师在该班的点评随之出现「⋯」），校长视图为全校；默认与班主任职务默认值一致，只能处理本人点评','保存 / 删除复核发现无权限后改为给该卡打 data-noedit 标记并重算「⋯」，之后再给权限也不恢复','分组方案去掉校长例外：epPlanEditable 改为仅创建人可改（以 V1.2.5 PRD 2.1.1.13 为准），相关注释与表现点评、小组管理页演示说明同步','docs：飞书 V1.2.5 PRD 2.1.1.13 第 1 条 a 项与素质评价查看 / 修改 / 删除 / 分组方案行补点评记录数据归属口径（个人点评随学生、小组点评按小组所在班级 + 学年、往年小组点评只读、分组方案按学年不沿用）与原型现状，7.2 加 20261102 一行；小程序 PRD 2.5.1.6 / 2.5.1.8 / 2.5.1.9 / 2.5.1.13 同步，V1.2.0 的「仅本人可编辑 / 删除」「校长可管理任意方案」旧句划掉，附录更新记录并入 261102 行']},
{d:'2026-11-02 09:32:43',t:'编辑点评保存 / 删除时增加服务端校验：点评已被删除给 toast，无权限弹单按钮对话框且不区分原因（PRD 2.5.1.6 同步）',p:['teacher.html','docs'],i:['编辑点评页「保存点评」与点评记录「删除点评」执行前新增 tedCheck 校验（原型以 tedSim 模拟服务端结果，用一次即复位）：点评已被删除 → toast「该点评已被删除」，记录移出列表、统计扣回并返回来源页；点评仍在但无权限 → tAlert 单按钮对话框，保存为「无法保存」/「您暂无编辑该点评的权限，本次修改未保存。」，删除为「无法删除」/「您暂无删除该点评的权限，点评未删除。」，点「我知道了」返回来源页、该卡去掉「⋯」','无权限提示不区分具体原因：编辑权限不只取决于是否任教该班，也可能来自职务，统一口径避免说错原因、也不暴露权限细节','删除执行拆出 tedRemoveCard()（删除成功与校验发现已被删除共用）','演示说明：编辑点评页新增「预览 · 保存时无编辑权限 / 保存时点评已被删除」，素质评价页新增「预览 · 删除时无删除权限 / 删除时点评已被删除」，两页说明文字补充校验口径','docs：飞书小程序 PRD 2.5.1.6 第 5 条新增 d 条「保存与删除时的校验」（绿色高亮），附录详细更新记录加 261102 一行']},
{d:'2026-10-30 11:21:55',t:'关键词搜索框按占位文字自动加宽，占位文字完整显示（上限 360px）；后台原型设计规范「筛选条」补充约定',p:['admin-trade.html','admin.html','school.html','docs'],i:['运管端、学校端新增 fitSearch()：页面加载时按占位文字实测宽度把关键词搜索框 .search 的最小宽度撑到刚好放下，只加宽不缩窄、上限 360px，字体加载完成后再算一次','实际加宽两处：admin-trade.html 支付单「支付单号 / 办理记录编号 / 渠道交易号 / 支付人」220 → 297px（此前截断在「渠道交」）、退款流水「退款流水单编号 / 微信退款单号 / 退款单编号」220 → 283px；其余搜索框 220px 已放得下，不变','docs：docs/admin-prototype-design-spec.md「筛选条」补一条：关键词搜索框占位文字必须完整显示，宽度随占位文字、上限 360px，超出时精简措辞，不靠截断']},
{d:'2026-10-30 11:15:59',t:'运管端下拉框同步改为自绘面板：admin-trade 14 个、admin 1 个，与学校端及后台原型设计规范一致',p:['admin-trade.html','admin.html'],i:['admin-trade.html 办理明细 / 支付流水 / 退款 / 退款流水 / 操作日志各页的筛选下拉（状态、类型、时间档位等）与每页条数下拉，admin.html 分页条数下拉，按 docs/admin-prototype-design-spec.md「下拉选择 select + 自绘面板」改造：自绘箭头距右边缘 10px，点击在框下方弹出白色面板（圆角 10、下拉阴影、选中项主色淡底 600 字重），不再弹 macOS 原生菜单盖住框；页面靠下的分页条数下拉空间不够时向上展开','样式与面板逻辑与学校端 school.html 同一份代码；原 select 仍为数据来源，选中后派发 change，各页筛选逻辑不变；下拉面板开着时按 Esc 只关面板、不连带关闭弹窗或抽屉；学校 / 操作人联想输入框不受影响']},
{d:'2026-10-30 11:12:03',t:'后台原型设计规范新增「下拉选择 + 自绘面板」一节；学校端下拉面板圆角、阴影、选中字重对齐规范令牌',p:['school.html','docs'],i:['docs：docs/admin-prototype-design-spec.md「六、通用组件」在筛选条之后新增「下拉选择 select + 自绘面板 .sel-pop」：外观（自绘箭头距右 10px、展开描边变主色）、面板（框下方 4px、宽度不小于框、限高 280px、空间不够向上展开）、选项（选中主色淡底 600 字重、禁用与分组）、实现约定（select 仍为数据来源、写回后派发 change、新页面写 select 即自动接入）与关闭时机','学校端下拉面板按规范已有令牌调整：圆角 8 → 10，阴影改为下拉阴影 0 12px 32px rgba(15,30,80,.12)，选中项字重 500 → 600']},
{d:'2026-10-30 11:09:22',t:'学校端下拉框改为自绘面板：箭头右侧留白，展开时面板在框下方弹出、不再盖住框',p:['school.html'],i:['学校端全部下拉框（筛选栏、分页条数、添加老师 / 分配职务等对话框内）去掉浏览器原生外观：右侧自绘箭头，距框右边缘 10px（此前原生箭头几乎贴边），展开时描边变蓝、箭头朝上','点击不再弹原生菜单（macOS 原生菜单会把当前选中项对齐到框上，盖住框且边缘不规则），改为在框正下方 4px 弹出白色面板：宽度不小于框，当前选中项浅蓝底蓝字，支持分组（教师名单职务筛选的「自动关联 / 手动分配」）与不可选项（分配职务中已选的职务置灰）；下方空间不够时向上展开，点面板外、滚动、缩放窗口或按 Esc 关闭','原 select 仍作为数据与状态来源，选中后写回并派发 change，各页面筛选逻辑不变']},
{d:'2026-10-30 10:29:58',t:'学校端班级列表收敛规则与老师端统一：3 个班以内全列，超过 3 个只列前 2 个并接「等 N 个班」（PRD 2.1.1.7 同步）',p:['school.html','docs'],i:['学校端新增共用收敛函数 clsSum：3 个班以内全列，超过 3 个只列前 2 个并接「等 N 个班」（N 为总数），与老师端教师管理名册行副标题、首页头部副标题（clsBrief）同一阈值；此前学校端为超过 2 个即收敛，同一位老师任 3 个班时两端显示不同','四处改用 clsSum：添加老师对话框候选行班级身份摘要（「班主任」「任课」两段各自收敛，此前班主任段从不收敛）、教师名单「职务」列自动关联行、名单 / 详情的自动关联职务行、注册审核列表班级列','演示说明「教师名单」条目的收敛口径同步','docs：飞书 PRD 2.1.1.7「选择老师」区班级身份摘要由紫色待确认定稿为绿字新规则（旧句删除线），7.2 当天记录补一句']},
{d:'2026-10-30 10:00:02',t:'职务管理添加老师：数据权限类型被改为全校等类型时也先红字拦一次，移除在任老师补「已不持有本职务」并发处理（PRD 2.1.1.7 同步）',p:['school.html','docs'],i:['添加老师对话框点确定时，职务的数据权限类型已被别处改成不需选范围的类型（全校 / 任教班级 / 班主任班级）：此前直接按新类型写入，范围可能在操作者不知情时被放大到全校；改为保留已选老师、刷新范围区与影响提示，红字「本职务的数据权限已改为「{范围}」，请确认后再提交」，再次确定才写入（改为指定年级 / 班级时仍为「请重新选择范围」）','移除在任老师点「确认移除」时重读最新数据：该老师已被别处移除时不报错，关闭确认框、toast「{老师} 已不持有本职务」并刷新在任老师表格；职务已被删除时 toast「本职务已被删除」（此前直接读取职务记录会报错）','演示说明「添加校验与并发修改」条目补上述两条口径','docs：飞书 PRD 2.1.1.7 添加校验表「兼任职务上限」「所选已全部持有」两行按原型实际文案对齐（请确认后再提交 + 括号提示、多人逐人列出），表后段补数据权限类型改为不需选范围时的处理；移除确认框「这是其主职务，移除后主职务清空」与 2.1.1.7 / 2.1.1.11 / 2.1.2 日志明细前缀「主职务：」按原型改为「职务」；7.2 详细更新记录追加 20261030 一条']},
{d:'2026-10-30 01:48:05',t:'老师端状态筛选改为下拉面板：考勤明细、代学生补签、信息确认、办理记录四处替换原生下拉',p:['teacher.html'],i:['考勤明细（全部 / 待签到 / 正常签到 / 迟到 / 待签退 / 正常签退 / 早退 / 缺卡 / 请假）、代学生补签（默认缺勤）、信息确认（全部 / 未提交 / 待确认 / 已确认）、办理记录（默认落在该生当前状态）的状态筛选由原生 select 换成按钮 + 下拉面板：原生下拉在桌面是浏览器系统菜单、在小程序里是底部滚轮，均不是小程序列表页的筛选样式','下拉面板：点按钮从筛选栏下沿展开白色面板，下方列表盖半透明遮罩，按钮变蓝、箭头朝上；当前项蓝字加粗并打 ✓，选中即收起并筛选；点遮罩、再点按钮、点日期 / 班级 / 返回等面板外位置均收起，切页时自动收起','四处共用一套 ddOpen / ddPick / ddVal / ddSet（assets/teacher.js），原读写 select.value 的地方（考勤明细列表、首页统计直达、代学生补签列表、信息确认统计栏点击、办理记录默认状态）改走 ddVal / ddSet，筛选口径不变','演示说明：四页条目补充下拉面板说明（2026-10-30 替换原生下拉），各加「打开状态筛选下拉面板」演示入口；信息确认「筛选未提交学生」入口改走统计栏同一函数']},
{d:'2026-10-28 16:17:49',t:'我的校徽接上「无需上传学生证件照」校级开关：NO.0008–0010 与对应 3 枚办理单切为无照片版式，旧徽保留照片',p:['parent.html'],i:['我的校徽 Tab：校级配置为无需证件照时校徽卡直接去掉左侧照片位（校名条 + 姓名 + 班级·编号向左顶满、二维码不变），不用首字母头像或人形占位，与校徽办理 Tab 徽面预览 / 支付半屏 / 办理记录的无照片版式同一套','逐枚口径：每枚徽按自己制作当时有无照片显示、不按当前校级配置；开关打开后只有 6月26日 3 枚单的 NO.0008 / 0009 / 0010（待核验）切为无照片版式，NO.0001–0004 与林晓晴的 NO.0005 为旧徽、照片不变，新旧徽在同一列表并排（parent.css 按 body.nophoto 只隐藏 bd6–bd8 的照片位）','办理记录 Tab：该 3 枚单（SS2026062641572089）标记为跟随配置，新增 odPhotoCfgSync 在开关切换时同步数据并重绘——列表缩略图无照片位、记录详情不展示「学生证件照」行，其余记录保留照片形态','我的校徽 Tab 演示说明新增同名开关行「无需上传学生证件照（校级配置 · NO.0008–0010 无照片位）」，与校徽办理 Tab 为同一个开关（proto-nophoto，刷新保留）；我的校徽 / 办理记录两个 Tab 的演示说明补逐枚口径、无照片徽不提供替换照片入口，并注明演示简化：日期更晚的其他演示记录各自承载状态演示、不按日期推演']},
{d:'2026-10-28 15:26:27',t:'设计文档 13.4.1 补「数据所属班级」判定规则，13.4.4 补升学年与转班后的请假单口径（与 PRD 2.1.1.13 1.a 同步）',p:['docs'],i:['docs/design.md 13.4.1 在「逐条计算，不先合并」之后、「判定规则」列表之前新增「数据所属班级（2026-10-27 定，2026-10-28 补入本文）」：学生记录（请假单、信息确认、学生管理、考勤等）按学生在当前学年所属的班级归属、不按业务单据上记录的班级；班级评价、智慧放学等挂在班级上的记录按记录所在班级归属、不经学生；班级 ID 跨学年固定、升学年只为学生新增对应关系，上学年旧数据不进新一届班主任范围，现班老师可见其历史数据（含转班前、上学年在别的班产生的），毕业 / 离校学生老师端覆盖不到；单据上的学年与班级快照只用于统计与审计。下文「该数据所属班级」「该单所属班级」统一按此取，此前 design.md 只用了这个词、没有定义','13.4.4 王老师示例之后新增「升学年与转班后的请假单（2026-10-27 定）」：旧单不进新一届班主任的列表与待办，未闭环的待审批 / 销假待确认自动进现班主任「待我审批」，原班主任不再覆盖该生即不可见，毕业 / 离校学生的历史单只剩家长端可见。此前只写在飞书 PRD 请假节权限与消息口径 d 项','飞书 PRD T9K9 2.1.1.13 同日已把 10-27 补在标题下的「范围判定总则」并入第 1 条为 1.a「数据所属班级」，并补「班级记录按记录所在班级归属、不经学生」半句，7.2 当天记录已合并']},
{d:'2026-10-28 14:26:44',t:'设计文档 13.4.4 智慧放学第二个 Tab 的「全校」判定：按职务范围类型，多个指定年级 / 班级叠加覆盖全校仍叫「可查看班级」（PRD 同步）',p:['docs'],i:['docs/design.md 13.4.4 页面形态段「全校为「全校班级」，否则为「可查看班级」」后补：「范围为全校」指本人持有范围类型为「全校」且带智慧放学「查看」的职务；多个指定年级 / 指定班级叠加后恰好覆盖全部已启用班级的仍叫「可查看班级」（2026-10-28 定）。Tab 名称表达授权性质，叠加覆盖会随新建班级、班级撤销、年级升届来回变化，且与 13.4.2 校级功能只在职务数据权限为全校时生效同口径','飞书 PRD T9K9 2.1.5.4 3.a：拗口的「第二个 Tab 全校范围为「全校班级」，否则为「可查看班级」，」改为「第二个 Tab 的名称按「查看」范围定：范围为全校时叫「全校班级」，否则叫「可查看班级」。」并接上同一句补充（旧句删除线、新句绿字），7.2 当天记录合并；原型第二个 Tab 名称按演示视角切换，不受影响']},
{d:'2026-10-28 09:28:36',t:'考勤明细 / 代学生补签的日期筛选换成「‹ 日期 ›」胶囊 + 半屏月历；智慧放学 Tab 显示条件按可查看的任教班级判定（PRD 同步）',p:['teacher.html','docs'],i:['考勤明细、代学生补签两页的原生 input[type=date] 换成同一套日期胶囊：左右箭头切上一 / 下一上学日（自动跳过周末，到今天提示「已是今天」），中间「今天 7月6日」/「7月3日 周五」文案点开半屏月历——上学日可选，周末、未来与演示范围外置灰，今天蓝圈标记，‹ › 切月（只开放 2026年6月–7月），页脚「回到今天」，选中即关闭并刷新列表。原生控件在小程序里是系统滚轮、桌面是浏览器面板，与整套风格不符且带「清除」与真实今天','日期改为脚本状态变量（attcDate / asDate），签到页定位所选日期的逻辑同步改读；代学生补签页从考勤明细进入时沿用那边所选日期，列表的缺勤标签与状态筛选按所选日期取值（今天实时、历史上学日与签到详情同源、非上学日列表为空并提示）','月历格子复用签到详情页 .cd 样式，新增 .attc-dt / .dp-ft 样式；无头 Chrome 验证箭头切日、月历置灰与选中、6月24日 林晓乐两栏状态、补签页带入日期与周末空态','演示说明：考勤明细、代学生补签两页描述更新，新增「打开日期月历」「切到 6月10日」演示按钮','智慧放学页演示说明补 Tab 显示条件口径（2026-10-28 定）：按「可查看的任教班级 = 任教班级 ∩ 查看范围」判定，非空且查看范围超出它才显示两个 Tab，「任教班级」Tab 只列持有「查看」的任教班；有任教班级但都没有「查看」的账号按不带班形态、不显示 Tab。design.md 13.4.4 同步；飞书 PRD 2.1.5.4 3.a / 3.b 已改（旧句删除线、新句绿字）并记入 7.2']},
{d:'2026-10-28 09:10:18',t:'考勤明细点缺卡学生改为进该生校园签到页并定位所选日期；考勤明细列表按所选日期生成、与签到页同源',p:['teacher.html'],i:['考勤明细点上学缺卡的学生不再进单人补签页，与其他状态一样进入该生的校园签到页（签到详情），并定位到筛选栏所选日期；补签统一走底部「代学生补签」。单人补签页保留、无产品入口，经考勤明细演示说明「预览 · 单人补签页」进入','考勤明细列表按筛选栏所选日期生成（此前选其他日期只弹「历史日数据已定格」提示、列表仍是今天的数据，与签到页对不上）：今天为实时记录；历史上学日对全班逐人取签到详情页同一套定格记录（按姓名散列生成，林晓乐用家长端同一套日期常量）折成「上午 · 上学」「下午 · 放学」两栏，午间与晚自习不保留；周末为「非上学日 · 当日无考勤数据」空态；日期选择器限定 2026年6月1日–7月6日','林晓乐特殊日映射：6月24日 上学缺卡 + 放学早退 15:10，6月10日 两栏缺卡，6月17日 / 25日 / 2日 / 3日 全天请假，6月4日 等签到侧请假日上学栏「请假 · 08:00–14:00 · 已通过」，6月22日 放学栏请假，6月19日 「考勤时间 07:50 · 老师补签」，6月26日 「老师补签改为迟到」；无头 Chrome 对 3年级-2班 / 1班 全部历史上学日逐人比对 2225 个人日，列表状态与签到页该日记录一致','stuDays 拆为纯生成函数 stuDaysGen + 缓存，不再依赖当前打开的学生；历史日页脚说明去掉「更新约延迟 1–5 分钟」','演示说明同步：考勤明细、学生签到详情、补签三页描述更新，考勤明细新增「点击上学缺卡学生（周雨桐）→ 校园签到页」「预览 · 单人补签页」及切到 7月3日 / 6月24日 / 6月10日 / 6月17日 / 7月5日 周末空态 / 切回今天 的演示按钮']},
{d:'2026-10-27 18:36:09',t:'考勤明细里林晓乐的当天记录改为家长端同一套时间并去掉晚自习；签到详情今天视图补放学时段两条通行记录',p:['teacher.html','parent.html'],i:['考勤明细 3年级-2班 林晓乐当天记录改为 07:42 到校、11:47 午间签退、13:36 下午到校、16:58 放学签退，晚自习两个字段置空（与代学生请假的演示排班「只有王一彤、杨梓冉有晚自习」一致；此前为 11:46 / 13:35、放学待签退并带 18:32 / 20:35 晚自习记录，自相矛盾）；考勤明细晚上组不再出现林晓乐','签到详情「今天」视图：林晓乐各节点通道与抓拍图按家长端逐节点一致，放学时段补 16:47 / 16:52 两次出校与校门再识别的轻量通行记录，离校以最后一次出校 16:58 为准，共 6 个节点；学生卡 chip 随之变为「今日已离校」；统计数字不变','演示说明：签到详情页与考勤明细页补林晓乐当天记录与家长端一致的说明；家长端校园签到页说明同步改为「教师端林晓乐今天与历史记录均与本页同一套数据」']},
{d:'2026-10-27 18:13:25',t:'老师端签到详情：林晓乐历史记录套用家长端同一套演示日期；删除空壳的学生请假记录 / 详情页',p:['teacher.html','parent.html','docs'],i:['林晓乐（3年级-2班）6月1日–7月4日 的历史记录改为与家长端校园签到页同一套演示数据（数据常量与按日视图自 parent.js 移植）：6月17日 / 25日 / 2日 / 3日 全天请假、6月10日 全天缺勤、6月24日 到校缺卡 + 早退 1小时20分钟、6月19日 老师补签、6月26日 补签改判迟到、7月2日 迟到 21 分钟、时段请假 7 日、7月4日 周六返校通行记录；6月统计（应出勤 22 / 出勤 17 / 请假 4 / 时段请假 27 小时 / 缺勤 1 / 迟到 2 / 早退 2 / 缺卡 2）与 7月统计与家长端同数；其余学生仍按姓名生成','统计卡新增「时段请假 × 小时」行（有时段请假的月份才出，可点筛选命中日），「查看该生 ×× 日」入口改为按统计子类逐日查找、新增「时段请假日」','删除从未接入的空壳页「学生请假记录」「学生请假详情」（#sc-stuleave / #sc-stuleavedt）及其演示说明与 hash 直达兜底项；考勤明细请假行跳转与签到详情「查看请假单」链接作为后续迭代方向记入 docs/design.md 附录开放决策清单','演示说明：签到详情页补林晓乐与家长端一致的说明，新增林晓乐 6月24日 / 10日 / 19日 / 26日 / 25日 / 22日 / 16日、7月4日 与 6月统计入口；家长端校园签到页说明同步改为「教师端林晓乐与本页同一套日期」']},
{d:'2026-10-27 18:04:07',t:'老师端学生签到详情页与家长端校园签到页对齐：日历选日、按日时间轴、统计月历与月份选择器',p:['teacher.html','parent.html'],i:['页面结构改为与家长端 parent.html#sc-atthist 同构：学生卡 → 「签到」Tab 顶部日历（收起为周条、点底部把手展开整月，左右滑动或箭头切上一 / 下一周（月），点标题呼出年月选择器半屏，超出 2026年6月–7月 的月份置灰）→ 按日时间轴；「统计」Tab 为指标卡 + 逐日出勤月历，月份标题同样可呼出年月选择器。原「今天 / 7月3日」两枚日期 chip 与 7月 / 6月逐日记录列表移除','日历上学日圆点按当日结果着色（青碧=正常、朱红=有异常、蓝=请假已通过），底部同款图例；点日期切换下方时间轴：今天为实时视图（按该生考勤明细当天记录），其余上学日为定格概要（到校 / 离校两节点、括注上学 08:00 / 放学 16:30），7 天内带抓拍、更早的注明影像已自动清理；请假日 / 缺勤日为顶部日级结论行 + 到校 / 离校两个置灰节点（--:-- 并标「请假」/「缺卡」chip）；周末为非上学日空态','6月1日–7月3日 的记录按姓名确定性生成（同一学生每次一致）：6月含 1–3 个迟到日，并可能含全天请假日、缺勤日、早退日、签退缺卡日各 1 个；统计指标卡（应出勤 / 出勤 / 请假 / 缺勤 / 迟到 / 早退 / 缺卡、出勤率环形图）按该生记录汇总，今天已到校即计入 7月应出勤，非 0 指标行可点筛选、月历只保留命中日期并按类别加浅色底，再点或切月取消；月历点日期跳回签到 Tab','学生卡今日状态 chip 全天缺卡改为「今日缺勤」，与日级结论行同口径；今天请假结论行去掉重复日期','演示说明：签到详情页重写，新增展开 / 收起月视图、打开月份选择器（签到 / 统计 Tab）、查看该生 6月请假日 / 缺勤日 / 迟到日 / 早退日 / 签退缺卡日（该生没有该类日时提示换人）、周末空态、6月迟到筛选等入口；家长端校园签到页说明里「教师端数据尚未同步」一句改为两端已对齐、数据不同源的说明','样式：从家长端同源移入周 / 月日历、年月选择器、统计指标行筛选与命中高亮样式（teacher.css）']},
{d:'2026-10-27 17:35:44',t:'老师端学生签到详情页按点击的学生渲染，任意学生可进；上学缺卡学生进补签页按该生填充',p:['teacher.html'],i:['考勤明细点任意学生行（待签到 / 待签退除外）都进入该生的签到详情页，不再弹「以林晓乐为例」的演示提示：头部学生卡（头像、姓名、班级、今日状态 chip：正常 / 迟到 / 早退 / 请假 / 缺卡 / 放学缺卡）与「今天」时间轴按该生在考勤明细里的当天记录生成——到校、午间出入、离校、晚自习各节点，迟到 / 早退注记，缺卡与请假为占位节点；入校区块多于一组抓拍才出「收起」','上一上学日 7月3日 与「统计」Tab 的 7月 / 6月 为按姓名确定性生成的演示数据（同一学生每次一致），7月记录里「今天」一行与当天记录一致（迟到分钟数、早退、请假、放学缺卡）；抓拍大图标题带该生姓名','上学缺卡的学生点行进入补签页，头部头像 / 姓名 / 班级按该生填充，确认补签改的就是这名学生（此前补签页固定为周雨桐）；放学缺卡进签到详情','页面静态内容改为骨架 + JS 渲染，hash 直达或演示说明直接打开时默认显示林晓乐；考勤明细与签到详情演示说明更新，新增迟到 / 早退 / 请假 / 放学缺卡学生的直达入口']},
{d:'2026-10-27 17:24:11',t:'演示账号王老师去掉兼任的校级管理员职务，老师端按真实权限范围演示；待审核列表按「注册审核」范围过滤',p:['teacher.html','school.html'],i:['共用名册（duty-store.js）：王老师 t26 的兼任职务清空，只保留 3年级-2班 班主任 + 任课 3年级-1 / 2 / 3班；存储键升 v19，浏览器缓存的旧名册自动按新种子重建（演示过程中改过的职务、教师数据随之重置）；学校端职务管理校级管理员成员只剩何静','去掉后各页变化：信息确认页 3年级-3班 唐博文默认只剩「信息详情」（办理记录按钮与只读页同步）、一键提醒只计 3年级-2班 的 2 位未提交；个人资料「兼任职务」与教师详情显示「无」。不变：首页宫格角标 2 / 6 / 4 / 2、信息确认统计栏 135 / 3 / 3 / 129、请假待我审批、学生管理名册、校园签到范围、素质评价','待审核页：列表与分类 tab 角标新增按本人持有覆盖该班「注册审核」的班级过滤（spInScope），王老师只列 3年级-2班 注册 3 + 认领 3 条、与「待审核」按钮及首页角标同数；3年级-1班 2 条与 4年级-1班 孙伟的学校注册码申请仍在演示数据里、不在范围内不显示','首页「预览 · 学校取消班主任三项」与信息确认页「预览 · 学校取消班主任一键提醒未提交」按钮文案去掉「且无其他职务覆盖」；首页、信息确认、办理记录、校园签到、考勤明细、代学生补签、学生管理、待审核、教师管理、教师详情的演示说明不再写「校级管理员全校范围不单独演示」，改按真实范围说明；个人资料与教师详情 HTML 注释、脚本注释同步','飞书 PRD：2.1.1.13 权限表智能校徽「信息确认」「一键提醒未提交」「注册审核」三行原型现状列同步，7.2 记一条']},
{d:'2026-10-27 17:10:50',t:'老师端共用演示名册按真实班额补满；考勤明细 / 代学生补签班级选择收敛为任教班',p:['teacher.html'],i:['共用演示名册：基础名单与登记学生之后，用自动生成的学生补满到校园签到统计的班额（3年级-2班 45 人、3年级-1班 44 人、3年级-3班 46 人，全校 22 个班 1037 人、无重名）；此前 3年级-2班 只有 19 人，与信息确认页、学生管理统计栏的 45 对不上。补入学生当天考勤一律正常到校，3年级-2班 原 12 人的手写考勤状态与迟到 / 缺卡 / 请假剧情不变；考勤明细、代学生补签、代学生请假选人、学生管理、素质评价表现点评与评价报告选学生同步变为同一人数','学生管理班额取值改为复用名册的同一函数 stuClsSize，统计栏 135 不变、名单人数与之相同','考勤明细、代学生补签的「选择班级」半屏候选由全校 50 个班收敛为与统计页同一份任教班清单（3年级-2班 班主任在前，3年级-1班、3年级-3班 任课在后），对应 PRD「考勤明细候选只列查看范围内的班」「补签页候选只列持有『代补签』的班级」；校级管理员全校范围的形态与学生管理、素质评价一样不单独演示','演示说明：校园签到统计页任教班清单改为三个班并注明范围简化口径；考勤明细、代学生补签、学生管理、代学生请假、评价报告选学生的说明同步更新人数与候选范围']},

{d:'2026-10-27 15:06:01',t:'老师端办理记录页按学生真实状态生成记录，筛选默认落在该生当前状态',p:['teacher.html'],i:['此前每个学生固定两条假记录（一条待确认、一条已确认），已确认学生点进来会多出一条可再次确认的待确认记录，且时间与信息确认页不符；改为从信息确认页该生行读取状态与时间：待确认学生一条待确认记录（时间 = 提交时间），已确认学生一条已确认记录（提交时间取确认时间前一小时，演示中「确认无误」后沿用原提交时间）','筛选默认值由写死的「待确认」改为跟随该生当前状态；进入办理记录页时状态以信息确认页该行 data-cf 为准，演示中确认 / 取消确认后再进来即为新状态','办理记录页演示说明同步']},

{d:'2026-10-27 14:39:55',t:'老师端办理记录页「信息确认」按钮改为按本人是否持有覆盖该班「信息确认」权限判定，无权限只显示「信息详情」只读',p:['teacher.html','docs'],i:['办理记录页按钮：待确认且 mePermOn(\'badge.confirm\',班级) 为真才给可编辑的「信息确认」，否则（无权限或已确认）只给只读「信息详情」；只读详情页状态随记录显示待确认 / 已确认，「取消确认」只对已确认且持有该班权限的记录显示','首页演示说明「预览 · 学校取消班主任三项」联动办理记录页重绘：预览态所有待确认只剩「信息详情」，恢复后还原；办理记录页、只读详情页演示说明同步','演示口径更正：王老师兼校级管理员、全校持有「信息确认」，默认态 3年级-3班 唐博文仍可确认，信息确认页统计 3、首页角标 2 不变','飞书 PRD：2.1.1 权限表「信息确认」行原型现状列补按钮已按权限判定，记 7.2']},

{d:'2026-10-27 11:54:52',t:'老师端学生管理宫格角标改为与智能校徽同口径：只计本人担任班主任且持有覆盖该班「注册审核」权限的班级',p:['teacher.html'],i:['此前按「本人有审核资格」计全部待审（王老师兼校级管理员故为 9），与同模块「审核提醒只发给该班持有注册审核的班主任」及请假「责任归属唯一、待办不虚高」不符','spUpdateCatBadges 的首页宫格角标与学生管理页「待审核」按钮角标改为按班主任班 + mePermOn(stu.audit) 过滤：王老师演示 3年级-2班 注册申请 3 + 家长认领 3 = 6，3年级-1班 任课班 2 条与 4年级-1班 学校注册码 1 条可见可办但不计；待审核列表与分类 tab 角标仍按审核权限范围列全部','无头验证：默认 6 / 6；学校取消班主任「注册审核」且无校级管理员兼任时隐藏，智能校徽角标不受影响仍为 2','首页、学生管理、待审核三处演示说明同步；飞书 PRD 2.1.1.13 第 2 条 iii 项与权限影响表「注册审核」行同步']},

{d:'2026-10-27 10:54:38',t:'老师端王老师任教班以共用名册为准：信息确认页改列 3年级-2班 / 3年级-3班，校园签到任教班收敛',p:['teacher.html'],i:['共用名册（duty-store t26）王老师为 3年级-2班 班主任、任课 3年级-2班 / 3年级-3班，而信息确认页列 2年级-1班 / 2年级-3班 / 3年级-2班 / 4年级-1班、校园签到 attMine 列 11 个班、首页演示说明写 4年级-1班，三处互不一致','信息确认页只保留 3年级：3年级-2班 不变，新增 3年级-3班 班卡（3班 46 人：未提交 1 · 待确认 1 · 已确认 44），原 4年级-1班 的钟梓萱 / 唐博文（待确认）/ 谢雨涵 迁入，补未提交学生罗一凡；去掉 2 年级与 4 年级分组；统计栏改为在读 91 / 未提交 3 / 待确认 3 / 已确认 85，3 年级表头同步，宫格角标仍为 2、统计仍为 3','STU_EXTRA 登记同步：4年级-1班 条目改为 3年级-3班 并加罗一凡，删去已不在任何页面出现的 2年级-3班 高欣怡 / 吴俊杰与 2年级-1班 张明睿 / 刘思琪，孙浩然保留在 2年级-1班（学生管理演示说明引用）；tools/check-demo-roster.sh 通过','校园签到 attMine 收敛为 3年级-2班（班主任）/ 3年级-3班（科任）两个班','首页演示说明角标一段改为「统计栏按本人查看范围计全部、角标只计其中本人班主任班级的部分」口径，示例改为王老师兼 3年级-3班 任课、统计 3 / 角标 2，与飞书 PRD 2.1.1.13 第 2 条当日改法一致']},

{d:'2026-10-26 19:01:03',t:'老师端全部请假：郑皓宸 7月6日 卡状态随单据走，销假待处理时显示「销假待确认」',p:['teacher.html'],i:['该卡与「待我审批」的销假待确认卡为同一张单，此前卡上仍写死「已通过」、点进却是销假确认页；改为「销假待确认」琥珀胶囊并加「实际结束时间 7月6日 13:00」行，与家长端列表卡同口径（PRD 2.1.4 请假列表「销假待确认」记录卡）','班主任不同意销假后卡回到「已通过」并去掉实际结束时间行（cxReject 重绘），确认销假后转「已销假」沿用原逻辑；「全部状态」筛「销假待确认」能筛出该卡；演示说明同步']},
{d:'2026-10-26 18:57:06',t:'CLAUDE.md 新增「小程序 Toast 口径」约定',p:['docs'],i:['产品 toast 不超过 11 字、只放一句话，更长的结果说明走 pAlert / tAlert 单按钮对话框；演示提示一律 demoToast、产品提示不带演示后缀；改 toast 文案时飞书 PRD 引用同步，PRD 已定稿写法以 PRD 为准']},
{d:'2026-10-26 18:51:35',t:'toast 文案与飞书 PRD 对照：原型三处按 PRD 既定口径回调，PRD 两篇共 45 处旧文案更新',p:['parent.html','teacher.html','docs'],i:['家长端校徽核验 / 重新启用 toast 回调为 A0HK 6.2 已定稿的「NO.000X 已核验并启用」「NO.000X 已重新启用」（单枚、多枚同一句，剩余枚数由核验半屏「本次办理」行回答），演示说明同步','老师端新增教师按 T9K9 2.1.2 已删去「两个班级都为空时追加」的口径统一为一句「已新增 {姓名}，待激活」，去掉上一批加的空班级对话框分支；注册审核单人通过改为「已通过，教师信息已生效 / 已通过，信息已更新」','飞书 V1.2.5 PRD（T9K9）25 处、家长端 PRD（A0HK）20 处 toast 旧文案改为删除线 + 绿字新文案，7.2 当天记录与 A0HK 附录更新记录已记；旧租户两篇（MZ5g、BquN）未动']},
{d:'2026-10-26 18:36:25',t:'两端演示提示改走独立演示样式 demoToast，产品 toast 去掉演示后缀',p:['parent.html','teacher.html'],i:['新增 demoToast()：琥珀描边 + 「演示」角标、左对齐可多行、停留稍长，专放原型替代真实能力（扫码、拨号、播放视频、微信系统页）与演示开关切换结果的说明，不受 11 字限制；产品 toast 显示时自动清掉演示样式','两端共 139 处「演示：…」「已模拟 / 已恢复 / 已切换…视角」提示改为 demoToast（含素质评价演示说明里的三个重置动作）','带「（演示数据，刷新恢复）」「（演示）」后缀的产品动作提示去掉后缀（评语、小组、方案、点评删除、解绑、清空等 12 处；刷新恢复已由演示说明 chip 覆盖）；登录成功 / 验证码已发送 / 照片已上传 / 已选择学校 / 切换孩子 / 班主任审核通过等 17 处混合文案拆成产品短句，演示解释并入演示说明或 demoToast','加入家庭被拒改为单按钮对话框；小组计数方式切换改为 tAlert 点明「方案下所有老师同步变化」；重新扫描后两端产品 toast 全部不超过 11 字']},
{d:'2026-10-26 17:35:42',t:'两端 toast 产品文案压到 11 字以内：精简短句、结果说明改走单按钮对话框',p:['parent.html','teacher.html'],i:['口径（2026-10-26 定）：toast 只放一句话、不超过 11 字；12–15 字的直接精简，去掉括号补充与第二分句；16 字以上带后果说明的，toast 只留动作结果，说明移到页面状态或单按钮对话框。两端共改 199 处产品文案（演示提示本次不动）','家长端新增 pAlert 单按钮对话框（与老师端 tAlert 同款，样式表同步），绑定 / 认领锁定、不是我的孩子反馈、挂失 / 找回、退出人脸、取消办理退款、监护关系解除、加入家庭结果等 20 余处改用对话框','老师端认领不通过、认领锁定、注册码关停、补卡通过、打卡以校门记录为准、手机号已存在、职务被他人修改、首发校徽分发说明等改用 tAlert；放学播报、延迟放学、代录 / 代销假、审核结果等动态文案精简为动作结果','两端 toast() 加开发期守卫：产品文案超过 11 字时控制台告警（含「演示」「模拟」字样的演示提示除外）；演示说明中引用的旧文案同步']},
{d:'2026-10-26 17:16:47',t:'老师端疑似缺勤核对「确认缺勤并通知」加二次确认半屏',p:['teacher.html'],i:['该按钮会直接向孩子全部家人推送缺勤通知，此前一点即发；现在先弹半屏写明推送对象、通知不可撤回、推送前请先电话或群内联系家长，确认按钮红底（破坏性二次确认口径）、「再核实一下」灰描边，与退出登录、删除点评同款','确认后回待办工作台并提示已推送孩子的全部家人；演示说明同步']},
{d:'2026-10-26 17:10:33',t:'家长端按钮样式与老师端统一：底部操作条、半屏、正文整宽按钮同规格，红底只留破坏性二次确认',p:['parent.html'],i:['规格与老师端同一套：胶囊 22px、内边距 11px、字号 14、底部安全区 24px；底部操作条由 24px / 12px / 14.5 改为同规格，正文整宽按钮（登录、身份确认、家人邀请、消息设置、支付成功等页）去掉 10px 小圆角与内联尺寸，半屏内按钮由样式表统一压平，sm 小按钮除外；登录页微信绿色快捷登录按钮按微信样式保留','「提交请假单」「确认版面并支付」由正文末尾移到固定底部操作条，与老师端表单页一致','配色：「确认解绑」由浅红底珊瑚红字改为红底白字实心，「仍要停用」由珊瑚红描边改为红底实心，与老师端破坏性二次确认一致；设备卡「启用」小按钮去掉晴空蓝描边、「找到了 · 恢复」由青碧实底改晴空蓝，青碧 / 珊瑚红只留给状态 chip']},
{d:'2026-10-26 17:04:02',t:'老师端正文内整宽按钮并入统一规格，六个表单页的提交按钮改为固定底部操作条',p:['teacher.html'],i:['整宽按钮（blk）统一为胶囊 22px、内边距 11px、字号 14，与底部操作条、半屏按钮同规格；登录、注册、身份确认、无权限、注册码过期等页去掉内联尺寸与圆角覆盖（登录页微信绿色快捷登录按钮按微信样式保留）','代学生请假、新增学生、修改学生信息、添加孩子、教师补卡、新增教师六个表单页的提交 / 保存按钮由正文末尾移到固定底部操作条，与确认补签、修改教师信息、分配职务一致，长表单滚动时按钮始终可见']},
{d:'2026-10-26 16:40:05',t:'老师端半屏弹层内按钮按底部操作条同一规格统一',p:['teacher.html'],i:['半屏内按钮统一为胶囊 22px、内边距 11px、字号 14，与底部操作条一致；脚本拼出的半屏按钮原带 22px / 24px 圆角、9–12px 内边距等多种内联写法，由样式表统一压平，sm 小按钮除外','红底仍只用于破坏性操作的二次确认（确认退出、删除点评、解散小组等）；筛选消息、调整排序、选择本组学生等半屏核对通过']},
{d:'2026-10-26 16:37:02',t:'老师端底部操作条按钮样式统一：胶囊圆角、同一尺寸、次要按钮灰描边、次要左主操作右',p:['teacher.html'],i:['规格统一为信息确认页基线：胶囊 22px、内边距 11px、字号 14、底部安全区 24px；apply-foot / sd-foot / ep-foot / batchbar / sp-foot 五种底部条同口径，素质评价、教师详情、学生详情、注册审核等页去掉内联圆角与尺寸覆盖','次要按钮一律灰描边：去掉「一键提醒未提交」青碧描边、「取消确认」珊瑚红描边、「代学生请假」「代销假」「申请记录」晴空蓝描边（请假列表动态生成的代销假同改）','信息确认页按钮对调为「一键提醒未提交 / 分享校徽办理」，与其他页一致次要左、主操作右','批量审核「一键通过」、降级批量核对「一键补录到校」由青碧实底改晴空蓝实底；考勤异常处置「补录到校」改晴空蓝实底，「确认缺勤并通知」「上报校方」由红底改灰描边，青碧 / 珊瑚红只留给状态 chip']},
{d:'2026-10-26 16:27:57',t:'老师端信息确认页收起班级后卡底不再多出一条横线',p:['teacher.html'],i:['班级表头与名单之间的分隔线在收起后仍显示，贴在卡片底边形成多余横线；收起时一并隐藏，展开恢复']},
{d:'2026-10-26 16:24:23',t:'修复老师端信息确认页收起班级 / 年级后名单位置留下大片空白',p:['teacher.html'],i:['原因：折叠时先把内联 max-height 设为实际高度再加 collapsed 类，内联样式优先级高于类里的 max-height:0，名单只变透明、高度没收起','修法：加类的同时清掉内联 max-height，过渡动画照常；班级与年级两处折叠一并修，无头 Chrome 验证收起后高度为 0、再展开恢复']},
{d:'2026-10-26 16:22:03',t:'老师端首页智能校徽宫格角标改为只计本人班主任班级的「待确认」数',p:['teacher.html'],i:['口径（2026-10-26 定）：与请假「待我审批」同口径，正、副班主任同计；校长、年级组长等按范围持有信息确认权限的只是兜底处理，不计角标；信息确认页统计栏「待确认」仍按本人信息确认范围计全部，班主任看到的两数相等','原「信息确认页待确认数、只计本人查看范围内的班」会把任课班（只有查看、没有信息确认）算进来；王老师角标由 3 变 2，4年级-1班 那条待确认属任教班不再计入，确认 / 取消确认仍即时联动','首页与信息确认页演示说明同步；飞书 PRD T9K9 2.1.1.13 第 2 条同步改写并记 7.2']},
{d:'2026-10-26 15:57:46',t:'学校端与老师端第一阶段去掉「至少保留一名职务与权限管理持有人」的防锁死拦截',p:['school.html','teacher.html','docs'],i:['理由：学校端 Web 的登录与菜单权限由基础设置「角色管理」决定、不依赖职务里的「职务与权限管理」权限点，停掉最后一个持有职务也锁不住学校；该权限点第一阶段又不在界面展示，原弹窗要求「先把该权限分配给另一位在职教师」无法照做；最后一个持有人被收回只影响小程序内的职务分配入口，Web 端照常。待角色管理并入职务管理、Web 登录资格由职务决定后恢复','学校端：编辑权限保存、移除在任老师、停用职务、分配职务保存、设为离职五处不再走 wouldLock 拦截，函数保留未调用并注明恢复方式；职务管理演示说明去掉两个「体验防锁死」动作并改写相关句','老师端：教师详情分配职务「收回唯一持有人不能收回」与设为离职「唯一持有人请先分配给他人」两处 toast 拦截去掉，演示说明同步','docs/design.md 13.4.2 该条改为第一阶段不做并写明理由，13.4.6 两处引用同步，13.4.7 注明角色管理并入职务后恢复；飞书 PRD T9K9 2.1.1.9 第 5 条等处补注去除理由、删弹窗截图，记入 7.2']},
{d:'2026-10-26 15:45:18',t:'设计文档新增 13.4.7 账号同源与两端联动（第一阶段兜底），附录开放决策清单加「角色管理是否并入职务管理」',p:['docs'],i:['docs/design.md 13.4.6 之后新增 13.4.7：写明现状（小程序权限走职务管理、Web 权限走角色管理，两端账号独立——小程序源于教师名册、Web 用户在基础设置用户管理维护）、六点弊端、长期方向「一套权限模型、两个入口」','第一阶段兜底三件事按依赖顺序：以手机号为关联键、Web 用户从教师名册选人实现账号同源；名册离职 / 停用 / 换绑单向联动 Web 用户；校级管理员类 Web 角色只授名册内在职老师并自动挂职务。列出不做关联的三个口子','附录开放决策清单新增「学校端 Web 角色管理是否并入职务管理」一条']},
{d:'2026-10-26 15:21:15',t:'老师端无功能权限空态预览不再把角色标签强制显示为「教师」，标签照常按名册计算',p:['teacher.html'],i:['口径（2026-10-26 定）：角色标签表达「我是谁」、不表达权限——设了主职务显示主职务名（该职务没勾任何功能也照常显示），未设主职务、担任班主任显示「班主任」，都不是显示「教师」；空态与否不影响标签。此前预览开启时脚本强制覆盖为「教师」，与副标题里的班主任班级自相矛盾，已去掉','演示账号王老师是班主任，开启空态预览时显示「班主任」；脚本注释与首页演示说明同步','飞书 PRD T9K9 2.1.1.13 第 2 条空态形态改写为同一口径、空态截图重截替换（示例显示「班主任」），记入 7.2']},
{d:'2026-10-26 15:05:03',t:'老师端首页智能校徽宫格加「待确认」数角标，信息确认「确认无误 / 取消确认」联动名单行、表头、统计栏与宫格角标',p:['teacher.html'],i:['口径纠正（2026-10-26 同日）：智能校徽的「待确认」是家长提交办理申请后老师核对信息的本人队列（确认通过才进平台确认与工厂生产），应计入宫格角标，此前按「家长待办」排除有误；「未提交」仍不计。第一阶段四个宫格带角标：智能校徽 3 / 请假 4 / 学生管理 9 / 教师管理 2','信息确认页统计栏「待确认」改由脚本按名单行计数（apWaitSync），与首页宫格角标同源同数；「确认无误」把该生行转已确认（chip、确认时间）、「取消确认」转回，班级 / 年级表头的未提交 · 待确认 · 已确认计数与统计栏「待确认 / 已确认」即时增减，办理记录页返回后状态同步','首页与信息确认页演示说明同步；飞书 PRD T9K9 2.1.1.13 第 2 条划去「智能校徽不计角标」、改为四个宫格并写明待确认口径，7.2 记入同日纠正']},
{d:'2026-10-26 14:58:49',t:'老师端首页请假 / 学生管理 / 教师管理三个宫格加待办数角标，与页内待办角标同源联动',p:['teacher.html'],i:['口径（2026-10-26 定）：宫格进入的页面存在本人需处理队列时，图标右上角显示红底白字数字角标，与该页待办角标同源同数，处理一件即时递减、为 0 隐藏、超过 99 显示 99+，不用无数字红点；智能校徽的未提交 / 待确认是家长的待办、老师只做提醒，不计角标，其余宫格与底部消息 Tab 不显示','请假 = 「待我审批」数（演示 4；只派班主任，校长 / 纯任课老师视角为 0 隐藏）、学生管理 = 待审核学生注册申请 + 家长认领数（演示 6 + 3 = 9，学生管理页「待审核」按钮角标同步改为脚本计算、原写死 3）、教师管理 = 待审核教师注册申请数（演示 2）','脚本：hmSet / homeBadgeUpd 维护，挂在 lvFltApply、spUpdateCatBadges、taBadge 三处计数出口，文件末尾初始化一次；样式新增 .gmenu .hbadge；首页与学生管理演示说明同步','飞书 PRD T9K9 2.1.1.13 第 2 条「首页宫格」补写宫格待办角标口径并记入 7.2']},
{d:'2026-10-26 14:47:36',t:'设计文档新增第 15 章：小程序站内消息按当前身份显示、存档按账号保留（未来迭代待办）',p:['docs'],i:['docs/design.md 附录前新增「15 小程序站内消息与身份」：消息页为服务号通知的站内存档、不做待办清单、首页消息 Tab 无角标；师长双重身份账号的消息视图按当前身份分流（老师身份只看任教任职消息，家长身份只看本人孩子消息），存档账号级一条不少','写明不采用「统一列表 + 身份筛选」的三点理由（落点依赖身份上下文、两端消息域不同、工作与家庭场景分开），并给出孩子妈妈兼他班班主任的示例','配套规则：服务号深链带目标身份、点开自动切身份并 toast；未读联动随身份走；归档随业务数据；原型两端本就独立，待落实深链切身份与分身份计数演示','章首标注为未来迭代待办：口径已于 2026-10-26 确认采纳，暂不写入飞书 PRD（T9K9 2.1.4.19 / A0HK 2.6.10），后续排期时一并同步']},
{d:'2026-10-26 14:25:27',t:'老师端消息页对齐家长端：晴空蓝渐变页头、读态 Tab 行与筛选半屏',p:['teacher.html'],i:['页头改为晴空蓝渐变底 + 白色标题与胶囊（与家长端消息页同构）；导航栏「全部已读」移入标题栏下的读态 Tab 行','新增读态 Tab 行：未读 / 已读 / 全部消息，右侧并列「全部已读」与「筛选」；「筛选」拉起半屏，按消息类别（请假 / 学生管理 / 教师管理）× 时间范围（近 7 / 30 / 90 / 180 天）点选即生效、不关面板，有生效条件时按钮带蓝点，「重置」恢复默认','条目补 data-cat / data-ago，分组包为 msg-grp（组内无可见条目时整组隐藏），新增空态卡；第一阶段隐藏的条目（降级模式、超时升级）标 data-stage2 不参与筛选；markRead / 全部已读后按当前筛选刷新','样式新增 .msg-hd / .msg-rtabs / .fs-sec / .fs-chips（复用家长端取值）；演示说明同步补写版式与筛选口径']},
{d:'2026-10-26 14:09:13',t:'家长端消息页补「销假申请未通过」与「老师代销假」两条消息及对应服务号卡',p:['parent.html'],i:['消息页近 7 天新增「李老师为林晓阳代销假」（7月3日 15:35，预览「7月3日 13:00–16:30 病假 · 实际 15:30 结束 · 家长来电告知提前返校」），更早新增「林晓乐销假申请未通过」（6月3日 20:40，预览「6月2日–6月4日 病假 · 王老师未同意销假」），标题与预览按消息通知一览 2.6.10.2','晓阳 7月3日 的老师代请假单改为当天 15:35 由李老师代销假、已销假（实际结束 15:30，免审即时生效）：列表卡加「老师代销」附注与实际结束时间行，详情流转补「代销假 / 已销假」节点；代请假与代销假两条消息指向同一张单、点开为当前状态','晓乐 6月2日–4日 病假单流转补「申请销假（实际 6月4日 08:00）/ 不同意销假（意见）」两节点，单据维持已通过与原时段；流转记录「不同意销假」节点意见按警示色显示','服务号推送示意新增两张「请假审核结果提醒」卡（6月3日 20:40 未通过、星期五 15:35 审核人「李老师（代销假）」已通过），与消息页列表继续一一对应（41 条）；消息页演示说明补销假结果与老师代销假口径']},
{d:'2026-10-26 14:01:25',t:'家长端消息列表「销假已确认」预览改按消息通知一览的站内模板顺序，模板补非整单销假的实际结束时间',p:['parent.html'],i:['「林晓乐销假已确认」预览由「5月29日 事假 整单销假 · 王老师已确认」改为「5月29日 08:00–16:00 事假 · 王老师已确认 · 整单销假」，与模板「{请假日期与时段} {请假类型} · {老师}已确认 · 实际 {实际结束时间} 结束 / 整单销假」顺序一致','口径（2026-10-26 定）：原模板「{老师}已确认[ · 整单销假]」在非整单销假时看不到实际结束时间，改为非整单必须带「实际 {实际结束时间} 结束」（跨天请假带日期、单日只写时刻），整单写「整单销假」；飞书 A0HK 2.6.10.2「销假结果通知」行与 T9K9 2.1.4.19「确认销假」行已同步并补非整单示例']},
{d:'2026-10-26 11:42:59',t:'老师端消息页补请假审批提醒 / 销假待确认提醒的站内存档条目，消息页定位改为「服务号通知的站内存档」',p:['teacher.html'],i:['口径调整（2026-10-26 定）：消息页是服务号通知的站内存档（微信服务号取关后历史消息会被清除），凡推送过服务号的事件都留一条记录，不再按「可操作事项不进消息页」排除请假待办类提醒；待办提示仍只靠请假页「待我审批」角标，底部「消息」Tab 在首页不显示未读角标与红点','消息页新增三条与服务号推送示意一一对应的条目：今天「郑皓宸销假待确认」（09:20，点开进销假确认页），更早「吴一诺请假待审批」（昨天 20:15）与「林晓乐请假待审批」（7月4日 21:18，该单今日已通过，点开为当前状态）；预览含时段、类型、实际结束时间与申请人','消息 Tab 注释、消息页与服务号推送示意的演示说明同步改写；飞书 PRD T9K9 2.1.4.19 两行、A0HK 2.6.10.2 两行与附录记录同步']},
{d:'2026-10-26 11:12:31',t:'家长端服务号推送示意 35 张卡字段改按已申请微信模板的固定字段，取值对齐消息通知一览 2.6.10.1 示例',p:['parent.html'],i:['工单处理提醒（45686）25 张：学校名称 / 学生姓名 / 工单状态 / 时间 / 位置，位置栏承载结果说明（如「校徽办理审核通过，已进入生产制作」「客服已回复您的问题反馈」），素质评价的学校名称栏按一览写「市实验一小德育评价」','进出校园提醒（43323）3 张：所属班级 / 学生姓名 / 进出状态（普通上学日上学进校园 / 放学出校园 / 周末休息日进校园）/ 通过地点 / 进出时间；学生离校提醒（44483）6 张：学校 / 班级 / 学生姓名 / 考勤状态 / 时间','退换货申请处理结果通知（56693）1 张：订单号 / 退换类型 / 受理时间 / 退费金额 / 产品名称；生产在退款审核出结果时推送，卡片时间由到账时刻 6月12日 15:20 改为审核通过时刻 6月11日 10:20，到账不另推送（消息列表「退款已到账」仍为站内条目）','一览未单列的两种状态自拟文案：免费校徽回收作废（工单状态「免费校徽回收作废」）、取消办理失败（工单状态「取消失败」），待确认','请假 / 销假四张卡此前已改，本次未动；演示说明补写各模板字段']},
{d:'2026-10-26 11:07:50',t:'家长端服务号推送示意 39 张卡标题全部改为微信模板标题，按消息通知一览 2.6.10.1 的模板对应关系',p:['parent.html'],i:['微信模板消息的标题由已申请模板决定，不能按业务事件另起；对应关系：校园打卡→进出校园提醒（43323）、班级放学→学生离校提醒（44483）、老师代请假→学生请假申请提醒（53589）、请假审批结果与销假结果→请假审核结果提醒（53810）、退款结果→退换货申请处理结果通知（56693）、考勤补签 / 校徽办理与核对 / 认领 / 家人 / 记录保留 / 素质评价 / 反馈回复→工单处理提醒（45686）','「取消办理结果通知」在消息通知一览中未单列，按校徽办理同域暂记工单处理提醒，待确认','卡片字段未动，仍为设计稿字段（仅请假 / 销假四张卡此前已改为模板字段）；演示说明补写标题口径与对应关系']},
{d:'2026-10-26 10:52:07',t:'老师端服务号推送示意三张卡标题改为微信模板标题「学生请假申请提醒」',p:['teacher.html'],i:['两张「请假审批提醒」卡与「销假待确认提醒」卡的标题改为复用模板 53589 的标题「学生请假申请提醒」：微信服务号模板消息的标题由模板决定，不能按业务事件另起；三张卡同题，靠学生姓名的「·销假」后缀区分销假','注释与演示说明同步说明标题口径']},
{d:'2026-10-26 10:42:56',t:'老师端「请假审批提醒」服务号卡同样改按生产复用的微信模板 53589 字段',p:['teacher.html'],i:['生产的请假审批提醒（家长提交请假后推班主任）也复用 53589「学生请假申请提醒」，与请假代提交通知、销假待确认提醒共用同一模板；两张「请假审批提醒」卡改为 学生姓名 / 开始时间 / 结束时间 / 班主任（王老师）/ 申请时间，申请人与事由只在单据详情可见','服务号推送示意的注释与演示说明同步写明复用模板与字段','飞书 PRD 同步：T9K9 2.1.4.19「家长提交请假 / 老师无处理资格代请假」行改按 53589 字段写，7.2 合并记录；消息通知一览 A0HK 2.6.10.1 / 2.6.10.2 新增「请假审批提醒」行，附录更新记录并入当日一行']},
{d:'2026-10-26 10:34:49',t:'请假 / 销假服务号卡片改按复用的生产微信模板 53810 / 53589 字段，不另申请销假模板',p:['parent.html','teacher.html'],i:['研发侧方案（消息通知一览 A0HK 2.6.10）是不为销假申请新模板：销假结果复用 53810「请假审核结果提醒」、销假待确认复用 53589「学生请假申请提醒」，只在请假人 / 学生姓名后加「·销假」区分；原型与 V1.2.5 PRD 此前按设计稿写的 请假开始时间 / 实际结束时间 / 处理结果 字段在微信模板里不存在，两份文档描述的是两种消息，今日拍板接受复用旧模板','家长端服务号示意：「销假结果通知」卡改为 请假人（带 ·销假）/ 申请类型 / 审核人 / 审核时间 / 审核结果；两张「请假审批结果通知」卡（已通过 / 未通过）同样改为 53810 字段，审核人「王老师」、审核结果「已通过 / 未通过」','老师端服务号示意：「销假待确认提醒」卡改为 学生姓名（带 ·销假）/ 开始时间 / 结束时间（申请的实际结束时间）/ 班主任 / 申请时间；「请假审批提醒」卡未动（生产模板未知）','演示说明同步：家长端销假结果通知注释、老师端代销假与服务号推送说明写明复用模板与字段；实际结束时间、是否整单销假、不同意意见只在请假单详情可见','飞书 PRD 同步：T9K9 2.1.4.19 第 5 条导语改为「审批 / 确认老师填入『审核人』字段」，表格三行服务号字段改按 53810 / 53589 写并标注与消息通知一览的名称对应，7.2 合并记录']},
{d:'2026-10-26 10:10:23',t:'老师代请假 / 代销假改为均通知孩子的全部家人，与生产现行代请假通知一致；服务号「请假代提交通知」字段对齐生产模板 53589',p:['parent.html','teacher.html'],i:['推翻 2026-10-22「老师代请假、代销假不通知家长」口径：生产已实现代请假通知家长，代销假与之保持一致——老师代请、代销都直接改写孩子的考勤，家人（含未来电的其他家人）需要知情与异议通道','家长端消息页恢复「李老师为林晓阳代请假」条目（去掉 data-off 与 display:none），服务号推送示意恢复「请假代提交通知」卡片，字段按生产微信模板 53589「学生请假申请提醒」改为 学生姓名 / 开始时间 / 结束时间 / 班主任 / 申请时间','老师端演示说明（已通过单详情代销假、代学生请假、销假代码注释）改为「生效后通知孩子的全部家人」，代销假复用「销假结果通知」模板、处理结果为「{老师} · 代销假[ · 整单销假]」、站内「{老师}为{学生}代销假」','飞书 PRD 同步：2.1.4.3 第 3 条、2.1.4.11、2.1.4.12 第 5.2 条、2.1.4.19 第 5 条及消息表格改为通知口径并对齐生产模板，7.2 记录一条']},
{d:'2026-10-24 12:42:18',t:'老师端教师管理页搜索框占位改为「输入姓名或手机号搜索」，与 PRD 2.1.2.4 及实际匹配逻辑一致',p:['teacher.html'],i:['教师管理页搜索框占位由「输入姓名搜索」改为「输入姓名或手机号搜索」：过滤逻辑（tmFiltered）一直按姓名或手机号包含匹配，只是占位没写出来，用户不知道可以搜手机号；PRD 2.1.2.4 写的就是「输入姓名或手机号搜索」，学校端教师名单同一位置也支持手机号','手机号是教师记录的身份锚（新增查重、待激活自动激活、离职拦截都按手机号判定），老师拿手机号反馈登录 / 激活问题、同名老师区分都靠它；名册行与详情都不明示完整手机号，搜索是从手机号找到人的唯一入口','演示说明同步补写；匹配逻辑与 PRD 均未改动']},
{d:'2026-10-24 11:48:20',t:'两端教师名册的职务筛选去掉「全体教职工」项，自动关联项只保留班主任 / 任课老师，与 PRD 2.1.2.4 一致',p:['teacher.html','school.html'],i:['老师端教师管理筛选半屏「职务」组去掉「全体教职工」（assets/teacher.js tmDutyOpts、tmHasDuty 的 role-all 分支一并移除）：该项匹配的是「在职且学校端为全体教职工开有功能」的老师，在职的人全部命中，与「状态」组的「在职」完全重复；学校端没为全体教职工开任何功能时还会筛出空态，用户只会困惑而想不到是权限配置的原因。班主任、任课老师能把名册分成不同人群，保留','学校端教师管理 · 教师名单「全部职务」下拉的「自动关联」分组同步去掉全体教职工，保留班主任 / 任课老师 / 值周老师（值周老师在学校端能筛出一部分人，老师端 PRD 本就不列，不动）','两端演示说明与 tmFiltered 段注释同步改写；无头 Chrome 核对老师端职务组选项末尾为班主任 / 任课老师，学校端自动关联分组为班主任 / 任课老师 / 值周老师；飞书 PRD 2.1.2.4 a 条「三个自动关联项」改为两个并补写原因，7.2 合并进当天记录']},
{d:'2026-10-24 11:36:49',t:'老师端摘要位的指定年级类职务范围同样收敛为「等 N 个年级」，与 PRD 2.1.2.3 第 6 条新口径一致',p:['teacher.html'],i:['assets/teacher.js 的 clsBrief 增加单位参数，tmClsText 中主职务为指定年级类时改走 clsBrief(范围,\'年级\')：超过 3 个年级只列前 2 个并接「等 N 个年级」，3 个及以内全列，阈值与班级类一致；此前年级类直接全列，年级名最长 20 字、九年一贯制等学校年级可达 9 个以上，全列后会被单行省略成看不出总数。名册行、首页头部副标题、身份切换面板与账号切换页的身份行副行同用该函数，一并生效；教师详情、个人资料、分配职务页仍全列','演示数据里两位年级组长（孙海 3年级、黄涛 2年级）各管 1 个年级，页面显示不变；无头 Chrome 核对 5 个年级的构造数据输出「1年级、2年级 等 5 个年级」、3 个年级全列','clsBrief 注释、教师管理与首页演示说明中「指定年级类不收敛」同步改为新口径；飞书 PRD 2.1.2.3 第 6 条同日改写并在 7.2 当天记录合并记录']},
{d:'2026-10-24 10:32:42',t:'两端身份切换面板与账号切换页的教师类身份行 chip 统一藏青，琥珀只留给首页角标与「我的」头部，当前身份由勾选表达',p:['teacher.html','parent.html'],i:['老师端首页身份切换面板、账号切换页与家长端对应两处的「王老师 · 市实验一小」行职务 chip 由琥珀改为藏青，与「王老师 · 红旗小学」行及教师管理名册行的职务 chip 同色：此前两个教师身份一琥珀一藏青，实际语义只是「本校 / 他校」（绑了 meRoleSync 的行跟着「我的」头部改成了琥珀），界面上没有任何解释，容易被读成两类标签或当前身份标识','配色口径：琥珀只用于首页头像角标、「我的」头部这类「我是谁」的位置；身份列表里教师类身份行统一藏青、孩子行在读青碧 / 归档灰不变，当前身份只由左侧勾选表达','两端四处 HTML 注释与首页、「我的」演示说明同步；无头 Chrome 打开身份面板核对各行 chip 类名：班主任 navy、校长 navy、在读生 teal、毕业生 / 离校生 gray']},
{d:'2026-10-24 10:00:14',t:'修复教师管理名册行职务 chip 超 9 字时硬裁无省略号，与 PRD 2.1.2.3 职务标签截断口径一致',p:['teacher.html'],i:['assets/teacher.css 的 .chip.dname 省略规则改为同时选中 .stu .chip.dname：名册行在 .stu 容器内，写在后面的 .stu .chip{display:inline-flex} 把 chip 变回 flex 容器，text-overflow:ellipsis 对 flex 容器内的匿名文字项不生效，长职务名只剩 overflow:hidden 在第 9、10 个字之间硬切，不出现「…」','修复后名册行与「我的」头部、身份切换面板、账号切换页同样为「不超过 9 个字完整显示、超过显示前 8 个字加「…」」；无头 Chrome 用 15 字职务名复测，chip 显示「一年级及二年级及…」，其余三处本就正常、不受影响']},
{d:'2026-10-24 09:54:32',t:'各端演示说明 chip 统一增加「原型总览」入口，新开标签页打开 prototype/index.html',p:['parent.html','teacher.html','school.html','admin.html','admin-trade.html','badge-h5.html','docs'],i:['家长端 / 老师端（assets/parent.js、assets/teacher.js renderDemo）与学校端、运管端、运管交易端的演示说明面板在「原型更新日志 →」之后统一追加「原型总览 →」按钮，window.open 新开标签页打开 index.html，不打断当前演示状态；无需逐条修改 demoInfo，新增页面自动带上','校徽二维码 H5 兜底页原有的「返回原型总览 →」（本标签页跳转）改为与各端同名同行为的「原型总览 →」（新开标签页）','原型总览页自身不加该入口；docs/admin-prototype-design-spec.md 第六章演示说明 chip 一节同步写明两个统一追加的入口','无头 Chrome 实测六个页面的面板各渲染出一个「原型总览 →」按钮']},
{d:'2026-10-23 18:37:40',t:'老师端身份面板与账号切换页当前身份行补数据范围副行，副标题 / 副行改为单行省略不挤压姓名列，与 PRD 2.1.2.3 对齐',p:['teacher.html'],i:['首页身份切换面板与账号切换页的当前教师身份行补副行，显示该身份的数据范围，由 meRoleSync 与首页头部副标题同一函数计算（主职务范围或班主任班级 + 任教班级、同样的收敛规则）；红旗小学行保持「全校」、孩子行保持班级，各身份行同构，本人职务 / 班级身份变化时随头部一起重算','年级名、班级名各最长 20 字的情况：身份面板行、账号切换行、教师名册行的副行改为单行显示、超宽以「…」省略，右列限宽（面板 52%、账号切换 44%）、姓名列占满剩余宽度并单行省略，不再出现长班级名撑开右列、姓名被挤成一字一行；首页头部副标题原本即为单行省略','PRD 2.1.2.3「名册行副标题」同日补写：首页头部副标题与两处身份行副行同口径、各行同构，副标题与副行一律单行、先按个数收敛再按宽度省略、完整范围在教师详情 / 个人资料；演示说明「首页」「账号切换」「教师管理」三条同步','无头 Chrome 用两个 41 字班级名实测：面板、账号切换页、教师名册行均单行省略，姓名与学校名完整显示']},
{d:'2026-10-23 18:21:39',t:'演示说明：职务名标签截断口径改为「不超过 N 字完整显示、超过显示前 N-1 字加「…」」，与 PRD 2.1.2.3 新表述一致',p:['teacher.html'],i:['「我的」演示说明条目中的职务名截断描述由「最多显示 6 / 9 个字」改为「首页头像角标不超过 6 个字时完整显示、超过时显示前 5 个字加「…」；各处 chip 不超过 9 个字时完整显示、超过时显示前 8 个字加「…」」，说明省略号占一个字位的实际效果；PRD 2.1.2.3 与 7.2 同日改为同一表述，原型样式不变']},
{d:'2026-10-23 18:09:09',t:'老师端职务名标签截断口径：首页头像角标最多 6 个字、各处 chip 最多 9 个字，与 PRD 2.1.2.3 对齐',p:['teacher.html'],i:['职务名 chip（名册行、「我的」头部、首页身份切换面板、账号切换页共用 .chip.dname）宽度由约 8 个字放宽到 9 个字（calc(9em + 16px)），第 10 个字起省略；首页头像角标原 76px 即为 6 个字上限，加注释说明、不改尺寸','口径来源：PRD 2.1.2.3「职务标签」同日补写「首页头像角标最多显示 6 个字（覆盖平台默认模板里最长的「课后服务老师」），chip 最多显示 9 个字，超出省略，完整名在个人资料与教师详情可见，截断不影响推导与权限」；演示说明「我的」条目同步记录','无头 Chrome 实测：6 字职务名角标完整、7 字起省略；9 字 chip 完整、10 字起省略，「我的」页与账号切换页一致']},
{d:'2026-10-23 17:06:58',t:'原型入口页新增学校端 Web 卡片，老师端卡片改为常显并去掉显隐开关，四张卡片栅格自适应',p:['index.html'],i:['新增「学校端 Web」卡片（school.html，靛紫色头部，桌面端）：职务管理、职务详情、教师管理、班级角色、请假管理、操作日志六条能力清单；原「配套页面」里的学校端文字链去掉，H5 兜底页与更新日志链接保留','老师端卡片改为常显：去掉演示说明里的「显示老师端原型卡片」开关，不再读取旧的 proto-teacher-card 本地记忆（此前默认隐藏，老访客浏览器里留有关闭值时仍看不到）；演示说明新增「显示学校端原型卡片」开关（默认开，proto-school-card）','卡片栅格：四端全显 4 列，关掉运管端 / 学校端各减一列，最少保留老师端与家长端 2 列；列数由脚本写入可见卡片数、CSS 按它取值，容器加宽到 1320px，窄于 1200px 两列、窄于 900px 单列','卡片头部右上角设备标签下移到标题行并给标题留出右侧空位，四列时运管端的角色文字不再与标签重叠、各卡头部等高','演示说明文案改为四张卡片口径']},
{d:'2026-10-23 16:53:46',t:'老师端「我的」页对齐家长端并新增帮助与客服页：蓝天背景、同款宫格图标与版式、三项协议页脚、身份标签改琥珀色',p:['teacher.html'],i:['「我的」页背景改为与家长端同一张蓝天图（assets/sky-me.jpg，渐变兜底），头部透明、状态栏白字；头像 64px 带白描边，分组标题加大加黑，宫格卡片改双列 + 中缝分隔线、图标 46px、文字 13.5px，页脚配色对齐，样式规则复制自 parent.css 的 #sc-me 段并只作用于本页；补 g3 三列变体供恢复隐藏宫格时使用','「账号切换」「帮助与客服」宫格图标换成家长端同一套图片（icon-switch.png / icon-help.png），「帮助与反馈」改名「帮助与客服」（含隐藏的原「账号与帮助」组）；待认领 chip 右侧箭头换成家长端同款白色三角','页脚由静态「隐私政策 · 用户协议」改为「用户协议 · 隐私政策 · 儿童信息保护规则」三项，点击进入协议阅读页（复用 assets/legal.js 全文），返回落回「我的」','新增「帮助与客服」页（sc-help）：从「我的」宫格进入，版式与家长端同页一致（问题搜索框、横向问题类型筛选条、常见问题折叠卡片、底部固定操作栏），搜索与类型筛选取交集、无匹配显示空态；常见问题八条按教师端业务口径改写（校徽丢失与首发分发、到校未识别代补签与到离校时间口径、代学生请假与销假、任教班级由学校端维护、教师兼家长身份）；底部「联系客服」为主按钮，「在线客服」默认隐藏、由演示说明开关控制（localStorage proto-csentry）；与家长端唯一不同为「反馈建议」入口第一阶段隐藏（后续阶段，节点保留）','「我的」页姓名下方身份标签由蓝色改为琥珀色 chip，与首页身份切换面板、账号切换页同一标签同色','演示说明：「我的」条目改写背景 / 图标 / 版式 / 页脚 / 标签的对齐记录，新增「帮助与客服」条目（含在线客服开关），协议阅读页条目补「我的」页脚入口']},
